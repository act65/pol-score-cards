<script>
const ITEMS=[{"statement_id": "197c629de6b1b8a4", "politician": "Matt Doocey", "party": "National", "side": "government", "date": "2024-01-30", "statement": "They were a Government of misinformation. They were a Government of disinformation. They were a Government that was a failed socialist experiment, because there’s only one trick in Labour’s playbook, and that’s to centralise.", "window": "Hon MATT DOOCEY: Just say sorry—that’s exactly what the country wants to hear from this Opposition. Just say sorry for what you’ve done to our country. They’ve crashed the economy, law and order is spiralling out of control, our kids are not even going to school, and that’s the legacy of that last Government.\nThe first majority Government since the start of MMP, and what will they be known for? Abject incompetence—the failure to deliver. They were a Government of misinformation. They were a Government of disinformation. They were a Government that was a failed socialist experiment, because there’s only one trick in Labour’s playbook, and that’s to centralise. The health reforms, the polytech reforms, water reforms, three waters—because, under their book, Labour knows best and Wellington knows best.\nI tell you what the public did at the end of last year: they voted for change. They wanted change because they had had enough, and what I won’t stand for now is listening to all these Opposition MPs who have found in themselves a voice. They’re a lion in Opposition, but a lamb in Government. They sat here day after day last term—zip, zilch, de nada. They didn’t say a word on behalf of their electorates when they were ramming through reforms that New Zealanders didn’t want, and we warned them. We warned them that they would die on the hill with things like three waters, and that’s why, when they look around here today, less of their colleagues are back, because they sat here like lemmings and didn’t represent their electorates.\nIt’s summed up by one Labour MP who got booted out, and when he got vox popped out the front of Parliament, his response was “Oh, my lifestyle’s gone from champagne socialism to lemonade.”, and that’s exactly what was happening: champagne socialism, while everyone out of the beltway of Wellington was hurting. That’s why now we are left in a predicament where this country is facing years of deficits.\nBut they will be for ever known as the Government of three waters. They’ll be known as the Government of health reforms in the middle of a pandemic that took a wrecking ball to DHBs. Their own Heather Simpson report said to go from 20 to about six to eight, but they went from 20 to zero in the middle of a pandemic, and Kiwis are paying the price now because they’re stuck on waiting lists because of that Government’s focus on growing the bureaucracy.\nThink about the lawlessness we’ve experienced in New Zealand: ram raid after ram raid after ram raid. That Government had its head in the sand, and that’s why it’s very clear that the New Zealand public voted for change.\nWe’re unashamed that we will repeal what that last Government brought in, because it took the country backwards. This coalition Government will take the country forward. We won’t have all the misinformation like with three waters of the misleading advertising campaigns of people turning taps on and green water coming out. When they promised local government that they could opt in, but Official Information Act documents revealed it was an all-in from the very start, they misled New Zealanders, and they should not be returned back to the Treasury benches for a very long time.\nIt was outlaid very clearly in the Speech from the Throne that we need to grow New Zealand’s economy. We’ve got years of deficits ahead of us. We need to unblock what that last Labour Government did in order to allow New Zealanders to grow and flourish.\nCan I also acknowledge the very hard-working people of Waimakariri, who returned me in the last election for my fourth term. People in the electorate of Waimakariri—when you look at the history of it since 1996, they’ve elected Labour and National MPs. They reward hard work, and my commitment today to them is I will continue to work hard for them, as I did in my first term, and now I will in my fourth term.\nCan I thank my family for supporting me to be here today, as well as my campaign team and the many people who have supported me over the last nine years, including one gentleman, Roger Bridge, who’s up here in the gallery listening today.\nI want to acknowledge my ministerial colleagues as well, who will make a big difference in this country. Why will they make a big difference? Because our Minister of Health is a GP, our Minister of Police was a bravery award - winning police officer, our tertiary education Minister, Penny Simmonds, ran a polytech, a tertiary education institution. The difference is that on this side of the House, we know what we’re doing.\nWe don’t come here with big, grand slogans that fail to deliver, and nothing worse in their failure to deliver was around mental health. Remember the $1.9 billion, and the Mental Health and Wellbeing Commission came out in its first report and said that despite the $1.9 billion, there was no material improvement? It’s very clear when talking to officials that announcements were being made that even the officials knew could not be delivered. It was all about grandstands, it was all about headlines—putting out the latest slogan of transformation. But what they really did was raise expectations for some very vulnerable New Zealanders, and they failed to deliver.\nI’m very privileged to be New Zealand’s first Minister for Mental Health, and, as the Prime Minister outlined in the Speech from the Throne, we will get money out of Wellington to the front line. Like our announcement of $6 million for Gumboot Friday. We don’t believe the bureaucracy of Wellington knows best; the front-line community NGOs know best. They know what makes a difference. They’re already delivering, and we will get money to their front line.\nAnother reason why Labour failed to deliver in mental health was they never understood the issues. It was just all spray and walk away—$100 million here, $100 million there. The reality is, you can announce money, but if you don’t have the workforce to deliver it, no services are going to open. If they’d really done their job and started a pipeline of workforce six years ago, we wouldn’t have a mental health workforce crisis today. The biggest barrier to timely mental health and addiction support in New Zealand is the lack of mental health workforce, and, as we heard the Prime Minister announce in the Speech from the Throne, our commitment is to train more psychiatrists and more psychologists. We’ll work through every discipline to ensure that we open up that pipeline to ensure there’s workers in our mental health services, as well as people with lived experience in the peer support teams that we can roll out, who will make a real difference.\nWe need to focus on increasing access to timely support. We’ve done a great job in New Zealand encouraging a conversation. We’ve broken down some of the stigma for those who want to come forward. Now they trust us, they take a great leap of faith, and when they do come forward, quite often that timely support is not there. So that’s why we’ve got to focus on getting more money out of Wellington to increase access. We’ve got to reduce the workforce vacancies to ensure that when services are funded, there are people there to deliver them.\nBut of course, most importantly, it’s not only about treating mental illness; at the same time, we need to promote mental wellbeing. We need to focus a lot more on prevention and early intervention, and that is what this Government will do, because what we will do is actually deliver on our promises.\nThe time for big slogans is over. It’s about delivery, and that is the difference with this new coalition Government. Thank you.", "window_id": "2024-01-30#8"}, {"statement_id": "cec965dccb9f505c", "politician": "Matt Doocey", "party": "National", "side": "government", "date": "2024-04-30", "statement": "Look, thank you very much for the question. It’s a very important question about the priorities going forward. I take this as the annual review debate for 2022-23.", "window": "INGRID LEARY: Yes, sir. I made the point that, in the Health Committee, we’re really interested in open, transparent, competitive procurement, that there are assurances around clinical standards. Wanting to know more details about the procurement of Gumboot Friday, we asked Te Whatu Ora; they directed us to the Ministry of Health. I’ve done a series of written questions and Official Information Act requests, we were able to get very little openness back. So could we have the Associate Minister take the chair and answer, please. There’s a lot of providers wanting to know that they are on a level playing field, but also a lot of those who are using the services wanting to know that clinical standards are assured. And what is the monitoring evaluation process for Gumboot Friday? So that we know that people are being appropriately triaged and treated.\n\nHon MATT DOOCEY: Thank you very much, Mr Chair. Look, it’s a real privilege to rise in the annual review debate, as the Minister for Mental Health—New Zealand’s first Minister for Mental Health. Can I put in my slight apologies for being late, I was just meeting, via Zoom, the Welsh Minister for Mental Health, Jayne Bryant. I’ve had the privilege to be able to talk to my counterparts around the world in the last few months since taking up this role. I think there are some real commonalities with other countries as they work towards better mental health in their respective countries. I want to acknowledge the member Ingrid Leary’s very important question around how we get more funding out of Wellington to the front line. When we look at the funded sector, we’re currently funded around $800 million a year to power up NGO and community groups. So my expectation with any commissioning of NGOs and community groups is that Health New Zealand and the Ministry of Health would follow procurement rules.\n\nINGRID LEARY: Thank you to the Minister for Mental Health for answering those questions. I’m not sure that I heard addressed the specific questions around what procurement process was used for Gumboot Friday in particular. It doesn’t sit with Te Whatu Ora; it did sit with the Ministry of Health. I have written Official Information Act requests. Was it a transparent process, and what is the monitoring evaluation system, and what clinical standards are involved in the provision of that care? I know we are all fans of Gumboot Friday, but there are many, many questions about how it came to be, and we need specific answers on those questions that none of my Official Information Act requests or written questions have secured any answers to. So if you could perhaps be more specific to that particular procurement, that would be really appreciated.\n\nHon MATT DOOCEY: Well, I agree with the member Ingrid Leary that we are all fans of Gumboot Friday. What I would say is some Governments are more fans of Gumboot Friday than other Governments, and this Government has made a coalition agreement to fund Gumboot Friday, and, I would expect, when that decision is made, then the proper procurement approach would be taken.\n\nRACHEL BOYACK: Thank you, Mr Chair. I just want to follow up with a question to the Minister off the back of my colleague Tracey McLellan’s questions around health infrastructure, and I just note your comments around potential changes to scope. My specific question—and just noting that Standing Orders have changed, which means we can delve into issues around strategic intent—is: is there an intent to honour the previous Government’s commitment to the $1.1 billion rebuild of Nelson Hospital?\n\nHon Dr AYESHA VERRALL: I’d like to return to some of the issues relating to workforce, and, in particular, I note that many committee members shared a concern around the primary care workforce. During the year under review, funded GP trainee numbers were increased and there was an increase for their salaries as well, to make sure they were on parity with their hospital colleagues. My question to the Minister is: what other measures does he intend to take forward about the training of general practitioners to address the workforce shortage there? As my colleague mentioned, there is a high number of retirements anticipated there. My second question, also relating to primary care, particularly general practice, is on his intentions around pay parity for primary care nurses.\n\nHon Dr SHANE RETI: Thank you, Mr Chair. Just to return back to a previous question—the question was around increasing capability of the Māori Health Authority Board, and I said that it was my view or my belief that Mataroria Lyndon was one of those few people who had come in. That isn’t correct; he was actually a pre-existing board member. The new people, I’m informed, were Ben Dalton, Helmut Modlik, and Kim Ngarimu—all very good people. So I’m just correcting the record for that.\nFor what the member who has just taken her seat is describing, that is quite correct. During the period under review, it was announced that there would be increased funding for primary care—more specifically, that gap between primary care or General Practice Education Programme (GPEP) registrars and their specialist colleagues, for example, which was around about $10,000. That was reduced. Consequently, the impact of that was felt this year with the new GPEP registrars, of which there are several hundred who are out in the community as we speak, supporting general practice. This certainly was a good initiative of the previous Government in the period under review. I have other plans and ambitions for primary care and I recognise that it’s a very, very important place, not just in achieving the targets that I have ambitions for but, actually, in sustaining the whole health system, and I look forward, at a later date, to describing them in more detail.\nHŪHANA LYNDON (Green): Thank you, Mr Chair. This is a question about tobacco control, so may be directed to your associate. It’s in relation to the modelling, understanding that there could potentially be $500 million in revenue generated from the repeal of the smoke-free legislation, and taking a positive view in the way that the coalition Government might want to spend this revenue in social investment, from a public health approach—how we try to not be the ambulance at the bottom of the cliff but pull it back and look for services that can prevent the uptake of smoking, knowing that so many New Zealanders do die. I’m keen to understand from the Minister what modelling was done to understand the repeal itself and cost-benefit, and, further, why the Minister won’t look to restrict or regulate the number of stores in New Zealand that sell both vapes and tobacco. Kia ora.\n\nHon CASEY COSTELLO: Yes, I’m more than happy to answer the question of the member that’s just taken her seat, Hūhana Lyndon. Although the question was largely out of scope in terms of what’s under review today, I can assure you that there is a huge amount of work that’s currently being talked about around how we reinvest the funding, which is, basically, continuing to support the programmes that have been so successful in reducing smoking numbers, but looking specifically at targeting to the most at-risk groups rather than a blanket approach.\nI would challenge the comment that we are not looking to consider reducing the number of retailers. We are looking at an entire programme around the regulatory regime, and that is the advice at the next stage that we’re working on in terms of what we will be doing to ensure that both we meet the smoke-free target of 2025, which is a collective commitment from all of the coalition parties, but also that we ensure that what has been delivered—and I think that there is credit to be given in what was being achieved in the work programme, but we will continue to invest further and work on what has been working to ensure that both we meet the smoke-free target and that we reduce youth vaping and restrict that access to vaping by a range of initiatives that will be coming through this House in due course.\n\nINGRID LEARY: Thank you, Mr Chair. A further question to the Associate Minister: what funding has gone to Gumboot Friday under this new Government, and where does that contract sit, and what further procurement is he anticipating that may result in funding to Gumboot Friday, and where will that contract sit?\n\nHon MATT DOOCEY: As the member alluded to, there was a commitment to fund Gumboot Friday in the coalition agreement, because what we believed is we wanted to get more money that was stuck in the beltway of Wellington out to the front line. And, also, we’ve made a commitment through the Mental Health Innovation Fund that will pair up and match funding with community groups and other NGOs, because we believe they know their communities best and they can respond to the needs of their community, especially in mental health and wellbeing.\n\nHon Dr SHANE RETI: Thank you, Mr Chair. Just to address the question around Nelson Hospital, it is in the business case. We can’t quite recall whether that happened in the period under review, but it kind of doesn’t matter. So it is in the business case. It’s been funded for that and for enabling works as well, and that continues.\nDr HAMISH CAMPBELL (National—Ilam): Thank you, Mr Chair. I appreciate the Minister’s comments on health reforms, especially around questions about infrastructure, and it’s something that we’ve heard a lot about during the committee process. We heard about these health reforms. How does the Minister think the health reforms have gone, and what lessons have we learnt from any failures?\n\nSAM UFFINDELL: Thank you, Mr Chair. My question is for the Associate Minister with responsibility for mental health. Given the current demands in the mental health space and the acute staff pressures there, I wanted to explore what his priorities and strategic intent were for the year ahead.\n\nHon MATT DOOCEY: Look, thank you very much for the question. It’s a very important question about the priorities going forward. I take this as the annual review debate for 2022-23. During that year, I was the Opposition spokesperson for mental health, so I was aware of the issues within mental health. So I’m not surprised the Opposition members now who were in Government then don’t want to ask any questions about this respective year.\nBut, going forward, I think what we need to do is increase access to timely mental health, addiction, and suicide prevention support in New Zealand. Clearly, we’ve done very well as a country on breaking down the stigma and discrimination. As more people come forward for support, we need to make sure that timely support is available when they do come forward.\nThe second priority is that we need to grow the workforce. For successive years, we saw vacancy rates within our health services, specifically in mental health, grow, which led to the wait times growing for specialist mental health services over the last six years.\nFinally, the third priority is that we need to shift to prevention and early intervention. We should always be promoting mental wellbeing to ensure we don’t wait for people to get into a time of distress and crisis before they reach out for help.\nDr HAMISH CAMPBELL (National—Ilam): I move that the debate on this question now close.", "window_id": "2024-04-30#28"}, {"statement_id": "c8efec12eda3cbcc", "politician": "Tim Costley", "party": "National", "side": "government", "date": "2024-10-23", "statement": "That’s the start of the period and the thinking at the time and New Zealand’s intent to not give citizenship. Let’s fast forward to the end.", "window": "TIM COSTLEY: Talofa lava, Mr Speaker. Let’s set the scene and understand our Government’s and this Parliament’s precedent-breaking support. Samoa in the late 1800s: there are interests from Germany, the US, and the UK, and civil war breaks out between local factions backed by these three countries. Then, without consulting any Samoans—this is not something any of us should be proud of—they have a conference and decide how to split Samoa. The eastern part goes to the US—now American Samoa—and the western part—hence Western Samoa—comes under German control. Of course, 1914 was the start of World War I. Britain rings up New Zealand as it’s not so keen on having Germany with a safe haven in the Pacific, and New Zealand is asked and goes in, without anyone firing a shot, and takes control of Samoa for the duration of the war.\nNow, the intent at the time was actually to give it back to the Germans in 1919, but the League of Nations has a different plan and it becomes what we call a Class C mandated country, along with other German territories in the Pacific and in South Africa, the likes of South West Africa—now Namibia—Nauru, I think of New Guinea, the South Sea Islands—of course, went to Japan—Micronesia, the Marshall Islands. The mandate lasts from April 1922 until April 1946. Now, the dates get a bit confusing when we look at the dates in this legislation, but we also have to read the British Nationality and Status of Aliens (in New Zealand) Acts, both the 1923 and the 1928 Acts, along with the Act with the same name, but in the UK, from 1914.\nThis trusteeship: in 1921, the Samoa Act brings this into law in New Zealand, and the bill makes it very clear that Samoans would not become New Zealand citizens. That was the thinking at the time. In fact, we have the letter that the Prime Minister, the Rt Hon Gordon Coates, wrote to the League of Nations in 1928, after the legislation that actually this bill gets based off. He said—and I’m quoting here—“The status of native inhabitants [from Samoa] is distinct from that of … nationals [from] the Mandatory Power,”—in this case, New Zealand. Again, quoting, it “cannot be identified there—with by any process having general application.”, and he goes on to say that “The native inhabitants of the mandated territory are not invested with the nationality of the Mandatory Power.” This is also agreed to, of course, by the UK, Australia, France, Japan, Belgium, and South Africa, and none of those countries have ever gone on to give citizenship to any of those trustee countries.\nThis is the first time in history that a trustee administrated country will be given citizenship. This is incredibly significant. That’s the start of the period and the thinking at the time and New Zealand’s intent to not give citizenship.\nLet’s fast forward to the end. It’s the first Labour Government—of course, Savage, and then Fraser—and Labour’s Minister of Internal Affairs at the time, the Hon Bill Parry, again makes it clear that Samoans, in his view and that Government’s view, are not New Zealand citizens when he’s commenting on the law changes they’re putting through in the 1948 bill. I’m quoting from the Labour Government: “The inhabitants of Western Samoa are not British subjects because trustee territories and protectorates are not in the legal sense part of His Majesty’s realm.” In fact, the Privy Council accepted the intent of that Labour Government, and that’s why the cut-off now sits at 1948 in the 1982 legislation that we are amending today. He goes on to say that “Although the protected persons are not British subjects, they should not be treated as aliens either. There should be an intermediate class.” They changed the rules requiring five years of residency to get to citizenship to be just one year of residency, and this, in a way, sets the path towards the 1962 Treaty of Friendship, which builds on what he called an intermediate class.\nNow, of course, in 1977, Falema’i Lesa was prosecuted for being in New Zealand unlawfully but argued that, between the periods of legislation that we’re talking about now, she, effectively, became a New Zealand citizen. Ultimately, the Privy Council accepted that. We can understand the shock that there was across all parties in Government at the time, because we know that the intent was, both in the 1920s and the 1940s, that they were not citizens, and hence the thinking to go and change this.\nAs we’ve heard, Jim McLay was the Minister responsible at the time. He argued that successive Governments had never anticipated this, and he used a comparison to a tax loophole. When someone finds a loophole in the law, a responsible Government would honour those that found it, but would also move to close it, which is what the 1982 legislation did. In fact, that legislation did three things: firstly, it awarded citizenship to Falema’i Lesa and her family specifically but also to any Samoans who were legally in New Zealand at that time; secondly, it created a fast-track pathway—and we love a good fast track—for all Samoans, removing that one-year residency requirement but also things like not needing to pass an English language test. In effect, if you can reside in New Zealand legally, you can become a citizen right away, and that’s something we want to protect by not removing some of those details from the 1982 legislation. Finally, of course, it ruled out future citizenship to people who might not otherwise be entitled to it from that period.\nCome forward to 2002-03 and Helen Clark’s Labour Government. They were presented with a petition to do exactly what we’re doing here, but they denied it. Why was that? Well, part of it may be, as was explained in their thinking, that they considered that a repeal of the 1982 Act would be—I’m quoting—“Inappropriate from an international law perspective”, and they noted that no other mandated country had citizenship from that time. In fact, even today, the Ministry of Foreign Affairs and Trade’s advice to us was that the advice it provided to the committee 20 years ago was still valid, and, further, that they consider that before this bill passes, New Zealand’s current legislative policy and administrative settings in relation to Samoa are consistent with international human rights law.\nNow, add to that the Department of Internal Affairs’ advice that said that if we were to repeal the 1982 bill, it could create an unintended divide between those who would gain citizenship from that period and all other Samoans and those that might be born in the future that would not be able to benefit from the fast track and the provisions that that brought in. Of course, we know from recent submissions, like we heard from the Hon William Sio, the Minister of Pacific Peoples from 2017 to 2023—we heard from him directly that even with the complete majority, this bill was not something he was able to gain support for from his Cabinet colleagues, which is, of course, a real shame.\nThat begs the question: why now? Why is this National Government supporting this now when, as we’ve heard, no previous Government was willing to? Well, I want to cover three reasons. Firstly, I have to acknowledge the member in charge of this bill, Teanau Tuiono, for bringing it in, and his clear intent of what he was wanting and the target group. I’m quoting from his intent in the bill that this “would not create new rights to citizenship for descendants of those whose citizenship rights were removed.” The intent was never to go broader, it was to address this historical wrong. By bringing that focus and that clarity, it really enabled us to get a better sense of comfort and to know that this was a targeted bill and something that we could find unity in the select committee together around. That was a big piece of the puzzle.\nSecondly, it is about amending, not repealing. We heard official advice that there would be huge challenges with a repeal, that it was—and, again, I quote—“It was very difficult to operationalise or could not be operationalised in its current form” that passed the first reading. It could potentially kill the Treaty of Friendship—kill the fast track for Samoan citizenship—for others. It could inadvertently do more harm than good, and I think it’s a great sign of leadership, actually, that people are willing to forgo the big banner posters of repeal and go for the thing that will actually deliver the practical outcome that was desired. We could add to that things like section 32 of the Legislation Act, which are also problematic in terms of a repeal.\nBut finally, for me, as much as anything else, it was the submissions, the personal stories that moved me—the emotional, often at times, examples that we were given. I know that this bill is not directly just in response to things like the Dawn Raids, the 1929 massacre, or the Spanish flu, but I heard the submissions from people like Melani Anae, the Polynesian Panthers, David Lui, the Samoan Trade and Investment Council, and Hans Schwalger. They were very clear—and, again, I’m quoting—that the Ardern apology didn’t cut it. It was hollow, it fell short, and this bill is an outward and visible sign of an inward and invisible bond that our two countries share. One small step, as the Greens mentioned, to show more than just words.\nSecondly, it was the personal stories from people who lived in this period, or perhaps their children. I think of Akenese Taupo Pualilo and Ierome Lui Vaoliko—I apologise for my pronunciation—their parents were personally impacted; Akeripa To’Alepaiali’i, who is from this generation, has to apply for a visa to visit his grandchildren; or Mataio Lemaveve, who wanted their grandfather to be able to come and visit them; or Lealasa Tovio. She and her sister were both born in the 1940s. She has citizenship, but her older sister, who was born in 1946, doesn’t, but now they both could become citizens.\nThere is no legal precedent for this bill, I’m convinced. There is no legal right or requirement, but let’s do it anyway. This is a focus bill on one small group. It’s actionable. It’s amending, not repealing, and it’s a bill that I look forward to a constructive committee stage with. I commend the bill to the House.", "window_id": "2024-10-23#39"}, {"statement_id": "dda0be64f39f276d", "politician": "David Seymour", "party": "ACT", "side": "government", "date": "2024-12-18", "statement": "See—off the cuff, brother. I also want to thank my two fellow Northlanders Winston Peters and Shane Jones for their collegiality, working through a range of issues and making sure that this Government is dangerously united, dangerous to all our partners who thought it would be so easy.", "window": "Hon DAVID SEYMOUR: See—off the cuff, brother. I also want to thank my two fellow Northlanders Winston Peters and Shane Jones for their collegiality, working through a range of issues and making sure that this Government is dangerously united, dangerous to all our partners who thought it would be so easy. What I can see is an Opposition that is still going through the stages of grief. Man, they pick some tiny issues—tiny minds, tiny people, and tiny issues—while we’re dealing to the serious issues that New Zealand has faced, from this side of the House.\nI’m particularly pleased to see that New Zealanders will go into this Christmas with a little bit of hope. Because for far too long, it wasn’t just the fact that the Government spent too much money. It wasn’t just the fact that inflation was going up. It wasn’t just the fact that interest rates were rising and it was so hard to make ends meet. All of those things were true, but there was something much worse. There was a pervasive sense that they had a Government of “Hakuna matata”, who thought that it was all going to be OK. It means no worries for the rest of your days. Well, that’s the truth but it wasn’t the reality for anyone else. It was only the truth for that Government.\nThe real hope comes from having a Government that understands that there is no magic money tree at the bottom of the garden and that the only way we’re going to make this country a success is to unleash the ability of each and every New Zealander to succeed on their own terms. Only when people are recognised as thinking and valuing beings with the opportunity to make the most of their future will we be able to succeed as a nation. That’s what this Government believes.\nI look at some of my colleagues. Many have been mentioned already. I look at the work that Brooke van Velden is doing, the youngest Cabinet Minister in 40 years and taking to it like a duck to water, going out and listening to people about health and safety for three months so she is formulating policy informed by the experiences of everyday New Zealanders. I have to say it’s been a bit of a surprise for some of the public servants to get out there and do it, but we’re making policy in a different and better way. And that’s before you get to the fact that we’ve had a small minimum wage increase. Our minimum wage is one of the highest in the developed world—I think it’s the fifth highest—compared with the median wage, and yet that cost is put on to so many small businesses. Finally, they’re seeing relief. And Brooke van Velden tells them it’s five months before it comes in. She told them this year, not next year, so they can be prepared. And that’s before you get to ending the personal grievance culture in our workplaces that stops productivity and holds back people that are trying to make that difference in their own lives.\nI look at Nicole McKee, what she’s doing with anti - money-laundering, and simplifying one of the greatest problems that people come to us with when it when it comes to red tape and regulation. And she’s making the courts go faster, because justice delayed is justice denied. And she’s finally bringing justice to those licensed firearm owners who were vilified by the previous Government totally undeservingly and completely ineffectively.\nI look at Andrew Hoggard. Isn’t it great to have a real farmer in Parliament? And I can tell you, without breaking too much confidentiality, the number of times in Cabinet committee discussions that Andrew Hoggard’s said, “Well, I can tell you how to run a farm.” He always comes out with pearls of wisdom that are of value to the Government. Having people like that in Government is hugely important to the quality of policy—that we’re able to wait in terms of significant natural areas, with split gas approaches to methane, getting rid of farm environment plans and upgrading the Resource Management Act, so you can actually do something in this county and actually build some wealth.\nI look at Karen Chhour. Karen Chhour could make more excuses than anybody else in this Parliament, I dare say, but she makes none. She gets up and she changes the world to make it better for the next generation instead of one unending victimhood whine, as if this is just like bad weather and we can’t make tomorrow better than today. That is what Karen Chhour is doing, and that is why she annoys the left so much—because they know it’s true. They know it’s true.\nThen there’s Simon Court. His assistance to the Minister responsible for RMA Reform, in respect of replacing the Resource Management Act and that campaign with a regime based on property rights, has more potential to unleash this country and its resources and its wealth than perhaps anything else the Government is doing.\nI was so proud of launching seven charter schools—among other things I have done myself—up and down New Zealand, from all different cultural backgrounds, with so many different pedagogical approaches, but what they all have in common is that we are connecting communities with children and opportunity to do things better. We know what we’re doing is not working. People that continue to defend the system on behalf of the unions need to get with the programme. Children deserve an education in the way that works for them, and that is what charter schools, among many other Government policies, are delivering.\nPerhaps this year will be known for being the year that ACT put on the agenda an issue that nobody else wanted to talk about, except for the overwhelming majority of the New Zealand public, and that is the simple question: what does our founding document really mean? Does it mean that we are a combination of two collectives where for ever and a day we’ll be recognised based on who our ancestry was and given rights based on our ancestry? Or are we indeed a liberal, democratic society filled with thinking and valuing individuals who are able to make the most of their time on Earth without discrimination, without being categorised, boxed in, or called something because of who their ancestors were?\nThat is our dream—a dream of a country filled with thinking and valuing individuals who each have that right to use their time on Earth to make the most of their life, to make the greatest difference they can for themselves and those they care about without having to suffer through other people’s beliefs or prejudices, as long as they’re not harming anyone else. Only when we realise that dream, can we overcome the very real problem that so many of us face, from education, to economics, to health, or the economy.\nMr Speaker, I wish you a very happy Christmas, and thank you to everyone for your great work in 2024.\n\nRt Hon WINSTON PETERS: Well, what a bunch of copycats! Can’t even think originally.\nWe’d like to begin with a special acknowledgment to the many hard-working, often forgotten staff that keep the Parliament going. Thank you especially to the cleaners, security, Parliament and Beehive staff, Hansard staff, and others who work within the House, library staff, and, of course, thank you, Mr Speaker.\nNew Zealand First has had an extraordinarily good year in Government alongside our coalition partners, National and ACT, and we thank them both for it. Coalitions are not easy, but you shake hands and try to make things work, and we’re doing extraordinary well.\nWe inherited an economy that was far worse than Treasury ever knew, and they should have known it. Some members there do, but the rest are trying to deny it. Now, what was extraordinary today, of course, was Mr Hipkins couldn’t go the full distance. The bell rang a warning for a minute to go, and he sat down. And then, of course, Chlöe got up. Chlöe got up because she thought she was in Hollywood, and she began to swear—at the very beginning; it’s all in the Hansard—and then she gave us all the evidence why—\n\nRt Hon WINSTON PETERS: No, these are just little handwritten notes I put down there, Willie. Unlike you, I can write my own speeches.\nThen she gave us all the evidence of why for 54 years, since the Values Party in 1972, they have been waiting to get in a Cabinet—54 years and they’ve never been inside Cabinet. Now, you got to say their high point came this year. You watch the next election, and that goes for Te Pāti Māori sitting on the left-hand side of them as well.\nRawiri Waititi : You’re going down. You’re going down.\nOh no, no. Listen, sunshine, I’ll be around long after you’ve gone because nobody wants the “Midnight Cowboy” any more. We came back because we were on a mission to take back our country, and we packed out the rooms in this country during the year. And, at our conference, we had over 900 people listening to our convention speech—900. And we didn’t go and defraud the Charities Act, we didn’t defraud the electoral system—all of which is coming for you, sunshine, next year. You’re not getting away with breaking the laws of this country, even if some authorities think they can help you. So stand back and watch. When you declare war on us, you get a reply that’s coming next year. So you have a good Christmas, because you’ll need it, sunshine—[Interruption]\n\nRt Hon WINSTON PETERS: —and your big, loud mouth is not going to help you any longer.\nHe’s got some idea that if he opens his mouth and lets the wind blow his tongue around, he’s going to make some sense. Unbelievable. Never seen the likes of it.\nMāori have been coming here since 1867, and since 1867, those Māori leaders have all respected this Parliament, and up turns this crowd over here—so arrogant, so much in rebuttal of all the past respect. And here he is. He can’t even shut his mouth for five minutes.\nRawiri Waititi : No kūmaras for you!\nLook, we know what you are—we know what you are—and your supporters will know even better. Of course, now in the leadership of Māoridom, they are starting to question the very privilege of Te Pāti Māori. Out there where the real Māori work two and three jobs a day, they are sick and tired of people like that.\nBack to my point: we came back to stop the division and the separatism, and what they hate over there is that, for the first time, they’ve been confronted. They’re being confronted by a party that’s got a record win for Māori, a record they can speak about for day after day after day, and they can’t show me one thing they have ever done for the Māori people. Not one.\nRawiri Waititi : Sunset.\nWell, tell me what it is.\nRawiri Waititi : Sunset—100,000 turned up here the other week. Did you see them? Did you hear them?\nTell me what you’ve done for Māori—not a word, not a mutter, not a syllable, not a sound. All bulldust. Mr Speaker, I’m enjoying this.\n\nRt Hon WINSTON PETERS: As Elvis sang, “If you’re looking for trouble, you’ve come to the right place.” We’re going to expose you for what you are. This party is a party of frauds. They’ve broken the Electoral Act, they’ve broken the Charities Act, they’ve made tens of millions on the backs of their people, and, now, out there in the Māori land in Northland in particular and in Auckland, Māori are asking: “How come they made $60 million, and it’s all in somebody’s pockets?”\nNow, can I ask you this question: why doesn’t your party chairman practise law? Let’s start. He declared war upon us, and do you know why he doesn’t practise law? Because he got convicted of forging and uttering, and he was told, “You’ll get off, but don’t ever apply for a licence to practise law.” People don’t know that. You’re hearing it for the first time. Well, Judith Collins knows, and I know. But you tell your leader that when you declare war on a party called New Zealand First, there’s going to be repercussions.", "window_id": "2024-12-18#13"}, {"statement_id": "b3418c53843bfa90", "politician": "Brooke van Velden", "party": "ACT", "side": "government", "date": "2025-02-18", "statement": "Laura McClure : How will the changes you’ve announced to enable pay deductions for partial strikes benefit the community?", "window": "Hon NICOLA WILLIS: I’ve seen two recent releases from BNZ and Business New Zealand: the BNZ-Business New Zealand Performance of Manufacturing Index and the BNZ-Business New Zealand Performance of Services Index. In terms of manufacturing, the index lifted sharply in January to its highest level since September 2022. And while, of course, individual manufacturers will have their own sets of circumstances, manufacturing on the whole is now expanding after 22 months of contraction. The BNZ describes this as “a positive start to 2025, with the manufacturing sector shifting out of reverse and into first gear.”\nPaulo Garcia : What did the Performance of Services Index show?\nThe Performance of Services Index also moved into expansionary territory after an extended period of contraction. That means the services sector, the largest part of our economy as a whole, is growing, although modestly. Both the manufacturing and services sector results are consistent with a pick-up in economic activity at the beginning of 2025, supporting Kiwi jobs and incomes.\nPaulo Garcia : What other recent economic reports has she seen?\nI’ve seen a report from Westpac that says that dairy incomes look set to hit record highs in nominal and, perhaps, real terms. This is good news for supporting New Zealanders’ jobs and incomes—go the farmers! Yesterday, Statistics New Zealand released its latest international travel stats, and this showed that there was a 12 percent increase in overseas visitors to New Zealand in the last year, the highest number since COVID. We want more tourists coming to New Zealand, opening their wallets, spending money in local businesses, supporting Kiwi jobs, and growing Kiwis’ incomes.\nPaulo Garcia : When is the next major economic release?\nTomorrow, the Reserve Bank releases its quarterly Monetary Policy Statement (MPS). The MPS will include the bank’s view of the global and domestic economy, its latest forecasts, and the Monetary Policy Committee’s decision on the official cash rate (OCR). Decisions about the OCR are, of course, for the committee but the market and most economists are expecting a reduction in the OCR of 50 basis points. That would take the OCR down to 3.75 percent, supporting lower retail interest rates which, in turn, support a growing economy, jobs, and incomes for New Zealanders.\nQuestion No. 4—Workplace Relations and Safety\n4. LAURA McCLURE (ACT) to the Minister for Workplace Relations and Safety: What announcements has she made about restoring balance in employment relations?\n\nHon BROOKE VAN VELDEN: I’ve announced a plan to reintroduce pay deductions for partial strikes. This will be discussed at select committee this week. This Government has committed to this change because we need to restore balance to the rights and consequences of collective bargaining. If workers are partially striking by refusing to do their normal work, why should they get paid a normal wage? I’m also restoring balance to personal grievances by removing entitlements to remedies in situations where the employee is found to have contributed to the personal grievance. For too long, employees have been able to claim compensation for hurt and humiliation even if they were dismissed for serious misconduct. It’s no wonder I’ve heard from so many employers who are concerned the personal grievance system is unbalanced in favour of workers.\n\nHon BROOKE VAN VELDEN: My changes will give employers confidence that they can act to remove workers in cases of serious misconduct in order to keep other workers safe, without fear that doing so will end up costing tens of thousands of dollars in personal grievance compensation. I’ve heard one case where a worker was intimidating and abusive towards another worker, yet the employer felt like they were between a rock and a hard place as they feared the intimidating worker might raise a personal grievance and be reinstated if they were dismissed.\nLaura McClure : How will the changes you’ve announced to enable pay deductions for partial strikes benefit the community?\nMany of the examples of partial strikes we’ve seen in the past were designed to intentionally cause disruption to the public. Often, it’s the community who loses out or are caught in the middle when partial strikes occur. When teachers refused to teach certain year groups on particular days, it was parents who paid the price by having to take unplanned leave from work in order to take care of their kids who were rostered home, not to mention the cost of lost learning for the students. When hospital-based nuclear medicine technologists limited the number of scans completed each day, it was patients waiting for their results who suffered. If communities and employers bear the negative consequences of partial strike action, it’s only fair that employees do too.\nQuestion No. 5—Finance\n5. Hon BARBARA EDMONDS (Labour—Mana) to the Minister of Finance: Does she stand by all her statements and actions?\n\nHon Barbara Edmonds: Does announcing $19 million of additional spending for conservation make up for the $125 million that was cut from conservation in her Budget?\n\nHon NICOLA WILLIS: Did the member just say the $125 billion that was cut from conservation spending? Because that would be a ludicrous figure to use in this House.\n\nHon Barbara Edmonds: Does announcing $500,000 of additional spending for tourism marketing make up for the $20 million that was cut from the “marketing New Zealand as a tourist destination” fund at Budget 2024?\n\nHon NICOLA WILLIS: Well, the Government stands by its decision to invest in effective marketing campaigns to bring tourists to New Zealand because that supports New Zealand jobs and incomes. On the other side of the House, they’ve got to make up their mind. Should we be investing more in attracting tourists, as these questions seem to suggest, or does she not think tourism is a good idea, as other of her members have suggested? I don’t know which way is up or down with you guys.\n\nHon Barbara Edmonds: How does cutting $24 million from the New Zealand Cycle Trails, Great Rides, and the tourism recovery fund help promote New Zealand as a tourism destination?\n\nHon NICOLA WILLIS: Well, investment in cycle trails continues. As a Government, we’ve made it very clear that where we make investments, we want to make sure they’re having the biggest impact for New Zealanders. Taxpayers deserve to know that when a dollar of theirs that’s been taken out of their household budget is being spent by Ministers, it is going to its absolute best value and impact.\n\nHon Barbara Edmonds: Why is she spending international visitor levy funding to attract tourists from Australia that do not pay the international visitor levy?\n\nHon NICOLA WILLIS: Well, we’ve been very clear that we want the international visitor levy to support the tourism sector growing in a way that supports New Zealanders and so it’s our view that, right now, getting tourism numbers up is important. It’s important for every New Zealand community who has restaurants, cafes, or tourism operators that need more people coming through their doors; it’s important for all those people who would like a job but can’t get one because those businesses haven’t got the tourism numbers coming through the door; and it’s important for businesses in the future, who we want to see investing in these industries and paying their employees more. We stand by our decision to support tourism growth.\n\nHon Barbara Edmonds: Does cutting major Government spending, then announcing new spending at a fraction of what was cut, count as new spending?\n\nHon NICOLA WILLIS: As I have outlined to the member, our focus is on ensuring that where we have dollars to invest, we are investing them for their highest impact. That means putting them into areas which will actually get tourism back to the levels it was before it was decimated after the COVID-19 border closures, and that means ensuring that we’re promoting our tourism sector effectively offshore.\n\nRt Hon Winston Peters: Could I ask the Minister of Finance to please put the Labour Party at ease and let them know that “Everybody must go” is not our view of the Labour Party?\n\nHon PAUL GOLDSMITH: It’s progressing very well. Having banned gang patches and restored three strikes, the next step is the Sentencing (Reform) Amendment Bill. This gives sweeping changes to put more serious offenders in prison for longer, and to prevent them from creating new victims, and is getting one step closer to becoming law, set down for second reading this afternoon. This Government promised to restore real consequences for crime, and that is what we are doing.\nTom Rutherford : What will the Sentencing (Reform) Amendment Bill do to restore stronger consequences for crime?\nThe Sentencing (Reform) Amendment Bill reduces the ability for judges to massively reduce sentences for convicted criminals. There’ll be a cap on total sentencing discounts of 40 percent, and there will no longer be repeated discounts for remorse. You can’t be remorseful repeatedly. The bill also makes a number of other changes, including the addition of a range of new aggravating factors, such as for adults who offend in crimes alongside young people, such as in ram raids.\nTom Rutherford : Why is it important to restore stronger consequences for crime?\nWell, because New Zealanders deserve to feel safe in their communities. The Government is concerned that in recent years, the courts have imposed fewer prison sentences while the prevalence of serious crime increased. That’s why the Government set an ambitious target of seeing a reduction of 20,000 fewer victims of assault, robbery, and sexual assault by 2029. The data has long lead times, but early results from our work have been encouraging. There have been 24,000 fewer victims over the year ending October 2024 compared to the year ending June 2024.\nTom Rutherford : What other actions is the Government taking to restore stronger consequences for crime?\nWell, we’ve introduced legislation to make stalking an illegal and jailable offence. New laws are providing police with additional tools to disrupt gangs, and we’re already making a mark on our communities through that. We’re currently considering proposals submitted by the excellent ministerial advisory group led by Sunny Kaushal to combat retail crime. Indeed, there’s much more work to be done.\nTākuta Ferris : Given the three CEOs in Justice don’t believe that they have the capacity to reduce overrepresentation of Māori in either Justice, Police, or Corrections, will the Minister commit to setting them targets that they must achieve?\nWell, look, our primary target is to reduce the number of victims of crime, and that is what this Government is focused on. As that member is well aware, sadly, Māori are more likely to be victims of crime than the general public. That is why we are absolutely focused on reducing the number of victims of crime, and that is the best thing we can do for Māori in the criminal justice system.\nQuestion No. 7—Children\n7. Hon WILLOW-JEAN PRIME (Labour) to the Minister for Children: Does she stand by all her statements and actions in relation to serious youth offenders and the military-style academies?\n\nHon KAREN CHHOUR: Yes, in the context in which they were made at the time. I especially stand by my actions to provide funding of $30.6 million over four years to continue the fast-track youth offending programme and extend the programme to 14- to 17-year-olds, which will contribute to Government Target 3, a 15 percent reduction in the total number of children and young people with serious and persistent offending behaviour.\n\nHon Willow-Jean Prime: What are her measures of success for the entire 12-month military-style academy (MSA) pilot?\n\nHon KAREN CHHOUR: My measure of its success is around making sure that our communities are safe, and we are also putting in place opportunities for young people to be the best version of themselves. What they do with that is ultimately up to them.", "window_id": "2025-02-18#1"}, {"statement_id": "0860bf4d156f4027", "politician": "Erica Stanford", "party": "National", "side": "government", "date": "2025-04-08", "statement": "That’s pretty alarming. How would the Minister justify that? Well, it’s not really alarming at all. The fact is—and we had this over all of the curricula areas—there are many people who are involved in a curriculum area, and, on occasion, they disagree—\nKatie Nimon : Wow, a difference of opinion!", "window": "Hon ERICA STANFORD: Thank you. That’s an excellent question. They are not resources that have been translated from the English version into te reo Māori. The ministry, under my direction, have gone out and contracted Māori academics and specialists in te reo Māori, structured literacy, and in pāngarau as well. All of those resources have been created by the most incredible—and I’ve met some of them—Māori academics and Māori specialists, so it’s certainly not been a simple translation from English.\nGRANT McCALLUM (National—Northland): Thank you, Madam Chair. Just for the Minister of Education, I’m interested to know—one of the important factors we focused on was student achievement—what was it that led to you bringing such a big focus to the numeracy aspect and the structured numeracy aspect? What were the results that you found that led to that?\nIt’s fair to say that mid - last year we had a bit of a shock when we saw the School Improvement Plan (SIP) results. The SIP results are an assessment that we do with a randomised number of students, about 2,000 or 3,000, in different subject areas, and the maths one was particularly bad. I look at the year 8 results: those year 8 results had about 22 percent of kids at curriculum for mathematics before they went into high school.\nNow, it was shocking, but were we particularly surprised, given what we’d heard from principals, who were saying to me, “Erica”—when I was in Opposition, not Minister—“we are getting students who are turning up at high school who don’t know their basic facts, have got huge chunks of their learning that are just missing. They don’t know their times tables; they haven’t automatised those.” We haven’t been making sure that there’s instant recollection of basic facts, which, we know now, from the science of learning, you have to have if you’re going to be able to solve complex problems and not get cognitive overload.\nSo we knew in Opposition that there was a problem. When we saw these results—22 percent, and I think it was around 12 percent of our tamariki Māori, at curriculum for mathematics before they went into high school—those were particularly galling, and we knew at that point that we couldn’t wait. Frankly, I don’t know how the ministry did it, but they have. We have the new curriculum in place this year, half a million maths books that went out to market in, I think, around July or August last year. They were aligned to the curriculum, they were printed, they were delivered, and then delivered out of our warehouse in the Hutt to schools around the country in January this year.\nSo, basically, what drove it were those awful results that, frankly, we weren’t particularly surprised about, but we are now doing something about it.\n\nHon WILLOW-JEAN PRIME: Thank you, Madam Chair. Just a question about those maths books provided to Māori-medium schools: how many of them were printed upside down, and how much did that cost? Further to that, what feedback has she got from principals and teachers about those maths resources, from Māori-medium education?\nDr LAWRENCE XU-NAN (Green): Just one quick question, because I know that other people may have questions as well. I’m just confirming with the Minister of Education that the remainder of the $3 million that I asked about before has been used on professional learning and development.\n\nHANA-RAWHITI MAIPI-CLARKE: Tēnā rā koe e te Pīka. Tēnā rā koe e te Minita. I’m just going to quickly ask some brief first initial questions to the Minister of Education, and one of them is around Waikato-Tainui having a partnership agreement with 14 kawenata schools in Waikato and South Auckland. They are setting mutual education objectives, and among these are having Waikato histories taught as part of the school curriculum.\nWhat can the Minister of Education report back, in the progress reports that the Education Review Office (ERO) provides, on its curriculum development work with iwi arising from pou reo evaluations, and, in particular, the teaching of New Zealand war histories—Te Pūtake o te Riri—within Hauraki-Waikato and in these schools nationwide? That’s the first question.\nThen the second question is: the annual report explains that ERO’s He Taura Here Tangata Māori strategy also delivers on commitments to the Whāinga Amorangi plan, the Crown commitment to increase its own te ao Māori capability; what feedback can the Minister progress reports in from iwi and kura that ERO can provide on the status of te ao Māori’s capability—that was a bit of a mouthful! Thank you.\n\nHon ERICA STANFORD: Thank you, Madam Chair. Just in response to the member Willow-Jean Prime’s question about the Māori maths resources, the feedback that we’ve had has been excellent. The resources—I’ve got some of them here—are, as I say, developed by experts, and I know that the Opposition are looking to find issues everywhere. I’m not aware of anything that’s been printed upside down; it’s not been brought to my attention. But what I had expected, I guess, if you’re interested in student achievement and wellbeing, is details about actually what’s in the curriculum—like a good, smart question might be “Hey, Minister, on page 29, we don’t think that this should be in this part, but it should be somewhere else.” But, instead, we’re getting questions about whether or not things are printed upside down, rather than celebrating the fact that these were developed by world-leading experts in Pāngarau. But here we are, worried about something that may have been printed upside down. It tells us a lot about the Opposition.\nDr LAWRENCE XU-NAN (Green): Thank you, Madam Chair. Since we are on the curriculum, let’s actually talk about the curriculum. I want to ask questions to the Minister around the ministerial advisory group for the curriculum. Let’s start with, say, literacy. The Minister says “world-leading experts”, but let’s face it, in the beginning it was, essentially, just one or two people—there might be a whole team of them, but it was mainly led by one or two people—and I think we all know who they are. Can I just check whether the ministerial advisory group did also take part in the writing of the curriculum—which is a big no-no—and what the conflict of interest process is for that? We are also understanding that there are people who were part of the writing of the curriculum whose company is now being contracted to deliver them.\nI put together a ministerial advisory group when I first became the Minister. They were only in place for a very short period of time and did one report for me on the state of the curriculum and where they saw it going—their work was then finished. It is up to the ministry to contract writers on different curricula areas. For the English curriculum that we just put out recently, for example, there were around 20 different writers, over different periods of time. It went through a number of different iterations, through many different writers, and now it’s out for consultation to the broader sector, and the feedback we’ve had so far has actually been really good.\nI had the principal of the largest school in the country text me to say how good it was. I’ve also had the principal of a large intermediate in Auckland also email me, just the other day, to say how good they thought the new English curriculum was. I think that’s a product of the fact that we had so many voices in the process. The other thing, I guess, just to remind the member, is that it’s not up to the Minister to pick writers on these groups; it’s up to the ministry—they make those decisions.\nDr LAWRENCE XU-NAN (Green): Thank you, Madam Chair. Just a quick follow-up, since the Minister of Education mentioned the senior English curriculum: can the Minister enlighten the committee on why the New Zealand Association of Teachers of English pulled out, citing that there is a lack of transparency, there’s a lack of ability to consult, and there’s a lot of secrecy behind that consultation? When we’re looking at the Association of Teachers of English for high schools, the entire association, pulling out, how would the Minister justify having lots of people being a part of it and getting all of this feedback, which is anecdotal, let’s say, from one school, but then we have the entire national association that pulled out of the development? That’s pretty alarming. How would the Minister justify that?\nWell, it’s not really alarming at all. The fact is—and we had this over all of the curricula areas—there are many people who are involved in a curriculum area, and, on occasion, they disagree—\nKatie Nimon : Wow, a difference of opinion!\nYep—and it happens. The English association—it was a shame that they didn’t want to be involved. They were involved earlier on in the subject learning outcomes that we had written over the Christmas period, when we became the Government, because we could see that the roll-out of the NCEA level 1 was such a disaster. They were involved in that.\nLook, it’s up to them, and the questions need to be put to them around why they wanted to be involved or not. But I would note that their feedback so far on the English curriculum has been pretty muted, because, frankly, I don’t think there’s much in the English curriculum to be upset about; because, as I say, it is world-leading, knowledge-rich, year by year. It’s out for consultation—lots of people can now have their say about what they do and don’t like, and I suggest that that member might like to go and look at the English curriculum himself, and the feedback as well. Thank you.\n\nHon WILLOW-JEAN PRIME: I’m just really interested to understand what definition the Minister of Education uses for the “science of learning” when she often refers to it. Can she, please, explain, step by step, how implementing the science of learning will meaningfully change how students are being taught, particularly in terms of the curriculum we’ve been talking about?\nWhile I’m just waiting for the Minister to answer that question, can she also talk about what consideration has been given to neurodivergent students when considering the implementation of the science of learning?\n\nHon ERICA STANFORD: There is a huge wealth of research and information around the science of learning. There is decades of cognitive—\nDr Lawrence Xu-Nan : What’s the definition?", "window_id": "2025-04-08#21"}, {"statement_id": "5695c7ca0b8342f9", "politician": "Mark Patterson", "party": "NZ First", "side": "government", "date": "2025-06-24", "statement": "The Principles of the Treaty of Waitangi Bill—opening ourselves up to the world again—lorded over the New Zealand public for more than a year, exhausting many of us.", "window": "Hon MARK PATTERSON: Mr Speaker, I’m over here, over in the seat called Siberia. We’ve got to get these angles right. You and I both have to adjust.\nNew Zealand First does support this Overseas Investment (National Interest Test and Other Matters) Amendment Bill. These are sensible changes. They’re not the apocalyptic version that the Hon Julie Anne Genter was describing before the dinner break or a return to feudalism. This bill does streamline some processes. There is some triaging so that the genuinely sensitive transactions that would trigger a national interest test still go before Ministers, but there is a fast track, if you like, a streamlined process, for those lower-risk investments, and it adds a trusted investor category too, which does make some sense. The process at the moment is ad hoc, it’s bureaucratic, and it is opaque. We do support these refinements.\nIt does enable us to have a focus on growth. We are absolutely, relentlessly focused on growth. We do have enormous opportunities in this country. We are restrained in many cases by capital. We’ve got an enormous infrastructure deficit that we do need to address. These measures are freeing up the overseas investment provisions, will create jobs, will enable us to add value to the likes of our primary sector—that’s $60 billion of primary exports—and get money for agritech and nutraceuticals and the like. But New Zealand First is cautious about foreign investments. It’s on the tin; it’s in the name. We have looked very, very carefully at this bill.\nWe do think there is a strong case for keeping control and having some oversight of our key strategic assets. To our cost, we have lost Marsden Point, we have lost control of our banking sector, and we see those dividends sucking out every year to the cost of our balance of trade or our current account deficit. It is not one-way traffic; we do need to keep some guard rails here. New Zealand First had been very clear, and I’d like to thank the Hon Barbara Edmonds for probably acknowledging that—well, she did acknowledge that, but she was right—New Zealand First has drawn a line around farmland, around fishing quota, and, essentially, the stock of family homes. Putting those on the international market and inflating them beyond the means of the average Kiwi is completely anathema to us. The coalition as a whole has agreed to that, and that is protected, and I want to make that absolutely clear in this reading that that is protected within these provisions.\nThere should be a Kiwi citizenship advantage. We should tip the scales in favour of our own people in areas like that, where it doesn’t actually bring any advantage to us, just inflating a price of an existing asset. We have held firm over that, and we make no apologies. It is core to our values. We do not want to be tenants in our own land. That doesn’t mean that we are “Fortress New Zealand”. We are not North Korea. We do rely, and have always relied, on foreign investment to grow our economy and to build our productive capacity, and, as the Minister said in his introductory speech, it’s not just the capital; it’s the expertise that can be brought in, and it’s the access to the domestic markets for the companies that are coming in. There are some mutual benefits that can be gained through this, but we do go in with our eyes wide open within this bill. We should make it easier. It is far too complex; it is far too bureaucratic.\nWe will support this bill. We are going to support this through to the select committee and beyond. We think we’ve got it into a pretty good place. We thank the Minister and our coalition colleagues for being sensitive to the ideals that we hold dear and hold firm on, and we have made our way through this to get this bill to this first reading. Thank you.\nTĀKUTA FERRIS (Te Pāti Māori—Te Tai Tonga): Tēnā koe e te Pīka. E tū ana ahau ki te whakapuaki i ngā whakaaro o Te Pāti Māori e hāngai nei ki ngā whakaaro o te iwi Māori mō tēnei pire e kīia nei ko te Overseas Investment (National Interest Test and Other Matters) Amendment Bill.\n[Thank you, Mr Speaker. I stand to express the opinions of the Māori Party that align with the opinions of the Māori people concerning this bill, known as the Overseas Investment (National Interest Test and Other Matters) Amendment Bill.]\nI might just open by referencing the Associate Minister of Finance’s statement. He said we’re opening ourselves to the world. This seems to be a fairly common theme in the thinking from this Government—opening ourselves up to the world. Indeed, we’ve seen many bills brought before the House that have suggested that opening ourselves up to the world is the way to go. We’ve already had to deal with the Fast-track Approvals Act, readily opening ourselves up to the world as quick as we possibly can. The Principles of the Treaty of Waitangi Bill—opening ourselves up to the world again—lorded over the New Zealand public for more than a year, exhausting many of us. Now, we have the Regulatory Standards Bill (RSB) aiming to do the same thing. It’ll open us up to the world, and not just any part of the world, e te whānau: the corporate part of the world. You know, whai mai [follow along]: it stands that following these few, we’re going to have to deal with a review of 28 pieces of legislation, taking Te Tiriti o Waitangi out—one of the last and longest-standing vanguards for the protection of Aotearoa against the corporate interests of the world. But, here we go, let’s get rid of that one too!\nNow, here we are with the Overseas Investment (National Interest Test and Other Matters) Amendment Bill, and the Minister is happily and openly promoting the idea that we need to open ourselves to the world for foreign investment and that exports are the things that we need to fix our country. Well, in my 46 years—but probably only 30-odd of paying attention to these things—it seems that exports haven’t managed to save us yet. Neither has foreign investment. All it’s done is managed to entrench the people who live in the lower end of society—all of the New Zealanders out there—into their category.\nAs we all know in this House right now, we are living through some of the most extenuating times that our country, and people of this country, have ever had to deal with. All of the economic wizardry of decades and decades and decades of Parliaments and Governments come and gone, come and gone, come and gone, hasn’t seemed to address the issues but only entrenched them even further. Here we go again: a bill with no regard for Te Tiriti o Waitangi—a common theme amongst many bills in the current iteration of New Zealand Government—the removal of protectionary measures that are there—they’ve been there for a long time, but let’s strip them out to make the accessing of natural resources and the opening up of ourselves to the world easier to do, quicker to do. The benefit test has been stripped down to one protection that a single Minister could make the call on. We’re just continually faced with this set of circumstances and these types of propositions that have consistently failed us, decade in, decade out, so why should we possibly think that they’re going to fix things now for ordinary New Zealanders?\nA condensed time frame—it seems again that te iwi Māori have been quite conveniently left off the groups of people who will be consulted with bills such as this. When we’re talking about opening up our natural resources, I’m sure te iwi Māori are still a partner to Te Tiriti o Waitangi. That had a blanket caveat across all natural resources of the country and yet was left out again—owing to, of course, a short time frame. Well, we know that the bill was part of the coalition agreement, so it’s been around for at least two years, so I don’t know how you haven’t had enough time in two years to consult with any iwi Māori groups out there. And I’m sorry, but Te Arawhiti and Te Puni Kōkiri don’t count as iwi Māori groups. But we are getting used to seeing this—getting used to seeing this. All these things are left out of a raft of bills: the fast-track Act; the Treaty principles bill; the RSB; the removal of Te Tiriti o Waitangi from 28 bills, as promoted by New Zealand First; and the Overseas Investment Bill—all taken out. And so, man, where can we turn to?\nWhat we can say is that Te Pāti Māori are committed to strategies that enhance te taiao, strategies that protect the country’s natural resources for future generations, and strategies that are committed to the wellbeing of our mokopuna. These are the things that we will support, but unfortunately for this bill, we do not commend it to the House.\n\nRYAN HAMILTON: Thank you, Mr Speaker. It’s great to speak on this, the Overseas Investment (National Interest Test and Other Matters) Amendment Bill. I think it’s good to bring it in context with another bill which will be coming through today or tomorrow in its third reading, the Invest New Zealand Bill. Of course, my colleague referred to the Active Investor Plus visa. As you start to look at these things in context, it’s starting to say New Zealand is open for business. We can’t survive by selling things to ourselves; we need to open ourselves up to more investment to get things done. Federated Farmers agrees and says that, as a small nation, capital and investment from overseas can help New Zealand to fix infrastructure and drive industry development. I commend this bill.", "window_id": "2025-06-24#18"}, {"statement_id": "03bb3241f773fd53", "politician": "Erica Stanford", "party": "National", "side": "government", "date": "2025-11-04", "statement": "And I’ll tell you what, the member opposite hasn’t actually said what she thinks that it means. We are being very, very clear.", "window": "Hon Erica Stanford: Madam Chair, it is very clear, in everything that we're doing, that we are supporting te reo Māori in schools, not only making sure that school boards have an obligation to make sure that they're offering te reo Māori but also making sure that everything is available in te reo Māori—more so than any Government ever, that I've been able to see. So there's no need for the member to take offence.\n\nHon WILLOW-JEAN PRIME: Thank you, Madam Chair. We’ve just had the Minister, once again, standing up and talking so proudly about her record of te reo Māori. My question to the Minister is: what gave the Minister the right to determine that Te Tiriti o Waitangi means providing resources in te reo Māori? Who gave the Minister and the Crown the sole right to determine that giving effect to Te Tiriti o Waitangi is to simply provide resources in te reo Māori? Who did she talk to?\nWhich iwi, which hapū who signed to Te Tiriti o Waitangi did the Minister talk to, to determine that in order to give effect to Te Tiriti o Waitangi all she has to do is give some resources and te reo Māori? The duties of the Crown to give effect to and honour Te Tiriti o Waitangi are far more than providing some resources in te reo Māori, OK? The Minister might want to address that one for us.\nBut I want the Minister to also tell me how she can claim that providing resources in te reo Māori is giving effect to Te Tiriti o Waitangi when she is also recolonising the curriculum, whitewashing the curriculum? Who was involved in the rewrite of that curriculum, minimising the use of te reo Māori, minimising Māori concepts and matauranga Māori in that curriculum`?\nMinister, as the Crown, who did you work with when working with your Treaty partners? Who did you consult? Who agreed that giving effect to Te Tiriti o Waitangi was removing Māori words from 5-year-old students’ readers? Can she tell me the answer to that one?\nWho did the Minister consult with when she decided that giving effect to Te Tiriti o Waitangi meant removing $30
