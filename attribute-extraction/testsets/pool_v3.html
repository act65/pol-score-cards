op that charter and to have the power to do so under this part, given that Auckland Council is the decision maker up until this point and could continue to be the decision maker about the values and about the protections that are in place under his legislation that he has proposed? Thank you, Mr Chair.\n\nHon SIMEON BROWN: I thank the members for their questions. What happens to Northland? Part 4 deals with services for Watercare in the Auckland region—it does not apply to Northland—but it does not prevent Auckland Council from entering into joint arrangements with other councils if they wish. How does it apply to stormwater? Auckland Council will continue to retain stormwater. The arrangement set out in Part 4 is mutually beneficial for both Auckland Council and Watercare, and, ultimately, consumers, because it enables them both to borrow independently of each other.\nIn relation to the issue in clauses 59A and 59B, these clauses are here because, ultimately, Watercare is a monopoly provider and so this is about clarifying that they are a monopoly provider. Of course, then the point of having a Crown monitor and in terms of having a charter is to ensure that there are consumer protections in place to protect consumers and to ensure that, as it says in the purpose section, clause 59A(1)(c), “Watercare manages its operations efficiently with a view to keeping the overall costs of delivering water services at the minimum levels consistent with the effective conduct of its undertakings and the maintenance of the long-term integrity of its assets.” That is what those clauses are to do with.\nIn relation to the question asked by Arena Williams, this is a point that was discussed between the Government and the Crown. In relation to the preparation of the charter, it was agreed that the secretary would prepare it, but that would, obviously, be done in consultation with Auckland Council. That is, ultimately, due to the fact that the arrangement here needs to ensure that the financial separation which is articulated works to the benefit of both the Crown and the council.\n\nHon Dr DEBORAH RUSSELL: We’d really only just started on this part of the bill before the dinner break. I’m aware you will have been watching.\n\nHon Dr DEBORAH RUSSELL: But it is a very significant part. And it’s a very significant part because it concerns the water services for a third of the population of the country and the biggest city in the country. It concerns quite a unique structure in the country around Watercare Services.\nI think we need to understand, from the Minister, the nature of the deal that has been struck with Auckland Council, because we know that a special deal was struck with Auckland Council. Auckland-based as I am, I think it’s important for people in the rest of the country to understand why Watercare is getting some special treatment here. I think there are some particularly important issues around what is to be done with water in Northland. Northland has been left isolated by this treatment for Watercare.", "window_id": "2024-08-20#17"}, {"statement_id": "3d09cddbd423b871", "politician": "Debbie Ngarewa-Packer", "party": "Te Pāti Māori", "side": "opposition", "date": "2024-10-23", "statement": "South Waikato, Maniapoto, Te Nehenehenui, and Raukawa talked about the fact that this cannot succeed at the expense of restoring the health and wellbeing of waterways, as provided under the Waikato River arrangements.", "window": "DEBBIE NGAREWA-PACKER: Tēnā koe e te Pika. I rise on behalf of Te Pāti Māori to speak in opposition to this bill for a few reasons: the removal of Mana o te Wai, the diluting of mana whenua, making it easy to mine and destroy indigenous taonga, the impact on significant natural areas—for example, wāhi tapu—and making it easier for bad farmers. That, really, is what is at discussion here, and as the original rural farmers here—as tangata whenua—what we’re really doing is talking about those who don’t meet and/or don’t want to meet any thresholds.\nI heard, here, and I want to sort of capture the whole aspect about this mana o te wai, and you can’t regulate mauri. Actually, Māori have regulated mauri for thousands of years through something called “tikanga”, and if you don’t know it, go and find out for yourself. It is not my role here to make the allies’ jobs easier. Māori farms and Māori approach to farming, despite our natural development being interfered with, is extremely values-based—indigenous - values-based.\nLake Taupō, Miraka, Wakatū, Ātihau-Whanganui, Ngāi Tahu have all adopted kaupapa-based ways of how they look after te mana o te wai, of how they put the taiao first, of how they are also contributing to the economy for the whole of Aotearoa. What we have here is lazy, lazy politicians who don’t want to sit there and understand what is required for te ao Māori, mana o te wai—[Interruption] And they’re all speaking at the moment. There you go.\nWhat I want to do is talk about the fact that what we have here is a whole bunch of people who are making it easier for the bad farmers, because good farmers have pride in looking after their wai, they understand mana, they understand the mana of their whenua, they understand the mana of their wai, they understand the mana of their mokopuna. And that is what this is about. Those who don’t understand the mana of their mokopuna aren’t future focused. In Te Tai Hauāuru, we had multiple submissions. We had Ngā Iwi o Taranaki who strongly oppose this. They said there was a lack of ministerial transparency. There was poor due diligence. They said that there was absolutely no compliance of the principles of Te Tiriti—surprise, surprise. They talked about the health and wellbeing of water bodies. They talked about the fact that there was absolutely no respect for the rangatiratanga, kaitiakitanga, and community interests.\nSouth Waikato, Maniapoto, Te Nehenehenui, and Raukawa talked about the fact that this cannot succeed at the expense of restoring the health and wellbeing of waterways, as provided under the Waikato River arrangements. They talked about how the politicians here are frightened of te ao Māori and its source of matauranga and the kaupapa of mana o te wai. They talked about how the Crown is failing to meet its Te Tiriti duties of participation, it was unacceptable in the purpose of Waikato River arrangements, and how we must protect the health and wellbeing of the Waikato River. was South Waikato who have huge experience in the awa.\nRuapehu, Whanganui, and Ngāti Rangi oppose this. They talk about the violation of Rukutia Te Mana settlement provisions and the undermining of Te Waiū-o-Te-Ika. They talked about, under the provisions of this, how it has been granted protection in its own legal entity and the tangata tiaki of Te Waiū-o-Te-Ika comprising the Whangaehu River and the rivers and streams that flow into it. They talked about, on behalf of these awa, how they are extremely distressed by what has been happening to them because of these changes. They talked about how this is an extension of the fast-track bill and the undermining of the principles of the partnership. Now, these are—let’s go back to it—all iwi who contribute to the economy of Aotearoa. The proposed changes in Ngāti Rangi’s settlement view is that it violates their living entity, Te Waiū-o-Te-Ika, and breaches their international obligations under the Convention on Biological Diversity.\nNow, let’s go back to visiting who is putting these submissions in. They are innovative, they are contributing to the employment and the productivity, indeed, of the primary sector of this nation. They are investing in world record taiao kaupapa. They have a world record in what they do in the research and science sense. They are not bad farmers; they are progressive not only in how they invest but how they think. They have extensive international relationships, and these entities take exception to what this Government is forcing on them.\nTe Mana o te Wai is something that the iwi have fought for for a very long time, to have regulated and accepted, and it is disgusting to be here with this Government, but not surprising, with what’s going on. Kia ora rā.\n\nLAN PHAM: Tēnā koe, Mr Speaker. This is a sad day for fresh water and biodiversity in Aotearoa, and it’s, therefore, a really sad day for all of us, because so much of what makes living in Aotearoa incredible is the one foundational thing that is so foundational, so core to our health and wellbeing. That is Te Mana o te Wai, ki uta ki tai [from inland to the sea]—it’s water—and yet here we are, this Government is doing an absolute disservice to wai Māori and, therefore, a disservice to ourselves.\nThis piece of “quick and dirty legislation”, just to quote the Minister’s own description, is just one part of this Government’s comprehensive dismantling of not only the capacity and capability of our environmental agencies and our science institutes, with these crippling funding cuts that we’ve seen, but to add to that, the systematic override and weakening of our environmental legislation. The bare minimum of laws that formed what we understood in this country to constitute an environmental protection. This bill is yet another abomination of democratic override, with the truncated time frame for public submissions and the last-minute additions of Government bowing to the whim of industry demands to actually override local democracy and allow this continued pollution and environmental damage for the private profit of a few.\nWho gets left to pick up the tab of the legacy pollution of all of this, the contaminated streams, rivers, lakes, estuaries, beaches? It’s the public. It’s iwi Māori, it’s our kids and our grandkids. Quite frankly, the inaction—I agree with my colleague—it’s lazy, it’s cancelling, it’s delaying, it’s removing protections that are ultimately insulting. They’re insulting to New Zealanders because thousands of them have worked in good faith alongside councils, alongside mana whenua, community industry, NGOs, and they’ve actually agreed on ways to improve fresh water, and they’ve agreed on ways for their own local environment. I’m really sick of hearing this one-size-fits-all description of Te Mana o te Wai and the hierarchy, which simply it was not and is not and needs to be ended.\nNow, we’re left with nothing but delay and decline. I just want to point out just one example among the litany of mistakes that this Government is making with this bill, and that is around the removal and weakening of the intensive winter grazing regulations. I want to quote, within this, the Public Health Communication Centre and their submission, because they’ve actually looked at the evidence and made it crystal clear that intensive winter grazing “is a highly polluting activity”. It results in frequent “high nutrient, sediment, and faecal matter pollution of [nearby] waterways”, with four to five higher nitrate losses and 12 times higher sediment losses than those from pasture grazing. It “Impacts on waterbodies” and the impacts of intensive winter grazing “can last for many decades as they are cumulative.” It’s those cumulative impacts that this Government is also removing the ability of councils to actually address. This change to section 107 actually allows higher levels of pollution in some of our most degraded waterways. It’s a fundamental baseline of protection for freshwater ecosystems that is now unable to be upheld.\nThe changes to it in this bill will not only shut out iwi Māori and public voice in having a say on this, but everyone in Aotearoa who cares about fresh water and deserves the right to actually have a say about our protections, about those things that ultimately impact the health and wellbeing of them, their whānau, and all the native critters and fish who once thrived in our freshwater ecosystems and who will no longer. It’s a real shame and it’s a sad day and Te Pāti Kākāriki do not support this bill.", "window_id": "2024-10-23#14"}, {"statement_id": "84fe24e2a6d5945e", "politician": "Megan Woods", "party": "Labour", "side": "opposition", "date": "2025-01-29", "statement": "There were some very specific provisions that went with it. We thought this was an important thing. It was one piece that we needed to put in place in terms of solving our housing crisis.", "window": "CAMERON BREWER: I’m very pleased to speak in support of this bill that’s gone through the Finance and Expenditure Committee. This is another story of this Government being prepared to deal after generations—certainly after six or seven years—with the supply side of housing. We’ve seen that with bringing in deductibility—phasing that in again; another phase on 1 April—as a genuine tax expense that can be put against for landlords, lowering the brightline test to two years, and, of course, lowering inflation and lowering interest rates, with the Reserve Bank set to make another announcement on 19 February.\nThis Overseas Investment (Build-to-rent and Similar Rental Developments) Amendment Bill offers an opportunity to increase the supply of affordable and quality rental developments, and particularly it attracts—\nRicardo Menéndez March : You can’t guarantee they’ll be affordable.\n—those large ones—and the Green Party member will like this—within walking distance or next to key transport links. That is what the Auckland Unitary Plan of 2016 really, really focuses on. That is why, Dan Bidois, if you’re getting around the beautiful suburb of, say, Point Chevalier, you are seeing townhouses and small apartment complexes going alongside public transport, going alongside arterial roads, going alongside town centres, but not being buried down the far reaches of Point Chevalier Road by the Coyle Park reserve, for example. The unitary plan protects those family suburbs, those leafy character areas.\nThis will enable that intensification that is much needed, and Auckland argued over it for many years, and has agreed with it with the 2016 enactment of the Auckland Unitary Plan for sensible intensification in places that make sense. Again, this is where these build-to-rent developments will be and that is where other city councils—like the Christchurch City Council, when it confirms its district planning rules—will probably head as well.\nAs far as the Medium Density Residential Standards (MDRS), this Government is giving the option for councils to be able to opt out of the MDRS if they can prove that the density will go elsewhere. For the leafy suburbs of Northcote or Upper Harbour, Dan Bidois, that is great news, because allowing three-storey buildings, three townhouses on one section as a permitted activity without a resource consent—\nShanan Halbert : You’re sending them out to Judith.\n—is not popular in Auckland; you know that, Shanan Halbert. It’s not popular. You heard that on the doorstep last time. It is not popular. We’re giving councils the option. Do you know why? Because those leafy suburbs of Northcote that you once represented, they fought hard, I remember that, with the late Ann Hartley. I want to acknowledge her today, the late Ann Hartley, councillor. They fought hard to keep those single-house zones, those large lot areas free. They fought hard to retain their low density.\nWith the unitary plan and with this National-led Government, this coalition Government enabling councils to opt out of those permitted activities, we will see councils empowered, and this will see, with the unitary plan and other district and city plans around the country, these build-to-rent developments. We will see them go up with foreign investment—much needed for supply in sensible places in and around the likes of Auckland, town centres, public transport, commercial areas, arterial roads, where they need to be built. Good news for the tenants. More are coming. I commend the bill.\n\nHon Dr MEGAN WOODS: Thank you, Mr Speaker. It is my pleasure to take a call on this bill. It is a very narrow bill in scope and a very small bill. It only makes a couple of changes. Labour is supporting this bill. I think, sometimes in the House, that maybe the speeches could reflect the fact that there is some agreement on points of policy. The very simple reason that we’re supporting this is that this is making some small changes to work that started under our Government. It’s work we agree on. I actually think that when it comes to housing policy, that is a good thing that we can have some agreement across parties.\nWhat the Labour Government when we were in Government did is that we brought legislation to this House that created the category of build-to-rent. It didn’t exist in New Zealand law. As it was, it was a relatively new phenomena—well, phenomena in New Zealand; it was new. Of course, we’ve seen build-to-rent around the world for decades now, but not a category of housing that existed in New Zealand. We needed to establish a definition of what is a “build-to-rent development”. What does it look like? What distinguishes it from other houses that are built to be rented out? There were some very specific provisions that went with it.\nWe thought this was an important thing. It was one piece that we needed to put in place in terms of solving our housing crisis. Did we think it was going to solve our housing crisis on its own? No, but we did think it was important that New Zealand had the opportunity to establish this category of housing in New Zealand. Alongside that definition sat some provisions that actually gave some rights to build-to-rent developments that didn’t exist for other rentals. There was interest deductibility that was allowed on them. There was a range of provisions.\nThe advice that we got at the time as a Government is that we didn’t need to amend the Overseas Investment Act, that there could be advice that could be given, that it had always been enabled under the law, and the advice from those offshore looking to invest was that it wasn’t actually something that needed to be changed in law. There just needed to be some stronger guidance given to the sector, and particularly those giving legal advice to people seeking to invest in build-to-rent in New Zealand. That may well be the case. That advice may still hold and, in fact, officials seem to indicate that could well be the case. None the less, there was a desire to see it writ large in legislation. We don’t have an issue with actually making abundantly clear in the law what is the case and was the case before this passage: that under the provisions that we’d put in in terms of the ability for overseas people to invest in property in New Zealand, the ability to invest in new apartment housing had always been there. That wasn’t something new.\nOne of the things that we were very clear on as a Government when we introduced this category of build-to-rent into New Zealand is this did offer us opportunities. This provided opportunities for people that never wanted to own a house. We’ve seen this internationally. They could actually be some very well-paid individuals that want to do other things with their money, and homeownership isn’t one of them, none the less they wanted a security of tenure beyond the one-year lease which is traditional in New Zealand. One of the things that landlords needed to give was the right for tenants to initiate a lease for up to 10 years, the idea being that someone could enrol their kids in school, they could make their home, and this was a place where they could really put down roots in a community. We see internationally that this can be some very wealthy individuals that take advantage of this.\nOne of the things that we were really clear on is that we wanted this category of housing to offer a solution all the way through the housing continuum. One of the gaps that we saw in New Zealand was that space that used to exist between market housing and public housing. It’s what councils used to let out before the sell-off under the previous National Government, when they made council and Government compete for the income-related rent subsidy. There used to be affordable rental housing that was usually around 75 to 80 percent of a market rent. It would be someone that wasn’t eligible for a State house or for the income-related rent subsidy, but none the less couldn’t survive in the private rental market.\nWe saw an opportunity to work with iwi, to work with councils, around actually building community-focused build-to-rent developments. That is why we put in place the Affordable Housing Fund and put in place the Affordable Rental Pathway. That fund has since been cancelled by this Government, but what we did see throughout the country is over 200 of these Affordable Rental Pathways come through—many of them falling within build-to-rent. In my own city, in Christchurch, we saw a wonderful partnership between the Ōtautahi Community Housing Trust and Ngāi Tūāhuriri—the hapū at Tuahiwi, north of Christchurch—that put in place affordable rental housing that I think showed a model and a way through in which we could actually, if we worked together and put funding behind it, find some ways through to solving our housing crisis.\nWe support the changes in this bill. It lays bare what is already possible under the Overseas Investment Act. It does introduce some more liquidity into the build-to-rent market in terms of the on-selling of these assets and how that works. We know internationally that there does need to be liquidity within this market, because otherwise the danger is, rather than these staying as long-term rentals where people have these 10-year leases and the right to renewal on that, that potentially these developments can be broken up, rather than sold as a going concern. What we wanted to do was create this long-term asset class that actually endured for decades and offered a different way of renting for people in New Zealand.\nMaking sure that we have build-to-rent is an important part of how we will solve our housing crisis, though I do caution the Government that it does need to sit alongside funding and it does need to sit alongside initiatives to ensure that we can also make sure that it is part of solving our housing crisis. Yes, you solve a housing crisis through supply measures, but you also need to ensure that you’re ensuring that the people in most need of housing can get into that housing that is built. Thank you very much, Mr Speaker.\n\nRYAN HAMILTON: Happy New Year, Mr Speaker. It’s great to be back and to see you as well.\nAs has been acknowledged, we’ve got a massive housing shortage, a chronic shortage, in New Zealand. I do acknowledge the party opposite, Labour, supporting this bill. Thank you. Thank you. Get on track because we’ve got lots more for you to support as we continue to say, “Yes”. We’re the party of yes—yes to more housing, yes to supporting more build-to-rents, yes to this bill. The Green Party would be the party of no. The Green Party member over there challenged me to provide 10—\nShanan Halbert : You said no to building 2,000 in Auckland alone.\nSorry, what was that? Did you say KiwiBuild? Sorry, what was that about KiwiBuild? How did that go?\nWe need more housing across the entire spectrum. We need more emergency housing, we need more social housing, we need more affordable housing, we need more rental, and we need more private. We need more one bedrooms, two bedrooms, six bedrooms. We need all the typology. And we’re not naïve to think that one piece of policy can solve it. It’s a combination of things.\nMr Speaker, with your indulgence, over the last 13 months we’ve been in Government, I just want to highlight some of the 10 things we’ve done to increase supply around housing. I hope the Green Party member is listening. The first thing, of course, is we’ve got inflation back in band.", "window_id": "2025-01-29#26"}, {"statement_id": "83620ec90e7e1d91", "politician": "Hana-Rawhiti Maipi-Clarke", "party": "Te Pāti Māori", "side": "opposition", "date": "2025-02-11", "statement": "We have self-determined our own systems that work for us. The only problem is we’ve only ever been given 1 percent of the education budget, no matter who’s in Government.", "window": "HANA-RAWHITI MAIPI-CLARKE: Tēnā rā koe e te Pika, otirā tēnā rā tātou e te Whare. Madam Speaker, before I deliver my first speech for 2025 in response to the Prime Minister’s statement, if you would please allow me to take the first time out of my speech to commemorate and acknowledge those who have recently passed on.\nKahurangi Iritana Tāwhiwhirangi: the matriarch of kōhanga reo, the holder of endless knowledge. Mei kore ake ko koe, kua kore tēnei reanga o Te Kōhanga Reo. [If it were not for you, there would be no Te Kōhanga Reo generation.]\nThe term “kōhanga reo generation” that I have coined so much was inspired by wāhine like Iritana—not just the physical representation of kōhanga but being at the feet of our surviving elders, who yearned to teach us knowledge that was once on the verge of extinction. From a child who has been through bilingual, mainstream, and kura kaupapa education, tēnā koe, te kōhanga, te rūruhi ki ngā mokopuna. [thank you, the matriarch of all grandchildren.]\nKahurangi Tariana Turia, who continues to whisper in my head constantly: the bravest of them all, who crossed the floor, who walked so I could run, who I marched for in my first ever hīkoi—at two years old in my pram for the takutai moana. I vividly remember watching her at the Parliament forecourt in 2004. Yet 20 years later, we had swapped exact positions for the Hīkoi mō te Tiriti. E oti haere atu koutou, kōrua tahi. [Depart all, together.]\nOur party must be strong and healthy to carry on your legacy. Ka ora tonu mātou, āke, āke, āke. [We will live on, for ever.]\nThis speech is in response to the Prime Minister’s statement. Straight to the point: within the first 20 minutes of his speech, he did not mention the word “Māori” once—not even once. What kind of message is that saying as a Prime Minister to this country? The Prime Minister needs to be responsible, accountable, and most of all inclusive of the country they serve, no matter who voted them in or not.\nAt the end of this Government’s first year of being in power, we saw the largest protest this country has ever seen, with all walks of life attending to stand in solidarity for the founding document of this country. More than 300,000 signatures arrived at the steps of Parliament in opposition to the Treaty principles bill, which is in fact more votes than the ACT Party received. This shows how many citizens the Prime Minister is ignoring. The only thing this coalition has done in relation to the Treaty is appoint people to the Waitangi Tribunal who literally said it shouldn’t exist.\nIn 2025, our job as Te Pāti Māori is to do everything in our power to ensure our people can embody tino rangatiratanga in their everyday choices, to be self-determined on a day-to-day basis in the decisions that they make from the health to the education, groceries, where their tax money is going, the protection of the environment, local government decisions, and the justice system.\nI’m going to briefly touch on all those aspects, breaking down what barriers are right in front of us, to break down whether it be through policies, research, and how the general public can engage outside of Parliament.\nSomething that vividly stood out for me in the Prime Minister’s statement was—and I quote—“If you work hard and you are prepared to work hard, you can get ahead in this great country of ours.”, which instantly brings me to our tax system. What does the Prime Minister say to the 98 percent of all hard-working people of New Zealand who work hard but can’t get ahead, who pay 22 to 33 percent in tax, yet the top 2 percent of the wealthiest people in this country who earn an average of $39 million per year only pay 9 percent in tax? If we really want to talk about inequities in this country, we have to start by talking about how unjust and unfair our tax system is. The top 2 percent—311 households, to be exact—need to pay their fair share, just like the rest of the 98 percent of New Zealanders in this country.\nWhen I think of health, I think of how this Government disestablished Te Aka Whai Ora, the Māori Health Authority, in the first 100 days and intends to privatise our healthcare, which literally means if you can’t afford it, you can’t access the medicine you need. Everyone has the right to healthcare. Every person in this country has funding allocated to their NHI number. The funding must follow the patient, not get lost in transit or swallowed in bureaucracy.\nWhen I think of whānau getting groceries and basic necessities like kai at the end of their shop looking at the receipt with the additional cost of $50 of GST, I see how this Government rolls in $3.4 billion on average from GST on kai yet doesn’t want to tax the wealthiest 2 percent their fair share. This is completely unacceptable, and this is what our member’s bill seeks to address in this exact issue.\nAll of last year, I constantly heard the Prime Minister yapping on about Māori children failing in NCEA as he stared down our way, yet he never mentioned the kura Ngā Tapuwae who had a 100 percent pass rate at excellence in NCEA. This didn’t just happen overnight; champions, like Iritana Tāwhiwhirangi, who helped shape these education systems that work for us. We have self-determined our own systems that work for us. The only problem is we’ve only ever been given 1 percent of the education budget, no matter who’s in Government. This must change immediately.\nThis is what tino rangatiratanga and mana motuhake is about: creating our own pathways for success. And the proof is in the pudding: a 100 percent pass rate and the number one school in the country.\nI think of local government like Māori wards that this Government called for a referendum on straight away. As I asked Minister Simeon Brown eight continuous evidence-based questions, he did not care to answer once. With that being said, local government elections are coming up, e hoa mā. Put your hand up and put yourself right at that decision table.\nWhen I think of our taiao over the holidays, swimming in my own pepeha Waikato River but with the fear of swimming in a whole river of arsenic, like those of my constituents in the Coromandel and Hauraki region in Ōhinemuri, such is the potential aftermath of mining in that region, or the many approved fast-track mining and development projects in Rotowaro, Mangaharakeke Pa, and Hauraki who are still awaiting hapū consultation.\nThe solution to climate change—whether you arrived here yesterday or your tūpuna did centuries ago—is the attitude of kaitiakitanga; that must be at the forefront of our country. This is what our country is known for worldwide.\nWhen I think of housing, with more than 38.9 percent of people in my electorate of Hauraki-Waikato living in a damp house and more than 90 percent of them living in an intergenerational household. Everyone in this country must have access to a warm, dry house and the right to live in a papakāinga if they wish.\nWhen I think of our justice system, the raw reality of tamariki Māori being racially profiled and legislation such as the gang patch law that shows no evidence that this actually stops crime, like the 12-year-old boy who was stopped by police for simply wearing a T-shirt representing his boxing club. Laws like this show no change in our justice system.\nWhen I think of values in this country and online hate, I believe no matter which party you are, every MP would receive this at some point. As a 22-year-old, the fear of opening my work computer sometimes daunts me, from seeing not-so-nice emails. However, my mama reminded me—she even put it in the Excel spreadsheet—that out of all responses received for my haka in this House for Te Tiriti, 8 percent were negative, and 92 percent were positive or in support. With flooding messages from across the country, the globe, and nearly every continent—89 percent who are not of my race. Just because I’m proud of my race does not make me racist.\nThis year, 98 percent of New Zealanders are relying on us; 92 percent of the world is in support—295,759 people who I am responsible for in Hauraki-Waikato, who brought me into this House to be a voice. Which leaves us with the 2 percent needing to pay their fair share, the 8 percent just being pure haters, and our people are counting on us to remove any barriers, legislation, law or misconceptions and bring transformative policies, bills, and a voice for us moving forward.\nNow, my name is Hana-Rawhiti, not Hana Kōkō [Santa Claus], so I can’t promise you the world, but if you can hear me right now and your values align to this kaupapa, we hear you too. Nō reira tēnā rā tātou e te Whare.", "window_id": "2025-02-11#25"}, {"statement_id": "eb95e7aa8e114242", "politician": "Ginny Andersen", "party": "Labour", "side": "opposition", "date": "2025-05-20", "statement": "The irony is that the ACT Party turned up in this House, wearing their lapel badges with “ACT” on them. In fact, their leader was reprimanded time and time again for continuing to act against a Speaker’s ruling, where party political badges were not allowed to be worn within this House.", "window": "Hon GINNY ANDERSEN: This bill, along with all of the other employment relations type bills brought by this Government, is quite simply an attack on the rights of working New Zealanders. But it’s not just an attack on the rights of working Kiwis; it’s doing it during a cost of living crisis that hurts so much. We have a Government that is telling us that they are going for growth; that they are, effectively, putting more money in the pockets of New Zealanders—this is what they’re claiming, on the face of it. But with this legislation, along with a number of others, they are doing the antithesis: they are taking the power away from workers. They are making a power imbalance in our industrial relations, and they are capitalising on that without even thinking through what the win is. There is no evidence, right throughout the regulatory impact statement, that this bill will have one iota of difference on productivity or on working. It is simply designed to be able to intimidate workers so that they work longer hours for less money in a cost of living crisis. That’s the simplicity of it. That’s all it is.\nThis bill is on top of already scrapping fair pay agreements, where we have industry-wide standards and a bottom floor for bus drivers, for example. It is on top of reinstating 90-day trials. It is on top of a party that voted wage theft was not, in fact, theft. It’s on top of wiping 33 pay equity claims in already underpaid sectors, some of those sectors are impacted again by this bill. Those 33 sectors are still reeling from the impact of the pay equity legislation; the bill itself was only made available in the last few days to actually look at what the bill does. And now we have a second reading of a bill that will, effectively, mean working to rule or wearing a badge or a T-shirt in your workplace enables the employer to deduct 10 percent of that worker’s wages.\nNow, the deep irony here, which I hope is not lost, is that we have a party that is behind a lot of this assault on workers’ rights, and that is the ACT Party. The irony is that the ACT Party turned up in this House, wearing their lapel badges with “ACT” on them. In fact, their leader was reprimanded time and time again for continuing to act against a Speaker’s ruling, where party political badges were not allowed to be worn within this House. So, in my view, what is good for the goose is good for the gander. Why is it appropriate for this bill to prevent workers from wearing a union T-shirt or wearing a badge in terms of their collective bargaining rights, whereas the ACT Party thinks they have the right to wear their own badges in this House?\nWhile we’re on that point, I think it’s important to highlight the deep, I guess, irony—is that the right word?—or maybe contradiction of reasoning here. Because we have a party that’s also very strong on individual freedoms: freedom of speech and freedom of expression. I’d be really interested to know what their mates in the Free Speech Union think that they are voting for a bill that prevents workers from wearing a T-shirt or a badge in their workplace. I would think that goes right against those abilities for individuals to exercise their rights for freedom of expression. That one seems to have been completely overlooked by those who were supporting this bill.\nI think that goes to the heart of this bill. It’s not about principle; it’s about undermining workers’ rights, and giving a power advantage to those employers. That is deeply concerning. It is deeply concerning because what will happen in New Zealand as a result of this is that we will see more strikes. We will see workers who are enabled to do partial strikes, like work to rule or wear a T-shirt, take full strike action, and that is where productivity does get hit. When you have an entire sector striking like our doctors or our nurses—or probably soon our teachers, we’ll see—that does impact upon productivity, because we have parents having to take time off work, we have people unable to see a doctor and taking time off work. Those are the real ways that productivity is impacted upon. So by taking away the ability for partial strikes, you are actually having a bigger impact upon productivity. So there’s no thought that has gone through that at all.\nThe point I’d also like to make is that a lot of these professions impacted by this legislation—for example, nurses. If nurses work to rule, people will quite simply not get medical attention and get ill. Many of the nurses in Hutt Hospital, for example, have to work extra hours every single day just to make sure the hospital keeps running, just to make sure that New Zealanders get the medical attention they need. If you have an ability here to dock their pay by 10 percent if they work to rule, that is unfair. That is unfair to workers who already work incredibly hard to make sure things keep on operating.\nI have yet to hear one good reason from those members opposite as to what is the point of this bill. What does it achieve? If this Government stands for productivity, if this Government actually stands for increasing wages for New Zealanders and putting more money in their pocket, why is it that we see bills time after time brought to this House that undermine the rights and the working capacity of New Zealanders? It is those who are already underpaid that are under incessant attack by this Government to find extra money to pay for a Budget that they can’t clearly quite add up in total. This bill is an absolute insult to workers and it will make life harder for working Kiwis. What we will see is it’s not fair.\nIn fact, I’d like to conclude by looking at that regulatory impact statement. If there was any evidence that this bill is not backed by evidence, it’s right there. I encourage anyone to take a look at it. The regulatory impact statement fails to meet quality assurance standards, it has absolutely no qualitative data, and it relies completely on anecdotal and historical examples. It makes untested assumptions and it completely fails to outline how the Government intends to meet its Treaty of Waitangi obligations. We support that view. That’s not even the Labour Party saying that in a differing view; that is the view of the independent review panel that is assessing the regulatory impact statement. That’s how bad this bill is. In fact, I’d like to quote it, because I have time: “Neither the number of partial strikes and full strikes, [nor the] number of person days lost, show any clear pattern in relation to the ability of employers to make … deductions [during] partial strikes.”\nIf there is no clear evidence that the previous law caused a problem, why on earth are we now reversing it? It’s because it’s on the tick-list of ACT and it’s been agreed to further undermine the rights of working Kiwis. The gall of it is that they do it in a cost of living crisis. When people are having to pay nine bucks or more for a pound of butter to be able to do some baking at home, they take it upon themselves to say, “You can’t wear a T-shirt or a badge and you need to work to rule, or deduct 10 percent out of your pay.” It’s designed to intimidate and undermine workers’ rights and it is an absolute travesty because there is no evidence here. It is not about evidence; it is about ideology.\nIn 2018, when Labour amended the Employment Relations Act to remove pay deductions for partial strikes, we did so to restore balance in the workplace. We recognised that industrial action is a fundamental right and we understood that partial strikes are a legitimate and proportionate way for workers to express dissatisfaction without resorting to a full withdrawal of labour. It is a good, healthy, working relationship that this Government takes to undermine and tip the balance in favour of the other side, and they do it in a cost of living crisis. It’s an absolutely sad piece of legislation that does nothing to achieve any type of productivity or good for New Zealand. I’m ashamed to see it brought to this House.\n\nCATHERINE WEDD: Look, I rise to support the Employment Relations (Pay Deductions for Partial Strikes) Amendment Bill, because this is about bringing balance back to employment relations. That’s what we’re all about on this side of the House: common sense and practicality.\nAs the member said, this is about driving productivity. Partial strikes usually involve someone turning up to work and refusing to take part in key parts of the job, and, of course, that’s really disruptive. Under these changes, employers have the ability to respond to partial strikes proportionately. It will encourage fair negotiations and reduce prolonged disruptions. This is fair and balanced.\nAs has already been stated, if you do a fair day’s work, you should get a fair day’s pay. But if you don’t do a full day’s work, proportionate deductions should be balanced. This bill aligns with other jurisdictions—what they’re doing in Australia and the UK. Of course, in the Public Service, healthcare and education are really disrupted when we have partial strikes, and this can lead to delayed treatment, and of course disruptions in the classroom.\nEmployees, of course, should retain the right to bring meaningful industrial action, but this change is about balance and fairness and returning the law to how it was, which worked—rebalancing rights and consequences and incentivising negotiations and minimising disruptions. So I commend this bill to the House.\nA party vote was called for on the question, That the Employment Relations (Pay Deductions for Partial Strikes) Amendment Bill be now read a second time.\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 15.\nBills\nEducation and Training (Vocational Education and Training System) Amendment Bill\nFirst Reading\n\nHon PENNY SIMMONDS: I present a legislative statement on the Education and Training (Vocational Education and Training System) Amendment Bill.", "window_id": "2025-05-20#9"}, {"statement_id": "846848dc034e8fd4", "politician": "Deborah Russell", "party": "Labour", "side": "opposition", "date": "2025-07-30", "statement": "We’ve just seen in the last week or so extraordinary downpours through the country. We know that our weather is being affected by climate change.", "window": "Hon NICOLA GRIGG: Thank you, Mr Speaker. It’s a real pleasure to be able to stand up today and talk about the backbone of the New Zealand economy, and that, indeed, is of course our agricultural sector.\nI’ve been reflecting. I used to stand up in this House as an Opposition MP, genuinely and deeply concerned about the future of farming in this country, and that was, by no means, because of the lack of skill or intent of the New Zealand farmer, but it was absolutely and utterly because of the provisions, and the onerous regulations, and the burden that the previous Government placed upon the farming sector of New Zealand—you know, David and Damien and the other “henchmen of the Apocalypse” drove our agricultural sector to its knees. But, happily, when we came into office in 2023, we set about turning it around.\nWhen we came into office, the confidence of the sector was through the floor. I cited it earlier in question time: negative 66 percent. Red tape from the capital city—from this Parliament—was out of control. Farmers were bogged down in regulation, not production; mental health was suffering; investment had dried up; and the most efficient producers of food and fibre in the world were being told that they were the enemy and that they were the problem. So we campaigned on not closing down our farms, on not sending jobs overseas, and on not sending production overseas. We campaigned on getting this House out of farming and out of agriculture. We campaigned on building a partnership between the New Zealand Government, and farmers and growers around New Zealand. Most importantly, we campaigned on rebuilding the confidence of the sector, New Zealand’s greatest export earner.\nIn order to do that, we’ve travelled up and down the country and we have spoken at length with farmers and growers around New Zealand. That is why the policy with the regulatory shifts and the legislative changes that we’re driving through this House will work. They are working because they have been built from the grassroots up. We’ve spoken recently at the primary industries summit and at the Meat Industry Association. I myself am going down to the New Zealand Apple and Pears conference in Nelson tomorrow. We speak to farmers and growers every single day so that we know we are getting the settings right.\nIt is no secret that the economy of New Zealand was driven into the ground under the previous Government. New Zealand needs our agricultural sector to fly. We need it to hum. We need it to rebuild this country’s wealth and its prosperity. Therefore, every single member of this Parliament owes it to the farmers of New Zealand and the growers of New Zealand to ensure that we get the settings right and we get them right for the long term, for the ongoing sustainability, productivity, and profitability of this country.\nRural communities are the engine room of this economy. When farmers are doing well, we know that New Zealand does well. That capital, that profit—it flows through to local businesses and regional jobs, and it grows the economy for all New Zealanders. We need agriculture to do well in this country, and, indeed, it is doing well. It’s set to hit $60 billion in exports this year. That is a record for this country—that is incredible. We owe farmers and growers a debt of gratitude, and it is being proven that our policies are shifting sentiment.\nI want to refer members of this House to this fine publication, the Farmers Weekly—acknowledging Neal and all of the guys that work so hard every day—“Farm confidence surges after a tough few years”. I go on: “Back to farming, not fighting regs.” What does that tell you? That is exactly what a Government in this country needs to be focused on, which is letting farmers get back to farming, and not fighting off unnecessary regulation.\nThe list of what we have done and what we have changed in a short 18 months is long. I’ve got an entire A4 page in front of me, but some of the highlights are that we’ve removed agriculture from the emissions trading scheme, we have repealed Labour’s punitive ute tax, we’ve passed the first reading of the legislation to ban farm-to-forest conversions, we’ve started rebalancing Te Mana o te Wai, we’ve halted Labour’s freshwater farm plans and those restrictive significant natural area requirements, we’ve launched contestable funds for rural support, and we’ve established a new pastoral group focused on informing through science what methane reduction should actually look like.\nThe list goes on and on and on. Suffice to say, this Government backs farmers. We will back them to the hilt, and we are intent on their ongoing success.\n\nHon Dr DEBORAH RUSSELL: I have in my hand a page from that fine publication the Farmers Weekly, and, in it, I want to refer to something that the Minister of Climate Change, Simon Watts, said some months ago. It’s talking about the target set under the Paris Agreement around climate change, and he said, “Some will meet them, and some won’t just because [of] national circumstance. You have to have the intent to meet it and if you don’t meet it, no one sends you an invoice—and that’s why it’s not a liability on the government’s books.”\n“No one sends you an invoice”, he said, but just last week, the International Court of Justice delivered its judgment on the Obligations of States in respect of Climate Change. This is just the summary and the actual judgment is significantly long, but let me tell you what is in that judgment. Very roughly paraphrasing, it says that States must act on climate change, or be held responsible. Its key findings include that 1.5 degrees Celsius of warming is the agreed legally binding target for limiting the global average temperature increase. It agreed that customary international law imposes binding legal obligations on States to take preventive and precautionary measures to avoid climate harm. It agreed that while the emission of greenhouse gases is not per se unlawful, a failure to take appropriate measures to prevent foreseeable harm does constitute a wrongful act attributable to States. It agreed that States must regulate private actors’ emissions. It agreed that States have a responsibility around climate change. It agreed that climate action can trigger legal consequences. It turns out that there is an invoice coming due on climate change.\nThen a second report came out last week. It was the Climate Commission’s annual monitoring report on climate change, and what did that report tell us? It said that our emissions budgets may not be met. Here’s the rub: the first emissions budget, we’re probably going to meet it, but I’m just going to say that under the Labour Government, emissions were coming down; our second emissions budget can be met, but there are areas of significant threat; and our third emissions budget, covering the period from 2031 to 2035, requires further action urgently in order to be met.\nNot only is there now an invoice from the International Court of Justice but the current Government is building up our liabilities in respect of that invoice. It needs to take climate action soon, and it’s important not just because of the international settings and not just because we might have an obligation to other States; it’s important because climate change affects us here every day in our ordinary lives in New Zealand.\nWe’ve just seen in the last week or so extraordinary downpours through the country. We know that our weather is being affected by climate change. We know that the intensity of those storms and the amount of rain that is being dumped on farming communities is deeply affected by climate change. We know that our homes are at threat because of climate change. We know that our health is at threat because of climate change—not just the immediate threat to life and limb but the mental health of many people who live under the stress of climate change. We know that jobs are under threat due to climate change and that that Government, by focusing on dying industries and on oil and gas, is ignoring the plentiful jobs that are to be found in green industries.\nLabour is proud of its record on climate change, and we stand by it. Our record of the Clean Car Discount, of public transport, and of the Climate Emergency Response Fund, which was used to drive emissions down—we were doing the work that needs to be done to get our emissions down.\nThat Government is ignoring the problem. It is tucking the problem away and pretending it doesn’t exist, and because it continues to do that, one day soon that bill will come due. It’s not just a bill that’s going to come about because of the International Court of Justice; what we are doing by refusing to act is imperilling the futures of our children and our children’s children. It’s time to act.", "window_id": "2025-07-30#6"}, {"statement_id": "c6a25d22efcf17de", "politician": "Phil Twyford", "party": "Labour", "side": "opposition", "date": "2025-11-11", "statement": "For this side of the House, it’s so terrifying. It’s so obnoxious that they want to pour Janola on every bit of law and bleach out of it any kind of commitment to the Treaty of Waitangi.", "window": "Hon PHIL TWYFORD: This bill demonstrates so much of what is wrong with this Government. It’s a grab bag of right-wing bigotry and settling scores with the Government’s perceived and imagined critics. It’s probably one of the reasons—the fact is that this Government is so inclined to pursue fringe ideological distractions, instead of focusing on the things that people in this country are most concerned with, and that’s the cost of living, actually, they spend the time of the House passing laws like this. This bill is not worthy of this House’s time, it’s not worthy of a Government with any self-respect and understanding of the importance of this country’s institutions, and it’s not worthy of a Government that claims to be laser focused on educational achievement.\nLet’s take the issue of freedom of speech in our country’s universities. No evidence has been presented either to this House or to the Education and Workforce Committee to justify putting the long arm of the State into our autonomous universities to basically micromanage them and make them report regularly to the Government of the day on their free speech policies. There has been no evidence.\nAs Shanan Halbert said to the House, the only instance that was used to justify this, in all of the discussions at the select committee, was the incident when Don Brash was denied a platform at Massey University. That is the only crisis that justified this intervention. These provisions are the bastard children of the right-wing libertarian movement internationally, like the Free Speech Union, which is trying to use the power of Government to break open our universities and require them to provide platforms for the racists, the Holocaust deniers, the trans haters, all of the people that the libertarian right want to give respectability to. They want to force our universities to provide platforms for those fringe people at the cost of the credibility and the status of our universities.\nThe thinking behind this provision completely confuses the idea of free speech with academic freedom. Our universities are based on a tradition of academic freedom that is hundreds of years old, where ideas get tested against research in a climate that fosters independence, fosters critical thinking, and thinks about the quality of ideas. The notion of free speech that people like David Seymour and his ilk are promoting has no notion of quality. Actually, they want the most fringe, notorious people to have access to our treasured academic institutions.\nIt also completely misses the point that free speech traditions in this country have grown up with a much more balanced approach that requires people to think about the consequences of what they say, because we live in a small island country where we have to get on with each other. The whole idea of freedom of speech should, in any sensible society, sit alongside the balance and the responsibility to consider the consequences of what you say. In universities, it’s the job of the universities to make that judgment, not to have people like David Seymour and right-wing libertarians like him imposing some foreign concept of freedom of speech on our institutions.\nI want to talk about the provisions in this bill that set out to neuter the independence of the Teachers Council. Again, a measure in this bill for which no evidence was provided—no serious or plausible rationale for these principles. Where did it come from? Where did it come from? The New Zealand Initiative. Now, I asked the House, why would the Government deliberately undermine the autonomy of the Teachers Council, the body that’s legislated to govern the profession and set standards? Who’s next? Lawyers, accountants, doctors? No, only teachers. That’s right.\nThere’s only one reason. We have to surmise, because they haven’t actually been open enough and transparent enough to tell us why, but there is only one reason the Government would do this, because they see teachers as their ideological enemies. Now, let’s think about that for a moment. The National-led coalition Government sees the people who get up every day and go off to work to teach our children and help them grow and develop and learn as their ideological enemy. You can see that in the recent comments that several Ministers made about the teachers taking industrial action.\nThey are happy, in the interests of cultural war politics, to reduce education policy to some kind of parody where they demonise the very people who teach our children. Their whole approach to education policy is to set up this false contradiction between teachers and parents that they’re somehow in opposition to each other. Well, they’re not. They are simply not. If you ask people in the community that I represent, if you ask parents what they think of the teachers in our schools, they respect them, they thank them, they appreciate them, because they know that their kids’ progress in life depends, to a large extent, on good schools and good teachers, but for this Government, teachers are just pawns in their culture war.\nFinally, I want to talk about the move to remove the clause that says that schools don’t need to give effect to our country’s founding document. Whose idea was this? No, it wasn’t the Free Speech Union. No, it wasn’t the New Zealand Initiative. This one came from Hobson’s Choice, shoehorned into the coalition agreement by David Seymour and ACT, supported by New Zealand First.\nNo evidence was supplied to justify this move. In fact, it was basically inserted into the bill late in the select committee process. It’s just an assertion that parents and teachers, the people who govern our schools, cannot be expected to understand or give effect to the Treaty of Waitangi. Who says they can’t? How patronising, how absolutely patronising to say that the people who govern and run our schools—thousands of schools around this country, from one end of the country to the other—cannot understand and cannot give effect to our founding document.\nThink about this: our public school system is one of the core and most indivisible parts of the modern State. It is one of the main ways that Government touches the lives of people on a daily basis. The people who run those schools are now being told, “You’re not capable of understanding or giving effect to our founding document, the Treaty of Waitangi.” It says to us as New Zealanders that we have rights and responsibilities for ourselves and to each other, that this country is built on a partnership between tangata whenua and tangata Tiriti.\nIs that so hard to understand, that we owe each other the obligation to ensure that each other’s views are taken into account, are heard, that Māori have a say, that we share this place and we are bound together? Is that so hard to understand for the volunteers who govern our schools? I find it absolutely gobsmacking. I worry that this philosophy that is terrified of Māori aspiration, that’s terrified of our founding document is actually percolating through every Cabinet discussion, every Cabinet paper, every bit of law that comes to this House, they are trying to ethnically cleanse out of it the idea that sits beneath our founding document, and that is that this country is based on a partnership. For this side of the House, it’s so terrifying. It’s so obnoxious that they want to pour Janola on every bit of law and bleach out of it any kind of commitment to the Treaty of Waitangi.\nThree changes in this bill—all of them fringe ideas that have come in from the outside, with no evidence to support them. This Government is content to bring pure right-wing ideology into this House at the expense of educational achievement.\n\nHon DAVID SEYMOUR: Point of order, Mr Speaker. I just want to note that there are many New Zealanders who moved here to seek refuge from actual ethnic cleansing, and I think the use of that term was incredibly irresponsible and, really, he ought to withdraw it for the reputation of the House.\n\nHon DAVID SEYMOUR: Madam Speaker, first of all, I thank you, the other presiding officers, and members for their engagement on this bill so far.\nPart 3 is a relatively simple part of the bill. It sets out provisions for the Ministry for Regulation to carry out regulatory reviews—that is, backward-looking evaluations of the stock of laws that the Parliament has previously made or allowed. It then goes on to set out how the ministry—the regulatory standards ministry, that is—should go about reviewing a regulatory system, or rather its responsibility to present a report to the Minister on any review it does, and subsequently for the Minister to present that to the House of Representatives.\nIt goes on, in a series of clauses, to set out powers for the Ministry for Regulation as a central agency to require information to be shared by Government agencies in the course of preparing briefings for regulatory management, which is a procedure that’s been described earlier in Part 2; also, for giving information on regulatory reviews, such as asking for information from Government agencies. It then sets out a series of limitations on that power to request information, noting, for example, in clause 44 that it cannot demand information from the House of Representatives, an Office of Parliament, the Clerk, or the Parliamentary Service. It also goes on to say that it cannot require information from non - Public Service agencies, or at least has restrictions on that; and, finally, that it cannot require information from a person who is contracted to a Government agency.\nIt concludes the bill, or at least this part, with the consequences of failing to comply with a notice issued by the regulatory standards ministry to provide information, and it provides that a court may make an order if the court believes it’s necessary or desirable to enable the regulatory standards ministry to review a regulatory system to which any legislation relates. It has a role for the court at the very end if there is a dispute over providing information to allow the Ministry for Regulation, as a central agency, to do its job, both preparing reports and also carrying out regulatory reviews into existing regulatory systems. I hope that that will make clear that the purpose of this—it’s really quite a straightforward purpose, with a series of exemptions and conditions for using that power for that purpose.", "window_id": "2025-11-11#21"}, {"statement_id": "a1d9e9600d993e26", "politician": "Camilla Belich", "party": "Labour", "side": "opposition", "date": "2026-01-27", "statement": "It’s easy to dismiss this as kind of technical legislation—and it is technical—but it’s also about how we make law, and so it’s actually, genuinely part of our constitutional framework, and I think we’ve got to remember that when we come to talk about it.", "window": "CAMILLA BELICH: —and I’m sure you probably remember it. Anyway, it was very outdated.\nIt was very surprising to see that type of outdated language in legislation, and it is a substantial job to actually keep on top of all legislation, even in this day of digital bills and Acts, to make sure that everything is kept up to date. So, if that prevents Dr Duncan Webb and me from using the House’s time—talking about things like how a dollar is a better term to use than a pound—then, obviously, that’s going to be good use of the House’s time.\nAdditionally, I think that all members of the public would agree with the premise of this bill, which is that we should be able to access secondary legislation. We have some concerns around how this may be implemented. Hopefully, in the committee stage the Minister can give some assurances as to how this will be interpreted and the intention, and, of course, that forms part of the statutory interpretation of the bill. That would be really helpful, I think, to give the House confidence in how this bill will end up being enacted. I commend this bill to the House.\nPAULO GARCIA (National—New Lynn) (21:51) : The Legislation Amendment Bill should be every legislator’s objective: to promote high-quality legislation that’s easy to find, use, and understand. The Justice Committee recommends that we should pass the bill. I commend this bill to the House.\nHon Dr DUNCAN WEBB (Labour—Christchurch Central) (21:51) : Thank you, Mr Speaker, and it’s good to speak on this excellent piece of legislation. It’s easy to dismiss this as kind of technical legislation—and it is technical—but it’s also about how we make law, and so it’s actually, genuinely part of our constitutional framework, and I think we’ve got to remember that when we come to talk about it. It’s also unusual in a couple of ways. One way is that it’s identifying this concept of a revision bill, and in that sense it’s directing the House. We know that, by and large, we let the Standing Orders deal with matters of procedure for the House, but because of the interface between the Attorney-General and the Parliamentary Counsel Office and the confirmative various powers, it’s probably appropriate that it go here.\nIt does a number of things, and I’ll only touch on three, all of which have in some way been touched on already, but I do want to just discuss a few of them. Firstly, secondary legislation. Everyone has noted that there’s now this direction that secondary legislation from particular Government agencies is to go on the legislation website, and that’s, in fact, in one sense an access-to-justice issue. It means that people can find, particularly, rules and regulations, if you like, on the Government-administered website and it’s, essentially, got a quality check.\nI do want to observe, though, that is only the tip of the iceberg when it comes to secondary legislation, and the number of departmental rules and exemptions that are made within Government departments—which will fall outside of this; it’sthat grey area which falls below kind of an actual regulation but above mere policy—is one area. Then, of course, there’s a huge area of secondary legislation made by non-Government bodies, whether that be testing standards for building materials, whether it be professional rules for accountants, or whatever it may be, and so there’s a whole range of other legislation which actually still won’t be captured.\nIn fact, one of the interesting provisions here is that secondary legislation, with some exceptions, won’t commence until it’s properly published. The problem that previously existed was that there could be secondary legislation which had passed its appropriate legislative process, whatever that might be, but was never publicly available, but it was nevertheless in force. So that was a real problem, and that’s the first thing I wanted to talk about.\nThe second thing I wanted to talk about is a little more obscure, actually. It’s to do with electronic transactions, which is a matter close to my heart because one of the things that the Legislation Act does is it gives definitions: definition of what a day is, definitions that say that if the legislation says “man”, it means man or woman, and all kinds of things like that.\nOne of the things it doesn’t do is define writing in terms of electronic transactions—not just electronic contracts and commercial arrangements, but electronic stuff, if you like—and the reason it doesn’t do that is because some clever person put it in the Contract and Commercial Law Act. So way over there in the Contract and Commercial Law Act, you’ve got a provision which deals with what amounts to an electronic signature in all of the law. It’s actually the wrong place to put it; it should be in the Legislation Act, and this cropped up in the Justice Committee. It was essentially out of scope to insert this at the last minute, and our advice was that that’s not a good idea to pull it out of one piece of legislation and put it into another, but, rather, a provision was inserted essentially saying, “and writing means what it says in the Contract and Commercial Law Act”. So, to be perfectly honest—and I’m pretty sure our counsel would agree with us—it’s a pretty messy solution, but it’s the best we could get to on the day.\nThen, the flavour of the month is, of course, the revision bills. Can I just say that I think that parliamentary counsel are extremely long-suffering, because we certainly gave them a working-over on what could be said to be a minor point, and I heard my colleague Vanushi Walters talk about this. I heard her erudition in respect to, was it King Charles and Gazette notices and Oxford University, or some such thing—which always astounds me, the depth of her knowledge—but the issue is this. The concept of a revision bill historically has been a modernisation bill, and so you pick up the Partnership Act from 1908 and you say, “Yeah, the rules in it are fine, but the language, the ordering, and the expression desperately need to be cleaned up, and so let’s do that.”—and so it’s simply modernisation.\nIf that’s what we’re doing, we really don’t need a first reading debate and we don’t need a committee of the whole House debate. We can truncate these processes, but let’s send it to select committee, make sure that people have their say, and get on with it. That makes perfect sense, but—and this is the point, I think, that Dr Lawrence Xu-Nan was referring to—if we then turn it into a general tidy-up, is it appropriate to truncate the scrutiny to such an extent? The real point is this: do we trust the Government not to abuse the expanded rights to use revision bills, because, goodness knows, they’ve abused urgency throughout this term of Parliament, and so that’s the concern.\nIf you look at the kinds of things that can now be included in revision bills—and I must say that I still have some reservations. For example, in new section 96(3)(b) in clause 37, it says that a revision bill may “make amendments to reduce or avoid any of the following: (i) unduly onerous or burdensome requirements:” Now, that sounds fine, but what is “unduly onerous or burdensome” is very much moot, and those members might think temperature requirements for hot water in childcare facilities are “unduly onerous”, or they might think that food safety standards are “unduly onerous”. We don’t; we think things like that are important safeguards. So that is the danger.\nNow, one of the protections is that these are drafted and certified by parliamentary counsel and the Attorney-General. That gives me some comfort, but I’m still concerned that if, as you go through this, new section 96(3)(b)(ii) says “unnecessary compliance costs:”. Sure, there will be things which are genuinely unnecessary compliance costs, but what is an unnecessary compliance cost? You know, I heard Andrew Hoggard’s speech on farming, and his view seems to be that keeping cows out of waterways is an unnecessary compliance cost—you know, “Just get rid of the green tape and let us do our farming.” That’s the question, right?\nBut my point is well made that there’s an argument to be had, and a modernisation bill would be one which didn’t change the rules—it didn’t change the needle on regulation—but it just changed the language. So the revision bills, now, that can be put before this House are actually not revision bills; they’re amendment bills, and this is my good-faith point: when any Government comes to a revision bill, they need to accept the word “revision”, and any changes of that nature, particularly in that new section 96(3)(b) needs to be consistent with the original purposes of the Act, and not changing the kind of regulatory burden imposed by the Act itself.\nI guess that’s my constitutional point. That is why this is part of the framework of our law, because it dictates to this House the constraints under which laws can be made, but like any constitutional framework, it’s imbued with convention, and that convention is important. I think it’s important that all parties in this House adhere to the convention that revision bills do not change the substance of the legislation.", "window_id": "2026-01-27#16"}, {"statement_id": "de00a11125ef7536", "politician": "Helen White", "party": "Labour", "side": "opposition", "date": "2026-02-11", "statement": "I think that’s really important for the rights of those workers. So I thank him for his question. RACHEL BOYACK (Labour—Nelson) (17:52) : Thank you, Madam Chair.", "window": "HELEN WHITE: Thank you. They were in a situation where they were vulnerable to exploitation. I want to know: how is it that this law will protect such people? What happens to things like the test for independence? What happens to the test for integration? In that situation, they were so integrated in the business that no one else would know that they weren’t an employee. What happens to the fact that they had no chance to make a profit? I’m very interested to hear. I can see there are a lot of other questions I’d like to ask on this part, but I just want to ask this single question because I can see that you’re likely to answer it. Thank you very much. I’ll take my seat and ask for an answer to that question so far.\nHon BROOKE VAN VELDEN (Minister for Workplace Relations and Safety) (17:43) : Well, I thank the member for her question. I think all of us in this House do care about the rights of people who work within New Zealand, and want to make sure that we are helping people who are in vulnerable situations. When it comes to the example that Helen White has asked for, in terms of there being anything within this section 6 change that would help people who might be vulnerable as contractors, I can absolutely assure you that there is. There was one area in particular that I was quite keen on making as an addition, which is that in order to meet the gateway test, the contract has to be written down.\nNow, for contracts, there are actually many people out there who don’t have written contracts—that is not specified in law—but, in order to meet this particular part of the gateway test, everything needs to be written into your contract. I think that is actually quite useful for people who might be a current vulnerable worker if their employer was hopeful to meet the gateway test. But in regards to the specific example the member has used, I want to make it very clear: the gateway test is used to give clarity to a small subset of people who may wish to use the gateway test. In order to use the gateway test, all four different types of criteria must be met, which are written down into the law—about the intention, the restriction, the availability, subcontracting, etc. If those gateway criteria are not met, then the current section 6 actually still applies, so employees can still challenge their status based on the existing test if any of those criteria are not met. It’s actually quite comprehensive as part of the law.\nTEANAU TUIONO (Green) (17:45) : Thank you, Madam Chair. I rise on behalf of the Greens and join with the concerns of my friends and colleagues in the Labour Party as well. This is a significant rewrite of employment law. It does tilt the balance to the employers over the employees. We support the call that we make sure that we give this a thorough going-over.\nWe are, at this particular point in time, talking about the gateway test and the impact of whether someone can be classified as a contractor as opposed to an employee. That will have massive ramifications for those workers because it means that they could, potentially, lose out on holiday pay, sick pay—all of those types of things that you would expect if you were an employee. The 30-day revocation rule, as well, is also a significant departure, and that is something that must be thoroughly interrogated, along with, in my mind, the undermining of the personal grievance system. There are a lot of issues here that we need to unpack.\nI did hear the Minister talk about the gateway test, and she did say, “Well, if it’s not written down, then they can’t use the gateway test.” I guess it’s a start of a number of questions that I have as well. Not just having it written down, what are the other criteria? What other safeguards are in there for workers, for employees, before they get to the gateway test? I think it’s incredibly important to make sure that we get that on the Hansard so that people are clear, out there, exactly of the impacts of this law on the workforce.\nI also acknowledge that a lot of this came out—well, all of this came out—because of the case that the Uber drivers took and won in every single court. They were misclassified as contractors when actually they were employees. They were trying to access their rights via section 6, and now they’re going to have to jump through another hoop, this so-called gateway test, as well. I wanted to acknowledge the hard work of those workers as well and to also note that if we want to do everything that we can for workers in this country, we’ve got to provide a vision of hope, and we’ve got to make sure that we provide those foundations and make sure we get the balance right. I don’t think that this piece of legislation gets that balance right at all, and people should be alarmed, across both sides of the House, about exactly what this piece of legislation is doing, because we are seeing too many people getting on a plane and flying over to better paying conditions in Australia. We don’t want that. We want our young people to stay here.\nI have got a tabled amendment—I’m not sure if it’s hit the Table—and it is related to clause 4 in this Part 1, which we are debating as well. I would be interested to see if the Minister might support this because it tries to tilt the balance back towards employees. What I’m proposing is after clause 4, new section 6(8), after page 4 line 12, to insert a new section 9, which is: “Person A, as classified as a specified contractor, can notify person B in writing that they’re an employee, not a specified contractor. Person A is classified as an employee under the Act from the time they send written notice to person B.” In my mind, what this will do is it will give the opportunity for the workers to say, “You know what? You think I’m a contractor. You’re actually wrong.” We should be able to have a rethink about that relationship.\nFor me, that ensures that the classification of the specified contractor, actually, accurately reflects the contracting intentions of both parties. Sometimes, when you go in there and you sign these contracts, the relationship changes as well. There has to be an opportunity somehow, somewhere within this piece of legislation to make sure that we get that balance right. At this particular point in time, this is so balanced towards the employers and this is so balanced towards the bosses that it doesn’t give many options for the workers. This is something that really needs to be interrogated.\nOnce again, just for the sake of the Minister, the Minister did talk about
