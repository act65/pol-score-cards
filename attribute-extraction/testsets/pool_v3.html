same and do it quickly.\nIn terms of Marlborough, the question there around the emergency response—the board, I think, has recently approved some more funding for their emergency response for those roads, which is critically important to help ensure that recovery, which is really, really important for the Marlborough Sounds.\n\nTANGI UTIKERE: Thank you, Madam Chair. The Budget decisions taken by this Minister of Transport clearly show a real dislike for local government from this Government, because they are simply wanting to lump additional costs in this particular space.\nI note from the Treasury’s release of the bilateral briefing notes to the Minister of Finance that there was a warning, and it was noting that a number of the Minister’s proposals would actually see an increase in the expectations on local government funding and that it may not be sustainable in the long term. The suggested question for the Minister of Finance to put to the Minister of Transport was to ask how he proposed to manage the risks of transferring further costs on to local government, with the removal of Crown funding from those programmes. My question to the Minister is: what was his answer to that question? Or in the circumstance where that question was not actually put to him, was it because the Minister of Finance simply didn’t have a sense of diligence in the particular space?\nMy colleague Mr Davidson is, I’m sorry, incorrect: the biggest pothole is not in Christchurch; it’s in the Cook Strait as we wait for a ferry. This was an issue that the Treasury identified as a real financial risk in the cancellation of iReX. My question to the Minister is this: why is there not a specific provision in the Budget for a ferry replacement? That would send a very strong signal that this was a Government that was actually serious about replacing the ferries for the Cook Strait, rather than relying on the $7.5 billion multi-year capital allowance that has been set aside. How, also, does the Minister justify wasting potentially half a billion dollars on an exit clause and penalties for this cancellation, without any viable replacement? We’re still waiting. Every day, you wake up and think, “Oh, is a ferry coming today? No, still waiting.”\nNow, the question I put to the Minister during the hearing for Estimates was around ferry maintenance. Minister, you’ll recall that there was a figure that had been floating around that the maintenance cost would be around $65 million a year, and you told me in the hearing that, no, no, you were comfortable that it would be nowhere near that particular level. Within the next couple of days, we had an incident where the ferry ran aground. Now, your Government has indicated that they’re going to push out the replacement, when it eventually comes, by at least five years. That will come with additional maintenance costs. Do you maintain that that $65 million is inaccurate, and, actually, what is the figure in terms of maintenance as a result of pushing out the ferry replacement option to at least a five-year period?", "window_id": "2024-09-18#21"}, {"statement_id": "ed9ed18ff83dc1f1", "politician": "Mark Patterson", "party": "NZ First", "side": "government", "date": "2024-10-23", "statement": "What we’re seeing now is the practices have got so much better that we’re getting 95 percent, 97 percent that are compliant in terms of good management practice.", "window": "Hon MARK PATTERSON: I rise on behalf of New Zealand First to support this Resource Management (Freshwater and Other Matters) Amendment Bill. This is what delivering on your election promises looks like. All three of the coalition parties recognise the dog’s breakfast that the freshwater regulations were—those regulations that had seen, actually, towns closed down by tractors in the streets on more than one occasion. Farmers are not unreasonable people, and as Minister Hoggard has just outlined, they do care deeply about the environment, but when they saw really impractical, unworkable, and bureaucratic rules, they rose up, and that just can’t happen without there being some real reasons for that to happen. They’ve got more to do on their farms than be driving around the local town.\nThe farming sector was genuinely affronted, and I’ve heard some of the commentary from the other side of the House already in this debate and earlier in this bill, with some apocryphal stories about farming conditions in this country. Here’s an anecdote: one of the professors at Lincoln University, an international professor who trains our Master’s degree students there, he said to me that he has trouble placing the Master’s students on the international part of their courses. He said, “There’s nowhere I can send them that they could learn anything about pastoral farming. New Zealand pastoral farming is akin to magic, by international standards. We do it very well.”\nWe were affronted by some of the commentary that went round this and went into some of the original 2020 measures—the one-size-fits-all nature, particularly—the stock exclusion rules and the low-slope maps. As Minister Hoggard outlined earlier, what we were capturing, in many cases, was small tributaries and low-intensive areas that were going to cost, in some cases, hundreds of thousands of dollars and make farming, essentially, uneconomic. We note the Beef + Lamb New Zealand economic service forecast for this year showing the average sheep and beef farm making about $60,000 before interest, tax, and drawings. You can see why that would be a problem. Every cost is going to affect farming sustainability, really, in an economic sense, and that would be for no real environmental benefit, in the grand scheme of things, so we are being much more practical about it.\nYou only have to look at technology. Technology has come along. Since this 2020 legislation came through, the collars, the halters, the Gallagher’s—it’s like magic. Simeon Brown, actually, was showing some interest in this yesterday. He thought he could become a farmer, because you can actually farm from your couch. You get on your app and draw a line on the map there and you can shift stock around without even having to leave the front door. There’s all sorts of innovation and different ways we can go about getting the same outcomes without having to be heavily bureaucratic and expensive in the way that we as a central government are imposing on our rural sector.\nThe significant natural areas—now, that is a property rights issue, pure and simple. We have got to get back in this country to where if you own a block of land, you have certain rights, and you can’t have other people coming on and dictating to you what you’re doing on your own land without a very high bar. That is exactly what we’re looking to do in terms of pausing what had been overreach and having a really good look at this. Where there are ecologically significant areas, we do want to see that protected, but for many of the examples we were seeing, they certainly didn’t reach that threshold.\nI’ve heard so much about wetlands, and there’s some sort of faux indignation about someone calling them a “bog”. Well, I can assure you, Steve Abel—and I know that you know this, but one of the main things we are doing in terms of the catchment groups and the like is that we’re going back to wetlands. We’re creating wetlands. We’re doing it at a catchment level for exactly the reasons you mentioned, because they are good at catching nitrates and sediments. We’re actually reinstating a lot of these wetlands.\nThe intensive winter grazing regulations had unintended consequences, actually, in terms of some of the tightness around the rules. Farmers trying to get around those rules had gone to bale grazing and trying to winter on grass in wet conditions in Southland, which has caused much more damage than a well-constructed winter grazing programme would have done on traditional cropping.\nThe other thing around this, too—you know, our markets are demanding this. We’re not oblivious to the need to look after our environment, our animals, and we have that pressure from our markets. We are accountable to our processing companies and the like to qualify to supply and to get into the premium end of that market.\nAlso, many people wouldn’t know—I haven’t heard it in this debate—that we are monitored from the air by helicopters or planes by a regional council. They do flyovers—random flyovers. We don’t know it’s happening. They’ll come over three or four times a winter to monitor the winter grazing practices. They do it in Southland, Otago, and Canterbury, and possibly in other areas too—I think the Waikato. The regional council actually can interfere. What we’re seeing now is the practices have got so much better that we’re getting 95 percent, 97 percent that are compliant in terms of good management practice. The outliers, those that aren’t following good management practices, are then managed intensively by the council, by the Ministry for Primary Industries and their farm support team. They’ll go in there to make sure there are no animal welfare issues. There are pragmatic things that we’re doing—actual things that we’re doing that don’t necessarily sit in a piece of paper in a drawer; they’re actually actions on the ground.\nNow, I need to address the issue of the Otago Regional Council (ORC) and the measures we took with the amendment. The Government has been very clear that we are amending the National Policy Statement for Freshwater Management 2020. Most councils—almost all councils apart from one—have respected that position. They do know that we have serious concerns around Te Mana o te Wai provisions and the hierarchy that will be such lethal planning. It’s so vague, to have that as your basis for your planning. We’re having a completely new look at that and how that fits into a planning process.\nThe ORC, by moving to notify their plan today, if it had gone through, would have been working with a moving feast. They would have been, essentially, setting off a chain of actions that would have ended up in the Environment Court by default, because that would have been the process that would have been set off. There would have been no way of stopping that. The farmers would have fought it. We would have been absolutely torching ratepayers’ money for no reason, because the macro rules that we are going to change and have clearly signalled that we’re going to change would, at the end of that, mean that they would have to start again. All the other councils had respected that. The Otago Regional Council had not, for ideological reasons, I believe, amongst some of the councillors.\nI object to the apocalyptic representation of Otago’s environment and waterways. They are some of the best in the country. There is no danger at all if we have a pause. They absolutely are. You look at the statistics—you look at the statistics. Go and look at the Parliamentary Commissioner for the Environment’s report and you can see Otago is a shining example of water quality. We are bringing in sensible, pragmatic solutions. We’re going to do it in a timely manner. This bill buys us some time, really, to do the stuff that we really want to do so we can get some proper regulations for our farming sector. Thank you, Mr Speaker.", "window_id": "2024-10-23#13"}, {"statement_id": "effa3e805841344c", "politician": "Carl Bates", "party": "National", "side": "government", "date": "2025-01-30", "statement": "Tēnā koutou, tēnā koutou, tēnā koutou katoa. Ko Ruapehu te maunga, ko Whanganui te awa. Nō Whanganui ahau. Ko Carl Bates taku ingoa.", "window": "DAN BIDOIS: Tīhei mauri ora. E ngā mana, e ngā reo, e ngā iwi, tēnā koutou katoa. Te Whare e tū nei, tēnā koe, te papa e takoto nei, tēnā koe. Ngā mate, haere, haere, haere atu rā. Ka mihi ki te iwi kāinga, ngā iwi o Taranaki. Nau mai, haere mai, tēnā koutou, tēnā koutou, tēnā koutou katoa.\n[The living spirits stirs. To the authorities, the voices and the tribes, greetings. The House standing here, greetings, the land lying here, greetings. To the deceased, depart and go well. I acknowledge the local tribe, the tribes of Taranaki. Welcome and greetings to you all.]\nIt’s a pleasure to be here today. I’m not going to do what Willie Jackson did and explain my connections to Taranaki—I don’t have any—but it’s truly an honour to be here today to witness this most historic occasion. Indeed, it’s been an honour to help shepherd this bill through Parliament as the chair of Māori Affairs Committee at the time, to be welcomed to your rohe, to visit your maunga, to hear your submissions. I wish to thank you for your hospitality, your generosity, and your fine kai.\nTo understand the significance of the maunga to your communities has been a great privilege—to the past, to your tūpuna, to your whānau and your lives in the present, and to your mokopuna in the future. What you see every morning and night is what your tūpuna saw hundreds of years ago, and it will be what future generations see many hundreds of years later. To me, the maunga’s significance is clear in terms of providing sustenance, spiritual connection, wellbeing, and connection to your tūpuna. I am on record in this House as saying Taranaki Maunga is the most beautiful maunga in all of Aotearoa, and I stand by that statement. It is a beautiful maunga, and it has been a great privilege to visit it as part of the select committee process.\nAs members from across this House have signalled, this is a historic day. This is actually the 100th settlement, or collective redress bill, that this Parliament is due to pass, and I know that many of you have waited too long—160 years—for this moment. This bill, in terms of its details, explains the historical account of what the Crown did. It issues an apology, provides resource contributions. It creates a living person—Te Kāhui Tupua—and a legal entity to act on behalf of that legal person. It changes the name of the maunga and gives access to the iwi for certain facilities on the maunga. But, most importantly, it is a chance for the Crown and this Parliament to acknowledge the past and right the wrongs of the past so that the iwi of Taranaki can focus on the future. And the future looks bright for Taranaki. Under this bill, there will be a new arrangement that will enable input from iwi and the Department of Conservation (DOC) into the management of the maunga, to unlock the potential of the maunga for many areas—economically, socially, and environmentally—to ensure that the maunga is taken care of well into the future.\nI do wish to acknowledge the concerns that were raised in the select committee process, in particular those from local mountain clubs and the uncertainty caused. My message to them is clear: concessions will continue, the process for new concessions is clear and transparent, and the intent is for public access to continue in perpetuity. But Parliament can’t legislate for relationships, and one thing I noticed, and my members on the select committee noticed when we were there, was that there was a real willingness of iwi of Taranaki to engage with those mountain clubs in the future. To them, I’d say: engage the iwi and I’m sure your issues will be addressed in the future.\nI just want to wrap up and acknowledge the many, many people who have brought this bill to where it is today: former Minister Andrew Little and current Ministers Paul Goldsmith and Tama Potaka. I’d like to acknowledge the members of the Māori Affairs Committee, and the local MPs, who worked hard to ensure that they were kept abreast of the bill and made time to hear the submissions as well. Negotiators Ian Hicks, Hannah Morris from Te Arawhiti, Andrew McLennan from DOC—I always get the name confused; sorry, Andrew. The clerks from the Māori Affairs Committee: Tui, Paquita, and Louis, thank you for your hard work in arranging select committee visits. To Jamie, maybe we can get you to run for the National Party sometime in the future! To Hemi and Liana, thank you for what you do for your communities.\nIt is a great day for this Parliament and one of the rare occasions when this Parliament agrees in unison on the path forward. We welcome back the restored name “Te Papa-Kura-o-Taranaki”. We say haere rā to “Mount Egmont”, and we say haere mai, hoki mai to “Te Papa-Kura-o-Taranaki”. I commend this bill to the House. Nō reira, tēnā koutou, tēnā koutou, tēnā koutou katoa.\n\nGLEN BENNETT: He hōnore, he korōria ki te Atua, he maungārongo ki te whenua, he whakaaro pai ki ngā tāngata katoa.\n[Honour and glory unto God, peace on earth and goodwill to all people.]\nIt is always an interesting day to stand in this House and to have a collective, supportive approach to a piece of legislation. As the Hon Willie Jackson more than alluded to—he talked about it—this is a House of contradictions, at times. In the morning, MPs in this place, in the Justice Committee, are debating the Treaty principles bill, and in the afternoon we are sitting here in connection, in solidarity, supporting this piece of legislation. And no, Willie Jackson, my couch is not available, by the way!\nAs I look at and consider what this means for all of us in the gallery, all of us around Taranaki, all of us around Aotearoa, and all of our ancestors and whānau around the world, I think we need to consider that this place, even though it has done so much harm and has hurt so many people, can also be a place that brings hope—or, should I say, allows hope, because we are not the deliverers of hope; we’re the people who create opportunities, I think, for us as a community to then be the instigators, the creators of hope in the future together. This place can be argy-bargy, it can be a place where the contest of ideas crash head-on, and I’m glad that as we sit and we ponder today, we stand in unity together. This is a scary place but it can actually be a place that brings us together and allows hope to come.\nI want to acknowledge our ancestors—your ancestors—as we had our mihi whakatau earlier. To see in the gallery this afternoon photos of those who have gone before us, to think of those who are in our hearts and our minds right now, who are no longer with us, recently passed or passed decades or centuries ago—we acknowledge those people because they have brought us to this place\nI listened earlier and heard about and read about what happened in the late 1970s, in my lifetime, when the generosity that the Government allowed you to have was returned and then taken away again. I really consider that we need to see the way we move forward and continue to grow and bring our communities, bring our cultures, and bring Te Tiriti together.\nNow, many people consider the fact that the breaches of the Crown, the challenges of a century or two ago, are those things that many people, if you walk down the streets of New Plymouth, will say, “Oh, well, that was in the past.” But as we know, in the last decade there have been things done on your beautiful maunga that were not right, that broke tikanga—things like barbecues at the top and ashes left behind and fires lit—things that my Pākehā ancestors need to apologise for.\nToday, I want us to consider about how we move forward from here—how do we move to a place 15 years away from the commemoration of the signing of Te Tiriti o Waitangi? What is my responsibility and my response? As I leave this place this afternoon, it is to continue to educate myself and continue to educate my people, because so often I listen and I learn and I realise that you were all waiting for me to catch up—you’re all waiting for my people to hurry up and get on the waka together.\nToday I want to acknowledge the iwi of Taranaki: Ngāti Tama, Ngāti Mutunga, Taranaki Iwi, Te Atiawa, Ngāti Maru, Ngāruahine, Ngāti Ruanui, Ngaa Rauru Kiitahi—the settlements you’ve been through, also the Parihaka Reconciliation Bill, and now we are here. How do we move forward? I commit to working with my people that we can be good Te Tiriti partners, that the legacy that I will leave is that my people are educated and understand that we can walk together to 2040.\n\nCARL BATES: Tēnā koutou, tēnā koutou, tēnā koutou katoa. Ko Ruapehu te maunga, ko Whanganui te awa. Nō Whanganui ahau. Ko Carl Bates taku ingoa. Ko mema Pāremata Whanganui. Tēnā koutou, tēnā koutou, tēnā koutou katoa.\n[Greetings to you all. Ruapehu is the mountain, Whanganui is the river. I am from Ruapehu. My name is Carl Bates. I am the member of Parliament for Whanganui. Greetings to you all.]\nI want to take the opportunity to start off by welcoming those from Ngā Iwi o Taranaki from across Taranaki to this House today. As one of the four directly elected representatives of yours in this House, along with my colleagues Debbie Ngarewa-Packer, Barbara Kuriger, and David MacLeod, I welcome you to this House, as your directly elected representatives, as I say, will play a role in the future of this legislation here.\nJenny Marcroft referenced the story of Taranaki Maunga, and indeed it’s one that I shared in my maiden speech. I was going to reference it this afternoon because it doesn’t fall lightly, or the sort of context of that story, the journey of Taranaki Maunga down the Whanganui awa, up the South Taranaki coast, ultimately to the place that it now lays—connects with the journey of personhood that’s been taken through this House of Representatives, with Te Awa Tupua being passed in 2017 and now the passing of this legislation today.\nThese days in this House are significant. They’re milestones. They’re days that are not easily forgotten and are certainly taken with a heaviness by all members here on the floor. I was reflecting, coming into the House today, on the words of Minister Goldsmith earlier today when he spoke about Egmont 250 years ago, sailing past and deciding to call this mountain “Egmont”, and that many of us will be the last generation that will know what Mount Egmont was or meant or the context that it holds. Today, down here in Wellington, my six-year-old son Angus has been spending the last couple of days of the school holidays and he will only know this maunga as Taranaki Maunga, and I think that is significant and something for us all to treasure.\nI want to just acknowledge the feedback that my colleagues took on board from us as the local members of Parliament through the select committee process. We shared some of the feedback that was being received, and that’s already been referenced by my colleague Dan Bidois. But this legislation does bring a new set of kōrero that’s going to commence, as, I suppose, in my language, this new situation is put into practice. It’s going to require trust, collaboration, work, and engagement across iwi, Crown, the Department of Conservation, council, and mountain users.\nIn my maiden speech, I also referred to another little quote that I learnt as a youngster, as a Scout climbing on Taranaki Maunga a few years back, and that was “Take only photos and leave only footprints”. I think, in many ways, the spirit of that language is one that I know will be part of the kōrero that will happen as we look forward.\nLast year, I had the opportunity to visit Aotea Marae with Minister Potaka and we had somewhat of a robust kōrero. I look forward to the opportunity to visit again both Aotea Marae and others across both the Whanganui electorate and Taranaki as we go through this process that will come as this legislation is turned into practice. It is an honour and a privilege to commend this bill to the House this evening.", "window_id": "2025-01-30#13"}, {"statement_id": "d7060b92c28f2f43", "politician": "Todd Stephenson", "party": "ACT", "side": "government", "date": "2025-03-05", "statement": "Now, this council requires Chinese medicine practitioners to honour the Treaty as tangata whenua, challenge the biases of their colleagues, and enact the principles of the Treaty and involve bicultural principles.", "window": "Hon WILLIE JACKSON: Thank you, Mr Speaker. Well, what a shameful day for this Government and for—\nJenny Marcroft : You always say that.\n—I always say that because it’s true—the Minister for Māori Development, Tama Potaka, when we hear of the resignation of Richard Prebble from the Waitangi Tribunal.\nRichard Prebble, apparently, can’t read the fine print before he goes on to the tribunal. It’s a shameful, shameful stunt from Mr Prebble in terms of promoting the filthy, rotten Treaty principles bill. That’s what’s driving this. It’s an embarrassment for the Minister for Māori Development and it’s an embarrassment for this Government that they were tricked into appointing someone who has used the Treaty principles bill as his stage to support that filthy bill and, of course, the ACT Party.\nGetting tricked by David Seymour into allowing this appointment was so opportunistic that it is something that we should never forget. How many times—the question is—will the National Party allow the ACT Party to ankle tap them and play them for fools? Is Erica Stanford still waiting in the office for David Seymour to explain the terrible garbage he’s feeding the kids? Is the Prime Minister still doing nothing to hold David Seymour to account? Why has David Seymour been allowed to play Minister Potaka like this?\nThe resignation by Prebble is just another shameful, bad-faith political stunt designed to cause racial-baiting divisiveness. Whether he was on it or not, Prebble was always going to cause a scene to further the embittered, anti-Treaty agenda of the ACT Party. David Seymour applauded Prebble’s appointment when it happened last year. He applauded it and he thought it was wonderful, but he tricked the Minister for Māori Development into appointing this member. I’m sure he did, because it’s the same bad-faith argument from Prebble that we see with the Treaty principles bill and the same bad-faith argument that we see with school lunches. Everything ACT touches is bad faith.\nPrebble has quit the Waitangi Tribunal because, apparently, the tribunal has turned the Treaty into a socialist manifesto—a socialist manifesto. If only—if only! Prebble has detonated this self-sabotaging stunt so he can smear the tribunal with the two words ACT Party supporters get most frightened by: “socialist” and “manifesto”. We all know Prebble’s background. We know his background, and it’s the same background as ACT. He was the leader of Rogernomics, he oversaw mass privatisation, and he helped create and then lead the ACT Party, and so everything to the left of Caligula is considered a socialist manifesto.\nMinister Potaka has been tricked into appointing a right-wing agent provocateur to cause an embarrassing stunt to smear the tribunal, and, sadly, Minister Potaka fell for it. I warned him. I told him it was a mistake that Prebble had talked about the tribunal being racist and apartheid. I tried to help Tama Potaka, but he wouldn’t listen. This stunt smells as bad as ACT’s school lunches and is a waste of time to undermine this Parliament’s important work. We hear rumours that the numbers are being taken on the Prime Minister, and, hopefully, whoever the National Party’s next leader is will rein in the ACT Party from their embarrassing acts—particularly this one, in terms of Richard Prebble.\nI want to finish by clearly advocating our support for the tribunal and their chair, Caren Fox, who has been a tremendous advocate, and who has put out a statement today. We’re in the 50th year, in terms of their celebration, and I want to compliment them for what they’ve done in terms of this nation. It’s been magnificent—they’ve changed the conscience of this country.\nI want to congratulate them and also put this to people today: who would you believe with regard to tino rangatiratanga? Richard Prebble or my uncle Moana Jackson, who said that we would never give away our independence? Eighty thousand Māori giving away their tino rangatiratanga to 2,000 settlers—come on! He said that that “flies in the face of … human history, let alone … Māori history, where the notion giving away the authority to make independent decisions is not just culturally inconceivable; it was”—\nTodd Stephenson : Mr Speaker.\n\nTODD STEPHENSON: Thank you, Mr Speaker. The ACT Party doesn’t need to be reined in, because we’re a constructive part of this Government. I want to just reflect on what the health Minister, the Hon Simeon Brown, said today: patients must be at the forefront of everything we’re doing in health. In ACT, we totally agree with that. I really want to congratulate the Minister on some of the announcements this week he’s made around health and the timely and quality healthcare for New Zealanders he is trying to deliver, with the uplift in funding for GPs and the real focus on that primary practice, more places in medical schools, and, of course, supporting our very important nursing community.\nWhat I want to talk about today is what the consequences are when you actually do decide to divide New Zealanders by their ethnicity and actually decide that there are different rights and privileges based on ethnicity. What I’m talking about specifically is the health regulatory bodies in this country who are using the Treaty to justify their ideology ahead of patient wellbeing and valid science. That is extremely concerning to me. These bodies have decided how they are going to treat New Zealanders. It will be based on ethnicity—Māori versus non-Māori—and that is just not good enough.\nFirst, we have the Nursing Council of New Zealand. Now, they put out some standards of competency last year. There’s two of them, depending on whether you’re a registered nurse or an enrolled nurse. They have either six or four standards of competency, but the first two competencies are entirely related to ethnicity and the Treaty. Before you even get to patient care, how you actually should be looking after your patients is entirely based on ethnicity.\nSome of the nurses have told me—they’ve come to me directly and said—they are not looking at staying in nursing because of these competencies. It’s requiring them to know te reo, tikanga, describe the impact of colonisation, and actually advocate for culture and spiritual health. Now, look, I don’t think that’s actually what nurses should be focused on. We actually think of nurses as having the right skills to treat the patients in front of them and actually having a big heart, and now these bodies are requiring nurses to have the right and correct views on the Treaty.\nThen we’ve got my other favourite, the Chinese Medicine Council. This was set up in 2021 by Labour, and it’s to regulate the Chinese medicine providers here in New Zealand. Now, this council requires Chinese medicine practitioners to honour the Treaty as tangata whenua, challenge the biases of their colleagues, and enact the principles of the Treaty and involve bicultural principles. Well, bicultural principles—which culture are we talking about here? Chinese culture? Māori culture? I mean, really, this is crazy stuff. It’s absolutely absurd.\nThen we’ve got the psychologists. The New Zealand Psychologists Board—now, I actually was a representative. Some psychologists came to me late last year very concerned about this. They were so concerned that their voice would be shouted down and they wouldn’t be listened to. They actually couldn’t write directly to their own professional board, so I took up their case and actually wrote to them in September of last year—a very reasonable letter outlining their concerns—and said, “Look, actually, some of your members have got concerns and we just would like you to reopen consultation, have it open longer, actually do something.”\nThey just acknowledged my letter and just pushed on. They didn’t actually listen to their members. What that tells me is we’ve got a professional body—this is the New Zealand Psychologists Board—who are actually not providing a safe board for their members or a safe council for their members to actually have their views. That is very, very concerning.\nI will go on. We’ve got the Midwifery Council, who have embedded principles of self-determination, equality, and partnership. Again, luckily Minister Brown is actually looking for some new appointments.\n\nHon Judith Collins: I mean I can tell you—you don’t really care about that; you just want to get it out.\n\nTODD STEPHENSON: No. Then the Pharmacy Council—again, pharmacists need to embed the Treaty in everything they do, which is very, very concerning. But we have some good news—we have some good news. Minister Seymour is getting some new pharmacists.\nWhat I’ve got to say is, we’ve got to stop this woke madness. Kiwis engaging in our health system deserve confidence that they are being treated foremost as humans with individual needs and that their needs will be met on valid science. That’s what they’re wanting. I would ask parties to support the Treaty principles bill because it actually stops this divide by race.\nDr HAMISH CAMPBELL (National—Ilam): Excellent, thank you, Mr Speaker. It is a great honour to rise in this general debate, and we’re going to be talking about health. We had a previous speaker that said, “How good is the Minister of Health?” I think everybody agrees we have a great Minister of Health, but I also want to say: how great is our Minister for Mental Health, the very first mental health Minister, getting the money out of Wellington and getting it to the front line?", "window_id": "2025-03-05#6"}, {"statement_id": "01a5375d6ad9ea3e", "politician": "Erica Stanford", "party": "National", "side": "government", "date": "2025-06-24", "statement": "I recently visited Hot Lime Labs, a clean tech business in the mighty Lower Hutt, a New Zealand business that uses world-leading technology to produce clean and sustainable carbon dioxide for greenhouses from waste wood, using world-leading, patented technology.", "window": "Hon ERICA STANFORD: Since the Active Investor Plus visa opened on 1 April, we’ve received 189 applications. These investors have indicated they’ll be investing a minimum of over a billion dollars into our businesses and economy, of which $845 million is from new applications. That is all in less than three months. It’s a staggering lift from the 116 applications received over more than 2½ years under the previous settings. Attracting investment for our economy means businesses can expand higher and grow, which creates more opportunity for New Zealanders. And this message from our Government is clear: New Zealand is open for business and for investment, and we are serious about unlocking our economic potential.\nCameron Brewer : Where are applications being received from?\nWe’re seeing significant global interest in these new investment settings. Forty-five percent of the new applications are from the United States, with China and Hong Kong following. Applications have also been received from Austria, Canada, the Czech Republic, Germany, Great Britian, Japan, the Netherlands, Poland, Romania, Singapore, South Korea, Spain, Switzerland, Taiwan, and Vietnam. These investments will help grow businesses, create jobs, and provide new skills for young people.\nCameron Brewer : What Kiwi businesses are benefiting from the Active Investor Plus visa?\nI recently visited Hot Lime Labs, a clean tech business in the mighty Lower Hutt, a New Zealand business that uses world-leading technology to produce clean and sustainable carbon dioxide for greenhouses from waste wood, using world-leading, patented technology. Hot Lime Labs are an accredited business available for direct investment from the Active Investor Plus. They’ve already received investment from a managed fund, and they’re targeting the European market and looking to grow to an over $100 million business, headquartered here in New Zealand, which means hundreds of jobs for Kiwis.\nCameron Brewer : What feedback has she received about the Active Investor Plus visa?\nI’ve spoken with a range of people who are very positive about these changes. One said to me that opportunities for New Zealand businesses to seek investment have never looked so good since before the 2008 global financial crisis. Queen City Law managing director, Marcus Beveridge, described the scheme as “A ray of sunshine” and said that he wouldn’t be surprised if we exceeded $10 billion a year coming in through this programme. He said, “We’re expecting quite an explosion of applications over the next couple of months”. Attracting foreign investment means boosting the economy, creating jobs, and building a prosperous future for New Zealand.\nQuestion No. 7—Finance\n7. Hon BARBARA EDMONDS (Labour—Mana) to the Minister of Finance: Does she stand by her statement that “A number of Budget 2025 initiatives deliver targeted cost of living support”; if so, what were those Budget 2025 initiatives?\n\nHon NICOLA WILLIS: Yes, and the most important thing this Budget—and the previous Budget—does for the cost of living is help keep inflation under control through strong fiscal discipline; what a change that is from previous years. In terms of specific Budget initiatives, these included enabling New Zealanders to get 12-month prescriptions for medicines, rather than paying to get a new prescription written every three months; increasing eligibility for rates rebates, for up to 66,000 older New Zealanders; raising the family income threshold for Working for Families so that low to middle income recipients get additional financial support; continuation of our Government’s commitment not to lift petrol taxes this term, a proposal made by the previous Government and a continuation of our commitment not to reintroduce the Auckland regional fuel tax introduced by the last Government; ongoing support for the Commerce Commission to exercise its functions under the Grocery Industry Competition Act. Mr Speaker, I could go on, but you didn’t ask for a speech.\n\nHon Barbara Edmonds: How does $7 a week starting next year for Working for Families recipients help Kiwi families struggling now?\n\nHon NICOLA WILLIS: Quite simply, this was not a change that was in law; this is a change we introduced in this Budget. It has been the longstanding practice of successive Governments that tax changes like this happen on 1 April in the tax year.\n\nHon Marama Davidson: How does a decrease, on average, of $43 per fortnight for 61,000 families, who are now no longer applicable for Best Start in the first year of their baby’s life, help with the cost of living when food prices have increased by 4 percent, and electricity prices are up 8.7 percent?\n\nHon NICOLA WILLIS: We took a leaf out of the last Government’s book, which in one of its rare circumstances decided to target the second and third year of the Best Start payment at those families who actually needed it most, and we have simply continued that targeting into the first year.\n\nHon Barbara Edmonds: Does she agree with the Acting Prime Minister that it is not the Government’s job to find a family that received the full $250 cost of living support that she promised in last year’s Budget?\n\nHon NICOLA WILLIS: We delivered on our promise. The policy commitments that informed that case study were delivered in full. I find it very difficult to take that question seriously when that member opposed every tax relief measure in our last Budget, meaning she actively wanted New Zealand voters to be worse off.\n\nHon Barbara Edmonds: Does she believe that international factors, such as a global pandemic and a global conflict, can impact inflation and economic settings?\n\nHon NICOLA WILLIS: Yes, which is why it is so important that Governments control what is in their control. So, for example, Governments who, in the midst of global challenges, decide to double, triple, and quadruple down on their operating allowances and send cost of living payments to dead people and French backpackers are making inflation worse, not better. Our Government will not repeat the wasteful spending record of the last Labour administration.\n\nHon Barbara Edmonds: How can she stand by her statement that a number of measures in Budget 2025 delivered targeted support for the cost of living when $7 per week from 2026 barely buys a block of butter, 61,000 families with a newborn lose up to $43 a fortnight, and she still can’t point to one family that received the full $250 she promised them in her previous Budget?\n\nHon NICOLA WILLIS: The facts are very simple. Let me read out simply the facts, which are around inflation rates. In September 2022, prices were rising 7.2 percent; in June 2022, 7.3 percent; in December 2022, 7.2 percent; March 2023, 6.7 percent; in September 2024, they’d come down to 2.2 percent. They were 2.2 percent in December 2024 and 2.5 percent in March 2025. My point is a simple one that the member has not yet grasped: if prices are rising out control and inflation is out of control, every New Zealand family is worse off. That’s your record—own it. [Interruption]\n\nHon SIMEON BROWN: Primary care is at the heart of the health system, delivering care to around 55,000 people every day. That’s why, this morning, the Government announced the largest ever funding boost for general practice in our country’s history. GPs will receive up to 13.89 percent funding uplift, bringing the total Government funding increase to $175 million for this financial year. That’s more than double the highest annual increase there has been since capitation was first rolled out. This is about putting patients first. We expect this investment to deliver results including shorter wait times, easier access to care, and better health outcomes for patients.\nDr Vanessa Weenink : What will this record funding boost mean for New Zealanders?\nWe are backing general practice to deliver real results. We know that when people see their doctor or nurse earlier, they stay healthier and stay out of hospital. That’s why our record funding boost will enable general practices to see more patients, reduce wait times, and provide faster care to those who need it most. We’re also supporting GPs with an additional $5 million to deliver minor planned care procedures in the community, such as skin excisions and infusions, minor gynaecological procedures, and oncology infusions, so that New Zealanders can access care closer to home, without unnecessary delay.\n\nHon SIMEON BROWN: I’m currently taking it.\nDr Vanessa Weenink : How will this record funding boost support childhood immunisations?\nLifting childhood immunisation rates is a top priority for this Government. We want to see 95 percent of enrolled children fully immunised, and GPs will play a critical role in achieving this target. That’s why our record funding boost includes performance payments for general practices that lift their childhood immunisation rates by up to 10 percentage points or to 95 percent of their enrolled population, with partial payments for partial achievement. We’re a Government that is serious about results, and improving child immunisations remains a top priority for this Government.\nDr Vanessa Weenink : What else is the Government doing to support the primary care workforce?\nAs part of Budget 2025, we’re making significant investments to grow and support our primary care workforce, including funding 100 clinical placements for overseas-trained doctors in primary care, 100 additional medical training places at our universities over the term of this Government, and up to 50 graduate doctor training places in primary care. We’ve also invested in nursing, with our recruitment centres for up to 400 graduate nurses each year, accelerating tertiary education for up to 120 primary care nurses, and are funding up to 120 training places for nurse practitioners. We will continue to invest in our front-line workforce so New Zealanders can get the care they need when and where they need it.\nQuestion No. 9—Justice\n9. TODD STEPHENSON (ACT) to the Associate Minister of Justice: What recent announcements has she made regarding the Three Strikes law?", "window_id": "2025-06-24#4"}, {"statement_id": "89c6e93f9f6886cc", "politician": "Chris Bishop", "party": "National", "side": "government", "date": "2025-08-12", "statement": "If people think things are bad now, God only knows what it would have been under Grant Robertson’s profligate reign of fiscal terror.", "window": "Rt Hon CHRISTOPHER LUXON: Yes.\nChlöe Swarbrick : Does he agree with the Minister of Foreign Affairs that “There are a broad range of strongly held views within our Government”, and, if so, who in the Government is opposing recognising Palestinian statehood?\nThere are a broad range and strongly held views across the whole of our society and across the whole of New Zealand, and, as you would expect, across this Chamber there will be a variance of views as well.\nChlöe Swarbrick : What is the harm, if any, of recognising Palestinian statehood?\nWell, it’s been a longstanding position of successive New Zealand Governments since 1947 to recognise the creation of a State for Israel and a State of Palestine where two peoples can live together in peace and security. That has been a longstanding position of the New Zealand Governments of different political parties. The issue is that we need to, as we’ve said, as you’ve heard the Foreign Minister say, and it’s been a longstanding position—it’s a matter of when, not if. But the immediate challenge for the situation in the Middle East is, of course, Hamas must release hostages. As a terrorist organisation, they must release those hostages. Secondly, Israel must allow unfettered humanitarian access into what is an absolute catastrophe, and there must be a ceasefire and diplomacy and dialogue.\nChlöe Swarbrick : Is the Prime Minister aware that Israeli hostages have been offered back multiple times and Israel currently holds approximately 10,000 Palestinian prisoners?\nSorry, I’m not going to respond to that question. That’s not what I’ve been briefed on.\nChlöe Swarbrick : Point of order, Mr Speaker. [Interruption]\n\nRt Hon CHRISTOPHER LUXON: Yes, and what I’d say to the member is I would be very careful throwing terms like “genocide” around. It’s very important that the right bodies, that we support under the international rules-based system—the International Court of Justice and the International Criminal Court are those closest and are the appropriate bodies which we fully support to make those determinations.\nChlöe Swarbrick : Is the Prime Minister finally willing to say that Israel’s slaughter and starvation of Palestinians in Gaza is a genocide, and, if not, what does he know that Holocaust and genocide scholars don’t?\n\nHon David Seymour: Point of order. Standing Orders—I think it’s about 390—are very clear that a questioner must not make arguments or argumentations in asking a question that are not necessary to make it intelligible. This questioner is making a series of assertions in order to convey information rather than seek it by asking a question. A question like that, according to Standing Orders, should be ruled out.\n\nRt Hon CHRISTOPHER LUXON: Well, what I know is that there’s a humanitarian catastrophe happening in the Middle East. What I know is that we want to see peace and stability and security reign in the Middle East, and, for that to happen, Hamas must release hostages immediately. What happened on 7 October from a terrorist organisation inflicting 1,200 deaths on innocent civilians was unacceptable. We are also saying, clearly—and we’ve done it through a number of calls with other countries as well—that we want Israel to give unfettered humanitarian access. We do not want more military action. We need to make sure that we actually see diplomacy and dialogue reign in the Middle East.\n\nHon David Seymour: Point of order. Mr Speaker, I draw your attention to the member who has just resumed her seat, which is adorned with a Palestinian scarf, and I invite you to consider what this House might look like if everybody who had an interest in a global conflict started adorning their seats with symbols of one side or the other of a conflict. I think that would bring the House into disrepute, and no member should be allowed to do such a thing, particularly when you yourself have forbidden members from wearing tiny pins on their lapels.\nChlöe Swarbrick : Simon Court’s currently removing his.\n\nHon ERICA STANFORD: Last week, I announced a proposal to replace NCEA with a new national secondary qualification. This includes: replacing NCEA level 1 with a foundational skills award; replacing NCEA 2 and 3 with the New Zealand Certificate of Education and the New Zealand Advanced Certificate of Education; requiring students to pass at least four subjects to attain each certificate; returning to clear marks out of 100, with grades like A, B, or C; being ambitious for our kids—unlike some members of this House—and the creation of new coherent subjects and standards, to support strong vocational education. New assessments will be based internationally benchmarked and consistent national curriculum. Until now, no Government has been bold enough to take decisive action, but we are—so our kids get the very best chance to succeed.\nCarl Bates : Why is she proposing—\n\nHon ERICA STANFORD: The warning lights have been flashing for some time. There are clear issues with the design and implementation of NCEA, which is overly flexible, difficult for parents and employers to understand, and the lack of consistency leaves too much to chance. For example, last year in new level 1 mathematics, only 11 percent of students were assessed against all four standards—the whole curriculum. More than 250,000 exam papers were left blank, students are more than twice as likely to get an Excellence grade if it’s marked internally rather than externally, and 60 percent of teachers don’t believe that the new NCEA is a reliable measure of student knowledge and skill. Doing nothing in the face of all this is not an option. We have to strengthen the system, and our proposals are designed to do just that.\nCarl Bates : What will these proposed changes mean for parents?\nMy message to parents is this: like you, we are ambitious for your children; they deserve a world-leading education system, and we are delivering that. Our proposals mean that the very best parts of NCEA will stay—things like a combination of internal and external exams, flexibility to do both vocational and general subjects, and special assessment conditions for those students with additional needs—while other aspects will be improved and delivered on: assessment against an internationally benchmarked curriculum, clear grades out of 100, and stronger attainment requirements like passing at least four subjects to gain a qualification. We want there to be more coherence, more consistency, and more clarity of what students know and can do.\nCarl Bates : What feedback has she received from parents?\nWell, it has been overwhelmingly positive. One parent reached out to say, “Great job on the new education policy. I’ve got one kid about to enter NCEA, and I’m very glad my youngest will miss it and enter in through the new way. Keep up the great work.” Another parent reached out to say she was delighted to see the proposal. But my favourite comment was one simply saying: “Woo hoo! Fantastic policy. Woo hoo! Let’s go.” This Government is ambitious about the future success of our young people, and I look forward to working across the House to ensure that we secure enduring success of this proposal.\nQuestion No. 5—Economic Growth\n5. Hon GINNY ANDERSEN (Labour) to the Minister for Economic Growth: Does she agree with the Minister of Finance, who said about the additional 16,000 people unemployed that they “shouldn’t take it personally”; if not, why not?\n\nHon CHRIS BISHOP: I agree with the full quote made by the Minister of Finance, which was that “it is an incredibly tough experience. They shouldn’t take it personally, because what they are often the victims of is an economy that was mismanaged, where inflation and interest rates were out of control, and where many businesses have retrenched.” It is absolutely the case that the economy was mismanaged by the previous Government, with inflation and interest rates out of control, and we are still recovering from that.\n\nHon CHRIS BISHOP: I would just direct the member to the full quote in the context in which I gave on the primary answer. She should’ve listened.\n\nHon Ginny Andersen: If he truly cares about people’s lives and livelihoods, why does he dismiss the thousands of people who have lost their jobs and can’t pay their bills, as if their daily struggle doesn’t matter?\n\nHon CHRIS BISHOP: Well, the good news is that the Budget forecasts a 240,000 increase in jobs over the next four years as growth starts returning to the economy, after years of mismanagement under the previous Government. At the end of the day, the Government’s job is to implement good public policy and good fiscal policy and allow growth in the economy to return, generating jobs and higher living standards for New Zealanders. That’s what the Budget forecasts will happen over the next four years, and we look forward to that continuing.\n\nHon Ginny Andersen: Does he stand by his statement that “Some New Zealanders have got themselves into the habit of what I call glass half empty economics”, and, if so, does he think that those people who lost their jobs should just cheer up?\n\nHon CHRIS BISHOP: Yes, I do stand by that statement, and, no, I was referring to most members of the Opposition, including the shadow Minister of Finance, who said in a podcast a couple of days ago, “We don’t have to provide the solutions to issues,” and “It’s not my job to find the solutions.” I do stand by those statements as well.\n\nRt Hon Chris Hipkins: Point of order. Mr Speaker. I wonder whether you could clarify for us what the ministerial responsibility in the last part of that answer was?\n\nRt Hon Chris Hipkins: Further point of order, Mr Speaker. How on earth is a statement by Barbara Edmonds, the finance spokesperson for the Labour Party, a matter of ministerial responsibility?\n\nRt Hon Winston Peters: Minister, on the basis that all politics is local, has he got any examples of employers abusing their staff?\n\nRt Hon Winston Peters: The Minister can answer the question about its relativity. It’s very obvious. We’re talking about people over there who are claiming that employers are not looking after their workers—or, in this case, blaming the Government. I’m just making the connection of a local example.\n\nHon Ginny Andersen: Does he know what the unemployment rate would be if thousands of New Zealanders had stayed here and not left the country in search of jobs and higher wages?\n\nHon CHRIS BISHOP: No, it’s not. Your mismanagement of the economy was not funny. It definitely was not funny, my friend.\n\nHon CHRIS BISHOP: I’m laughing because I know what the unemployment rate would have been if that member’s party had been re-elected. The Pre-election Economic and Fiscal Update said one thing, but New Zealanders know that if Grant Robertson had been allowed to recklessly spend his way through another three years, unemployment would be even higher than it is today, debt would be even higher, and we’d be approaching 50 percent. If people think things are bad now, God only knows what it would have been under Grant Robertson’s profligate reign of fiscal terror.\n\nHon Ginny Andersen: Can he see that telling people who lost their jobs not to “take it personally” and who are “glass half empty” that it’s just another kick in the guts for Kiwis whose lives are worse and not better under National?\n\nHon CHRIS BISHOP: The member needs to cheer up. The Budget shows, over the next four years, over 200,000 new jobs will be created. There are billions of dollars of infrastructure investment coming down the pipe, including $6 billion between now and Christmas. Fast-track projects are being consented. In fact, there are due to be, between now and Christmas, over 10 fast-track projects—[Interruption]", "window_id": "2025-08-12#1"}, {"statement_id": "71194dd08b201213", "politician": "Louise Upston", "party": "National", "side": "government", "date": "2025-12-17", "statement": "I'd really encourage and invite disabled people, their whānau and community, as well as seniors who access the Total Mobility scheme to have their say on the consultation document put out by the Ministry of Transport because this is also an opportunity to strengthen the scheme, to make it more flexible, and to allow those who use the system to have more choice and control.", "window": "Hon LOUISE UPSTON: Unlike that member, I’m incredibly optimistic and can see that the economic growth that our coalition Government is driving will give us more opportunities to support New Zealanders off welfare into work. As I said, I think it’s cause for celebration that 83,000 New Zealanders came off welfare into work in the last year, and I actually think that’s worth celebrating.\n\nHon Willie Jackson: Why does she keep ignoring the Ministry of Social Development, the Department of the Prime Minister and Cabinet, and now the Treasury when they keep telling her that she will fail to achieve her target, or will she keep her head in the sand and pretend there’s nothing wrong?\n\nHon LOUISE UPSTON: Well, unlike that side of the House, I’m very optimistic about the way that the New Zealand economy has turned the corner, despite the absolute train wreck that we inherited. This side of the House knows that for every single person that we move off welfare into work, it is life-changing for them, for their whānau, and their community, and we will not give up on any one of them.\nQuestion No. 8—Mental Health\n\nHon MATT DOOCEY: This Government is committed to ensuring families who experience the loss of a baby are treated with dignity and compassion. That’s why we’ve announced we will change the process of registering a stillbirth so that it is more supportive and sensitive for grieving parents. Every year in New Zealand, approximately 700 to 900 families experience perinatal loss. We’re committed to making sure parents who lose a baby are met with dignity, care, and the right support.\nDr Hamish Campbell : Why was a change needed to the current process?\nFor too long, families have had no choice but to complete stillbirth registrations through the same online process designed for parents registering their newborn. We’ve heard from grieving families that going through the same process adds unnecessary pain at an already traumatic and distressing time. Changing this process is about reducing distress and showing understanding for what families are going through.\nDr Hamish Campbell : What will the process be under the new approach?\nHealth New Zealand is working with the Department of Internal Affairs on a new approach which will allow parents to register a stillbirth through the Whetūrangitia website. This is a dedicated website designed to support families who have experienced baby loss. Moving the registration process to Whetūrangitia means that parents can engage through a process that acknowledges their loss and connects them to the right services and support. Health New Zealand will fund the technical and service changes needed to make this happen, ensuring the process is sensitive, streamlined, and aligned with the guidance already available on Whetūrangitia.\nDr Hamish Campbell : What responses has he seen from families impacted by stillbirth?\nSome of the messages from families impacted by stillbirth that I’ve seen have been both heartbreaking and deeply encouraging. Sharma said, “This is a much-needed change. I was pregnant with twin boys and one passed in utero. It was heartbreaking and so hard to follow the same steps to register the birth of both my boys in the same process, even though one boy was alive and one wasn’t.” Lily said, “This is a really positive step in the right direction, and Whetūrangitia is such a great idea. It’s an amazing resource for bereaved parents.” This is a simple change, but it’s a meaningful way to reduce distress and show compassion during one of the most difficult times in someone’s life.\nMariameno Kapa-Kingi : Supplementary, Mr Speaker.\n\nHon MATT DOOCEY: I welcome that question from the member. I think it’s important that we do have the data that informs decisions around ensuring everyone gets access to timely mental health and addiction support. Today, we released quarter 1 data that showed Māori access to mental health and addiction support for primary and specialist services is increasing. I want to acknowledge our Māori services by Māori for everyone, as well as a significant improvement in Pasifika and Asian, as well as our rural, mental health services. It is important that we set a standard of what was a guaranteed level of service in this country and ensure Health New Zealand delivers to that standard the Government has set.\nQuestion No. 9—Disability Issues\n9. Hon PRIYANCA RADHAKRISHNAN (Labour) to the Minister for Disability Issues: Does she stand by her statement, “We know disabled people want to participate in their communities, to make decisions themselves and to thrive”; if so, why?\n\nHon LOUISE UPSTON: Yes. That’s why we’ve released the New Zealand Disability Strategy which sets out measurable actions we will take over the next five years to help realise the aspirations of disabled people. It has been clear, from the conversations I’ve had with the disability community, that this is important to them. The strategy is an important lever for building the future and driving positive change for disabled people. Our Government is committed to improving the lives of disabled people, and we have demonstrated this with an over $2.1 billion investment into the disability support services.\n\nHon Priyanca Radhakrishnan: How is driving transport costs up for disabled people by cutting funding to the Total Mobility scheme, that thousands of disabled people rely on, supporting them to participate in their communities?\n\nHon LOUISE UPSTON: It’s hard to cut funding when it wasn’t appropriated in the first place. What this Government has inherited is yet another mess of uncontrolled spending with a fiscal cliff. So, instead, our Government is focused on how we ensure that there is fair, consistent, and available support for disabled people and older New Zealanders to ensure there is a Total Mobility scheme available to them from one end of New Zealand to the other.\n\nHon Priyanca Radhakrishnan: Why is she making the lives of disabled people worse by increasing their cost of living, when the Ministry of Social Development’s own research shows many disabled people already go without healthy food and cannot visit family because it’s too expensive?\n\nHon LOUISE UPSTON: Well, as this side of the House has said on many occasions, unfortunately the economic reality we inherited from the previous Government has meant we have had to get on top of a range of out-of-control costs. Part of what we have focused on very, very deliberately in our support for disabled people is having fair, consistent, transparent, and reliable services. As I said, that’s why we have invested $2.1 billion into disability support services to improve the support they get. From February next year, it will also enable greater choice and control into the way that they are able to support and ensure that their services are delivered the way they choose.\n\nHon Priyanca Radhakrishnan: Is disability advocate Peter Boock wrong when he says that her changes are “cost-cutting to shift the burden on to the poorest and most marginalised people in our society,”?\n\nHon LOUISE UPSTON: No, and I would note that in September 2023—mere months after that member, when she was Minister, announced the increase in the subsidy to 75 percent—the then Minister of Transport David Parker told media outlets that his ministry was undertaking a review of Total Mobility, including investigating affordability. So it would have been really helpful if, when that member was in charge, she’d actually budgeted—put the money aside—and not given empty promises to disabled people.\n\nHon Chris Bishop: Can the Minister confirm that the appropriation for Total Mobility has remained flat into the out-years, even though a decision was made to increase the subsidy, which has unsurprisingly had the impact of increasing demand and therefore costs to the scheme?\n\nHon LOUISE UPSTON: I can confirm that, and what is absolutely despicable is making promises to disabled people when the funding is not set aside and when the then Government and the Minister of Transport within a couple a months could see there was going to be an issue around affordability and sustainability of the Total Mobility scheme. Yet again, this side of the House has taken on the reality of fixing a problem we inherited, and what we are ensuring is that disabled people and seniors have a Total Mobility scheme that is accessible across one end of New Zealand to the other, because what we do know is it’s not just an affordability challenge for central government; it’s been a big affordability challenge for local councils, and we wanted to ensure that we had a scheme that we could continue and that regional councils could continue to fund as well.\n\nHon Priyanca Radhakrishnan: What message does it send that her Government's holiday gift to disabled people is less independence, less dignity, more anxiety, and less community participation, all because her Government views disabled people as a financial burden?\n\nHon LOUISE UPSTON: I fail to even have words in this House for the level of despicability of that question. But what I would say is the changes that we have announced don't take the level of subsidy back to what it was in 2022. What we are doing is the changes will come into effect on 1 July—we have taken one decision in order to ensure that the Total Mobility scheme is sustainable. I'd really encourage and invite disabled people, their whānau and community, as well as seniors who access the Total Mobility scheme to have their say on the consultation document put out by the Ministry of Transport because this is also an opportunity to strengthen the scheme, to make it more flexible, and to allow those who use the system to have more choice and control. I'd really encourage them to have their say. We will be listening. We will make changes to ensure that it meets their needs.\nQuestion No. 10—Prime Minister\n10. DEBBIE NGAREWA-PACKER (Co-Leader—Te Pāti Māori) to the Prime Minister: Does he stand by all his Government’s statements and actions?\n\nRt Hon CHRISTOPHER LUXON: Yes.\nDebbie Ngarewa-Packer : Why has the Government announced a merger of three major ministries that will impact over 1,300 staff just a week before Christmas?\nBecause we want to have outstanding execution of our Resource Management Act reforms, and we need to build an organisation that can deliver up against that task. Also, this is a Cabinet that’s taken a decision and we didn’t want any further speculation.\nDebbie Ngarewa-Packer : Why has the Government chosen not to extend transport subsidies for our kaumātua and tangata whaikaha just a week before Christmas?\nBecause the system was unaffordable and unworkable. We did not want the risk of local government authorities backing out of the system. We’ve pulled it back 10 percent; it’s a 65 percent subsidy—unlike the previous Government that actually made promises but didn’t put the money aside, and as a result there was a massive blowout in the system.\nDebbie Ngarewa-Packer : Will he rule out including the Treaty principles bill in any future coalition agreement with the ACT Party?\nI’ve got no responsibility for that as a Prime Minister, but I have made my position clear as leader of the National Party\nDebbie Ngarewa-Packer : Is the Prime Minister running a Secret Santa this year, and, if so, which Minister drew Māori communities, because the gift seems to have gone missing?\n\nRt Hon CHRISTOPHER LUXON: We’ve canvassed these issues before over the course of this year. What this Government did do is it gave tax relief to low and middle income working New Zealanders, and not one member of Labour, Te Pāti Māori, or the Greens supported that.\n\nHon David Seymour: Can the Prime Minister find the patience to continue the long wait for some acknowledgment that restoring mortgage interest deductibility for residential housing has actually been accompanied by a fall in rents?", "window_id": "2025-12-17#2"}, {"statement_id": "3aab773df0933801", "politician": "Casey Costello", "party": "NZ First", "side": "government", "date": "2026-01-27", "statement": "Furthermore, kaupapa Māori providers who have survived severe funding cuts, just like Te Whare Hīnātore at the Auckland City Mission, are forced to reject whānau with nowhere else to go.", "window": "Hon CASEY COSTELLO: The concluding part of my speech is really around our Pacific response to organised crime, the importance of our relationships across the Pacific, and the work that we will continue to be doing. As the Minister of Customs, I’m incredibly proud of the work that we have done to build those positive relationships. We are continuing to work to support the customs administration of our Pacific neighbours to develop good legislation to enable them to strengthen their borders, and we will continue to drive better legislation for New Zealand with border security legislation to help enforce our borders and provide the protection that New Zealanders need to live in this great country. Thank you, Madam Speaker.\nORIINI KAIPARA (Te Pāti Māori—Tāmaki Makaurau) (20:12) : E te Pīka, tēnā koe. Today, the Prime Minister stood in this Whare and he painted a picture of progress: a picture of prosperity, of stability, and a so-called stronger Aotearoa. But for Māori up and down the country, in Te Ika-a-Māui, Te Wai Pounamu, and especially in Tāmaki Makaurau, that picture is a fiction—meaning it’s not real. Mum would say, “It’s all kaka.”\nWhat it is is a carefully crafted image that ignores the lived reality of whānau who have endured two years of anti-Māori, anti-Tiriti policies that strip away Māori rights, erase our reo and tikanga, and undermine every part of Te Tiriti o Waitangi. What’s despicable is that they’re OK with pushing many a whānau Māori further into crisis, and nowhere is that crisis more visible and more brutal than in housing.\nThe Prime Minister said that the Government is committed to solving our decades-long housing crisis and that we are making good progress. Let’s talk about that progress, shall we? Giving a $3 billion tax cut to landlords—is that their progress towards solving our housing crisis? Is it? Building bigger barriers for people to access emergency housing—is that progress? Selling much-needed homes to overseas buyers for holiday houses—I mean, seriously, that’s progress to ending our homelessness and our housing crisis? The only progress these kinds of policies are making is towards homelessness.\nI’ve said it before, and I will say it again and again and again until our housing and homelessness crisis is ended: the greatest breach of Te Tiriti o Waitangi is that tangata whenua have no whenua and have no homes. Homelessness, housing, and anything remotely resembling stability, security, and safety is being denied to far too many of us, and not just to Māori but to thousands—thousands—of us who call Aotearoa home. There remain over 110,000 homeless people, people without homes across our country, and more than half is made up of our future leaders. Rangatahi are on the streets. A third of homeless people are made up of wāhine Māori, many of whom are new or expectant mums, and the rate right now is increasing daily, so much so that service providers can’t keep up with the demand. Furthermore, kaupapa Māori providers who have survived severe funding cuts, just like Te Whare Hīnātore at the Auckland City Mission, are forced to reject whānau with nowhere else to go.\nHomelessness and housing is a crisis we can end overnight. There is a simple solution staring us all in the face: ghost houses—whare kēhua. We have 112,000 of them right across the country, so why not house our people first? That’s not throwing away money; that’s securing our future. Why not cut the homeless crisis at its core and prioritise our rangatahi first?\nAt the end of last year, I delivered my first member’s bill to end youth homelessness, which focuses on the cure, not the crisis. It’s not radical; it is responsible. It is not ideological; it is actually evidence-based. Not only is it by Māori for everyone; it is rangatahi-centred and rangatahi-led. It is transformational. Now, that would be real progress.\nThere are other ways to solve these housing and homelessness crises that we are faced with, but they will require real courage. It will need a Government who isn’t scared to entrench Te Tiriti across all laws and who cares more for Papatūānuku than for profit, and one Government that prioritises equity for all, including wāhine—our women—youth, our rainbow and takatāpuhi whānau, whaiora, and whaikaha. That will be the time when a Prime Minister should speak of real progress, but that time is not today.\nIt is not now, and so, on behalf of Tāmaki Makaurau and Te Pāti Māori, I will say this: we will not accept the erosion of our rights. We will not accept this. Our people deserve better. Aotearoa deserves better.\nMARIAMENO KAPA-KINGI (Te Tai Tokerau) (20:17) : Tēnā koe e te Pīka. Tēnā tātou e te Whare. Hoi anō, ka aroha ki a tātou, te kōrero tuatahi i roto i te Whare.\n[ Greetings, Madam Speaker. Greetings to those in the House. I sympathise with us all here with regard to the first speech in the House .]\nThe first thing that we have to refer to is the loss of life. It seems, from our opening earlier this afternoon, as it should be—the acknowledgments made to our whānau in Mauao, Pāpāmoa, and Mahurangi. And so we should. But what does that tell us? What might that indicate to us as Māori, as whānau, as families across the motu? Nō reira, just in that regard, ka aroha ki a tatou [ I sympathise with us all ], so my first speech today is to acknowledge and share with the House my condolences to all of our whānau across the motu, and particularly to our whānau in *Mauao and *Pāpāmoa and Mahurangi.\nI did listen with interest, as I’m sure you all did, to the Prime Minister’s statement, and I’ve listened to several as we’ve gone through the day. I just want to add my contribution to that and say this: we have reached the third and final year of this parliamentary term—yee-ha, I say. And then we reflect, as we must and as we should—we are forced to confront a very simple truth: our world has changed. So I do agree with one comment that the Prime Minister did say, which was that the last five or six years have been tough. That’s probably the only thing I might agree with.\nBut I want to add to that and say we have endured, as we all know, a global pandemic, the Christchurch mosque attack, the Whakaari eruption, Cyclone Gabrielle, and now the most recent and tragic weather events across the North Island. Globally, we have witnessed genocide in Gaza, the invasion of Ukraine, and the unfolding crisis in Venezuela.\nThese events do not pass without consequence. The fall out is real, and we carry it. This is precisely when leadership matters the absolute most—not leadership that punishes and not leadership that blames; not leadership that makes wrong the most vulnerable but leadership that stands with whānau, that stands with families, and that stands with the people, to lift them up and forward.\nYet, in the Prime Minister’s statement, he describes the Government’s response as prudent and fiscally disciplined. To make reference to discipline, I suspect that is exactly how many New Zealanders feel. They feel disciplined: disciplined into homelessness, severe, under reported, and growing; disciplined into a 5.3 percent unemployment rate; disciplined into education reforms that choke out diversity; disciplined into a housing programme that looks like it is in our prisons, and now our windows have bars on the windows. If that’s what discipline looks like and feels like, we’re screwed, “we” being the most vulnerable; I’m talking about whānau and families that are vulnerable, that are unprotected, and that are defenceless. Things aren’t looking good for the most vulnerable.\nBy the way, they might be vulnerable, but they’ve got their solutions; they’ve got their plans. They know what they want and what they need from a good Government. What they need from this House is to be listened to, to be understood, and to be worked with. As a first responder in Whangārei recently, what I saw from those who are the most vulnerable, the amount of whānau and families that came in, was that those who had the least brought the most. They brought kai, they brought towels, they brought socks, they brought taro, they brought their love, and they brought their hands, and they brought it to the marae. So what did we do? Go pick up the keys, open the marae, and make sure we can feed people and look after them.\nThese are the things that people with their own solutions and their own ideas are ready to provide. This year, we’re listening, and I’m listening, my Te Tai Tokerau. Tēnā koe. Tēnā tātou e te Whare.\nHon MATT DOOCEY (Minister for Mental Health) (20:22) : Thank you very much, Madam Speaker. How good; what a year 2026 is going to be. Can I first acknowledge you, Madam Speaker, and your news of your retirement? You will be sorely missed. We came into politics together, almost 12 years ago—such a long time ago Parmjeet Parmar was a National MP! That’s how long ago it was. You’ve been a huge advocate. You are a very proud, staunch Coaster and Mainlander, and we will miss you.\nIt is going to be, as I say, Madam Speaker, a great year, 2026. I think of my electorate of the Waimakariri, in North Canterbury. There’s a lot on the go. Of course, we are going to turn the sod soon on the start of the construction of the Woodend Bypass—tick. Boy, have we waited a long time, because, of course, it was the last National Government that announced the Woodend Bypass in 2017. The transport Minister—who was it at the time? Anybody take a guess? Simon Bridges; that’s who it was. Then that nasty Labour Government came in, and they cut it in 2018. It might even have been one gentleman who’s in the Chamber tonight. That set that project back six years. Think of the cost that it would have cost to build six years ago and now, today. That’s why I get really frustrated when I see the people I represent stuck in congestion in Woodend in North Canterbury, to think it could have been delivered under a National Government. It’s great to see that it’ll be launched and under construction this year.\nOf course, we’ve also got the Waimakariri irrigation scheme. My good friend and colleague Mark Patterson came in and announced $15 million; water storage is back, which is absolutely brilliant. North Canterbury will get reliable water storage, and that’ll be a game-changer. In a time of economic headwinds, it is our exporters, it is our primary industry, that’s leading the economic resurgence that we see being led out of Canterbury. Whether it be our sporting record or other indicators, there’s no surprise that Canterbury is leading from the front, because, of course, when Canterbury does well, the whole country does well. It’s great to see we’re backing our farmers in Waimakariri, and then, of course, we’ll be
