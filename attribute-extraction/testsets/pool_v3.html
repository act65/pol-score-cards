how are they going to pay for it? There’s a $300 million hole that has been created by that Government—$300 million hole created by that Government—of rebates being paid out over the top of taxes being collected, and they have no answers as to how they’re going to pay for it. That is just—\n\nHon SIMEON BROWN: Show us the money. They don’t know where the money is coming from, and it just shows the New Zealand public how much they don’t care when it comes to fiscal responsibility. That is why, on 14 October, New Zealanders voted for the National Party, the ACT Party, and the New Zealand First Party to get this country back on track, to fix the fiscal situation facing New Zealand. And this is only one of many fiscal holes left behind by the last Government.\nSo, as I outlined in my first speech on the first reading of this piece of legislation, the amount paid out in rebates has been $579 million, $13.5 million to administer the scheme, while only $290 million has been received from charges, leaving a hole of $302.5 million for taxpayers—hard-working taxpayers—to foot the bill.\nI ask the members opposite when they make their next speeches: what would their plan be if they were to keep this? Would they be increasing the taxes even further on utes? Is that the option they’d be taking? Is that the option they’d be picking?\nScott Willis : Yes.\nWould they say, “Oh no, we’re going to”—the Greens say yes. The Greens are very keen on more taxes on utes. They want to tax our farmers and tradies. They hate the farmers. The Greenies hate the farmers. They want our farmers gone. That is exactly what the Green Party wants. They hate our farmers here in New Zealand. They hate the productive part of our economy, which is absolutely appalling. On this side of the House, we back our farmers in New Zealand. That’s why we’re passing a range of policies to help support our farmers here in New Zealand.\nSo what they’d do—well, the Greens, they’d increase the ute tax. They think, what, $10,000, $20,000 for a ute tax? They’d probably go higher. The Labour Party—would they reduce the electric vehicle subsidy, which would make the scheme more ineffective, or would they just say, “We’ll put more taxpayer funding into it”? Well, I’m sorry to tell the Labour Party, but they have left the Government books in an absolute mess. But their answer would be to borrow more money—borrow more money from future generations to subsidise people who can already afford to buy these cars and who will continue to buy these cars and who don’t need a subsidy. That would be the choice that the Labour Party would be facing.\nOn this side of the House, we see this as a fiscally irresponsible scheme. It is inequitable for our farmers, our tradies, people with larger families needing to buy larger cars to be able to transport their children to and from school and do the things that they need to do. We actually think this scheme needs to go, and that is what this piece of legislation does.\nBut we’re also confident that there will continue to be an increased uptake of electric vehicles in New Zealand, and that is because car manufacturers around the world are switching from internal combustion engine vehicles to electric vehicles and hybrids and other low-emission technology. Battery technology is continuing to advance rapidly and at pace, and those are the types of vehicles which will be imported to New Zealand, and the choices will be made available to New Zealanders. We are confident that that uptake will continue, and we will support that uptake by continuing to invest in the electric vehicle charging network, which New Zealanders need to have the confidence to be able to buy these vehicles, to be able to get past the range anxiety, which is one of the biggest inhibitors for people actually purchasing an electric vehicle. And we’re going to supercharge that investment by supporting the private sector through deregulation where there is regulation with barriers which get in the way, by providing support to ensure that we can actually get that supercharging going.\nThat is what the role of Government is to do: invest in the infrastructure that we need rather than just in subsidies and cash being paid out—\nGrant McCallum : Ideology.\n—which is the ideological approach—the failed ideological approach—of the former Government on the other side of the House.\nSo this bill gives effect to what was committed to by the National Party, ACT Party, and New Zealand First Party in our coalition agreements. I acknowledge all of the coalition partners in their support and I thank them for their support so far in the passage through this House and their continued support as we progress this legislation through the House, and I commend it to the House.\n\nTANGI UTIKERE: Kia orana, Mr Speaker. Well, that was a concession speech if ever I heard one—that was a concession speech if ever I heard one. In my first contribution on this bill I talked about the leadership aspirations of the Minister of Transport. They are well and truly down the road, gone, because that was just a pathetic attempt from the Hon Simeon Brown to justify this Government’s attempt to move in this particular direction.\nWe had heard that this is about going back to the future. It is back to the future. This is a Government, whether it be a three-headed monster or something else, that loves to use the word “back”—backwards-focused; back whatever. This is something that clearly is back to the future.\nAgain, let’s also remind ourselves that it comes at a time when the House again is sitting in urgency to progress legislation that this new Government thinks—\nGrant McCallum : Important legislation.\nPoint of order. Mr Speaker, I note that Mr McCallum was objecting whilst he was on his feet. I appreciate that the member may not have been here for some time, but it’s a well-established convention that members need to be in place.", "window_id": "2023-12-12#93"}, {"statement_id": "45534271b806ccc2", "politician": "Casey Costello", "party": "NZ First", "side": "government", "date": "2024-01-31", "statement": "No, we don’t accept that modelling, and it was based on numbers that are not currently reflected. Hana-Rawhiti Maipi-Clarke : Given that smoking is the leading cause of premature death in Aotearoa, what is her Government’s strategy to rapidly address the inequity and accelerate smoking cessation among Māori to achieve nationwide targets?", "window": "BARBARA KURIGER: Almighty God, we give thanks for the blessings which have been bestowed on us. Laying aside all personal interests, we acknowledge the King and pray for guidance in our deliberations that we may conduct the affairs of this House with wisdom, justice, mercy, and humility for the welfare and peace of New Zealand, noting the mark of respect that some members have put in place for the rural community today. Amen.\nPetitions, Papers, Select Committee Reports, and Introduction of Bills\nPetitions, Papers, Select Committee Reports, and Introduction of Bills\n\nHon James Shaw: Sorry, just both when the prayer was being read out and then with the Clerk’s notes—I’m not sure that the sound system is operating because we didn’t pick up any of that through your mikes.\n\nHon NICOLE McKEE: Yes, 65 percent of firearms seized by police in 2023, and 62 percent of firearms seized in 2022 had no recorded serial number. This suggests that criminals are using firearms that are either illegally imported, manufactured, or intentionally stripped of serial numbers, making them untraceable. The firearms registry would be unable to capture these illegally held or manufactured firearms.\nCameron Luxton : What other data has she seen?\nNinety-four percent of people who were present at or subject to a search by police in which firearms were seized last year did not possess a firearms licence. The gangs and criminals are carrying and using firearms illegally, and they’re circumventing the firearms registry. Licensed firearms owners are not the problem. That’s why the Government is committed to targeting firearms illegally held by the gangs.\n\nHon Dr Duncan Webb: Will the Minister bring an open mind to her review of the firearms registry, or has she an utterly predetermined approach to the usefulness of it?\n\nHon NICOLE McKEE: The intention of the review is to be able to look at all data that is presented to those that are reviewing it. That would be an open mind.\nCameron Luxton : Why has this Government committed to reviewing the firearms registry?\nThis Government has—in the ACT and National coalition agreement—committed to reviewing the firearms registry, starting before June 2024. The registry needs to be evaluated to determine whether it is improving public safety, in comparison to other options such as targeting illegally manufactured or imported firearms. We also need to determine if any changes to the registry could make it more effective in preventing firearms from falling into the hands of criminals. A comprehensive review will improve insights into the effectiveness of the current registry.\n\nHon CASEY COSTELLO: The Government is committed to the smoke-free target of less than 5 percent of people smoking daily by 2025. Our plan is to repeal the 2022 smoke-free amendments that have not yet taken effect, namely reduced retailers, denicotisation, and prohibition to those born from 2009. We will also build on what currently works and is behind the recent dramatic decrease in smoking, and continue to work to prevent young people from starting smoking and vaping. In particular, we will work at education and cessation programmes, access to alternative products to aid quitting, and regulating access to related products. What’s also important is that measures are targeted to individuals and communities that will benefit the most.\nTanya Unkovich : What particular challenges does the Government need to address to achieve this smoke-free target?\nNew Zealand has done very well in reducing smoking. As of mid - last year, we were down to 284,000 daily smokers from 573,000 ten years ago. Smoking is nowhere as prevalent as it was and we’re dealing with a much smaller group, which is great news. The problem is we are dealing with a remaining group of long-term smokers who are addicted to nicotine, so we need an approach that focuses on them and understands their needs and helps them to quit. The progress we have made means there are clearly some current measures, such as vaping, that work, and I want to build on this and any other practical steps such as other products used around the world and targeted programmes that will help people stop smoking.\nTanya Unkovich : Are there considerations other than health outcomes that the Minister needs to consider?\nImproving health outcomes is extremely important. However, all Government policies need to be able to work and they need to consider real-world impacts. We can’t just wish for good outcomes. That means we need to address the real problem we face, which is that current smokers are addicted to nicotine and we need to help them to quit rather than moving to a prohibitionist regime. Cutting supply doesn’t equate to reducing demand, and the last Government’s planned approach was also going to have consequences for retailers, crime, and the growth of the black market.\n\nHon Mark Mitchell: I thought the question was over. But if there’s a supp, I can wait till after the supp.\n\nHon Dr Ayesha Verrall: With respect to the member’s proposals for other regulated products, are there any of those that would not increase the availability of tobacco and the profits of tobacco companies among her proposals?\n\nHon CASEY COSTELLO: At this stage, there are no proposals, and I’m seeking advice broadly on a range of issues.\nTakutai Tarsh Kemp : Does she accept the Government’s modelling that suggests Māori will not reach the 5 percent national target of smoking prevalence until 2061?\nNo, we don’t accept that modelling, and it was based on numbers that are not currently reflected.\nHana-Rawhiti Maipi-Clarke : Given that smoking is the leading cause of premature death in Aotearoa, what is her Government’s strategy to rapidly address the inequity and accelerate smoking cessation among Māori to achieve nationwide targets?\nWe’re completely committed to targeted programmes rather than the blanket approach of the previous Government and will focus on those groups with the greatest need.\n\nRt Hon Winston Peters: Is it the Minister’s position that behind this policy is the wisdom of not imposing $8.6 billion of taxation upon Māori since 2011 when it comes to cigarette smoking or having people beaten up at supermarkets on a daily basis in ram raids, all sorts of illegalities, or the black market, but by following this policy we have taken ourselves to number one in the world?\n\nHon CASEY COSTELLO: Yes, I completely agree with the Deputy Prime Minister.\nQuestion No. 11 to Minister, 30 January—Amended Answer\n\nHon MARK MITCHELL: Point of order, Mr Speaker. I seek leave to make a personal statement to correct answers given during question time yesterday.\n\nHon MARK MITCHELL: In answer to supplementary questions on question No. 11, I stated that the Government’s policy was for the 500 additional police to be delivered over the course of the term, which is three years. I should have been clearer: the Government’s policy is to deliver 500 new police in the first two years of the term. I was reflecting the significant challenges that Police face to drive that recruitment, but the Government is firmly committed to delivering on this target.\n\nHon DAVID PARKER: Point of order. Mr Speaker, I would ask you to reflect on whether corrections of answers are to correct misinformation that is given to the House or to reflect a change of position taken by a Minister. That was not an appropriate use of a correction of an answer.\n\nRt Hon CHRISTOPHER LUXON: Yes, and particularly given it’s back-to-school week, we actually stand by all of our actions, as I said yesterday, on education. Sadly, this has been a former Government that left us with 55 percent of our kids not going to school regularly. We want to call on all parents to make sure they get their kids to school this week so we can teach them the basics—an hour of maths, reading, and writing starting this year; a mobile phones ban; and an expert panel reviewing primary and intermediate school curriculum.\n\nRt Hon Chris Hipkins: How can Mark Mitchell have been confused yesterday, when he said on Monday: “Realistically, 500 new staff over the next three years is what we’re aiming for.”; he said on Tuesday, “The Government’s policy is to deliver 500 additional officers over the term of this Government, which is three years.”; and claimed previously that there had been a meeting in December of the three governing parties where they agreed to change the target from two years to three years?\n\nRt Hon CHRISTOPHER LUXON: There is no ambiguity around the target. We’re going to have 500 additional police in two years, and the Minister clarified that in his statement just before.\n\nRt Hon Chris Hipkins: So was there a meeting in December amongst the three governing parties in which changing the target from two years to three years was discussed?\n\nRt Hon Chris Hipkins: Does he stand by his answer yesterday that he’s not aware of the Government requesting advice on freezing tobacco excise, given Casey Costello’s answer to question No. 9 yesterday that she had requested that advice?\n\nRt Hon Winston Peters: Point of order. That is deliberate misinformation by Mr Hipkins. That was clarified in points of order yesterday and he’s back today, having ignored that, seeking to assert a falsity the second time around.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. I’d encourage you to go and review the Hansard of the answer that was given yesterday where the Minister did answer to the question: “Yes.” The word “yes” was the very first part of her answer to the question that was asked by my colleague Dr Verrall.\n\nRt Hon Chris Hipkins: I’ll ask the question again. Does he stand by his answer yesterday that he was not aware of the Government requesting advice on freezing tobacco excise, given Casey Costello’s answer to question No. 9 yesterday that she had requested the advice?\n\nRt Hon CHRISTOPHER LUXON: I was asked if the Minister had sought advice, I answered that I was not aware that she had, which was the case.\n\nRt Hon Chris Hipkins: Does he stand by his statement that Casey Costello “would have given a bunch of different party policy documents to her officials.”?\n\nRt Hon CHRISTOPHER LUXON: That is what I subsequently have understood since question time yesterday. Her office has clarified her approach, and that’s what I articulated this morning in media.\n\nRt Hon Chris Hipkins: Can he assure this House that no person affiliated with the tobacco industry was involved in developing or writing those party policy documents that were given to officials?\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. If a Minister gives party policy documents to officials, then the Prime Minister is absolutely responsible to that. Documents given by Ministers to officials, they are, effectively, instructions from Ministers to their officials. The Prime Minister and Ministers are absolutely responsible for that.\n\nRt Hon Chris Hipkins: Can he assure this House that no person affiliated with the tobacco industry was involved in developing or writing those party policy documents?\n\nHon Chris Bishop: Point of order, Mr Speaker. We’re into some difficulty here. We are getting into difficulty here, because although Mr Hipkins is of course completely correct that documents that are given to officials on behalf of the Government are the responsibility of Ministers, the creation of documents in a political party sense is not the responsibility of the Prime Minister. In particular, even in his capacity of leader of the National Party, he is not responsible for those if it’s related to a three-party Government. So we are getting into difficulty here, and there’s also the issue of awareness of all of that as well—so how on earth would the Prime Minister be able to comment with any degree of veracity around that?", "window_id": "2024-01-31#0"}, {"statement_id": "af4e76f61cc124bd", "politician": "Tim Costley", "party": "National", "side": "government", "date": "2024-02-14", "statement": "Just this week, on Monday, I was meeting with our local police, and they were telling me that 70 percent of their time is taken up—at least 70 percent—just with domestic violence and mental health now.", "window": "DEBBIE NGAREWA-PACKER: Kia ora. First of all, I’d like to confirm that Te Pāti Māori will be supporting this bill. We’ll be supporting this bill because it is simple and practical. We also note that the founder of this bill, our colleague Minister—gosh, I had better remember: Matt—Matt is one of the good dudes on this side. And even though I called him Chris Luxon for much of the last three years, we must give credit where credit’s due.\nI think one of the things that Matt has done is he’s absolutely shared vulnerability and made it OK, and I think it’s really important that we help to destigmatise and use our sphere of influence in the right way. Another thing he did was he reached across cross-parties for engagement, even though one of those cross-parties only had two MPs at times. It mattered. And this is something that really matters to us.\nAnd Te Whare Tapa Whā, which I’m sure many here in the Whare will know, is that we must prioritise mental health alongside every other health objective. So I’ll get that bonding out of the way with you, Matt. It probably won’t happen with you guys ever again, so let’s enjoy it!\nBut we do have our w’ānau who are desperately in need of help, and they’re in need of us to be able to understand and draw bridges across the systems and use legislation at times to help. So we totally agree with the Green Party’s view that there must be an overhaul in our Mental Health Act and, in fact, the system.\nSadly, what we have seen is a prevalence of mental distress amongst Māori, and we are 50 percent higher affected than non. Māori are 30 percent more likely to go undiagnosed than anyone else in Aotearoa. And our rangatahi suicide rates are beyond any imagination of what it is that we must think about in our solutions.\nI want to share, while we’ve got this opportunity, which is why Te Pāti Māori’s health policy—and I don’t want to make this about pitching for our health policy—\nCarl Bates : But you’re going to.\n—but the reason we specifically talked about—be quiet, Carl—our kaupapa Māori mental health service is because we know we have such dire issues. And our dire issues require us to actually take a really unique view. So we believe we’ve got to work together, but until we can address the inequity and the issues that we have, we believe that we must have a kaupapa mental health service so our mental wellbeing becomes something prioritised first.\nAnd it was something we really talked about when the Pae Ora legislation came out. Part of that was adopting and delivering recommendations from He Tapu te Oranga o ia Tangata: Suicide Prevention Strategy. And I know, Matt, that you will know a lot about that—Minister, sorry—and also that we talked about providing free mental health services in every community. So we all know the number—1737—but it’s not always accessible when digital equity is an issue in a lot of rural areas. We also talked about the fact that we need desperately to be able to normalise and make accessible that our w’ānau get tautoko and awhi when they need it and how they need it, by those they recognise and by those they can relate to.\nSo a Māori mental health approach must be different. It must be different because our dire and our desperation is so much worse than everyone else. That is not asking for a separatist system; it’s actually asking for a targeted approach to stop the horror that we see going on. And I really appeal that, as a follow-up, we continue to focus on what some of those solutions will look like.\nLook, I want to say a couple of other things before we conclude. We are in dangerous land of some of our rhetoric as we tension ourselves between whose way is right or wrong. And I can’t say this enough: Te Pāti Māori’s neither left or right; we’re Māori, first and foremost. And with some of the language, the Tiriti principles bill, the smoke-free environment, and the belief that there is an anti-Māori agenda going on out of this House, we fear that we’re creating harm. And so we will continue to support movements that appeal for unity.\nSo I just want to say, yep, finally that we do support this bill. We caution on all our responsibilities that we have to make the world a better place, but particularly when it comes to our mental health. So ngā mihi, and I’m really pleased, Matt, that I didn’t call you Christopher Luxon once in this whole speech. Kia ora rā.\n\nTIM COSTLEY: It’s a pleasure to speak in support of this bill in the name of my good friend and colleague Katie Nimon. It’s really pleasing to see her pick up the ball and run with it, passed from the very safe hands of National’s new Minister for Mental Health, the Hon Matt Doocey. He’s done great work in this space. I just want to acknowledge that on the many occasions he’s come and visited my electorate when we visited the local youth one-stop shops, we’ve held public meetings, actually one of the first things that he has always acknowledged is that this is one area that, across the House, people work on together. He’s always acknowledged the cross-party work in mental health, and we’ve heard that from almost all the speakers today. I think that’s really admirable.\nYou know, so often the snapshots that get put on TV shows are the heated moments; they show the tension—actually, I don’t know that that’s great for people’s mental health, to be fair—but it doesn’t capture some of the real meaningful work that takes place. I want to commend not just Matt but all of those across the House who have contributed to this, and particularly some of the contributions today. You know, to hear the Greens and ACT speaking together on the same topic, New Zealand First and Te Pāti Māori, I think is really encouraging.\nI wonder if this is actually not the time for politics. What if this was just one of those moments? There will be lots of days this year, there will be lots of questions, there will be lots of speeches, there’s lots of times to heckle and get in the shots, the witty comments—they’re fantastic, but is this the issue to do it on? I just wonder if this is the moment that we can actually show some leadership across the House to New Zealand on this issue, that, actually, this is one thing that we can unite on. I heard the criticism about sloganeering—you know, it could do more.\nFrankly, I think it’s great to see this happening, because two years ago this was apparently a step too far for the House. Actually, I think words matter. I think the change is meaningful. I think it matters that we are role modelling, we are demonstrating to the people of New Zealand that we care, that this matters, that this is important. It’s important enough to National to have the first Minister for Mental Health. It’s important enough to this House to put through a bill that says, actually, mental health is important in our strategy; listening to the advice of the Mental Health and Wellbeing Commission is something that we want Ministers to take note of.\nI won’t be the only person in this room today that in the last six months has been at a funeral of a friend who’s made a terrible decision. I won’t be the only person in here today who’s been supporting someone or who has supported someone struggling with mental health, who has walked next to them. There will be those who will have even more, perhaps, darker experiences than me. That’s really important.\nBut this is something that we can’t afford to pass by, not in this moment. Just this week, on Monday, I was meeting with our local police, and they were telling me that 70 percent of their time is taken up—at least 70 percent—just with domestic violence and mental health now. This is a huge issue in our community. I speak with social workers. I spoke with a doctor from Victoria University—90 percent, she reckons, of the issues they are seeing now in our young people are mental health. Making even small, symbolic changes is still meaningful, and it’s worth it.\nI think of Raechel and the team at Kāpiti Youth Support in Paraparaumu, in Kāpiti, in my district—the amazing work they do as a youth one-stop shop. I think about Glenn and the youth one-stop shop in Levin, in Horowhenua, and their amazing work. I’m really fortunate that I have two in our electorate—two of just 10, I think, around the country—showing them that, actually, we care; that, actually, this matters; that, actually, their contributions are valued; that this is a meaningful first step.\nTo hear criticism that we’re not doing anything in the first hundred days, and yet here we are in the first hundred days, saying, well, we’re actually not going to let this go past and we’re not going to make this a political thing. We have the opportunity to all join together, to all take some steps forward together.\nSo let’s finish. This is not about me; this is about people who I have seen, their work in the community; people who have struggled—it’s about them. So let me finish with a couple of quotes from the experts. We heard from the Mental Health and Wellbeing Commission when they criticised the 2022 bill, talking about mental health being—and I quote—“almost invisible within [it].” They wanted more explicit referencing. The Mental Health Foundation said it showed an—this is a quote—“absence of any ownership [or] leadership”. Well, we have the opportunity today to show that ownership, to take some leadership, and do what the Mental Health Advocacy and Peer Support Trust said, to have the Minister give regard to the advice from the commission, to bring this forward, to bring mental health into the Act. That’s why I’m supporting this bill and commending it to the House.", "window_id": "2024-02-14#20"}, {"statement_id": "460f160e9b4d2b9f", "politician": "Simon Watts", "party": "National", "side": "government", "date": "2024-03-19", "statement": "Similarly, Health New Zealand has taken over contact tracing from the Ministry of Health. Inland Revenue shares information with the Ministry of Health to help make more efficient processes and procedures; however, that arrangement cannot continue for the purpose of the legislation enabling such sharing of information for Health New Zealand as it was not referred to as a Government agency.", "window": "Hon DAVID SEYMOUR: Well, currently, Pharmac waits until Medsafe has completed its assessment before it begins a funding assessment, unless the treatment is in relation to cancer. Doing both the regulatory assessment to see if it’s safe at Medsafe and the funding assessment to see if it is a good use of taxpayer funds at Pharmac at the same time is common sense. It’s a change that costs nothing but it will help Kiwis in need by shaving up to nine months off the approval process. It will also bring us into line with countries such as Australia and Canada, which do it and have been doing it exactly the way that we now will.\nTodd Stephenson : Has he seen any reports of any risks to access to medicines for New Zealanders?\nYes. In fact, I have been looking at Budget documents that show that Pharmac’s funding over the next three years was left by the previous Government as reducing by several hundred million dollars each year for the next four years. In total, to maintain the level of pharmaceutical funding that New Zealanders are used to, the Government would have to find nearly $2 billion of extra funding over four years, and that is something that this Government is now working very hard to do in challenging economic conditions.\nTodd Stephenson : What steps is he taking to ensure even more access to medicines for New Zealanders?\nThe coalition Government is based in part on an ACT-National coalition agreement which contains a commitment to updating the rules for Medsafe to speed up the processing of new medicines for regulatory approval to within 30 days if two recognised overseas regulators have already approved it. It is to design and publish a medicines strategy and to update Pharmac’s decision-making model to ensure that it appropriately accounts for patient voice.\nUrgent Debates Declined\nDisability Funding—Purchasing Rules\n\nHon KIERAN McANULTY: Point of order, Mr Speaker. Thank you, Mr Speaker. We accept that. The concern that I have, however, is that there is still no requirement for the Government to accept the proposals from the Opposition on the topics and portfolios which will be debated during the annual review debate, so this House can’t be assured that the opportunity to debate this will be given during the annual review debate.\n\nHon NICOLA WILLIS: I move, That the Appropriation (2022/23 Confirmation and Validation) Bill be now read a first time.\nBill read a first time.\nBills\nTaxation (Annual Rates for 2023-24, Multinational Tax, and Remedial Matters) Bill\nSecond Reading\n\nHon SIMON WATTS: I present a legislative statement on the Taxation (Annual Rates for 2023-24, Multinational Tax, and Remedial Matters) Bill.\n\nHon SIMON WATTS: I move, That the Taxation (Annual Rates for 2023-24, Multinational Tax, and Remedial Matters) Bill be now read a second time.\nThe purpose of this bill is to set the annual rates for income tax for the 2023-24 tax year. The bill also makes proposals to improve the current settings for a broad based - low rate framework. Public consultation is an important part of the tax development process and it is also equally important to the parliamentary process.\nAs reported back from the Finance and Expenditure Committee, the bill contains a range of adjustments as a result of public feedback. These adjustments have strengthened the bill, and I wish to acknowledge the members of the Finance and Expenditure Committee across the House for their input into this bill.\nI would like to briefly touch on the more significant changes that have been made to the bill since its introduction. The centrepiece of the bill is a measure aimed at reducing the benefit to multinational corporations of profit shifting. Under the existing setting, some countries have attempted to attract economic activity by offering multinationals low effective income tax rates. This is particularly problematic when the income is from cross-border capital investment or the use of intellectual property. It has helped contribute to base erosion and profit shifting, where a multinational can achieve low or even no taxation by shifting their profits to low-tax jurisdictions.\nTo tackle profit shifting, the OECD has led the development of a global minimum tax, the GloBE rules, which ensures that large multinationals at least pay 15 percent tax on their mobile income where it is earned. Adoption of the GloBE rules by a critical mass of countries will help reduce the profit-shifting pressures on countries like New Zealand with higher corporate tax rates without preventing the use of tax incentives to attract real investment. Now that it is clear that a critical mass of countries will be adopting these GloBE tax rules, we are proposing in this bill to enact dates for its imposition by the New Zealand Government. On 1 January 2025, the income inclusion rule and under-taxed profits rule will be enacted, and on 1 January 2026, the domestic income inclusion rule will be enacted.\nThe GloBE rules are extremely complex. Rather than enacting them directly into our legislation, we are proposing law that will make sure that these rules are modelled through and developed in effect with the OECD countries along with New Zealand. This is the best approach to ensure that our rules are internationally consistent while keeping the Government’s implementation and administration costs low. Crucially, future Governments remain free to disapply any future updates to the OCED’s commentary or guidance on the GloBE rules which affect their application, so there’s no loss of sovereignty involved.\nAnother significant measure in the bill is the trustee tax rate proposal. Following consultation and public submissions, we have made a number of adjustments to this proposal. While most trusts will be unaffected by the proposals in the bill, there did remain a risk of over-taxation of trusts with lower-rate beneficiaries and settlors. That is a crucial point because over-taxation can’t be determined by looking at the income earned by the trust, but only by reference to the income of settlors and the beneficiaries in the trust.\nInland Revenue estimates that there are at least 400,000 trusts. In 2022, approximately 76,000 trusts paid taxes at the trustee tax rate. To help mitigate the risk of over-taxation, we are proposing a $10,000 trustee income de minimis. This will mean that a further 27,000 trusts will not be affected by the 39c tax rate. Based on this, only 12 percent of all trusts would be affected by the 39c tax rate. This reduces the risk of over-taxation while also addressing the vast majority of the under-taxation of trustee income. Trusts in estates with up to $10,000 in trustee income in an income year would continue to be subject to the 33 percent tax rate. Trusts with over $10,000 in trustee income in an income year would be subject to the 39c tax rate on all income. At the committee’s recommendation, disabled beneficiary trusts would be taxed at 33 percent instead of a 39 percent personal tax rate.\nWe are also simplifying and expanding the proposals relating to estates. An estate would continue to be taxed at 33c in the dollar for the year of death, plus a further three years. We’re also making sure that energy consumer trusts and legacy superannuation funds are excluded from the 39c tax rate.\nThe committee also made a number of recommendations to improve the fairness, certainty, and consistency of tax treatment. For instance, to improve the current proposal on the tax treatment of backdated lump-sum payments from ACC and Ministry of Social Development, the committee recommended including backdated lump-sum payments for attendant care, and related to the Cyclone Gabrielle in North Island flooding event relief measures, the committee made a number of recommendations, including adding the August 2022 Nelson flood buy-out to the list of events covered, by turning off the brightline and other timing tests.\nThe committee was also concerned at the potential for overreach in the proposed charities and the deregistration tax integrity measures. They therefore recommended providing relief when assets are transferred to other New Zealand tax resident exempt entities and deferring the application date. Along with these, there are a number of other smaller policy matters which have been suggested by policy officials in response to issues brought to them by third parties. This is good news. It shows that the Inland Revenue is working in collaboration with the private sector and with the wider Public Service in order to improve efficiency. An example is the new proposal relating to the Ministry of Disabled People.\nDistrict health boards and the Ministry of Health had historically made direct funding for disability support payments to their clients. The Income Tax Act provides an income tax exemption for these payments. However, due to an oversight, the exemption was not correctly updated to reflect the fact that the newly established ministry was now responsible for administering some of the direct funding disability support payments. This means that those support payments won’t technically meet the requirement for the exemption. The remedial amendment makes these payments exempt and has retrospective application to July 2022, as these payments were always intended to be exempt.\nSimilarly, Health New Zealand has taken over contact tracing from the Ministry of Health. Inland Revenue shares information with the Ministry of Health to help make more efficient processes and procedures; however, that arrangement cannot continue for the purpose of the legislation enabling such sharing of information for Health New Zealand as it was not referred to as a Government agency. For the purposes of information sharing, the bill therefore proposes adding Health New Zealand to the definition of a Government agency.\nAnother adjustment to the bill is a proposal to provide more certainty to the early payment discount offered by the IRD. This intends to encourage businesses to pay their taxes in the first year. Inland Revenue applies interest to unpaid tax bills, which is known as the use of money interest. That interest charged depends on the economic conditions of the entity. The application rate for this discount has moved more often than was envisaged in recent times, and due to economic conditions, this has created uncertainty for taxpayers and has undermined the ability of an early payment discount to incentivise voluntary tax payment by businesses in their first year. To maintain this incentive, the bill proposes tidying up and ensuring the early payment discount rate for the use of money interest at 31 March of the preceding income year. This would be applied to the 2024-25 and later income years.\nAs you can see, this is a comprehensive, complex, and detailed tax bill. There have been significant changes and modifications as a result of the Finance and Expenditure Committee working across party lines in order to listen to feedback from a large number of people making consultation and inputs into this bill. It is important to note that many of these changes that were made by submitters to the select committee have been very carefully and diligently considered by the select committee and, as a result, have been reflected in the bill which we are tabling in this House today. That is an appropriate use of parliamentary time. That is an appropriate mechanism, and it is a good example of how legislation can and should be improved by a select committee process, and, again, I acknowledge those members of that committee for their contribution. I commend this bill to the House.\nASSISTANT SPEAKER (Greg O’Connor) The question is that the motion be agreed to.", "window_id": "2024-03-19#5"}, {"statement_id": "577fce3a6ca325a4", "politician": "Chris Bishop", "party": "National", "side": "government", "date": "2024-05-02", "statement": "Sorry, can the member repeat that question? I couldn’t hear the start of it. Dr Lawrence Xu-Nan : Certainly. Has cultural competency been removed from professional development priorities for teachers, and, if so, why?", "window": "Hon SHANE JONES: It will recalibrate—that’s enough from the DIY over there. This is about ensuring that the New Zealand economy can rely upon a secure supply of gas for as long as it’s possible. The naive wokeism, the juvenile understanding of economics that drove the stigmatisation of the gas industry has disappeared, no longer to be seen anymore.\nAndy Foster : What announcements is he planning to grow New Zealand’s mineral exports?\nLater this month, I shall be going to the birthplace of the Labour Party. I shall be reacquainting the Labour Party with their historical ideological roots, long since abandoned. Because I am announcing—\n\nHon Dr Duncan Webb: Point of order. This kind of rhetoric from that member where he’s continually taking swipes at the Opposition, which were entirely unnecessary for him to have answered the question—it’s entirely out of order.\n\nHon SHANE JONES: Of course, I’m talking about Blackball on the West Coast. It’s not my fault that the member’s ignorant about whakapapa; it’s the birthplace of the Labour Party. That’s where I shall be announcing the Government’s strategy on mining, which will contribute to the export-led growth trajectory. Please don’t be a stranger to history, Doctor.\n\nRt Hon Winston Peters: Could the Minister tell us what he and his department are doing about the irony of importing so much inferior Indonesian coal while not using our own, and thereby placating our so-called green woke conscience?\n\nHon SHANE JONES: Recently, the CEO of Genesis Energy has stated that because of the parlous situation pertaining to natural gas—destroyed by an unwise foolish decision four or five years ago—there is going to be ongoing reliance on coal. We have coal under our feet. The Indonesian imports will continue to grow for as long as there is uncertainty in the gas industry—worsened by the naivety over there, and, sadly, aided and abetted by my erstwhile colleagues on the other side of the House.\nQuestion No. 11—Environment\n11. Hon RACHEL BROOKING (Labour—Dunedin) to the Minister for the Environment: How is she ensuring that environmental decisions are being considered across Government?\n\nHon PENNY SIMMONDS: In a range of ways. I’m on the Resource Management Act ministerial group. I consult with my ministerial colleagues on matters relating to my portfolio. There are bilateral meetings with Ministers with cross-over portfolio responsibility. I meet regularly with the Iwi Chairs Forum to discuss matters relating to my portfolio. I regularly meet with stakeholders across New Zealand. I’m involved with all ministerial groups that matter for the environment, and we are having appropriate conversations as a Government about the environment.\n\nHon Rachel Brooking: Has she read the submissions from the Environmental Defence Society and Forest & Bird on the Fast-track Approvals Bill?\n\nHon PENNY SIMMONDS: There will always be a range of opinions, but this Government, unlike previous Governments, believes we can both grow the economy and protect the environment. We can build things, we can grow things, and we can protect the environment.\n\nHon Rachel Brooking: Has she asked for advice on any of the submissions on the Fast-track Approvals Bill from the major environmental non-governmental organisations that represent tens of thousands of New Zealanders?\n\nHon PENNY SIMMONDS: It is going through the select committee process, they are making submissions, and they are speaking in the media about their submissions. We are hearing those submissions.\n\nHon Rachel Brooking: Given that she is hearing those submissions, has she raised the environmental concerns of environmental non-governmental organisations to the Ministers responsible for the Fast-track Approvals Bill?\n\nHon PENNY SIMMONDS: The bill is going through the select committee process. Submissions have been made. The select committee will, I’m sure, bring a report back to this Government.\n\nHon Rachel Brooking: Does she agree with the Rt Hon Simon Upton, the Parliamentary Commissioner for the Environment, that the proposed Fast-track Approvals Bill poses significant environmental risks because, amongst other things, it deprioritises the environment and the role of the Minister for the Environment?\n\nHon PENNY SIMMONDS: This Government is going to manage both economic growth and protecting the environment. The fast-track consenting process is going through a process. There are submissions being made for and against, and they will be looked at—as they should be.\n\nHon Rachel Brooking: Given that answer around the balance, isn’t it therefore the case that she, as the environment Minister, is doing nothing to ensure the environment is being properly considered by the fast-track legislation?\n\nHon PENNY SIMMONDS: No.\nQuestion No. 12—Education\n12. Dr LAWRENCE XU-NAN (Green) to the Minister of Education: What advice, if any, has she had on the impact of Ministry of Education job cuts on Māori and Pasifika students?\nHon CHRIS BISHOP (Minister of Housing) on behalf of the Minister of Education: Job cuts at the ministry are an operational matter. However, the Minister has received assurances that the ministry is not making cuts that directly impact services to children. Closing the gap for Māori and Pasifika students is a priority for this Government. That’s why I’m very proud today: we’ve announced $67 million in new funding for the implementation of structured literacy—going back to basics. We are committed to delivering better public services, especially for children who are too often let down and left behind by our education system. Take, for example, Maramarua School, which has seen incredible results for their Māori students with structured literacy. In 2021, only 37 percent of their students were at or above curriculum level for reading. By the end of 2023, as a result of adopting structured literacy, it was 68 percent. That is evidence-based results for children who need it most.\nDr Lawrence Xu-Nan : Has cultural competency been removed from professional development priorities for teachers, and, if so, why?\n\nHon CHRIS BISHOP: Sorry, can the member repeat that question? I couldn’t hear the start of it.\nDr Lawrence Xu-Nan : Certainly. Has cultural competency been removed from professional development priorities for teachers, and, if so, why?\nOn behalf of the Minister, we are putting knowledge back into the curriculum and we are adopting a back to basics approach when it comes to the teaching of reading and maths.\nDr Lawrence Xu-Nan : Has Te Hurihanganui programme team to address racism been disestablished, and, if so, will this work be continued elsewhere?\nOn behalf of the Minister, I can’t comment specifically about that programme, but what I would say is the single best thing we can do for underachieving Māori and Pasifika students in our school system is develop a knowledge-rich curriculum and go back to the basics and end the 30-year experiment on our children that has involved experiential learning, play-based learning, and other such activity that has failed a generation of children when it comes to literacy.\nDr Lawrence Xu-Nan : What alternatives will she put in place to bridge the achievement gap between urban, regional, and rural schools after the ministry’s cuts to regional service roles?\nOn behalf of the Minister, the Minister has made clear her priorities in education, which involve a back to basics approach and teaching the basics brilliantly, including refreshing the curriculum so it is based on knowledge and facts, not nonsense, and adopting structured literacy, which will be a game-changer for children in urban, rural, regional New Zealand and, indeed, of every ethnicity.\nTangi Utikere : Kia orana, Mr Speaker. How can Pacific communities have any confidence that her Government is adequately resourced to actually understand the specific needs of Pacific learners and their families when she is reducing resources in an area that seeks to meet and understand that specific need?\nOn behalf of the Minister, because, unlike the last Government, we don’t measure success in education by how many bureaucrats are hired at the Ministry of Education; we measure it by the results that children achieve. If there was a connection between student achievement and the number of bureaucrats in the Ministry of Education, we would have seen better results over the last six years. In fact, we hired hundreds of extra staff at the ministry, including in the specific areas the member talks about, and children’s results went backwards. We are focused on changing the curriculum, going back to basics, and redressing the appalling imbalance in results in our system.\n\nRt Hon Winston Peters: Point of order. There is no way that that sort of shouting from the Opposition benches, all in concert so that the answer from the Minister could not be heard, is in any way remotely acceptable. And please, sir, if this is going to go on, I think we need a new set of rules that those who can keep their counsel are allowed here and the rest are just moved from our Parliament for the time being until they learn how to behave themselves.\n\nHon CHRIS BISHOP: On behalf of the Minister, the Minister of Education meets with principals and schools and families at those schools, and students, all the time, every week. As she revealed earlier in the week, she is in constant contact with principals of all ethnicities—Māori, Pacific, European, Asian, and others—right around the country. This is a Minister who gets out and about and does the job and is committed to lifting educational achievement because the single best thing we can do for Pasifika children in this country is have aspiration for them rather than have a poverty of ambition and decide that because they are Pasifika, they are condemned to failure. We have higher aspirations for our Pasifika children.\n\nHon CHRIS BISHOP: On behalf of the Minister of Education, services and roles that directly impact services to children are not being cut. There are changes being made at the Ministry of Education, but the Government’s strong investment in a knowledge-based curriculum, delivering the basics brilliantly, going back to basics, will endure, and, I believe, will make a real difference for young people all around the country.\nAnnual Review Debate\nIn Committee\nDebate resumed from 1 May on the Appropriation (2022/23 Confirmation and Validation) Bill.", "window_id": "2024-05-02#3"}, {"statement_id": "63e1ee9ffbbe6e14", "politician": "Tom Rutherford", "party": "National", "side": "government", "date": "2024-07-23", "statement": "New Zealand National 49; ACT New Zealand 11; New Zealand First 8. New Zealand Labour 34; Green Party of Aotearoa New Zealand 14; Te Pāti Māori 6; Tana.", "window": "Hon MARK MITCHELL: Well, I think it’s very irresponsible for the member to come into this House and tell the country that Police have said they are withdrawing from family harm incidents. That is not true. Police will always have a role, and they will always respond to family harm incidents that involve domestic violence or where there is clearly an offence being committed. But I can tell the member that I was on night shift myself in Auckland recently, where police were called to a job where it was a mother and a daughter arguing over an iPhone charger. Now, I’m sorry; having uniformed police officers standing in someone’s lounge room trying to settle an argument between a mother and daughter over an iPhone charger is not a good use of police time. There are other agencies that will step up and deal with some of those issues. I want police back on their core business. I want police doing the job so that when members of the public put their hand up and they want help, there are police officers who are able to respond to them instead of having to deal with all the social issues that this country has, and there’s a much better response for a lot of those people from other agencies, and not the Police.\n\nHon Ginny Andersen: I seek leave to table the Official Information Act document I’ve received, that’s not publicly available, that stipulates Police advising the Minister of Police that there is risk of loss of life if police pull out of family violence call-outs without partner agencies being in place.\n\nHon Dr SHANE RETI: The Government appointed a Crown observer in December, given our longstanding concerns about the implementation of the health reforms that created Health New Zealand. The Crown observer has highlighted numerous issues to me, including a lack of focus on the current financial situation, particularly in the hospital sector. Hospitals are a critical sector in the health system and is one reason why this Government has taken significant action by appointing a commissioner to ensure all New Zealanders get timely access to quality healthcare.\nHūhana Lyndon : How will slashing up to 3,000 jobs from the organisation that employs doctors and nurses help to get more doctors and nurses on the front line to serve our people?\nThe commissioner has expressed that we will streamline the back-office staff that are not directly patient facing so that we can redistribute funds towards the front line and deliver better outcome for New Zealanders.\nHūhana Lyndon : Does he accept that the overall health Budget funding has actually reduced by 4.5 percent per capita, and, if so, will he increase funding to sustainable levels so that our health system isn’t on its knees?\nWhat I accept is the biggest contribution to health of roughly $16.67 billion across three Budgets in our last Budget.\nHūhana Lyndon : Does he really think that a relentless focus on cost savings for our new commissioner is what he should be looking for when our health system is chronically underfunded and does not deliver for those who are most in need?\nWhat I think is that it’s important to deliver timely access to quality healthcare for New Zealanders to improve life expectancy and quality of life.\nHūhana Lyndon : What will he say to senior doctors this weekend at the GP conference who have told us this morning that they are doing administrative tasks themselves because the back-office staff reductions at Te Whatu Ora are impacting them?\nWhat I will do is thank them for their work and tell them that this Government backs them and that we’re looking at ways to ameliorate some of the issues that they’re raising with us. That’s what I’ll say to them.\nHūhana Lyndon : Will the Minister make a promise to New Zealanders right now, in this Whare, that he will never prioritise any part of our public health system?\nThe Government policy statement, which I’ve announced, explores a wide range of actions that this Government will take, including what that member is asking now.\nSittings of the House\nSittings of the House\n\nHon CHRIS BISHOP: I move, That the sitting of the House today be extended into tomorrow morning for the second reading of the Local Government (Electoral Legislation and Māori Wards and Māori Constituencies) Amendment Bill; the first readings of the Customer and Product Data Bill, the Regulatory Systems (Economic Development) Amendment Bill and the Regulatory Systems (Immigration and Workforce) Amendment Bill, and the Regulatory Systems (Social Security) Amendment Bill; and the interrupted debate on the third reading of the Māori Fisheries Amendment Bill.\nA party vote was called for on the question, That the motion be agreed to.\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 14; Te Pāti Māori 6; Tana.\nBudget Debate\nBills\nAppropriation (2024/25 Estimates) Bill", "window_id": "2024-07-23#4"}, {"statement_id": "1c95f96c146532de", "politician": "Stuart Smith", "party": "National", "side": "government", "date": "2024-08-21", "statement": "Well, I don’t know if he’s aware, but it went through a select committee process. Madam Speaker, as I’m sure you are aware, the select committee process is the major part of our legislative process.", "window": "STUART SMITH: Thank you, Madam Speaker. It is a pleasure to speak on the Employment Relations (Protection for Kiwisaver Members) Amendment Bill. I want to congratulate the member who has got the bill to this stage. It was a pleasure to actually have it in front of the Finance and Expenditure Committee.\nI want to address a couple of the issues raised by the Green member Ricardo Menéndez March. He asked what had happened between the first reading and the second reading. Well, I don’t know if he’s aware, but it went through a select committee process. Madam Speaker, as I’m sure you are aware, the select committee process is the major part of our legislative process. All of our members in the House are members on select committees, and they put a lot of work into select committees. One major part of that, of course, is scrutinising legislation, calling for submissions, reading submissions very carefully, hearing oral evidence from those submitters, and then going through a process with very hard-working officials and select committee staff to try and improve the bill and to take note of submitters’ issues that they had raised or ways the bill could be improved, and, indeed, in some cases, coming to a different view. That is what has happened for the National Party. I think that shows pragmatism. I think that shows the select committee process actually working as it was supposed to do.\nI want to thank all of those people who did submit. There weren’t that many submissions, I have to admit, and we only had two that appeared before the select committee, as my colleague Jamie Arbuckle mentioned in his good speech on this bill. That, as Jamie so eloquently put it, really brought it home for the New Zealand First member on the select committee that this was, essentially, a solution looking for a problem, well-meaning as it is, and that it has a good outcome on the face of it. That’s why, at first reading, we supported the bill. It looked like it was going to really provide something and bring something to the table.\nUnfortunately, once we got into it, it actually became quite obvious that there were some issues with it. It was going to add complexity. Really, that solution wasn’t going to be that great. If, as was indicated by the Green member just previously, there was such an issue, if it was such an issue for workers, where were they at the select committee process? Where were they? Why didn’t they submit?\nDr Lawrence Xu-Nan : They were working.\nOh, they were working! They were working. OK. Well, people came out in large numbers for a whole lot of things. If it really means anything—nowadays, we do take submissions, particularly on the Finance and Expenditure Committee, and I think all the committees do, by Zoom. People could come during their lunch hour—usually it’s five minutes for an individual, but maybe it depends on the select committee; it could be more like 10 minutes—for a submission. It’s not asking them to take a day out of their work life and a significant impost on their pay. I really do recognise those people who the previous member was talking about, those people on the lower incomes. Absolutely. There’s no way that we would expect them to sacrifice a day’s work for something like that. If they really did think there was an issue, they would have found a way to appear before the committee. But they didn’t submit, and they didn’t turn up, because there were very few submissions. BusinessNZ’s submission was a good one. I remember that one quite well and their appearance before the committee.\nBefore I took it back to the caucus and before we deliberated, I did quite a lot of work. I called around a number of other people, doing my own research outside of those submissions to the select committee, trying to find a way to make this work. Unfortunately, it just wasn’t possible. That said, superannuation is a big issue for New Zealand. We do have an ageing population. We have an economy that’s actually only just starting to see some green shoots now that we’ve got in behind the driver’s wheel, if you like, of the economy and are getting things back on track.\nSome of the things in this bill we did do to change it. Actually, we changed the name of it. We capitalised the “S” in KiwiSaver. We did very important work in that—small but important. There were so many things that we went through in looking at how this would work in practice. One of the bigger issues that we have was that this was going to be another avenue for personal grievances. Now, that’s fine if the personal grievances are worthy, but sometimes they’re not, and we couldn’t really find a way to make that work. That also was a major red flag for me.\nClause 5 in the bill would insert new section 110C into the Employment Relations Act, and that sets out an adverse effect test that would be used to determine whether a worker is eligible to raise a personal grievance. I’d have to say, at the end of that, I didn’t think that really brought any clarity to the bill, and I was a bit concerned—well, in fact, very concerned—about that. I thought that was going to be quite difficult for us to deal with.\nThe bill did seek to—in the end, it’s about discrimination between people who have taken a full remuneration approach or have their wage and salary paid to them, and then the employer’s contribution is paid to their KiwiSaver account, versus those who just have that KiwiSaver remuneration, 3 percent, that goes on top of their salary, and they keep the money and choose to do what they want with it. We did find out, actually, that KiwiSaver is not the only way that people save for superannuation; there are many other schemes. This was too narrow, so we sought to expand that because, ultimately, employees should have rights to choose their own path if they wish to. There are plenty of other mechanisms in the law to protect people from not being treated fairly. While this bill was worthy in that sense—in its aim—it really didn’t help make the boat go any faster.\nMy colleague Jamie Arbuckle—I think it was—mentioned the minimum wage protections, and that’s absolutely the case. I think that is another safety net that we can feel confident that this bill wouldn’t help. I believe, at some point, there will be some piece of legislation that will come through, which will include something on this in the future. But I don’t think the work was able to be done in the back or in the early stages of this bill’s life to get all of those little things ironed out with all the policy work that needed to be done. It’s unfortunate that we’ve got to this stage.\nI do, once again, want to thank all of the submitters. Although there were few in number, at least they did submit. I can assure them that their submissions were considered very carefully. I guess, given the small number of them, Madam Speaker, as a select committee member, you do soon find out if people have read their papers or not. On this bill, they had. I can assure you that everyone around the table had read those papers, even whether they liked the bill or not. That’s an important part of our democracy, as I said at the beginning of my speech.\nI do want to congratulate the member for getting this far. It’s not easy, as we all know. I also want to thank the other members on the Finance and Expenditure Committee for the work that they did on it. The National Party won’t be supporting the bill past this point, but we do think that the member did put her best foot forward, and we just, unfortunately, can’t support it. Thank you, Madam Speaker.", "window_id": "2024-08-21#15"}], RUBRICS={"subject": "Whose conduct does this statement let you judge?\n\n  speaker  the statement is about the speaker's own conduct/record\n  other    the speaker is describing SOMEONE ELSE's conduct\n           (an opponent's broken promise, a previous government's failure)\n  unclear  genuinely ambiguous\n\nThis is the single most important column. Scoring an MP down for pointing out\nan opponent's failure is the defect v3.0 exists to fix, and it has no testset.\nNot a score — use the words.", "civility": "Is the attack on the argument, or on the person?\n\n  1.0   Civil. Engages the substance, attacks no one.\n        THIS IS THE STANDARD, NOT AN ACHIEVEMENT.\n        Harsh criticism of a POLICY belongs here — near 1.0.\n  0.75  Pointed, edging toward the person but not landing on them.\n  0.5   A real failure: imputing bad faith, sneering, mockery.\n  0.25  A clear personal attack.\n  0.0   Contempt — sustained abuse, attacks on character or worth.\n\nRE-ANCHORED 2026-08-07. The old scale put \"harsh but legitimate criticism\" at\n0.5; it is now near 1.0. Do not label from the old rubric.\n\nNOT civility: a false claim (veracity), a fallacy (rigor), an attack on a\nPARTY rather than a person (focus).\nIneligible: ceremonial speech — tributes and condolences are trivially civil.", "rigor": "Does the conclusion follow from the premises?\n\n  1.0  Valid inference; the conclusion is supported by what was offered.\n  0.5  A reasonable point leaning on an appeal, or with a gap in the logic.\n  0.0  Non-sequitur, strawman, false dichotomy, slippery slope, circular\n       reasoning, or a bare appeal to emotion/popularity/tradition/authority.\n\nWE ARE NOT FACT-CHECKING. An argument can be perfectly rigorous and built on\nFALSE premises — that scores HIGH on rigor and low on veracity. Whether the\nassumptions are true is not this column's job.\n\nAd hominem counts against rigor ONLY when the conclusion rests on it.\n  \"the policy fails because the member is a fool\"        -> low rigor\n  \"the member is a fool, and the policy fails because X\" -> rude, not illogical\nIneligible: statements advancing no argument at all.", "specificity": "Is there checkable content in the statement?\n\n  1.0  Concrete: figures, mechanisms, timeframes, named policies.\n  0.5  A direction with some detail, missing the how / how much / by when.\n  0.0  Platitude or slogan committing to nothing.\n\nJudge in context — credit detail the speaker actually supplied nearby.\nNOT specificity: whether the content is true (veracity), whether it answers a\nquestion (forthrightness).", "focus": "Is this about the policy, or about the other team?\n\n  1.0  Engages the substance: mechanism, cost, effect, who it hits.\n  1.0  ALSO legitimate scrutiny — \"the government promised 1,000 homes and\n       built 200\" names a specific policy and outcome. THIS IS THE JOB.\n  0.5  A real policy point wrapped in party framing.\n  0.0  Purely about the other party — their record in general, their\n       hypocrisy, their internal divisions. No policy content.\n\nNew in v3.0, replacing Charisma. The gap it fills: attacking a PARTY rather\nthan a person passes civility cleanly but is pure tribalism.\nThe deciding test: does it name a specific policy, measure or outcome?\nIneligible: ceremony, procedure, debate with no policy at issue."}, ATTRS=["civility", "rigor", "specificity", "focus"];
const KEY="pool_v3_labels";
let L=JSON.parse(localStorage.getItem(KEY)||"{}"), i=0;
const SCORES=[["0.0","0"],["0.25",".25"],["0.5",".5"],["0.75",".75"],["1.0","1"]];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function set(id,f,v){ (L[id]=L[id]||{})[f]=v; localStorage.setItem(KEY,JSON.stringify(L)); render(); }

function opts(id,f,vals,cls){
  const cur=(L[id]||{})[f];
  return `<div class="opts">`+vals.map(([v,lab])=>
    `<button class="o ${cls||''} ${cur===v?'on':''}" onclick="set('${id}','${f}',${cur===v?'null':`'${v}'`})">${lab}</button>`
  ).join("")+`</div>`;
}

function render(){
  const it=ITEMS[i], id=it.statement_id, done=Object.keys(L).filter(k=>Object.values(L[k]||{}).some(v=>v)).length;
  document.getElementById("pos").textContent=`${i+1} / ${ITEMS.length}`;
  document.getElementById("prog").style.width=(100*done/ITEMS.length)+"%";
  document.getElementById("cnt").textContent=`${done} labelled`;
  document.getElementById("meta").innerHTML=
    `<b>${esc(it.politician)}</b> · ${esc(it.party||"")} · ${esc(it.side||"")} · ${it.date}`
    +(it.window_id?` · window ${it.window_id}`:"");
  const w=document.getElementById("win");
  if(!it.window){ w.innerHTML=`<div class="warn">No window could be recovered for this
    statement, so there is not enough context to label it. Skip it.</div>
    <p style="margin-top:10px">${esc(it.statement)}</p>`; }
  else { const n=s=>s.replace(/\s+/g," ");
    const wi=n(it.window), st=n(it.statement), at=wi.indexOf(st);
    w.innerHTML = at<0 ? esc(it.window)
      : esc(wi.slice(0,at))+"<mark>"+esc(st)+"</mark>"+esc(wi.slice(at+st.length)); }

  let h=`<h3>subject</h3><div class="rub">${esc(RUBRICS.subject)}</div>`
    + opts(id,"subject",[["speaker","speaker"],["other","other"],["unclear","unclear"]]);
  for(const a of ATTRS){
    h+=`<h3>${a}</h3><div class="rub">${esc(RUBRICS[a])}</div>`
      + opts(id,a,SCORES)
      + `<div class="opts" style="margin-top:6px">`
      + `<button class="o na ${(L[id]||{})[a]==="n/a"?"on":""}" onclick="set('${id}','${a}',${(L[id]||{})[a]==="n/a"?"null":"'n/a'"})">n/a — doesn't apply</button>`
      + `<button class="o ct ${(L[id]||{})[a]==="?"?"on":""}" onclick="set('${id}','${a}',${(L[id]||{})[a]==="?"?"null":"'?'"})">can't tell</button>`
      + `</div>`;
  }
  h+=`<h3>note</h3><textarea onchange="set('${id}','note',this.value)"
      placeholder="optional — especially useful when you disagree with yourself">${
      esc(((L[id]||{}).note)||"")}</textarea>`;
  h+=`<nav><button onclick="go(-1)">&larr; prev</button>
      <button class="pri" onclick="go(1)">next &rarr;</button>
      <span style="color:var(--mut);font-size:13px">progress saves automatically</span></nav>`;
  document.getElementById("form").innerHTML=h;
}
function go(d){ i=Math.max(0,Math.min(ITEMS.length-1,i+d)); window.scrollTo(0,0); render(); }
document.addEventListener("keydown",e=>{ if(e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1); });
function dl(){
  const out=ITEMS.filter(t=>L[t.statement_id]).map(t=>({statement_id:t.statement_id,...L[t.statement_id]}));
  const b=new Blob([out.map(o=>JSON.stringify(o)).join("
")],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="pool_v3_labels.jsonl"; a.click();
}
render();
</script></body></html>
