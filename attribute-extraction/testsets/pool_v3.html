how, before you can access the gateway test, you’ve got to make sure that it’s written down; what other criteria are there? My other follow-up question is around whether she will accept my tabled amendment—which should be on the Table there—which I think would help to provide a bit more balance to this legislation.\nHon BROOKE VAN VELDEN (Minister for Workplace Relations and Safety) (17:50) : I thank the member for his question. While I was creating the gateway test and it was being thought through, it was very important for me that we were getting the balance right between businesses’ and workers’ rights. For that reason, you’ve outlined the importance of the written agreement. I’m asked further about what other parts of the gateway test uphold rights for workers, and I’m very happy to oblige because there are a number of them within here which I think are of benefit to a worker in that arrangement—especially the fact that there is the availability criterion, which essentially says that if a person is in this arrangement with this business, they cannot meet the gateway test if they’re being told as a worker they cannot work for any other person.\nThere are some arrangements out there as contracts where people have exclusivity clauses. That would not meet the gateway test. It’s also important for the termination criterion that a person cannot be terminated from their contract with this person because they’ve declined additional work. That’s also very important because part of the fundamental clauses of this gateway test is that it’s about flexibility. Part of contract work, I think, is that people are able to pick and choose their hours, and they should not be denied their contract because they have declined additional work. I think that’s really important for the rights of those workers. So I thank him for his question.\nRACHEL BOYACK (Labour—Nelson) (17:52) : Thank you, Madam Chair. I appreciate the opportunity to take a call, and I will have a few questions for the Minister on this bill tonight. I want to just keep to Subpart 1 because I have some particular scenarios to put to the Minister and some suggested amendments that I just want to foreshadow that I’ll probably table later in the evening.\nThe concern I have, and I want to put this scenario to the Minister, is based on the fact that what actually happens in practice, and in the Employment Relations Act, as the Minister will know, one of the things that it mentions right upfront is the inherent inequality in power between employee and employer. In practice, what often happens—and the Minister has talked a little bit in her answers about employees or contractors or people accepting some type of an employment relationship, some type of job offer, having something put in writing—is there is a letter of offer and a contract of some type put in front of a person.\nThose of us who’ve worked in this industry know, and I actually think probably most New Zealanders would know this, that very few people ever actually go through and read that document, especially young people going into their first jobs. It’s really unusual for people to take the time to read the document. One of the concerns I have is that while there is a gateway test and we’re changing the rules in the law to say that it needs to be agreed between the two parties, there will be many people, especially young people, who will sign a document and not know what they are signing. There are some suggestions that I have that would make this fairer.\nThe first is that it would be wise to have a cooling-off period. It would be wise to be able to say that a person who had signed a document saying they agreed to be a contractor could have a 24-hour, 48-hour cooling-off period where perhaps they then go home and see mum and dad and they say, “Oh, what have you signed up for?” They can go back and say, “Actually no, my preference is to be an employee.” That’s my first suggested change.\nThe second is a requirement that independent advice must be offered to anybody accepting such an arrangement, so that they actually can go to community law, pop into a union, talk to a family friend who’s a lawyer and seek some independent advice before making such a determination.\nThe third is actually being really clear around when this occurs in the process, because if there is a genuineness from the Minister and from the Government that this is a genuine agreement, is it included in the job offer? Does the job offer letter actually have a requirement that says, “You may choose option (a) or option (b) and whichever option you so choose will not revoke the offer.” So therefore, it says “You can choose to be (a) a contractor, and here’s what it looks like; or (b) you can choose to be an employee, and here’s what it looks like, and up to you which one you choose.” Because the reality is what’s more likely to happen is that there’s a job offer put in front of someone where someone must sign off to be a contractor or else they actually don’t get the job. That’s how it works in practice, right? You don’t agree with the terms and conditions—actually, the job’s not yours.\nThen the final point I want to make around this is that the reason why these questions of mine matter is that you’re going to end up in situations where person A is going to be working at one business doing a job with a set number of hours and duties and all sorts of other arrangements in terms of the employment relationship, and person B will be in a completely different organisation doing a very, very similar job. Let’s say it’s Burger King and McDonald’s—you know, very similar jobs, but in one job they could be an employee and in one job they could be a contractor. And this is the point here—\nSimon Court : There is nothing similar about Burger King and McDonald’s.", "window_id": "2026-02-11#16"}, {"statement_id": "63912225fe110a3d", "politician": "Arena Williams", "party": "Labour", "side": "opposition", "date": "2026-04-22", "statement": "What isn’t required to be constantly overseen is things that are in the realm of professional—just doing the work well. Like water hammers—we don’t need inspectors coming out on site and making sure that the person that’s run the pipes has made sure that there’s not a water hammer effect.", "window": "ARENA WILLIAMS: Sorry, metres—75 square metres. It’s important to understand here that it’s duplicating rules and making it quite hard for the actual plumbers who are doing the work to make sure that they are complying with these rules. The absurdity of also having different rules for a solar install on a small property versus one that’s slightly larger than that becomes very clear in that context.\nIf we can tidy these things up, if we can make sure that the plumbers actually doing this work are enabled to continue this, then this will be a workable system. We still have to figure out as a country who bears the risk of this bill, and currently the arrangements for this bill really rely on sorting out proportional liability at the other end. We need central and local government to take their fair share of the risk on. Currently, that’s not what’s going to happen, and so we need to make sure that we also do that work around who carries the guarantees, who carries the insurance.\nBut this is something that we support, because it brings down the costs for ordinary people to get this work done at the top end, and then we have to, also, sort out the back end of what happens when things go wrong.\nCELIA WADE-BROWN (Green) (12:46) : Thank you. I would like to start by saying, first of all, that the Green Party really supports plumbers and tradies and the essential work that’s done—for domestic comfort, for safety, and for all of the work that they do. I think there’s about 28,000 plumbers registered in this country or thereabouts, so thank goodness for them, especially with the extraordinary rainfall we’ve been having that has actually exposed a number of issues in past plumbing.\nI would also like to say thank you to the chair for the Transport and Infrastructure Committee and my colleagues with slightly different views and experiences. We were certainly enabled to raise issues, have our say, and ask plenty of questions of both the submitters and the officials.\nThere is a connected bill—and it would be really tidy if they could have come in together, perhaps—about occupational licensing that we do support. A number of the submissions actually made points both about occupational licensing and about increasing the self-certification, and we would, in some ways, have liked to have dealt with those together.\nThis bill is a tricky one, because you’re weighing up the balance of risk—who takes that risk—and potentially making something cheaper and easier and quicker. I think that people deciding to vote one way or the other can be somewhat of a line call on this. I agree with my colleague Arena Williams that there could be some further improvements.\nI just want to quote a couple of things here. I’d like to quote one of the submitters, the Christchurch City Council. They say in their submission: “The self-certification of plumbers and drainlayers is more concerning … [and] The Council”—point 5—“is concerned that most plumbers and drainlayers are not consistently reliable enough to self-certify their work with no third-party overview. The Council observed substantial non-compliant work carried out or supervised by Licensed Building Practitioners (LBPs) after the Canterbury earthquake sequence where there was no third-party overview by persons with no financial involvement (such as a Council).” I think it’s very useful to take what Christchurch City Council has said. This is not a personal opinion; this is an opinion of a large council—and not Wellington, because I thought that would be a bit too close to the bone—to actually reflect that they’re not, or at least at that stage, fully convinced.\nThere remain some very big questions about what insurance products will be available. The self-certification of electricians and gasfitters is relatively straightforward, because the problems are found straight away or could be tested straight away. Plumbing problems don’t necessarily arise for years. You might end up with a very dry year, in which case the earth cracks, or you might, like we have just now, end up with huge rainfall and scouring and burst pipes and so on that may not have been designed for.\nI also would like to echo my colleague Arena Williams’ issues about some of the greener solutions to plumbing. Detention tanks are also used in urban areas, particularly if you’ve got some steep land and perhaps you don’t have an existing or sufficient stormwater connection. They are complex, but they are also sometimes better than a pump system. They would not be included in this work, however much experience—you might have some somebody quite specialised in doing that work. Maybe there should be some way that they were able to be self-certified for that.\nThe other area is, of course, the reuse of grey water. We’re fortunate—and it was installed by plumbers—we have a system that irrigates our orchard from the washing machine, the washing up, things like that, and it works very well. If somebody routinely installs things like NaturalFlow, should they not be able to self-certify for this?\nI think the big question remains about what insurance product is available and for how long they should cover it. Supposing a plumber does some work in the last years of their working life, then—maybe it’s a sole trader—they stop working. Who’s actually going to look after that afterwards so that they’re not going to keep paying from their KiwiSaver into the insurance scheme? I don’t think that has been fully answered yet.\nI do agree that there have been some improvements, particularly the fact that you could combine self-certified and non - self-certified in the same consent. Both can be covered. That sort of mitigates the issue of more sustainable solutions—that are still called “alternative” solutions because systems haven’t quite caught up with more natural systems—but I don’t think it’s quite right yet.\nA couple of other points. The costs of auditing—I think we really heard both from the Master Plumbers and then from the board. Of course, the board is a different kettle of fish from the Master Plumbers, but we heard from the board that auditing was really important. I think there is still a question in my mind about whether the cost of auditing would only be borne by the opt-in plumbers, in which case it might be quite high and might discourage them, or would it be borne across the whole plumbing fraternity? I do say fraternity, because out of those 28,000, I think there’s less than 20 registered female plumbers, which is a bit of a surprise.\nWe also don’t know quite what’s going to come up in the regulations. I understand that and that regulations have to adapt to new mechanisms. We’re certainly looking at home at whether we do electric water heating for a bach or whether we do the solar water heating. Would that be a change—would we be deciding one way or the other depending on whether it was cheaper with a self-certified plumber? I don’t know how much difference that would make. We would probably be more concerned about the absolute safety of the system than the cost, but that’s our situation.\nFinally, it would be really remiss of me in talking about how the Greens support plumbers not to mention, for the sake of Hansard , that wonderful Green plumber Hannah Spencer, who is now a member of Parliament for Gorton and Denton. The Greens support the plumbers, and at least some plumbers really support the Green Party. Kia ora.\nCAMERON LUXTON (ACT) (12:54) : Thank you, Mr Speaker. I rise in support of this bill for a quick speech before we charge off for the afternoon. This is a practical, common-sense piece of legislation. It does something that doesn’t normally happen enough in this country, and that’s trust people who are actually doing the work to get on and do it. I’m proud that this Government—and, by the sounds of it, this House—is moving to trust more people actually on the ground getting the mahi done. At the end of the day, when something goes wrong, New Zealanders don’t want to call bureaucracy. They want to call someone who gets their hands dirty, gets in there, and does the job. These are people who we should be trusting.\nBefore I turn to the substance of the bill, I think it’s fair to say that there’s been some issues raised in this this debate so far about where liability lands and how we can actually make real changes to a scheme to trust people when, currently, you have to go through a hoop set by legislation that requires building consent authorities to oversee and then carry that liability. It’s a big hurdle for us to fix a system without identifying where the liability lands, where that funding, that underwriting, actually comes from, and then give New Zealanders real choices. If we’re going to continue to have councils holding that burden whilst also needing to fund professional indemnity, insurance, and other things, it’s going to make that decision more difficult.\nIt just shows though, how slow, cumbersome, and bloody annoying it is when you’re on site to be delayed and delayed and delayed because councils can’t get their A into G and actually get there and sign something off. That’s why we’ve got to call for self-certification for trusted building professionals, just like plumbers, drainlayers, and gasfitters. What we need to be able to do is say that delay is what’s causing the cost. It’s not the underwriting that’s causing the cost. The very fact that we’re trying to get around that cost delay by even having something that may not provide that economic decision as it appears on the surface just shows how much these delays are costing New Zealanders, homeowners, our economy, and our infrastructure. New Zealand across the board cannot go on charging into this century without making sure that we get some of this bureaucracy taken out.\nThe select committee, I was not a member on at this particular juncture, but I appreciate the work they’ve done, and the contributions so far have been very good for the House to hear, I think. I was particularly impressed at the Opposition members seeming to want to go further. This is something I can completely get behind—reticulated schemes, bringing on hot water, having grey-water storage. This is fantastic news to hear from the Opposition. I’m looking forward to working hard on producing policies for this election that you can get in behind and support. That will be great fun.\nWhat we need to be doing is making sure that this is not a matter of risk and no risk; it’s a matter of risk and professionalism. If you’ve got a plumber or drainlayer, we can trust, to a large extent, that they know what they’re connecting when they’re connecting pipes up. They’re made at different sizes, for one. They’re different colours. You can see these things. If you’re a professional who’s with this every day, you should be able to identify that. There are risks of grey, black, and stormwater connections being made—it’s acknowledged by everyone involved—but this is a very low risk when you’ve got professional plumbers and drainlayers.\nWhat isn’t required to be constantly overseen is things that are in the realm of professional—just doing the work well. Like water hammers—we don’t need inspectors coming out on site and making sure that the person that’s run the pipes has made sure that there’s not a water hammer effect. That is not a critical thing in a building. A water hammer is when you turn off the tap and the pipes shudder and smack into something and make a big noise in the house. It’s bloody annoying, but that’s not a critical failure in a building. That’s just someone who’s not a professional doing their job right. We don’t need to be getting stuck into the nitty gritty of people who genuinely, after doing trades, getting registered, doing the professional development, know what they’re doing and can keep an eye on that. We don’t need a council inspector coming out and checking on that.\nI think the expansions that the select committee has made to identify the issues at the design stage and say that registered architects, licensed building practitioner designs, and chartered engineers need to be able to be brought into the scheme so that at the design phase, these can be identified as parts of a building that can be self-certified—so we can actually trust the building professionals, the tradies on the ground who deal with the real world situations. But, actually they need to be identified up front by the partners in the building industry for the people who are out there getting their hands dirty, who don’t always get the acknowledgement that they deserve, and that is the people who are designing our buildings. They need to be able to get it right so that the people on the ground can get it right. There is a whole ecosystem here. I think that goes to show the amount of stages we have to jump through to be able to get stuff built in New Zealand.\nAgain, this is a great piece of legislation to try and make sure that the real impact on New Zealand is a more affordable, more responsive, more trusted scheme that says to New Zealanders, says to tradies out there, “You are building professionals. We know that you have been trained to do this. We trust you as we would another building professional, and we’re here to enable you and get the hell out of the way.” Thank you, Mr Speaker.", "window_id": "2026-04-22#23"}, {"statement_id": "89fe4eaa20e2d2c1", "politician": "Julie Anne Genter", "party": "Green", "side": "opposition", "date": "2026-05-21", "statement": "Why is the Government proceeding with an expensive public-private partnership road at the same time it has disclosed plans to, potentially, lay off 9,000 New Zealanders from the public service?", "window": "Hon Julie Anne Genter: Why is the Government proceeding with an expensive public-private partnership road at the same time it has disclosed plans to, potentially, lay off 9,000 New Zealanders from the public service?\n\nHon Julie Anne Genter: Mr Speaker, just speaking to the point of order. The front page of the New Zealand Herald today says it could well be the most expensive road ever built in New Zealand, so I don’t think it’s an outrageous claim.\n\nHon CHRIS BISHOP: The Warkworth to Te Hana road of national significance is an important nation-building project for the country.\n\nHon CHRIS BISHOP: Yeah, well, so was the Auckland Light Rail project you wanted to spend $50 billion on. But anyway, it is going to be a game-changer for the North. It will improve safety and resilience and better connect Northland to the very important economic market of Auckland and, of course, the wider “golden triangle”—or, as I call it, the “golden quadrangle” involving Northland.\n\nHon Julie Anne Genter: Does the Minister really believe that the Warkworth to Te Hana expressway is the best use of multi-billions of public money, when that route will carry less than 0.1 percent of daily motor vehicle trips, and if so why?\nGrant McCallum : Yes.\n\nHon CHRIS BISHOP: Yes. Standing Orders says some things about your pecuniary interest, but—it’s not pecuniary, sorry, that’s offensive. It’s not just about vehicle movements; it’s about safety and reliability and resilience.\nTamatha Paul : Then release the BCR.\nBCRs take into account multiple benefits other than—\nTamatha Paul : Exactly, so release it—release it.\nIt will be released. I’ve already—you need to listen. Tamatha Paul needs to listen to the answer. We will be releasing the BCR. The business case for the Warkworth to Te Hana expressway is not just predicated on vehicle movements. It is also predicated on the very unreliable road that is there at the moment. It is predicated on safety; it’s a very dangerous section of road at the moment. It is also predicated on reliability and the wider economic benefits that will come from better connecting Northland to the largest economic market in the country, which is the city of Auckland—which is presumably why the last Government, in their outgoing draft Government policy statement, also included it as a road of national significance that should be built. The last time I looked, that member was a member of the outgoing Government that got booted out of office two years ago.\nMāori Crown Relations: Te Arawhiti\nQuestion No. 4\nHon WILLIE JACKSON (Labour) (14:21) to the Minister for Māori Crown Relations: Te Arawhiti : Does he stand by the Government’s track record regarding Māori-Crown relationships?\nHon TAMA POTAKA (Minister for Māori Crown Relations: Te Arawhiti) (14:21) : Yes. Māori-Crown relations will outlive everyone in this House, hence why I commend the progressive and stellar mahi of members such as Minister Goldsmith with Treaty settlements progress—three last week from Hauraki and, of course, the first reading of Whanganui land settlement; Minister Stanford with some of her work around education, particularly supporting capital expenditure across various kura in this country; and Minister Jones, not only with the super-hot geothermal shot but also the tautoko that he provides to Parihaka, Ringatū out at Wainui Road, Rātana, and Waitangi.\n\nHon Willie Jackson: Does he agree with the Waitangi Tribunal’s assessment of the Treaty principles bill that states the bill risks destroying the very foundation of the constitutional arrangements of this country; if not, why not?\n\nHon TAMA POTAKA: I have not had the opportunity to read through the entirety of the Waitangi Tribunal report in this regard, but I will note that it was absolutely egregious that, in 2017, the NCEA level 2 achievement rate for Māori was 78.5 percent, and by the time we came back in 2023 it had gone down to 65 percent. That’s why, in this Government, I absolutely support Minister Stanford, who is spearheading a massive turn-around in educational achievement for Māori and all Kiwi kids—and actually reads her emails.\n\nHon Willie Jackson: Mr Speaker, the Minister didn’t address the question at all. I was asking about the Waitangi Tribunal’s assessment of the Treaty principles bill. I don’t know what he was waffling on about, but if he could—\n\nHon Willie Jackson: Yeah, so the question is about the Treaty principles bill, and he never addressed it at all.\n\nHon Willie Jackson: Why, then, given where the Minister is at, has the Minister allowed amendments to be made to the Education and Training Act that the Waitangi Tribunal has condemned and described as being as bad as the Treaty principles bill?\n\nHon TAMA POTAKA: Perhaps it was the case under the previous Government that the Minister for Māori Crown Relations had a veto on all legislation, but in this coalition Government, actually, we work on things together and that’s how we actually move things through and ensure better clarity. But I will note, also, for the record, that a number of schools—actually, most schools in this country—have continued their commitment to Te Tiriti o Waitangi and don’t need a legislative reference to do so.\n\nHon TAMA POTAKA: Absolutely, especially around that mahi in Budget 2025 around investing $10.5 million operating and $50 million capital expenditure into Māori-medium and kaupapa Māori education; and, also, strengthening kōhanga reo to aid in capability: $4.1 million; and, also, curriculum resources in te reo Māori: $4.5 million. We are committed to achievement and not just kōrero about Māori achievement in education.\n\nHon Shane Jones: Point of order, sir. Seeking a bit of direction from you. Essentially, what the honourable member from the Opposition, Mr Jackson, is asking is for my colleague to give, really, a legal response, and he’s not required to give it in relation to him offering an opinion—Speaker’s ruling 186/6—in terms of what the Waitangi Tribunal may or may not have said. The whole question is out of order.\n\nHon Willie Jackson: To the Minister, can he confirm that there will be no jobs lost at Te Puni Kōkiri that relate to maintaining the Māori-Crown relationship, and, if not, why not?\n\nHon TAMA POTAKA: As the honourable member will recall, I hope, from his previous days as a Minister, those are matter for operational decision-making within Te Puni Kōkiri. But what this Government is absolutely sure on is that we will not increase the Public Service by 33 percent over six years and then get far poorer outcomes around a range of issues, whether or not that’s conservation, Māori department, social housing, or a number of other things.\n\nHon Willie Jackson: Has he told the finance Minister that there can be no more job cuts at Te Puni Kōkiri and Te Arawhiti, given he’s already made cuts to those agencies in previous Budgets; or is it only Winston Peters and David Seymour who are brave enough to say no to her?\n\nHon Willie Jackson: Has he told the finance Minister that there can be no more job cuts at Te Puni Kōkiri and Te Arawhiti, given he’s already made cuts to those agencies in previous Budgets; or is it only Winston Peters and David Seymour that are exempt from making cuts to their agencies?\n\nHon Willie Jackson: Last chance. Has the Minister told the finance Minister that there can be no more job cuts it Te Puni Kōkiri and Te Arawhiti, given he’s already made cuts to those agencies in previous Budgets?\n\nHon TAMA POTAKA: As the honourable member will know, the quality of the Public Service is not determined by the quantity of public servants. This Government, and myself as the Minister for Māori Development, are absolutely focused that the ministry focuses and is geared towards achieving its role, delivering on its mandate, and making sure that it can be the best Ministry for Māori Development that it has ever been.\nTourism and Hospitality\nQuestion No. 5\nNANCY LU (National) (14:28) to the Minister for Tourism and Hospitality : What recent reports has she seen on tourism in New Zealand?\nHon LOUISE UPSTON (Minister for Tourism and Hospitality) (14:28) : Data released by Stats NZ last week shows New Zealand’s international visitor numbers continues to rise. Annual figures show we welcomed 3.63 million international visitors in the year ending March 2026, a 9.2 percent increase on the previous year. This means that we are now at 93 percent of our target of 2019 levels. Growing tourism is a key part of our Government’s plan to fix the basics and build the future, and this progress shows that our plan is working.\nNancy Lu : What markets have seen the strongest growth?", "window_id": "2026-05-21#1"}, {"statement_id": "61a0a6ce2ac8f8dc", "politician": "Christopher Luxon", "party": "National", "side": "government", "date": "2023-12-12", "statement": "Question No. 2—Finance\n2. STUART SMITH (National—Kaikōura) to the Minister of Finance: What reports has she received on the state of the New Zealand economy?", "window": "Rt Hon CHRISTOPHER LUXON: We are very comfortable with suspending regulatory impact statements because we don’t think they’ll add value for decisions that we’re repealing legislation on.\n\nHon Carmel Sepuloni: Does he agree with the National Party leader, Christopher Luxon, that “I can tell you we’re going to be straight with the New Zealand people, tell it as it is—the good, the bad and the ugly”; if so, what’s changed?\n\nRt Hon CHRISTOPHER LUXON: Very much—we’re going to be very straight up with the New Zealand people, and what they have heard today is that that was a previous Government that led three of the last four quarters’ declining economic growth. What they’ve heard today, and we’ve been straight up with the New Zealand people about, is a $15 billion New Zealand Upgrade project with an Auditor-General’s report that says it was appallingly managed—appallingly managed. What you’re going to see is a Government that is very focused on making sure taxpayers are not treated like bottomless ATM machines, that we get return for their money.\n\nHon Carmel Sepuloni: Did he suspend regulatory impact statements before or after the regulatory impact statement for repealing fair pay agreements was leaked?\n\nRt Hon CHRISTOPHER LUXON: We are determined to make sure, through repealing the fair pay awards legislation, that we can actually make it easier for people to hire workers, not harder.\n\nHon Carmel Sepuloni: Does he stand by his Government’s decision to repeal fair pay agreements, the Reserve Bank dual mandate, and the Clean Car Discount under urgency with no select committee process or regulatory impact statement, or does he agree with Chris Bishop that “This is a disgraceful way to make important law.”?\n\nHon Carmel Sepuloni: Has he suspended receiving regulatory impact statements because (a) he doesn’t like what they say, (b) he’s going to ignore them anyway, (c) he knows they’ll leak, or (d) all of the above?\n\nRt Hon CHRISTOPHER LUXON: We went to an election, we had a campaign, we made very clear what we were going to do, and we’re going to do it.\n\nHon Grant Robertson: In light of that answer, can we now expect that because of the election result, no pieces of legislation will be referred to a select committee?\n\nRt Hon CHRISTOPHER LUXON: No. We want a proper process. [Interruption] No, no, hear the answer—hear the answer. The answer is: when we went to the election with really good clarity about the policies we’re going to repeal and the dumb legislation from the previous Government that we’re repealing—we’re going to move forward with great speed so that we can actually get this country moving forward. But what I’d just say: I think it is ironic on a day when we’ve had economic news where in three of the last quarters under the previous Government we had negative economic growth, at a time when inflation has been out of the band for the last over 21 months, when we’ve seen wages not keeping pace with inflation, we haven’t had a single economic question from the Opposition—a single economic question from the Opposition.\n\nRt Hon Winston Peters: Can I ask the Prime Minister: has the Government just learnt, with respect to KiwiRail, the lack of impact that the impact statement had on the previous Government?\n\nHon Phil Twyford: Does the Government now support the immediate humanitarian ceasefire it voted for at the United Nations General Assembly yesterday, or does it still believe there are a list of preconditions that must be met before calling for a ceasefire?\n\nRt Hon CHRISTOPHER LUXON: I think our position is very clear. We want a cease to hostilities—as you’ve seen in the parliamentary statement; as you’ve seen from the joint Prime Ministers’ statements for Australia, New Zealand, and Canada; and as you’ve seen for our support for the General Assembly resolution.\nQuestion No. 2—Finance\n2. STUART SMITH (National—Kaikōura) to the Minister of Finance: What reports has she received on the state of the New Zealand economy?\n\nHon NICOLA WILLIS: New Zealand is experiencing difficult economic conditions. Statistics New Zealand confirmed today that GDP declined in the third quarter of this year, a third decline in just the last year. It’s also been confirmed that New Zealand did experience a recession at the end of the last year and the beginning of this year. I’ve also seen reports from the member for Remutaka, who claimed last week that we “inherited an economy that is growing faster than many economists had predicted” and that the economy was “never in recession”, but I have seen no evidence to confirm those reports.\nStuart Smith : What reports has she seen on the outlook from here?\nAfter six years of economic mismanagement, turning the New Zealand economy around won’t be achieved overnight. Our Government has inherited big fiscal deficits, a large current account deficit, an economy in decline, and a labour market on the skids. Rebuilding the economy will be a massive task, which is why we are moving fast and getting quick wins as part of our 100-day plan.\nStuart Smith : What reports has she seen on GDP per capita?\nToday’s GDP per capita figures show on a per person basis the New Zealand economy has gone nowhere since the start of 2021 and has gone backwards four quarters in a row. The last time GDP per capita continued to slide for at least that long was during the global financial crisis. Kiwis knew they were going backwards under Labour. Today’s data is just a confirmation of the challenge they face.\nStuart Smith : What steps is the Government taking to turn economic conditions around?\nThe Government is taking urgent steps to rebuild the economy in the interests of all New Zealanders. We’re supporting the Reserve Bank in their fight to beat inflation, because after years of rampant spending, this Government understands that monetary policy needs mates. We’re eliminating wasteful spending, ensuring taxpayers’ money is spent well, and we’re clearing out the blockages in the economy and reducing costs on business so we can chart a course back to growth, investment, and opportunity.\nQuestion No. 3—Energy\n3. Hon Dr MEGAN WOODS (Labour—Wigram) to the Minister for Energy: What are the total emissions reductions that will result from the doubling of renewable energy that was promised by the Prime Minister?\n\nHon SIMEON BROWN: Our commitment to doubling renewable energy will provide businesses with the investment certainty they need to make the switch to renewable energy, which will ensure emissions reductions. We have started work on updating the national policy statement for renewable electricity generation to make it easier to consent renewable energy. Part of that work will include getting that advice. I note that the Boston Consulting Group study The Future is Electric found that electrification could reduce annual carbon emissions by 22 million tonnes in 2050.\n\nHon Dr Megan Woods: What percentage of New Zealand’s greenhouse gas emissions come from the energy sector?\n\nHon Dr Megan Woods: Can he confirm that the percentage of New Zealand’s greenhouse gas emissions that come from the electricity generation is 5.7 percent, whereas the percentage of New Zealand’s greenhouse gas emissions that come from the energy sector is 40.6 percent?\n\nHon SIMEON BROWN: Well, as the member rightly knows, those are very good statistics and I’m sure she’s correct.\n\nHon Dr Megan Woods: What other policies, then, does the Government have to reduce the 40.6 percent of New Zealand’s emissions that come from the energy sector, given that the Minister’s own officials advise that only 5.7 percent of New Zealand’s greenhouse gas emissions come from electricity generation and the Climate Commission advised complementary measures to the emissions trading scheme (ETS) are required to shift industrial and process heat from carbon sources?\n\nHon SIMEON BROWN: Well, as the member will know—being a former Minister for energy—the electrification of our economy is going to require a significant amount of more electricity to be generated. That is why we have a policy of updating the national policy statement for renewable electricity generation to double renewable energy in New Zealand. And it’s not just for electricity supply now, but for all of the other activities that it’s going to be required—in transport and industry and energy, all of those other factors—and I thought the member might know that.\n\nHon Dr Megan Woods: Point of order, Mr Speaker. Mr Speaker, I did actually ask a very specific question and it was around policies that are going to be required to move energy emissions over to electricity.\n\nHon Dr Megan Woods: OK. What policies does the Government have to move industrial and process heat coming from fossil fuel sources to electrification?\n\nHon SIMEON BROWN: Well, this Government will use the emissions trading scheme, which is a critically important tool—and a critically important market-based tool—to help move New Zealand and bend the curve of emissions down. That Government over there wanted to subsidise wealthy businesses with profitable businesses using taxpayers’ money. We’ll use the emissions training scheme as the key tool.\nScott Willis : What is his plan to fix market imbalances in an electricity market dominated by four gentailers, which today’s Generating Scarcity 2023 report shows has stifled investment in renewable electricity generation and resulted in billions of excess dividends to shareholders, all while thousands of New Zealanders struggle to heat their homes?\n\nHon SIMEON BROWN: Well, thank you, and it’s a very good question. But what is stifling the market was this former Government’s Lake Onslow—\n\nHon Dr Megan Woods: Can he confirm that for the ETS alone to shift industrial process heat to electrification, the price needs to be in excess of $200 a tonne, and can he advise New Zealanders what it will do to their electricity and petrol bills at that price?\n\nHon SIMEON BROWN: What I can confirm is this Government is going to have the tools and the policies to double renewable energy in New Zealand so we can electrify our economy. What I will say, though, to the businesses—the profitable businesses—which were receiving subsidies under that Government, they will not be receiving them under this Government. They should be making those investments themselves. [Interruption]", "window_id": "2023-12-12#108"}, {"statement_id": "b13b1eb7dce5eb9a", "politician": "Simon Watts", "party": "National", "side": "government", "date": "2024-03-26", "statement": "You don’t have to travel too far to get feedback from a number of experts within the tax field that acknowledge that a 10-year brightline versus a two-year derives significantly more compliance costs.", "window": "Hon Dr DEBORAH RUSSELL: Thank you, Mr Chair. First of all, I’d just like to thank the Minister for tracking down that definition of fiscal year. It sounds remarkably like an income year, but I can see why it needs to sit with the fiscal year definition.\nWe’ve sort of gone through about four of the 11 major topics that there are within this bill and the Amendment Paper. There’s still more to be said on interest deductibility and on all sorts of matters. So I’ll take the question I have on interest deductibility first, and then I do want to come back and start looking at the trustee tax rate changes. I guess it’s a somewhat theoretical question, maybe. The rule, of course, for getting a tax deduction is that in order to be able to claim a tax expense, it has to be incurred in the process of earning income or incurred in the process of running a business. But there’s a pretty clear nexus between: in order to get that tax deduction, you have to be doing something that gets taxed as well. And that’s a fairly straightforward point.\nOne of the problems around investment in residential rental properties is that a large part of the income that people earn from them is capital gains, and, in fact, untaxed capital gains. So when people claim interest deductions against residential rental property income, what they’re doing—well, they’re paying interest, sorry. Partly they’re paying it because they’re earning assessable income of rent, but partly they’re paying it and they’re earning untaxed income in the form of capital gains. Now, traditionally, people have been able to claim an interest deduction in full. And part of the reason is that it’s pretty hard to prise apart which part of the interest deduction relates to the rent and which part relates to the capital gains. So it’s always been hard to apportion between the taxed income and the untaxed income. So the rule has been to claim the full amount; basically, it was concessionary—it was a concessionary treatment.\nIt got flipped back the other way under the interest deductibility changes that were put in place by the previous Government. So it flipped the other way. There was a portion of those interest deductions that relate to untaxed income, so the entire amount was disallowed. Except the interesting thing is that if a person was caught by the brightline test—so they paid tax on the capital gains—then they could claim the interest deductions as part of that tax calculation. So there was a whole lot of consistency there around the treatment of interest deductions.\nNow, by reverting to the old practice of allowing the full deduction—well, it’s going to be 80 percent in the next tax year and then a full deduction in the following tax year—in fact, the Government is reverting to the practice of giving a really concessionary treatment with respect to interest in comparison to other sort of regular expenses that people incur with respect to a residential rental property, such as insurance or rates and so on. So I just want to hear from the Minister whether they considered some form of apportionment, some way of trying to assess what part of the interest deduction was related to the untaxed capital gain and what part was related to the taxable rental income. It goes to the consistency of the treatment of other expenses, which always have to have that nexus with income. In particular, the rule is, really, no deduction unless you’re earning taxable income. So it’s a little hard to see the justification on a theoretical basis, as well as all the practical implications that my colleagues have talked about of allowing those interest deductions again.\nI’d like to submit that, actually, the previous Government’s treatment of it by allowing the tax deductions when the person paid a tax on the capital gain was actually a rather more consistent treatment of interest; and, in fact, was the better treatment. So just from a tax theoretical point of view, the better treatment would be to disallow those interest deductions.\n\nHon SIMON WATTS: Thank you very much, Mr Chair. In regards to the member’s question around the capital gains aspect in regards to the interest deduction—I mean, in effect, what we’re doing here, in regards to allowing an interest deduction on residential property, is no different to what is allowed by someone that undertakes an interest deduction on a commercial property, which was allowed under the previous rules, or likewise for a farm, for example, that is a similar entity that may be funded proportionately by debt and equity. So, you know, what we are simply doing here is driving a degree of consistency in regards to the overall way the tax system is, so that allows that deduction to be taken. And I don’t think the point that the member’s noting, in terms of the inconsistency, is relevant. So I’ve given just two examples there of where the aspect is.\nI think it is also important to note that in regards to the ability to take that interest deduction, under the prior Government’s rules, the deduction for interest in regards to residential property, even in circumstances where the property did not achieve or obtain a capital gain, was denied. So the inconsistency of that tax treatment is what this coalition Government are looking to resolve.\nI just wanted to go back to the different member’s question—I think it was Helen White’s—in regards to the storm implications. The Finance and Expenditure Committee (FEC) did agree as part of its deliberations—the question was “Why”, about the date, and “Is the date adequate?” The FEC did deliberate and consider that date quite considerably. The position of 30 April 2024 was the position of the select committee, that they determined was an appropriate date—hence I think I’ve covered those points and now I’m starting to repeat.\n\nHon KIERAN McANULTY: Thank you very much, Mr Chair. I had some questions in regards to the proposal in here around the brightline test, and I note the Minister has touched on this a couple of times. But what is of concern is that I actually don’t think that it’s good enough for the Minister to simply say that we’re bringing it back to how things were originally.\nWell, of course, a lot has happened since then, and we have a lot more information available to us. And my question is specifically around the advice that he’s receiving, given that even in their own documentation that’s provided here, Treasury not only suggests that doing what the Government’s proposing is the wrong idea; Treasury proposes that they push it out—they push it out to 20 years, because what they recognise is, as is intended with a brightline test, it discourages speculation in the market. And that is particularly the case when coupled with—as has been mentioned—interest deductibility. But, specifically, we’re talking here about affordability of homes, and in doing what the Government is proposing, it will do the reverse of what the justification was and the rationale behind bringing it in in the first place—even albeit for two years—right when the housing crisis was really getting going, to try and discourage speculation within the market. Then, as it continued, the rationale was to push it out.\nSo I want to know from the Minister, you know, a bit more detail, please, than what he has been giving up until now is—I get it. He said that he wants to bring it back to what was originally intended—we understand that—but I think the committee deserves a bit more. In light of the advice that’s here in the information that’s provided in front of us that says Treasury recommends a brightline test of 20 years and outlining the benefits not only for our house affordability but other reasons as well, why on earth is he not only going in the other direction but absolutely dismissing the advice that Treasury, their own department, who presumably played a massive role in the development of this bill, has put in this document?\n\nHon SIMON WATTS: Just responding to the member’s questions in regards to the Treasury advice, I mean, as the honourable member will know, there are circumstances where departments don’t always agree and they come from different perspectives in regards to the application and implementation of that policy. But as I’ve noted, I think on three occasions, in regards to questions on a similar matter in regards to this test, the intention rule will remain and does remain within the legislation. The point of the intention rule is to ensure that if it is the intent of the property speculator in order to develop that for the purposes of making a gain, then they will be captured, even if that period of time exceeds the two-year limit. So that hasn’t gone away. That remains in place and will be able to capture the aspects in regards to property speculators and that.\nI think the other point to acknowledge, and a key focus of this coalition Government, is to reduce the compliance burden on taxpayers. We’re wanting to actually get a more productive economy. We want to get a more productive country, and one of the ways that you can derive a more productive country is by having a more efficient tax system. And with all these inconsistencies, a 10-year brightline test in itself derives significantly more compliance and cost on business than a two year. You don’t have to travel too far to get feedback from a number of experts within the tax field that acknowledge that a 10-year brightline versus a two-year derives significantly more compliance costs. And on this side of the House, we are focused on making life easier for people to be productive in our economy, to earn more income, to hire more people, and to ensure that that flows to those that need it most.", "window_id": "2024-03-26#24"}, {"statement_id": "396b4a896ba79248", "politician": "Christopher Luxon", "party": "National", "side": "government", "date": "2024-04-30", "statement": "Well, there are no projects that have been approved. Debbie Ngarewa-Packer : What actions will the Prime Minister take to ensure that his Cabinet Ministers will adhere to the Cabinet Manual around the conflict of interests, if given, for the Fast-track Approvals Bill?", "window": "Hon NICOLA WILLIS: —and pay 20.6 percent of their income in tax. This is the consequence of not adjusting tax thresholds for 14 years. The average tax rate for someone who is, by definition, right in the middle of the income distribution has gone up by more than 5 percentage points. The Leader of the Opposition seems very concerned about the lack of adjustment to tax thresholds. Well, he had six years and he ignored working people and made no adjustment.\nStuart Smith : How do other countries deal with fiscal drag?\nMore than half of OECD countries index their personal income tax thresholds. The report I referred to in my primary answer shows that of the 38 OECD countries, around 17 automatically adjust thresholds for inflation or some other index. Those countries include Canada, the United States, Denmark, France, Norway, and Sweden.\nStuart Smith : What do other OECD countries do about fiscal drag?\nAs I said, most OECD countries index tax thresholds. Of the rest, most have decided on a discretionary basis to adjust thresholds and/or rates over the last decade or so to provide tax relief, including Australia, the United Kingdom, and Germany. Only a very small minority of OECD countries have decided not to provide personal income tax relief since 2010, and, in fact, have raised taxes. Those countries include Portugal, Greece, and New Zealand.\nQuestion No. 3—Prime Minister\n3. Rt Hon CHRIS HIPKINS (Leader of the Opposition) to the Prime Minister: Does he stand by all his Government’s statements and actions?\n\nRt Hon CHRISTOPHER LUXON: Yes. In particular, I stand by this Government’s action to ban mobile phones in schools. Officially kicking in yesterday, the ban is already helping young Kiwis focus on learning the skills they need to succeed, and schools across the country are reporting more engaged kids, louder playgrounds and sports fields at lunchtime, more positive interaction, and less cyber-bullying. We’re committed to delivering better public services for Kiwis. This is just one part of our plan to do exactly that.\n\nRt Hon Chris Hipkins: What additional factors was he made aware of between 4 March, when he expressed full confidence in Melissa Lee, and last week, when he dismissed her from the broadcasting portfolio?\n\nRt Hon CHRISTOPHER LUXON: As I discussed last week, Melissa Lee, and Penny Simmonds, for that matter, are hard-working, good Ministers doing an excellent job, but those portfolios became more complex and more complicated, and I want them managed by senior Ministers.\n\nRt Hon Chris Hipkins: What additional factors was he made aware of between 26 March, when he expressed full confidence in Penny Simmonds, and last week, when he dismissed her from the disability portfolio?\n\nRt Hon CHRISTOPHER LUXON: Again, as I said, the agenda in disability issues became more complicated and complex, and I want that managed by more senior Ministers. But what I’d just say is that that’s the same leader who was a Prime Minister, along with Grant Robertson, his former Minister of Finance, who actually got advice about the problems in that department, agency, and their management of their money and their budget and did nothing about it. It was typical of his Government to not face up to issues, to not deal with them. We’re doing that.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. In reference to the last segment of the Prime Minister’s answer, it neither related to the question nor is anything that the Prime Minister has any responsibility for. Will you give me a couple of extra supplementary questions in compensation for that?\n\nRt Hon Chris Hipkins: Thank you, Mr Speaker. Does he agree with David Seymour and Shane Jones’ criticism of the Waitangi Tribunal; if not, why not?\n\nRt Hon CHRISTOPHER LUXON: Again, what I’d say to you: I have strong Ministers doing an excellent job, and both those Ministers are doing exactly that.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. I asked the Prime Minister whether he agreed with the criticism that David Seymour and Shane Jones have made of a Government entity—the Waitangi Tribunal—and, if he didn’t, why he didn’t agree with them. He didn’t even address that.\n\nRt Hon CHRISTOPHER LUXON: I wouldn’t characterise it that way. What I would say is that I’ve made my statements on that, and you saw that in the media last week.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. Public statements that Ministers make—certainly, the subject can be the subject of questioning, but they’re not read into the record of the House. A Minister—any Minister—being asked a question shouldn’t be referred simply to public statements that have been made. The Minister has an obligation to answer to the House.\n\nRt Hon Chris Hipkins: Does he believe that David Seymour’s and Shane Jones’ criticism of the Waitangi Tribunal breaches the Cabinet Manual?\n\nRt Hon Winston Peters: Has the Prime Minister told his Cabinet colleagues to concentrate on great principles and great political programmes rather than venal, vicious personal attacks?\n\nRt Hon CHRISTOPHER LUXON: I think all my Ministers are very clear we are here to get things done for New Zealanders, and they’re doing a great job doing that.\n\nRt Hon Chris Hipkins: Will the Prime Minister take disciplinary action against ministerial colleagues like David Seymour and Shane Jones attacking the legitimacy of the Waitangi Tribunal, in breach of the Cabinet Manual; if not, why not?\n\nRt Hon CHRISTOPHER LUXON: Look, I have to say the sanctimony from that member is quite outrageous, because it took him longer to sack Michael Wood than it will take for the backbench to sack him.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. Not only does the Prime Minister not have responsibility for that, he hasn’t addressed the question that was asked.\n\nRt Hon Chris Hipkins: Who is right: the Prime Minister, who said that ultimately he determines the performance of Cabinet Ministers, or David Seymour, who said that the Prime Minister sacking an ACT Minister would be a breach of the faith of the coalition agreement and would be a major problem?\n\nRt Hon CHRISTOPHER LUXON: The Prime Minister.\nQuestion No. 4—Prime Minister\n4. DEBBIE NGAREWA-PACKER (Co-Leader—Te Pāti Māori) to the Prime Minister: Does he stand by all his Government’s policies and actions?\nYes.\n\nRt Hon CHRISTOPHER LUXON: Again, what I’d say is that we have a great fast-track process. It’s designed to get things built in this country, but a key component of it is an independent expert panel that will weigh up considerations economically, environmentally, and socially, and inform Ministers.\nDebbie Ngarewa-Packer : How can the public have confidence in this Government’s Cabinet overseeing the decisions of the hundred projects in the Fast-track Approvals Bill when Ministers are not disclosing their conflicts of interest?\nWell, there are no projects that have been approved.\nDebbie Ngarewa-Packer : What actions will the Prime Minister take to ensure that his Cabinet Ministers will adhere to the Cabinet Manual around the conflict of interests, if given, for the Fast-track Approvals Bill?\nWe have well-established processes on managing perceived or real conflicts of interest, but, again, we make no apologies about introducing fast-track legislation. It is important that we get things done in this country. We are over the talk and discussion; we need to get things built.\nDebbie Ngarewa-Packer : Has the Prime Minister got any register of current conflicts of interest before the beginning of the Fast-track Approvals Bill as it hits the select committee, or after the select committee process?\nAgain, we have well-established processes for managing ministerial conflicts of interest, the Cabinet Office, and Ministers, but, again, we have not yet got a full set of projects. We haven’t got any projects that are approved yet. That’s the point of introducing this legislation: so we can get some projects approved and done and building.\n\nRt Hon Winston Peters: Supplementary question, Mr Speaker—sorry, point of order. That questioner said that Ministers are not disclosing conflicts of interest. Now, sir, that is a very serious allegation. There’s not one shred of evidence to back it up: no proof whatsoever; just an insinuation of deceit by parliamentarians in this House. That, sir, is not acceptable under Standing Orders. It’s going to lead to a serious disorder and a few armed troops if she goes any further down that track.\n\nRt Hon CHRISTOPHER LUXON: Our Government is going to make sure that the wellbeing of children comes first, but that issue is before the courts and it’s inappropriate for me to comment.\nDebbie Ngarewa-Packer : Does he agree with Tama Potaka on 26 July 2023, regarding the repeal of section 7AA, that “It would be contradictory of us to dismiss this provision entirely, which is intended to be a genuine option to address and meet the best interests of the child in State care.”?\nAgain, this Government is focusing on making sure the wellbeing of a child comes first and foremost as the important thing that we have to do, but this matter is before the courts and I won’t be commenting any further on it.\nDebbie Ngarewa-Packer : Does he agree with Harete Hipango on July 2023, regarding section 7AA, that “If the National Party gets into Government, we would not be repealing it,”, and, if so, what has changed since then?\nWe are going to make sure that we prioritise the welfare of our most vulnerable children so they end up in loving homes. That is job number one. But I will not be making any further comments, given that this is under appeal through the courts this week.\nQuestion No. 5—Education\n5. KATIE NIMON (National—Napier) to the Minister of Education: What reports has she seen about the “away for the day” cellphone policy?", "window_id": "2024-04-30#1"}, {"statement_id": "9fd2954b72b2c60a", "politician": "Carl Bates", "party": "National", "side": "government", "date": "2024-05-28", "statement": "They are highly likely to be malnourished, highly likely to have significant mental health challenges or social challenges from that crossing, and upon arrival on our shores they will need those challenges supported—before we even start talking about the legal process that they’ll be going through.", "window": "CARL BATES: Thank you, Madam Speaker. It’s my pleasure to rise this evening and speak in this third reading of the Immigration (Mass Arrivals) Amendment Bill. I just want to acknowledge the work of the Minister of Immigration in getting this through the House, something that wasn’t able to be achieved under the previous Government. We’re now getting it delivered and getting this risk management framework, essentially, in place, to ensure that in the circumstance that we have the occurrence of a mass arrival, we have a framework and a structure to deal with it. Essentially, that’s what this bill is about.\nThere’s been a lot of talk this evening about taking it seriously. I think it’s important that everyone who’s watching this debate this evening—and watched the first and second readings and the committee of the whole House stage—appreciates how seriously the Government and the members of the Foreign Affairs, Defence and Trade Committee that would have been responsible for this on the Government’s side are here this evening. We are engaged in making sure that we get this framework in place. As part of that process, there have been four amendments that have been brought to the House and passed by the committee, to date, under the Minister’s leadership. They are important to making sure that we have the right framework in place, and the Minister spoke to those earlier this evening.\nLet’s look at what this framework is, essentially, about. Currently, should there be a mass arrival event, there’d be 96 hours in which the legal profession would have the ability to come together and support those asylum seekers, to do the necessary processes in order for their applications to go in and their status to be determined. And it’s simply not practical. It’s not practical, because we’re talking about people and their families—men, women, and children who have travelled across the seas in boats that are probably unlikely to be in any good shape for that journey. They are highly likely to be malnourished, highly likely to have significant mental health challenges or social challenges from that crossing, and upon arrival on our shores they will need those challenges supported—before we even start talking about the legal process that they’ll be going through.\nAlong with that, we’re talking about whether or not there are actually enough lawyers in place to be able to support that mass arrival process in the first place, and the reality is there simply aren’t. There’s about 40 lawyers, as I understand it, across the nation, who would have the ability to be mobilised to support an event like this. Should it occur, for example, on a Friday night, that they land at Ninety Mile Beach—as was suggested earlier this evening by my colleague the MP for Napier, Katie Nimon—in the grand electorate of my colleague the MP for Northland, that would take a couple of days out of that 96 hours before the lawyers had even got the opportunity to start working. It simply isn’t practical.\nI don’t want to see this happen. None of us want to see this happen. It’s unbelievable, actually, that our colleagues across the House—and I’m not speaking about my Labour colleagues, but some of the others—have made suggestions that we actually want this to happen, or the sort of attitude that we’re not taking this seriously. I tell you what I find extremely difficult to take seriously: this idea that we should somehow have a whole lot of lawyers on standby, a whole lot of places on standby, ready to support this should it occur, so that it can happen in 96 hours. At the same time, those same members opposite are talking about how this is unlikely to happen in the first place.\nIt’s a little bit like Budget week’s come early, because it seems to me that those members opposite think that there’s a bottomless pit of money that could be spent on hiring a whole lot of asylum seeker lawyers, training them up, and having them ready to support an event that is highly—or not highly but certainly unlikely, has a low probability of happening; not something that we want to happen but something that we need to make sure there’s a framework in place for. The idea that we should just resource them, that we should just appropriate it, I just can’t take seriously. It is simply nonsensical to suggest that as a Government we should be doing that.\nThere is a reason why there are a small number of lawyers in this country that would have the ability to support a mass arrival, a group, should it arrive on our coastline, and that’s because it’s unlikely. There’s not a huge amount of this work. If we had to be in a situation that we didn’t pass this legislation, that we didn’t put in a framework that enables us to manage this risk, however unlikely it is, we’d be in here under urgency trying to pass a piece of legislation that would end up being retrospective, and those same members opposite would have a problem with that. It’s because those members opposite simply do not understand how to make decisions, create practical frameworks, and ensure that we’ve got the sort of legislation in place to support this sort of event, should it happen, and I’m sure we’re going to hear much more of that unnecessary bravado from members opposite in the days to come this week. I commend this bill to the House.\n\nHon RACHEL BROOKING: Thank you, Madam Speaker. It’s useful to be talking about a bill about planning, in a sense, and planning for something that nobody wants to happen, with it being a mass arrival by a craft, which, of course, could be a plane or a boat. We’re very proud of the fact that we can now settle 1,500 refugees in New Zealand, and we have a very wonderful facility. People work helping refugees in Auckland learn about what it is to live in New Zealand, and all the benefits that come with that.\nI’m also happy to be talking about a bill that has been amended in the committee of the whole House stage, and there have been some very useful amendments at that stage. My colleague Camilla Belich touched on many of those.\nOne that I’ll just note, in clause 12, is the amendment to section 330, which is “Approval of premises for purpose of immigration detention”. At the moment in the Immigration Act, it says that “The chief executive may approve any premises for the purpose of detention under this Act.” Then what happened? One of the changes in the committee of the whole House was that it now says, “Despite subsection (1), the chief executive may not approve a police station or prison as a place that may be used to detain 1 or more members of a mass arrival group”.\nSo that’s an important change. Perhaps it should say “must not approve”, but it’s clear in the context of the legislation that police stations and prisons are not to be used, and that’s an important change. I commend the bill to the House.\n\nMIKE BUTTERICK: Good evening, Madam Speaker. I previously spoke about what this bill was really about. Firstly, it was about risk and management of it, should a mass arrival occur—that risk that could potentially manifest itself as a threat to our own national security and also the risk that could very well be a reality to those that may arrive. I also talked about due process and the need to have a fair and equitable process in place, and about the need to have a plan to enable timely access to legal advice to allow for fair representation and applications to be considered, and I also spoke about how this Government is practical and sensible enough to change our position. We’d previously held a position of opposition to this bill. However, once we were able to access what was previously considered confidential information, we did change our position and now support this bill.\nAlthough there’s a low likelihood of mass arrivals to New Zealand, we’re living in a false paradise to assume that a mass arrival won’t occur. Who are we kidding? You’ve only got to look at what’s happening around the world—the political unrest, the conflicts, the persecution—and you very quickly realise that there is an elevated risk of a mass-arrival event occurring here, and a failure to anticipate and plan for this would be a mistake. A failure to plan would simply be a plan to fail.\nThis bill’s not about imprisonment or incarceration, as some members on the other side of the House would have us believe; nor is it about saying that immigrants are dangerous to this country. I’d reiterate the value that immigrants add to our communities and to our economy, with the culture and the values that they bring with them, and I’d acknowledge all that they add—certainly, in the many recent visits I’ve had in the Wairarapa, in the Tararua, in the Hawke’s Bay, with many, many groups. They’ve been nothing short of inspirational, and I’m incredibly privileged to have been welcomed into their families, their lives, and their communities.\nThis bill is not about scaremongering and misinformation. It’s about one thing only: having sensible, pragmatic legislation that allows us to have a balance—a balance between detaining any mass arrivals while ensuring they also have a right to access legal advice and representation to support their applications.\nI spoke previously about allowing extra time. That’s not a negative; it’s common sense. This bill is about protecting those arrivals’ rights, along with ours, and having a right to put forward a case to remain in New Zealand—again, in the unlikely event of a mass arrival. The current time frames are entirely impractical. Security and health-screening checks are likely to need significantly more time to complete, and allowing more time will ensure that judicial decision makers are afforded all the information that they need to make a fair and considered decision which has taken into account every relevant piece of information.\nTo finish, I’d like to reiterate that whilst initially, as a party, we didn’t support this amendment bill, we’ve made sure to now expedite this process. As my colleague Carl Bates mentioned before, the previous Government that introduced this bill had the means to pass it and had the ability to deliver it into law, but they didn’t. Well, we will deliver it. We are the Government of delivery. We’ll finish the job. We’re back on track. I commend this bill to the House.", "window_id": "2024-05-28#28"}, {"statement_id": "eb902dfe0783ad1c", "politician": "Simeon Brown", "party": "National", "side": "government", "date": "2024-09-18", "statement": "Thank you, Madam Chair. I want to acknowledge the member, who’s the chair of the Transport and Infrastructure Committee.", "window": "Hon SIMEON BROWN: To acknowledge the question, in terms of the Northland Expressway, ultimately, that is one of the roads which already has a consent and it is critical to the resilience and the economic productivity of the North, and it’s also part of our coalition agreement with New Zealand First.\nIn terms of the questions from the Hon Julie Anne Genter around public transport projects, I mean, councils always bid more projects than are able to be funded, and that is ultimately what happens across all of the activity classes. There are always more projects than can be funded. The reality is, if the member wishes to put specific questions in writing, as she is genuinely quite good at, I would be very happy to answer that through the normal process, but the reality is that this Government has a significant record of public transport investment in this National Land Transport Programme and in the Government policy statement. It’s the biggest ever expenditure on public transport services and infrastructure in any national land transport programme—$6.4 billion. This is the biggest ever expenditure on public transport in any national land transport programme, and that is something we’re incredibly proud of on this side of the House, and we know it’s going to make a difference.\nI just want to reiterate the point that the last Government talked a big game on public transport. Let’s get Wellington consulting—well, you have to acknowledge them for the monument to Let’s Get Wellington Moving, which we drive past on Cobham Drive. The crossing there, that is the monument to Let’s Get Wellington Moving—2.4 million bucks for that, and tens of millions of dollars on business cases. Let’s talk about the $230 million or $250 million of “Auckland light fail”—didn’t even get to page 300 of their business case.\nNow I’ll answer the question around footpaths. I hear the members are very interested in the answers to footpaths. There is investment in footpath and in cycleway maintenance renewals—$114 million in the National Land Transport Programme, so here they are trying to make the claim that there is $0 for footpath maintenance. There’s $114 million for footpath and cycleway maintenance in the National Land Transport Programme, and that will go towards councils and support them in doing what they do on their networks.\nIn relation to the National Land Transport Programme, there is a loan which has been provided to the New Zealand Transport Agency. I think it’s a billion dollars per year. There has also been a capital grant allocated towards that. As we’ve talked about earlier, there’s a billion dollars of contingency capital to help support and advance projects such as the roads of national significance and the Northern Busway.\n\nANDY FOSTER: Thank you, Madam Chair. Look, I’ve got three questions. The first one of them is: we had some interjectory comments about the fast track being very much the same as the previous fast-track regime, but I just wanted to ask you—I went up to visit the Mount Messenger project not that long ago, and the hold-up there wasn’t resource consent so much as the ability to acquire land—in other words, the Public Works Act (PWA). I’d just like some feedback on that and the relationship with the fast-track legislation in terms of the PWA.\nThe second question: Minister, both you and the Transport and Infrastructure Committee have spent quite a bit of time looking at temporary traffic management, and the member opposite has kind of ridiculed that a little bit, but I’d be very interested, Mr Minister, in your observations about the potential savings that there are. The New Zealand Transport Agency (NZTA) has done some great work in changing the temporary traffic management code, but the potential savings that there are going to be through that. Also, how is that going to be monitored so that we can actually keep not just the NZTA but all roading authorities and other utility authorities efficient?\nThe third question that I wanted to ask, which is a very specific one that I have discussed with you, is the Marlborough Sounds. The roads there were obviously seriously damaged by the floods back in what was 2022, and there’s been a lot of consultation with the community there about how to fix them—particularly the Kenepuru Sound, which is a very, very long, winding road. It’s a beautiful part of the world, but it’s a very challenging piece of infrastructure, which, of course, the next time there is a major downpour, is quite likely to fail again. There has been some conversation about thinking laterally, and instead of accessing some of those areas by road, accessing them by water, as is done in that area for, say, D’Urville Island or Arapawa Island already. The question is whether that would be a more resilient way of doing things, to fund that rather than to fund the road into—so maybe bits of road, maybe bits of water-borne asset infrastructure—so that those communities remain connected and remain resilient the next time there is a major storm event. I look forward to your answers.\n\nHon SIMEON BROWN: Thank you, Madam Chair. I want to acknowledge the member, who’s the chair of the Transport and Infrastructure Committee. He does a great job getting around the country, actually visiting the regions, understanding the issues, and visiting the projects. I want to acknowledge your visit to Mount Messenger, which is a project which has become significantly challenged. I was up there recently with David MacLeod and Barbara Kuriger—the local members of Parliament.\nOne of the challenges there has become the Public Works Act. Yes, there are consenting issues. That is why fast track is about making sure that we consent projects like that faster and more efficiently and deal with the complexity of consenting. The Public Works Act is also part of the challenge. I’m working very closely with the Minister for Land Information, who’s in charge of the Public Works Act, around reforms that are required to the Public Works Act, because a project can be consented but then it can be held up for many years, adding huge amounts of cost to taxpayers or hundreds of millions of dollars of cost to taxpayers, and slowing down and actually inhibiting those who require the use of that road to be able to achieve the economic benefits or safety benefits or the resilience benefits that that type of infrastructure would provide. There’s a review of the Public Works Act under way, and we’re looking at what changes might need to be made to make that more efficient. If we don’t fix that, we can have fast track for transport projects, but we will still be held back, so we need to sort that through.\nIn terms of temporary traffic management, there’s a number of things that we’ve outlined in the Government policy statement (GPS) around the approach required in terms of temporary traffic management. We’ve made it very clear that we need to see more efficiency and effectiveness across both State highways and local roads when it comes to the use of temporary traffic management. I think it’s fair to say New Zealanders are sick and tired of the cost and also the inconvenience which can sometimes often be caused by temporary traffic management.\nThe New Zealand Transport Agency (NZTA) has responded to that in the GPS in a number of ways. Firstly, they are reviewing traffic management set-ups on the State highways and instructing suppliers to remove temporary traffic management that is not necessary. In February, they audited 800 worksites across the network and found that 26 percent of unattended sites were actually not required. That just, I think, gives evidence to the intuition of everyday Kiwis driving on our roads, who realise that, actually, a big proportion of this stuff isn’t actually needed. NZTA is taking a more proactive approach to ensure that when that temporary traffic management is not needed, it is removed, and that motorists are not being inconvenienced by temporary traffic management which isn’t needed.\nThat’s one thing—also, transitioning from the old temporary traffic management code to the new guide. That is based more on a risk-based approach rather than a safety-at-any-cost approach, which was the previous approach. The previous approach literally would determine how many cones and how many metres between cones and drove the industry very hard in terms of temporary traffic management, but without any concern for costs. The reality is, again, it’s taxpayers and ratepayers who pay for this, so transitioning that to the new guide will deliver savings by adopting a risk-based approach rather than being prescriptive, and that’s a critical component. NZTA is now working to roll that out into all of their contracts, their capital contracts and their maintenance contracts, as quickly as possible. My expectation is for local road-controlling authorities to do the
