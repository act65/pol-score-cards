 million of funding for Te Ahu o te Reo Māori, which is to train Māori teachers to be able to deliver?\n\nHon WILLOW-JEAN PRIME: Sure, yes. Replacement section 127, inserted by clause 8, the removal of giving effect to Te Tiriti o Waitangi. Madam Speaker, for your benefit, prior to you arriving, the Minister made some quite broad contributions, and as the previous Chair pointed out, opened herself up to this very type of questioning and debate. So that was made very clear by the presiding officer who was here immediately prior to you.\nNow, the Minister, in her last contribution, as you were switching over, talked about how she was proud of this Government’s record of giving effect to Te Tiriti o Waitangi and the responsibility of the Crown by giving Māori resources to kids, by translating them. So, I am responding to that. The Minister stopped me as I was interjecting over here and said that I will get my turn. So, in my turn, I am asking the Minister to now answer the questions that she invited me to ask.\n\nHon WILLOW-JEAN PRIME: Now, I look forward to the Minister answering those questions. I also want the Minister to explain very clearly for the House—\nCameron Luxton : And slowly for the member.\nThat’s right—really slowly, really clearly, in real detail, what she understands the Crown’s obligations to Māori under Te Tiriti o Waitangi are. And in the Cabinet Manual, what are the Crown’s duties and obligations in education to give effect to Te Tiriti o Waitangi? What are the obligations of partnership? What are the obligations of active protection? What are the obligations of equity? Can the Minister please tell me what she understands her obligations are, as the Crown, in terms of Te Tiriti o Waitangi?\nCan the Minister then tell me how she intends to ensure that schools do this if the boards of trustees no longer have any responsibility under this legislation and the proposed removal of this requirement on them? The Minister is going to delegate duties to boards of trustees but not any responsibilities. So how is the Minister, who says she’s going to retain that responsibility—what mechanism is she going to have in place to ensure that schools and boards of trustees are upholding her Treaty obligations? Because you’re removing one of those provisions. So, can the Minister tell the House, this evening, how she intends to monitor that so that parents across Aotearoa know that she is not simply delegating authority to school boards with no responsibility and that it just falls through some gap, which I’m sure is actually one of the key objectives of this? How will you ensure that that is upheld?\n\nHon ERICA STANFORD: Going back to the start of that contribution where the member was asking around the provision of te reo resources—and this may go to part of my questions as to why the previous Government didn’t do this; I’m now starting to understand it. But under the Waitangi Tribunal’s decision, Wai 11—and the member would be advised to go and look at that decision, which says that treating te reo Māori as a taonga is important and that te reo Māori is, in fact, a taonga under the Treaty of Waitangi and it deserves active protection. The way that we do that in education is to make sure that we are providing resources, that there is bilingual education like the kura kaupapa and rumaki units, and that we are actively protecting the language, and a part of that is to provide resources. It’s only one way, but it is an important way of making sure that we are actively protecting that taonga of te reo Māori, which is exactly what we’re doing. There are a lot more things that we do in order to do that, but the member asked that particular question about resourcing.\nThe member also went on to ask what I think honouring the Treaty means, and I’ve said this a number of times. In article 3 of the Treaty, it’s very clear that the rights and responsibilities are given to Māori as they are British citizens, if you take the literal reading of the Treaty of Waitangi. That means, when we think about education, that tamariki Māori are receiving an education and they have equitable outcomes. That is why that yawning gap between Māori achievement and non-Māori achievement over so many decades has meant that we haven’t been doing all we can do to uphold that part of the Treaty, which is why I am so focused on every single thing that I do in the mainstream to make sure we’re also doing it in te reo Māori.\nAll of the things I’ve already mentioned, I won’t go over them again, but we are also being very clear with school boards. As I’ve already said, it’s very vague to say to a school board that you need to give effect to the Treaty of Waitangi, because what does that mean, in effect, for a school board? And I’ll tell you what, the member opposite hasn’t actually said what she thinks that it means. We are being very, very clear. We are saying that you must offer te reo Māori when students request it; you must make sure that you are attempting to achieve equitable outcomes for tamariki Māori, and you must make sure that you are being culturally competent: very clear and specific to boards so they know exactly what they need to do. It’s all very well to just put words in without actually being clear about what they mean, because what happens is that boards lose their focus, and we want them to be laser focused on raising achievement, closing the equity gap, and doing those things to raise Māori achievement. That’s what we’re focused on doing.\n\nCUSHLA TANGAERE-MANUEL: Tēnā koe e te Māngai o te Whare. Tēnā koe e te Minita. Otirā, tēnā tātou katoa. It's my pleasure to stand here as the presiding member of te kura kaupapa Māori o Taperenui a Whatonga to seek further clarification around section 127.\nBeyond te reo and beyond resources, can the Minister of Education accept that giving effect to Te Tiriti o Waitangi looks different according to iwi, hapū, community, and the tikanga and kawa processes of that iwi, hapū, and community? If so, how can the Minister monitor effectiveness and, of course, ensure consistency? I mean, I'm yet to hear a good argument about why we're honestly mucking around with Te Tiriti o Waitangi.\n[Authorised reo Māori text to be inserted by the Hansard Office.]\n[Authorised translation to be inserted by the Hansard Office.]\nIt's absolutely unnecessary. To simply say that if someone wants access to their reo, to their culture, they can request it, already disenfranchised people are not going to do that. They are going to sit—\n\nCUSHLA TANGAERE-MANUEL: [Authorised reo Māori text to be inserted by the Hansard Office.]\n[Authorised translation to be inserted by the Hansard Office.]\n—because they've been downtrodden by ridiculous laws like this. That's why Te Tiriti being in these documents is so important, so ignoramuses can't detach people from their culture and their reo. But the question is: how can a Government asking stupid questions like that give us any comfort?\n\nCUSHLA TANGAERE-MANUEL: How can anyone in this country feel reassured that Te Tiriti will be honoured when we've got Government Ministers making silly quips like that about the value of Te Tiriti and access to te reo and tikanga and identity?\nSo in simplistic terms, how will the Minister monitor the effectiveness of this? What qualifies the Minister to ensure Te Tiriti will be given effect across schools across Aotearoa and therefore how will she ensure the consistency when the delivery giving effect to this will look different and it should look different in every school community, and that's what boards can be charged with. Tēnā tātou.\n\nHon ERICA STANFORD: One of the easiest ways to ensure that you are raising achievement—which is, again, the core tenet of a Treaty duty: to make sure that tamariki Māori are succeeding to their full potential, which we have not done in this country for some time—is to make sure that we're assessing our young people. That's why we created Hihira Weteoro, which is a phonics check that is designed specifically—a world first, as far as we can tell—for Māori children learning in bilingual units. It tests them at 20 weeks, 40 weeks, and 55 weeks—understanding that they are learning in a bilingual environment, in some cases, or in full immersion—to make sure that they are staying on track with their learning. Where they fall behind, we pick them up with our literacy intervention teachers and programmes that we have put in place, which are very, very important.\nWhat we're also doing is making sure that, for the first time—this has never been done before; the previous Government didn't do this—we’re actually assessing. Taking a sample assessment in our Curriculum Insights and Progress study, where we take samples of children in years 3, 6, and 8 in the mainstream and assess them in reading, writing, and maths to make sure that they're on track and that Government policies are working—for the first time, we're going to be doing that in immersion settings as well.\nSo the best way to make sure that we are achieving equitable outcomes is to actually ask the question, are we? We haven't done that before. We haven't had really good data across our mainstreaming and immersion units.\nAlso, from next year, there will be a requirement to assess, using one of the three assessment tools, reading, writing, and maths, twice a year, every year, from year 3. So it will be very telling how achievement is going and whether or not we are making sure that there are equitable outcomes for Māori students.", "window_id": "2025-11-04#14"}, {"statement_id": "a018716648a80692", "politician": "Rima Nakhle", "party": "National", "side": "government", "date": "2026-02-18", "statement": "This bill would increase trading days, meaning workers have fewer public holidays, which means less time off with whānau, especially for low-wage workers in our hospitality and retail sectors.", "window": "RIMA NAKHLE: Yes. That’s what Lebanese people do. The Christians allow their children a little bit of access, so it’s not a big deal to us—“Oh my goodness! When I turn 18, I’m drinking alcohol.” Other families are not like that, and so I do not support this bill, because I want the kids to have full access to their parents on these little few days that are left where there are some restrictions on buying alcohol and alcohol consumption. I want the parents to be fully engaged, instead of thinking about leaving or going somewhere earlier so they can have a drink. I don’t want extra access to alcohol. I’m sorry for the businesses that find this frustrating and tedious, but, for me, what’s more important is kids having their parents fully engaged.\nI’m sorry to the member across the House—I know you’re fighting fervently for it—but for me personally, I do not commend this bill to the House.\nCAMERON LUXTON (ACT) (20:13) : Thank you, Madam Speaker. I rise in support of this bill, and I want to start with the select committee process, which I personally wasn’t a part of, not being a part of the Justice Committee, but my ever-reliable colleague Todd Stephenson did listen to submitters and did the hard work, engaging and working through these issues carefully. I know that he engaged well with Kieran McAnulty, the honourable member—we won’t go down that track again—who has been extremely helpful in conversations about how this is going through the committee.\nSubmitters came forward, Todd informs me, with strong support for the bill, but they also raised quite a few concerns. A lot of that is focused on the distinction between on- and off-licences and how this would be affected by the proposed changes. I think the member whose bill this is has outlined that quite well, his thinking through that, in his speech given just now. There were concerns raised about whether having off-licences trading on restricted days would increase harm, given that involves unsupervised consumption—because who could trust adults to operate in this world and grow a sense of responsibility and be punished when they abuse that? As a result, the committee recommended amendments that removed changes to off-licences. In short, these reforms that happened at select committee narrowed it significantly, and I think that that narrowing was unnecessary and quite disappointing, actually. Todd Stephenson made it very clear during the process that the original intent of the bill was the right one, and it has already been signalled to the honourable member in charge that ACT is putting forward amendments at the committee of the whole House stages to restore the intent of the original bill, because if we’re going to fix something, we should just fix it properly.\nNow, stepping back from the select committee, I’ll talk about the broader ideas of this bill. The member has acknowledged religious concerns and also concerns being made about health. Now, it’s not unknown to this House that I’ve previously had a member’s bill on this topic. In fact, it’s been alluded to. The health concerns about people having access to supply—the member in his speech didn’t quite say what I want to say right now, which is if you restrict people on days from buying alcohol, they stock up. There is no drop in the amount of alcohol consumed. People stock up beforehand. I don’t know about you, but during the COVID madness, there was a certain run on toilet paper. Now, I didn’t partake in this run on toilet paper, but people overbought toilet paper. We had houses up and down the country full of toilet paper. Do you think that it is healthy and helpful for someone who’s got a troubling connection or relationship with alcohol to have piles of alcohol? I don’t think that is healthy. I think we can make a pretty good supposition that that isn’t an outcome that we want to see. Allowing a stable and predictable supply, I believe—and there is evidence to show this—leads to less harm. I think the member whose bill this is might like to take a stronger stance on that in his defence of it in the future.\nThe restrictions are relics from our past. They reflect an era when it was considered normal for the Government to micromanage adults who could legally purchase a product. Judging by some of the commentary—again alluding to the bill that I brought through this House and the first reading speech—that is still alive and well in New Zealand. There are those who would quite happily go back to the times of micromanaging New Zealanders’ lives. Thankfully for the people of New Zealand, and unfortunately for those who hold on to relics of the past, New Zealand finds archaic laws, and we have the ability to change them.\nToday, licensed premises are allowed to open on these days and serve food. They can serve non-alcoholic drinks, and they can, essentially, operate as usual, but alcohol is restricted in ways that just don’t make sense—adults being treated like children, told what they can eat, when they can eat, and how they can eat. I talked to many people up and down this country during my engagement in the communities that are affected by this type of legislation, when I was working on the Easter-trading restrictions bill that I was working on, and I heard from people saying, “I don’t feel comfortable having to go up to people and say, ‘That’s enough. You haven’t eaten enough.’ ” You’ve got people who are working part-time jobs, university students or young people on their first job, having to go out and talk to a family who are out to enjoy themselves and spend time together on Easter, and wider families, and say, “No, that’s enough. I can’t let you have any more. It doesn’t make any sense. Let me explain this crazy rule to you.” It’s not something that a young person working one of their first jobs or a part-time gig really wants to be going through.\nIt’s arbitrary, it creates compliance headaches, and it places unnecessary burdens on small businesses. It’s not the big supermarket chains that feel the constrictions and constraints of these rules; instead, it’s the local cafes, it’s your favourite restaurant on the corner, and it’s the family-owned bottle store that you go to. It’s the hospitality operators who are already navigating on extremely tight margins. Most Kiwis who had ever run a business or dealt with compliance have a pretty low tolerance for rules that don’t serve a clear purpose. This archaic rule that we have in place right now does not serve a clear purpose. These rules are very hard to justify in 2026, in a modern, mature, liberal, democratic society. We trust people to vote, to drive, to run businesses, to raise families, and to pay taxes, but for a few specific days of the year, apparently we don’t trust them to buy a bottle of wine.\nI’m interested in something that’s at the core of this bill: it’s freedom. It’s allowing people, when you’re licensed, to engage in commerce and operate responsibly. This is something that we should be able to do under normal conditions, even on restricted trading days. If we can find common ground across the House on cutting unnecessary red tape and trusting adults, I genuinely don’t care where the ideas originated, because ultimately it’s about practicality. But we do need to be honest; this bill is only a small change. It’s part of an issue that needs wider reform. It nudges the settings in the right direction, but it only trims around the edge of the problem. It cannot end this conversation here.\nWhen I brought to the House the aforementioned bill that I did, it wasn’t just about alcohol service conditions; it was about the wider issue of restricting trading hours themselves, because they are a route of inconsistency. Across the country, different rules were constraining the way businesses could operate with no justification, other than, “I want to stop somebody doing something.” If we want this to mean something real in the real world, not just on paper, we need to be honest about the scale of the problem. Hospitality businesses are already stretched; a minor tweak is not going to fix that. Unless we’re willing to take a proper look at trading laws as a whole, we’re just nibbling at the edges. We need consistency in this space—consistency between shop trading hours and alcohol law—up and down this country. This bill is a step, but it’s not the destination. As a Parliament, we cannot pat ourselves on the back for passing this while we ignore a wider trading regime that still creates confusion and unnecessary restriction. That conversation has happened but still needs to happen.\nOverall, I’m pleased with this bill, and I hope it passes through the House today. It moves in the right direction. I urge all members to support it, and I look forward to the committee of the whole House, where ACT will be proposing amendments to restore the original intent and make New Zealand just that little bit freer. Thank you, Madam Speaker.\nKAHURANGI CARTER (Green) (20:23) : Thank you, Madam Speaker. Congratulations to the member the Hon Kieran McAnulty for having their bill pulled from the biscuit tin. This is a personal vote, and our caucus are all on the same page, and we will be opposing this bill.\nThe Greens have long fought for workers’ rights. This bill would increase trading days, meaning workers have fewer public holidays, which means less time off with whānau, especially for low-wage workers in our hospitality and retail sectors. Although workers can refuse to work on Easter public holidays and Christmas, refusal to work in our current system where workers have less power compared to their employer is riskier than having a day off.\nAs the Green spokesperson for mental health and addiction and drug law reform, reducing alcohol harm is something I’m dedicated to. The select committee submission from Alcohol Healthwatch had three key points: one, this bill could further perpetuate the harm caused by alcohol. There is extensive research that tells us that alcohol-related harm in Aotearoa is at unacceptably high levels and causes harm to some of our most vulnerable communities. Two: this bill would increase access to alcohol. This would further promote alcohol availability, contribute to off-licence harm, and could negatively impact our communities. Three: the submission noted that the amendment bill should seek to minimise alcohol-related harm across New Zealand and prevent further harm from happening, where applicable. Thank you, Madam Speaker.\nMILES ANDERSON (National—Waitaki) (20:24) : Thank you, Madam Speaker. It’s a pleasure to take a call on the Sale and Supply of Alcohol (Sales on Anzac Day Morning, Good Friday, Easter Sunday, and Christmas Day) Amendment Bill. I’d like to congratulate the member for having his bill brought this far, which doesn’t happen often. Congratulations there, Mr McAnulty.\nAt the first reading of this bill, I voted in favour of taking it to the select committee, but I did have some concerns as to some of the content of the bill. I’ve had a good look at what the Justice Committee has recommended. I am happy to see that a number of my concerns have been addressed, particularly around off-licence trading during those specified times.\nI think, in an electorate such as mine, where there is a big tourist influence and we have enormous events over Easter in particular—one coming up is Warbirds over Wanaka. In the past, the hospitality providers in the area have not been able to serve alcohol with any of the food that they provide. This will go some way to addressing some of the concerns that a number of my constituents have raised with me. I’ve been lobbied by both sides of the argument, as I’m sure most of the House has. I’ve given it a lot of thought. I believe that, really, if you can’t be organised enough to have your off-licence purchases organised prior to these few days, you probably shouldn’t be drinking at all, really.\nAs it stands, I think the amendments done by the select committee address a number of the issues that some of my constituents had. They certainly address the concerns that the hospitality providers throughout the western side of my electorate and the southern part of my electorate had prior to this bill being introduced. For example, I guess, there are some differences in my electorate—compared to one of the previous speakers talking about hers—where a big portion of those that would be seeking hospitality during these days are tourists and are generally used to, in other countries, receiving a full suite of what’s available from the hospitality providers, in the countries they come from or a lot of the countries that they travel through.\nI guess I’m happy to commend this bill to the House, and congratulations to the member.\nTOM RUTHERFORD (National—Bay of Plenty) (20:28) : Thank you very much, Madam Speaker. I just want to commence my contribution by firstly saying, I personally don’t drink alcohol. It’s not that I’ve never drunk alcohol; it’s just that—", "window_id": "2026-02-18#15"}, {"statement_id": "da701e9260d3ca22", "politician": "Louise Upston", "party": "National", "side": "government", "date": "2026-05-28", "statement": "They would rather be spending their time providing actual healthcare. So did she receive any feedback whatsoever from—and I note the three bodies that are defined in PHPs—psychologists, nurse practitioners, or medical doctors on the pressure on the workforce, and, if not, I’m really keen to know why she wouldn’t have sought that.", "window": "Hon LOUISE UPSTON: It’s online. The other thing I would just say—because there have been a number of comments about it—and so I will say it again is that there is clearly an understanding that, in the use of automated decision-making (ADM), there are risks that come with making decisions in place of a human, which has the potential for bias, discrimination, and inconsistency. That is why the bill strengthens the ADM standard by making it a statutory requirement, and the standard must consider bias, discrimination, legal and policy considerations, fraud considerations, transparency, human oversight, and compliance and assurance. That is exactly what this bill is doing.\nRICARDO MENÉNDEZ MARCH (Green) (15:47) : Thank you so much, Mr Chair. I will be asking one more question of clause 7. That’s on the lines between 25 and 30 in relations to the comments on pregnancy. This is also in relation to the medical certificates coverage. Now, it says, “However, if the health condition is that A is at least 27 weeks pregnant, and A has no other health condition, injury, or disability,”. At the last line before “Consequence of not providing medical certificate”, it states that, basically, the date of the medical coverage must be when A’s pregnancy ended.\nNow, I want to ask, for clarification, why it has been worded on the day that the pregnancy ended? If the prescribed health practitioner (PHP) wasn’t able to comment, for example, on whether perhaps he expects that there may be medical complications after birth, then why wouldn’t that PHP be able to, actually, extend that medical coverage to after the birth? There may not be, for example, health conditions that the person may have—that’s basically what this line says—because it’s possible that the only medical coverage is that someone is 27 weeks pregnant. But, perhaps, the PHP expects that there may be complications afterwards. Why wouldn’t the PHP be able to extend that medical coverage later on down the track, or is it, for example, even if there were no medical issues for the person, for the reason that, perhaps, they expect that the baby would have medical complications after birth? I wonder whether there’s a gap here or whether this is covered by the subsequent child policy. I just want to triple check what the intent is of having worded those particular lines between 25 and 30 the way they are.\nNow, I want to reiterate that we did not have any analysis documents on things other than automatic decision-making, really, so I wanted to just draw your attention to new material on the departmental disclosure statement. The document noted that the Office of the Privacy Commissioner remains concerned about the use of the general authorising provisions that will broaden the Ministry of Social Development’s (MSD’s) ability to use ADM.\nWhat are the concerns of the Privacy Commissioner, because that’s not noted in the departmental disclosure statement. I’d like to know: if the Privacy Commissioner indicated that there were concerns, can the Minister please relate to the committee what those concerns were from the Privacy Commissioner and to what extent did she seek to address the concerns that were raised? Clearly, the Privacy Commissioner is not satisfied, and so I would like to know exactly what feedback she has received from him on the concerns of the use of ADM.\nNow, I also wanted to seek clarification. I know that when the previous Chairperson was there, we had a little bit of a back and forth when the Minister answered two sets of questions just with “yes”. This was in relation to the coverage of automated decision-making, and Carmel Sepuloni talked about the existing use. I just want to seek clarification from the Minister that all the current uses of ADM are legal. That’s just the question I’m asking: are all the current uses of ADM legal and covered under the current legislation?\nMoving on to clause—this is new. I know that my colleagues may have questions on clause 10, but I did want to just move to clause 12 briefly. I wanted to just talk about new section 41 in clause 12, and this goes back to how PHPs may be able to assist some of this stuff. In new section 41 in clause 12, it talks about PHPs being able to, through their coverage, certify whether P is expected to require C’s full-time care and attention but for which P would have to receive institutional care. I just wonder why the threshold was put in requiring full-time attention, or otherwise P would need institutional care.\nWhy is it that the Minister may have not considered, for example, whether, just simply, that the quality of life of P could just be worse off or deteriorating? Why is it that someone would only be allowed as a caregiver to be on the supported living payment (SLP) if someone would be in institutional care if they’re not receiving full-time attention? Some people need full-time attention, and if they don’t get it—they may not necessarily go to institutional care or need institutional care, but their quality of life could be massively affected by it, and I wonder whether that is setting a really high bar for caregivers to access the supported living payment.\nIt goes back to a bit of a broader question around the comments that the Minister raised. She talked about how this isn’t really changing anything, but it was clarifying stuff. I go back to the issue of: well, if it’s just clarifying stuff, what was the policy problem?\nThat leads me to a subsequent question, and this relates to clause 12. The Minister talked about how some people who may be on jobseeker medical should be on the supported living payment—you know, she really wants to make sure that people can go on the SLP. Now, having worked at the front line, it’s extremely rare that case managers are actually actively trying to get someone to the supported living payment from jobseeker medical. Quite often, it’s the opposite. There’s a lot of gatekeeping to actually get someone on the supported living payment from jobseeker medical.\nDoes the Minister have any statistics or data to back up her claims that, for example, people want to actually move someone to the SLP, but they’re unable to do so, and that this clarification will enable them to do so, because I don’t think that we actually have the evidential basis to support that right now, the front line is really trying to move people to SLP when they’re on jobseeker medical. Quite often, it’s the opposite.\nFurther, I’d like some engagement—and, Mr Chair, I take your guidance that perhaps some of the engagement that we’ve received hasn’t been satisfactory. But this is a question that I’ve asked, but I have received no engagement on it, which was around feedback from medical professionals around the burden that the current medical certificate requirements could put on them. For example, I have concerns that if there was no feedback sought from medical professionals, I wonder whether—you know, she’s confident that the ability for MSD to send someone back to a doctor as many times as MSD wants could actually cause pressure on doctors, basically, because why would a doctor be wanting to spend their time assessing a beneficiary over assessing someone who actually needs medical treatment?\nI assume that the medical professionals would not want to be spending their time actually seeing a beneficiary just to fill out some forms. They would rather be spending their time providing actual healthcare. So did she receive any feedback whatsoever from—and I note the three bodies that are defined in PHPs—psychologists, nurse practitioners, or medical doctors on the pressure on the workforce, and, if not, I’m really keen to know why she wouldn’t have sought that.\nFinally, does she have, on clause 12, any estimates that were made on how the provisions in clause 12 may change the number of people who enter the supported living payment on the ground of restricted work capacity or total blindness? I’m interested to know whether the Minister, when designing the changes to the medical certificates, had any estimates on how this would affect benefit numbers for people on the supported living payment. Does she have any statistics or a breakdown by population groups on how this is likely to change access to the supported living payment? I guess this would relate to clause 10 itself, as clause 10 actually also talks about the supported living payment.\nIf she does not have any information on this, are there any parts of this bill or these clauses that actually help support her target of having 50,000 less people on the benefit? Does this bill or the clauses in it—and particularly clauses 10 and 12—help in any way or shape?\nFinally, my last question in this line of questioning, and I want to go back to the use of automated decision-making. Now, the Minister keeps mentioning the current uses of automated decision-making to justify giving carte blanche approval for ADM to be used just more broadly, but something that the Minister hasn’t really engaged with is giving us assurances or a direction or an intent on what else in the future she would plan to use ADM for. Again, the question that I think remains unanswered and has not even been engaged with is why, if there’s only a list of specific uses for ADM that the Government wants to, basically, legalise, you would just open it up. I know the Minister has said, “Technology is great; we should have more technology.”, but can she actually engage in naming some of the potential uses that she would expect that sort of carte blanche, open slather use of ADM to be used for? Finally, does she expect automated decision-making to be used to automate anything within the workforce that could lead to a reduction in full-time equivalents?\nHon LOUISE UPSTON (Minister for Social Development and Employment) (15:57) : I’m repeating myself yet again. This whole Part 1 is about medical certificates and medical reviews. No requirement has changed.\nThis is about the use of automated decision-making (ADM) in applying and using that technology to allow ADM to be used to make greater efficiency. I gave the example. This whole part is all about it. If, for example, somebody gets a medical certificate that is exactly the same as the last one and you use ADM, that then means that it is saving front-line staff’s time so they can use that time for higher-quality conversations.\nI’m saying, again, that for the whole of Part 1, there is no change. There is no change in the requirements. This is just enabling and authorising so that in law it is clear about what we are using ADM for. Look, I’m sorry if the member hasn’t understood that yet, but for the requirements and the eligibility, nothing is changing.\nTo the comment around the jobseeker benefit and whether this will help: absolutely, because it will help ensure front-line staff can spend their time having meaningful conversations with job seekers, as opposed to comparing a medical certificate to the last one, when you can get technology to do that for you. I want the front-line staff of the Ministry of Social Development having conversations with job seekers about what are the barriers they face in getting a job, and they are the best people to do that, and so if I can save them, through this legislation, the time involved on really simple things, that’s exactly what we’re doing.\nHon PRIYANCA RADHAKRISHNAN (Labour) (15:59) : It’s great that the Minister for Social Development and Employment wants to see front-line staff talking to beneficiaries about moving into work, given that there are more people out of work under this Government’s watch—", "window_id": "2026-05-28#23"}, {"statement_id": "cb2591f73dccd60f", "politician": "Ayesha Verrall", "party": "Labour", "side": "opposition", "date": "2024-01-30", "statement": "In that case, why did she deny requesting specific advice on an excise tax freeze for cigarettes in an interview with Guyon Espiner?", "window": "Hon TAMA POTAKA: My response to that reflection and question by the Deputy Prime Minister is: we reiterate that Te Tiriti o Waitangi, the Treaty of Waitangi, is an absolute sacrosanct document fundamental to this country’s past, present, and future, and it will help us get the country back on track after what we’ve ended up with in the last three years.\n\nHon Willie Jackson: Does the Minister’s iwi support the Treaty principles bill, and will he be discussing that with his iwi at Waitangi?\n\nHon Willie Jackson: Thank you, Mr Speaker. Are the Minister and the Prime Minister planning to attend and participate in any of the forum tents at Waitangi; if so, which one, and, if not, why not?\n\nHon TAMA POTAKA: It is scheduled that I will be participating in the forum tent at Waitangi, and I look forward to the humble hospitality of manaakitanga that Te Tai Tokerau is renowned for. Kia ora tātou.\n\nHon Shane Jones: To the Minister for Māori Crown Relations: Te Arawhiti, can the Minister confirm, during the Waitangi period of time, the Government will be focused on concrete, measurable, key performance indicator - orientated results for our rangatahi, housing, and health rather than transcendental notions contained in the He Puapua United Nations report?\n\nHon Willie Jackson: Point of order, Mr Speaker. That’s clearly out of line, isn’t it? He can’t answer that. It’s such a stupid question.\n\nHon TAMA POTAKA: In my Wanganui dialect, ana. Yes, we will be absolutely committed to ruthlessly focusing on the outcomes of education, housing, health, and many other things that have been left behind for our various Māori communities throughout the motu. Tēnā tātou.\nQuestion No. 8—Local Government\n8. JAMES MEAGER (National—Rangitata) to the Minister of Local Government: What recent announcements has he made about the voting age for local government?\n\nHon SIMEON BROWN: On 26 January, I announced that this Government will not proceed with the previous Government’s plans to lower the voting age to allow 16- to 17-year-olds to vote in local elections. Changing the voting age for local government is not a priority for this Government. We want to see councils focused on efficient delivery of local infrastructure and services for their communities.\nJames Meager : What actions has he taken to give action to the Government’s intentions on this bill?\nI have written to the chairperson of the Justice Committee to inform him that the coalition Government does not intend to support the Electoral (Lowering Voting Age for Local Elections and Polls) Legislation Bill through further parliamentary stages and request that the committee ends consideration of this bill. We intend to focus local government on providing good-quality local infrastructure delivering public services at the least possible cost to their communities and businesses.\nJames Meager : Why is lowering the voting age not a priority for this Government?\nWell, this would be a distraction for local government when they should be focused on making sure that they are efficiently delivering local infrastructure and services for their communities. Lowering the voting age is not a priority for this Government.\n\nHon Willow-Jean Prime: Who is correct: the Minister when he said it’d be a waste of Parliament’s time to be progressing a bill and hearing select committee submissions on a bill that we are not going to be supporting or the Prime Minister when he said, “we will pursue a Treaty principles bill to select committee, and that’s as far as it will go.”?\n\nHon SIMEON BROWN: Lowering the voting age is not a priority for this Government, but we have made coalition commitments around the Treaty principles bill, which we will progress.\nJames Meager : Does the Minister think that the voting age for central and local government should be the same?\nYes, it is important that there is a clear and constant age for voting in a democracy. A split age would create an imbalance in terms of the voting ages between central and local government. That is not a priority for this Government. Furthermore, the last Government could not conjure up one single reason why lowering the voting age was a good idea.\nQuestion No. 9—Health\n9. Hon Dr AYESHA VERRALL (Labour) to the Associate Minister of Health: Does she stand by all her statements and actions?\n\nHon CASEY COSTELLO: Yes—in particular, those that relate to my absolute commitment to the Smokefree 2025 target and to providing practical, targeted help so that smokers who are addicted can quit.\n\nHon Dr Ayesha Verrall: Is it correct that she indicated she wanted advice from the Ministry of Health on a tobacco excise tax freeze in a document she annotated and signed on 20 December?\n\nHon CASEY COSTELLO: Yes, in relation to a range of advice, there was a component that asked for the implications relating to the excise tax freeze.\n\nHon Dr Ayesha Verrall: In that case, why did she deny requesting specific advice on an excise tax freeze for cigarettes in an interview with Guyon Espiner?\n\nHon CASEY COSTELLO: I did not state that I had not requested specific advice. I had sought advice on a range of issues which included that one.\nJamie Arbuckle : What do the latest statistics say about the smoking numbers?\nI’m pleased to announce that the latest New Zealand Health Survey figures released in December show that the daily smoking rates among adults have more than halved in the last decade, from 573,000 in 2011-12, to 284,000 last year. Smoking rates have reduced significantly in the last two years; another 55,000 people stopped smoking in the last year alone. This drop in daily smokers is reflected across all ethnic groups, but, significantly, drops have been seen in Māori and Pacific peoples, where we have seen drops from 37.7 percent to 17.1 percent and 22.6 percent to 16.4 percent respectively between 2011-12 and 2022-23. This supports the reasons for continuing on the trajectory that we’re on.\n\nHon Dr Ayesha Verrall: Is she seriously saying that she requested advice on the tobacco excise tax freeze but because the document canvassed other matters, she was being truthful when she denied having sought the advice to the media?\n\nHon CASEY COSTELLO: I was being truthful at the time, in relation to that statement. Being offered something and asking for something are two separate matters.\n\nHon Dr Ayesha Verrall: Was the Prime Minister wrong when he said in statements to Radio New Zealand this morning that she made a mistake?\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. Earlier on in question time today, I asked the Prime Minister whether the Government had sought any advice on freezing excise on tobacco, and the Prime Minister indicated that he was not aware of that. We’ve now had it confirmed by the Minister that in fact she did ask for that advice, and there are media reports where the Prime Minister has been publicly discussing it. The Standing Orders make it clear that if a Minister makes a mistake in their answers, they have to come back to the House and correct that at the earliest available opportunity. Fortunately, the Prime Minister is still in the House and therefore should be able to correct it now, at the earliest available opportunity.\n\nRt Hon Winston Peters: Mr Speaker, you’ve had two questions, and one of them a point of order, that don’t seem to be listening to what was said. If you request advice and get other than that advice—extra advice—it does not mean that you requested the second lot of advice that you didn’t seek in the first place. It’s not complicated, and words do matters in this Parliament. And surely they do matter to the media, who’ve so badly reported this matter in the first place.\n\nHon Dr Ayesha Verrall: Speaking to the point of order, no, I believe the issue under discussion here is whether a Minister made a decision in writing to seek advice on a particular matter. It is not a matter of receiving, as the Deputy Prime Minister has suggested, unsolicited advice.\n\nHon ERICA STANFORD: As schools start back for 2024, there will be a relentless focus on lifting student achievement. This Government’s ambitious target of getting 80 percent of our tamariki to curriculum by the time they finish intermediate by 2030 is our North Star. Recent release of provisional NCEA data showed, for the third year, rates of achievement have declined, and we are going to turn this around. As we begin the school year, I am focused on strengthening our curriculum to be knowledge-rich and underpinned by the science of learning, ensuring we spend enough time on the basics, and that we are removing distractions in the classroom so we set our kids up for success at school.\nPaulo Garcia : What can parents expect will be in place for students this term?\nWell, around New Zealand, students are returning or starting school this week to find new timetables in place that mean that no matter where they go to school or who their teacher is, they have consistent delivery of at least an hour a day of reading, writing, and maths. I’m already starting to hear stories from teachers with their new timetables promoting literacy and numeracy. New regulations are in place around the use of cellphones at school, requiring them to be off and away all day. School policies must be in place for the start of term 2, but it is my expectation that many of these plans will be implemented by the start of term 1 so that students can focus on their learning and interact with their friends.\nPaulo Garcia : What progress has been made by the ministerial advisory group reviewing the curriculum?\nThe ministerial advisory group had their first full-day meeting over the Christmas break. This group brings together curriculum and subject-matter experts who will ensure that our curriculum is knowledge-rich, detailed, grounded in the science of learning, and internationally comparable. Their work programme is well under way and on track to be tested with the sector later this year so that we can remain on track with the scheduled curriculum roll-out dates.\nPaulo Garcia : What feedback has the Minister received about the changes in the 100-day plan?\nI’ve received lots of positive feedback about our plans, but, in particular, an Auckland high school principal wrote to me saying that he is excited about our plans; that the cellphone ban will “remove a major distraction to learning, reduce cyberbullying, and promote social interaction between students”; and that a timetable focused on the basic subjects will ultimately lift educational achievement for all students. Furthermore, Newshub reported the Cashmere High School principal saying, and I quote, “It’s not healthy for students to come to school and … sit … and be glued to [their] digital device”.\nQuestion No. 11—Police\n11. Hon GINNY ANDERSEN (Labour) to the Minister of Police: Does he stand by his guarantee that there’ll be no cuts or reprioritisations to the Police budget in order to deliver 500 extra police; if so, what advice has he received, if any, on the impact the proposed 6.5 percent to 7.5 percent cut to the Police budget would have on public safety?\n\nHon Ginny Andersen: Is it the Government’s policy to deliver 500 extra police within two years as per the coalition agreement with New Zealand First?\n\nHon MARK MITCHELL: The Government’s policy is to deliver 500 additional police officers over the term of this Government, which is three years, and we’ve been very clear that we understand the challenges around that, because, as the incoming Government, we discovered that it was difficult to fill existing recruit wings, that the Australians are here recruiting our police officers, and that we’ve got lots of senior police officers that are coming up to retirement.\n\nHon Ginny Andersen: Can the Minister be clear that he is walking back on the coalition agreement that is undertaken to New Zealanders that he will deliver 500 additional police within two years?", "window_id": "2024-01-30#5"}, {"statement_id": "161fb2eca8d11f21", "politician": "Shanan Halbert", "party": "Labour", "side": "opposition", "date": "2024-02-27", "statement": "Today I salute you for the hard yards that you’ve done, and, by God, we stand with you moving forward. I want to push back on the non-Māori across the House that take cheap shots at Te Aka Whai Ora and say it didn’t deliver anything.", "window": "SHANAN HALBERT: Thank you, Madam Speaker. The disestablishment of Te Aka Whai Ora, the Māori Health Authority, today returns Māori to disproportionate harm. I want to take a moment to acknowledge all the kaimahi, all of the health practitioners, all of the kaiurungi who have done the hard fight, year in, year out to where we got to establish an independent voice for Māori in the structures of our health system that, we know, wasn’t working for them.\nWhen I return to my marae at Moawhango, I want to go back and tell them that I’ve done better for them by serving in this House. Today, some in this House will have to go back to their marae to tell them that they are returning their whānau back to a system where our people die seven years earlier than their non-Māori counterparts. The blood of their tūpuna will stain their hands for ever.\nI wonder if the doctors in this House who have supported the disestablishment of the Māori Health Authority today have abandoned their ethical principles that they were once asked to uphold as medical professionals—to act with integrity and in the best interests of their patients. Just not the Māori ones. How morally bankrupt do you have to become to sell out your own people and communities for a couple of trinkets and baubles of political office and a bit of a campaign clickbait? It should be a timely reminder for all people that it might be our health sovereignty and opportunities they are stealing today. But rest assured, they are coming for yours tomorrow.\nTe Aka Whai Ora isn’t bureaucracy, as the Prime Minister so casually regards it to be. It’s a chance for Māori to make meaningful decisions about improving their health outcomes through commissioning the services they need, delivered in a way that they want rather than have the same stale ideas rammed down their throats by the greatest pack of bureaucrats that we have ever seen—the other side of the House.\nThe establishment of Te Aka Whai Ora included the Waitangi Tribunal’s hauora report, and by God, I am disappointed that we didn’t have the respect to wait two days to hear of that hearing. This is a breach of mana motuhake, the incremental steps that this work has done to achieve better outcomes for Māori, to give Māori a voice, steps towards tino rangatiratanga.\nI want to acknowledge those that put the work in to put the hearing in place before the Waitangi Tribunal: Lady Tureiti Moxon, Rawiri Jansen, and all of our Māori health practitioners. Today I salute you for the hard yards that you’ve done, and, by God, we stand with you moving forward.\nI want to push back on the non-Māori across the House that take cheap shots at Te Aka Whai Ora and say it didn’t deliver anything. That is false. The strength of Te Aka Whai Ora lies in its independence from the Crown and its ability to provide coordinated and independent Māori-focused advice, policy, advocacy, and commission, and one year in we have seen incremental change. We have seen outcomes—and tell me of a structural shift in this country’s history in Aotearoa New Zealand where we have measured the achievements and results within only 12 months, but we only do this to Māori. It is unfair, it is disgraceful, and every Māori on that side of the House, every member of this Government, should hang their heads in shame. And when you go to your own marae, you tell your whānau that you are disgraceful.\nDr VANESSA WEENINK (National—Banks Peninsula): Thank you, Madam Speaker. Te Aka Whai Ora—the Māori Health Authority—was never really equipped to undo the health inequities for Māori. Those gaps are huge, and the responsibility lies much further outside the health system. It’s for the entire economy, and it’s for all of our Government to take note of those inequities because we can’t fix them within health alone; it has to be done across the board. So I don’t believe that this change will have any effect other than to get rid of a bureaucracy that wasn’t doing anything.\nThose strong Māori health providers will still be working for Māori health, and everybody in the health system will be doing the same. I believe that this change is needed because the only symbolism that I remember was the two waka lashed together—really, those two lashed together. What we had was a ship the size of the Titanic with a dingy attached to the back—that’s the real symbolism. So now we undo this, and I commend the bill to the House.", "window_id": "2024-02-27#41"}, {"statement_id": "28a07e9ae6e1a84c", "politician": "Tamatha Paul", "party": "Green", "side": "opposition", "date": "2024-05-23", "statement": "This reflects the reality for many young people in Aotearoa who are choosing to move overseas, where they can earn incomes that allow them to save up for a deposit and to service those regular mortgage payments.", "window": "TOM RUTHERFORD: Thank you very much, Mr Speaker. I rise to speak on the debate on long-term issues, informed by select committee reports on long-term insight briefings for the Social Services and Community Committee.\nNow, the context around this is that the long-term insight briefings are about the Public Service Act 2020 mandating Government departments to develop and publish long-term insight briefings every three years. Briefings aim to inform the public about medium and long-term trends, risks, and opportunities in New Zealand, providing impartial analysis and potential policy responses. And from the Social Services and Community Committee, there are three particular long-term insights briefings from the previous term: the first being the Ministry of Housing and Urban Development’s long-term insights briefing, the next being the Ministry for Pacific Peoples’ long-term insights briefing, and the final one being the Ministry for Culture and Heritage’s long-term insights briefing.\nNow, if I look at the first one, which was around the long-term implications of our ageing population for our housing and urban futures, it had a few points which are quite stark and bring together a number of issues that we as a country are going to be facing in the coming years. The briefing explores how population ageing will affect housing and urban development in New Zealand. It projects an increase from 17 percent of the population being over the age of 65 in 2023 to 24 percent of the population by 2053. The ministry highlighted that each community needs different things and cannot be a one-size-fits-all approach.\nNow, having looked at that and diving a little bit deeper into it, they identified four shifts that the housing and urban development sector will need to make to adapt to these population changes and support the needs of the ageing population. They included providing more affordable housing; secondly, supporting more opportunities for alternative tenure options such as cooperatives, cohousing arrangements, or papakāinga. They also recommended increasing the diversity, functionality, and accessibility of housing stock. Finally, designing neighbourhoods, towns, and cities so that it is easy for people to access amenities and essential services.\nThe Ministry of Housing and Urban Development emphasised that there cannot be a one-size-fits-all approach to housing and urban development. Instead, each community needs different things. So how neighbourhoods are designed and the housing dwelling types within them will differ depending on factors, including the age of population.\nAnd then looking at the next, they had the Ministry for Pacific Peoples’ long-term insights briefing, and this was around improving Pacific data equity—opportunities to enhance the future of Pacific wellbeing. The select committee heard from the Ministry for Pacific Peoples, and that looked into Pacific data inequity in New Zealand. It looks at how to improve the data systems and processes so that data more accurately represents Pacific perspectives and values. The long-term insights briefing stated that Pacific data equity is about ensuring that the definition of Pacific data in its design, collection, analysis, interpretation, and use, including the presentation of information and narratives about Pacific peoples, represents Pacific voices and is free from bias. The ministry has found that Pacific worldviews are not consistently taken into account across Government data systems. This risks misrepresenting the issues that affect Pacific people, leading decision makers to misidentify potential solutions.\nFinally, the Ministry for Culture and Heritage’s long-term insights briefing, and this was looking at ensuring we’ve got a thriving arts and culture sector across New Zealand, moving into the future. It also noted that the sector currently generates around $13 billion each year and employs just under 100,000 people as at the end of March 2022. The Social Services and Community Committee, from their long-term insights briefings, has looked into a number of issues and challenges facing our country moving forward, and I commend this debate topic to the House.\n\nHon KIERAN McANULTY: Thank you very much, Mr Speaker. This report was really interesting reading, and I believe that it did touch on many of the challenges facing housing in this country, and, of course, no report of this size would touch on absolutely everything, but there were aspects here which, I think, will inform those that take the time to read it. I do hope that it informs those that make policy decisions in Government and in Government departments.\nThere were a couple of things that I thought it might be useful highlighting, and that was touching on the trends that they have identified, one of which, of course, is that there are people that earn an income that would, on current numbers, prevent them from accessing social housing but also isn’t big enough for them to realistically expect to save for a deposit. And, of course, this is a topic that has been canvassed over the last couple of days. In addition to that, it touches on a trend here that, essentially, means across the board, be they Pākehā, be they Māori or Pacific, the projected rate of homeownership is to go down. Now, there have been successive Governments that have promised to increase the housing supply. There have been recent Governments that have declined that there was a housing crisis. But, if we are to draw anything from this, at least it has to be said that there appears now to be a consensus in Parliament, on both sides, that the solution to this is in increasing supply. Where the disagreement in that debate appears to be is what role the State has to play in that.\nIs it the State’s role to fund houses? We say yes. This Government believes that there is benefit in changing rules and requiring councils and all those sorts of things, and I’d note the nature of this debate isn’t to comment on that specifically, but to comment on this report and the trends that it identifies. But I mentioned that because I think that is the crux of the problem. In order to fix the housing crisis that we face, that this report refers to over four different areas, there actually does need to be some consensus moving forward. And that worries me a bit. I’m sure we’ve all heard it—and not that we agree with it, but we would have heard it from time to time—that for those who perhaps don’t take too much notice of politics, there’s not much difference between the National and Labour parties. Well, of course, we would disagree. There are areas where there are fundamental differences—like workplace relations, for example—and one of those, I think, is housing. But I don’t think we’re far off, because in here it touches on the need to identify the trends moving forward. So we’re going to have to address Māori and Pacific housing. That is going to require a change in attitude to programmes that are effective, directed, directly targeting and run by those particular groups that are going to benefit. There were programmes; there aren’t now. Perhaps that could be reconsidered.\nVery similarly, this identifies that older people are particularly prone at the moment, and are projected to be even more so, to homelessness or the inability to be able to own their own home—86 percent, not that long ago, of those over 65 owned their own home. That’s projected to be lower than 50 very shortly, and that’s a worry. So the question needs to be: are those provisions that are currently in place catering for the older person? Now, I’m sure we can all think of an example where perhaps an older person or a couple are living in their family home, their children have moved out, it’s now too big, and they’re looking around to downsize because they want another family to move into their home and have the life that they had. There’s nowhere to go. There are no single rooms. There are no double-room units. There is somewhere to go if they can afford it, if they can afford to go into a very corporate aged-care, retirement-type village. Not everyone can. But the provision of houses, despite the fact that there has been tremendous progress over the last six years, I don’t think is yet catering for that particular group, and the need will only continue to grow.\nSo I’m hopeful that, if the last speech is anything to go by, they will take this seriously, but they will, I think, need to reflect on a couple of things in order to get there. Thank you, sir.\n\nTAMATHA PAUL: Tēnā koe, Mr Speaker. I will try my best to keep it mellow because we have had a very big week on housing this week. So we will keep it mellow.\nI’m taking this call to speak on the past and the future of housing in Aotearoa, in regards to the long-term briefings. I want to begin with this quote by New Zealand author Rebecca Macfie, who said, “In a single generation New Zealand has transformed itself from a home-owning democracy into a society fractured by property wealth—between those who have it, and those who do not.” In Treasury’s He Tirohanga Mokopuna 2021 report, they said that sharp increases in house prices have exacerbated the challenges of housing affordability, especially for those seeking to purchase their first home. This reflects the reality for many young people in Aotearoa who are choosing to move overseas, where they can earn incomes that allow them to save up for a deposit and to service those regular mortgage payments.\nThe reality in New Zealand is that if you don’t have intergenerational wealth, if you don’t come from a rich family, then it’s going to be extremely hard to be able to scrape together the money for a deposit. I think this contributes even more to an ageing population, which is heavily touched on in this report. People aren’t having babies. That’s why our ageing population is increasing—because it’s too expensive and too unstable to raise a family under these conditions, and that’s the sort of country that we live in, where there is very little class mobility, where a huge chunk of our country’s wealth is concentrated in housing, and where our system is built around favouring those who are lucky enough to own their own homes. You used to be able to work really hard and save up enough for a home in Aotearoa, and now all of your wages are taken by supermarkets and the steep cost of living. It’s a massive shame to see our country’s brightest and best moving overseas.\nBut it’s not just those at the beginning of their lives who are struggling; it’s our kaumātua, our seniors in our communities who bear the brunt. This is a key theme throughout this long-term briefing around how our kaumātua are living in this day and age. Imagine spending your whole life contributing to the country that you live in, hoping to retire and be able to chill out, but your pension is calculated on the assumption that you own your home, so you’re living in poverty because your pension doesn’t even cover your rent and it doesn’t keep up with the rising cost of living.\nI had a message from a family supporting their grandfather that really encapsulates the reality behind this briefing. It says, “My elderly grandfather lived under other people’s homes, or in tiny beds, on the North Shore of Tāmaki. He was in his 80s. He paid way too much for these dark, little places. He was kicked out each year for three years in a row from three places. It was such an ordeal moving him. He wasn’t eligible for funding for a place in a rest home and didn’t have the money to pay for one despite being a successful businessman for many years. It was so sad seeing him shuffled along every year.” This is why we continue to advocate, especially for multigenerational housing—I think that’s something we don’t have in our housing stock, is that diversity.", "window_id": "2024-05-23#14"}, {"statement_id": "39fa283b0bb82b43", "politician": "Lan Pham", "party": "Green", "side": "opposition", "date": "2024-07-25", "statement": "Unfortunately, the committee has stuck with the 10-year time frame for the water services delivery plans, which are completely insufficient when it comes to planning for resilient water infrastructure and water services, particularly with these climate impacts.", "window": "LAN PHAM: Thank you—thank you. I appreciate that, Madam Speaker. Look, it’s a real privilege to be able to speak to te Pāti Kākāriki’s position on the Local Government (Water Services Preliminary Arrangements) Bill. It’s kind of clever, the name of this bill, because by the time you finish saying the title to anyone, they’ve completely lost interest. See [Gestures to Deputy Speaker]—and case in point. It’s much like this Government’s approach to our very real and very serious infrastructure deficit.\nI want to assure every New Zealander out there that this bill matters. It matters because the official advice states really clearly that 35,000 Kiwis get sick every year from simply drinking the water that comes out of their tap.\nSimon Court : Fake news.\nWe have this rolling—fake news, I just heard called out, but it’s actually in the official advice and official documentation. So thank you for pointing out that there’s some real misinformation going on over that side.\nWe have this rolling seasonal nightmare of health warning signs going up at our favourite swimming and fishing spots, needing to avoid certain areas from the risk that our dogs or our little kids could get sick from the contamination of our waste water and our stormwater—the majority of which, I might add, discharge directly into our fresh water or coastal environment. Nearly a quarter of these are operating on expired consents. So, yes, we do have immense challenges on our hands—that needs to be addressed. But, unfortunately, this bill does not spell out a clear way forward.\nFirstly, I want to touch on the use of urgency with the bill and the truncated select committee process which has been completely unnecessary. The time frame for submissions on this bill was nine days. It meant that councils and communities were unable to have their voices heard on legislation that has such significant implications for their health, their local community, and their environment. The New Zealand Law Society summed it up really nicely when they pointed out that the use of urgency in this case was, “not demonstrably necessary or appropriate”.\nWe, as the Green Party, oppose this bill for a number of reasons, and I wanted to start with the most foundational aspect of where this bill falls over and that’s with the role of iwi Māori partnerships and the Crown’s Te Tiriti obligations that should be emphasised in this water service delivery—even in this preliminary bill.\nNow, there was discussion about this. It was like, “Oh, you know, that’s covered in other legislation and this and that.” But I want to make it really clear that iwi Māori have specific rights and responsibilities when it comes to water in Aotearoa in their exercise of tino rangatiratanga and kaitiakitanga. So meaningful consultation and collaboration with iwi Māori in terms of forming this legislation, in terms of clear things that were actually spelt out in terms of the Crown’s obligations, are essential for upholding their rights and ensuring that water management practices and decisions actually align with cultural values and Te Tiriti obligations.\nSecondly, the removal of Taumata Arowai being able to consider Te Mana o te Wai in the setting of their waste-water standards is really inappropriate. It’s completely short-sighted and it actually introduces considerable complexity and uncertainty into their processes and decision making. We heard really clearly from submitters during hearings on this bill that Te Mana o te Wai was designed as “a cohesive whole and that the removal of Te Mana o te Wai provisions from Taumata Arowai’s considerations would be a significant step backward for New Zealand in our water management.”\nWe note submissions from public health experts who also considered this removal as “deprioritising the safety and quality of people’s drinking water and potentially increasing the risk of illness from polluted drinking water.” That is entirely unacceptable and unnecessary. Te Mana o te Wai was meant to be the driver that actually forced councils and any water service delivery partners to up the game when it comes to drinking water, when it comes to the treatment of waste water and stormwater, and this is a huge missed opportunity. It actually risks locking in immense under-investment in where we should be as a country. The fact that this removal of Te Mana o te Wai from Taumata Arowai waste-water - setting considerations was tacked on in this last-minute amendment bill that the committee has now adopted shows how little time and consideration these changes were actually given by Government.\nWe had the Regulations Review Committee and the New Zealand Law Society both clearly spelling out that the proposed amendment is a “Henry VIII” clause in that it allows secondary legislation to actually override existing primary legislation and shouldn’t be used unless absolutely necessary, which, in this case, it is clear it’s not. It’s simply bad law. The complexity for Taumata Arowai comes into it that they’re even saying that their obligations for decision making under Te Mana o te Wai aren’t clear, because they have it in the overarching legislation. It’s a really bad idea and I’m really disappointed that the committee did not adopt a potential to remove the amendment from the bill.\nThe other aspects that I wanted to touch on at this stage in the process were: the definition of “financial sustainability”, which we proposed was actually widened to consideration of debt and future borrowing, and also affordability for communities, which has been so well covered by my colleagues across the House, and also consideration of environmental sustainability. The current definition of “financial sustainability” in the bill is much too narrow to provide for that comprehensive decision-making that would actually enable us to have long-term resilient infrastructure and make really good decisions towards that.\nThe other aspect that was really important that, unfortunately, the committee did not take up was about the time frames in the bill, and I want to spell out here that we know that New Zealand is suffering climate impacts now, and this is only going to be increased in the coming years and decades. I did want to point out, though, that the total replacement value for exposed—particularly local government—infrastructure is in the billions and this is just replacement value, not the actual increase and uplift in our infrastructure that we need to actually respond to increasing sea-level rise and other such climate impacts. Unfortunately, the committee has stuck with the 10-year time frame for the water services delivery plans, which are completely insufficient when it comes to planning for resilient water infrastructure and water services, particularly with these climate impacts.\nWe would have liked to see the required time frame be a minimum of 30 years and have really clear expectations on councils that these plans would consider climate change as recommended by numerous submitters. We would have equally liked to have seen the committee adopt the submissions from local government in granting a more pragmatic 18- to 24-month time frame for submitting their water services delivery plans. Because, as the public health experts summed up really concisely, there’s a high risk that councils and communities with fewer resources or more significant challenges may be underserved by the water services delivery plan processes as currently outlined.\nIn those nine days that submissions were open for, there were 182 submissions only; 102 were in opposition and only 19 were explicitly in support. I want to quote the official advice that so clearly spelt out that all councils submitted that “The cost and resource implications are both unclear and significant for councils, making it challenging to plan or fund the reforms.” And yet this Government is ploughing on. So, in the absence of these really fundamental changes that we’ve just spelt out, the Green Party is hugely disappointed by this missed opportunity to prioritise the health and wellbeing of our communities. We oppose the bill.", "window_id": "2024-07-25#12"}, {"statement_id": "3d9e72c2b135f735", "politician": "Rachel Brooking", "party": "Labour", "side": "opposition", "date": "2024-08-20", "statement": "As we’ve heard, the purpose of the part in clause 59A is to promote the long-term benefit of consumers and water services, and then, at subclause (3) there, we’ve got that reference back to the start of the bill, at what will be section 3(2)(e), which is the specific provision around Watercare, which I think is what the Minister was referring to when he was saying that there was this deal done in May with Auckland.", "window": "Hon SIMEON BROWN: It’s unfortunate. I will attempt to speak with my question time voice again.\nThis part was part of the negotiation between Auckland Council and the Government in relation to the Local Water Done Well deal, announced in May, between the mayor and the Prime Minister. It relates to a number of elements of that plan in relation to financial separation, putting in place a Crown monitor, a charter, and in relation to the financial separation.\n\nHon RACHEL BROOKING: Thank you, Mr Chair. Starting at the start of Part 4, is clause 59A, “Purposes of this Part”. We read that they are “(a) to promote the long-term benefit of consumers”, etc. What I’m interested in asking the Minister about is, at clause 59A(2)(c), this comment that it “is limited in its ability to extract excessive profits.” This is to do with “(2) … promoting outcomes that are consistent with outcomes produced in competitive markets such that Watercare … (c) is limited in its ability to extract excessive profits.” What I’m interested in—and I’ll come to it in another point as well—is how this relates to stormwater, because, of course, the purpose of this part, in clause 59A(1)(a), is “to promote the long-term benefit of consumers of water services”. As we know, that definition of “water services” includes stormwater. Does this limit “in its ability to extract excessive profits” apply to stormwater, and, if so, how? How does that work? That’s what I’m interested in there.\nThen we’ve got, over the page, still on clause 59A, that “(3) This Part relates only to delivering the purpose of this Act under section 3(2)(e).”, which is the section about providing a financially sustainable model for Auckland. That makes sense, but then we go to clause 59B, which is the “Application of this Part”, and it says, “This Part applies to water services provided by Watercare in circumstances if there is”—and these are the words I’m interested in, “if there is”; I presume it means that if there is not, then this part does not apply, which seems a little bit odd. I mean, it is all to do with competition, but if we go back to the purposes of the part, it did seem to be about the long-term benefit of consumers. Clause 59B is saying that it only applies if there is “(a) little or no competition in providing those services; and (b) little or no likelihood of a substantial increase in the level of competition.”\nI’d really like some clarification from the Minister about the breadth of this part of the bill. Is it only supposed to be where there is little or no competition? Presumably, again, that would always be around stormwater. I can’t imagine a circumstance where there’d be competition for stormwater, but I’m happy to hear an explanation of how I might be wrong on that and should be more imaginative—or if, in fact, that’s a mistake, and the part applies to water services generally by Watercare and it’s not limited to those areas where there’s no competition. As we’ve heard, the purpose of the part in clause 59A is to promote the long-term benefit of consumers and water services, and then, at subclause (3) there, we’ve got that reference back to the start of the bill, at what will be section 3(2)(e), which is the specific provision around Watercare, which I think is what the Minister was referring to when he was saying that there was this deal done in May with Auckland.\nMy final question, for now, is: given the Minister’s statements about this as the deal for Auckland, what happens to Northland? Is there any ability for Northland to enter this arrangement or not? Of course, we all know that Northland has a number of councils with very small ratepayer bases that have had huge problems, historically, with water treatment in particular. I am interested in the Minister’s answers on that, and across—really, when answering, it would be very helpful to know what services are being talked about when we’re talking about drinking water, when we’re talking about waste water, and when we’re talking about stormwater. The way this is written, it really seems to be focused on drinking water that you’re charging for water usage—you’ve got your water meters in there. And that’s what already happens, is my understanding, with Watercare—that people are charged for their water use. But “water services” is defined to be much broader than just the drinking water. Drinking water’s very important—I don’t mean “just” in any derogatory way—but so is waste water and so is stormwater.\n\nARENA WILLIAMS: Thank you, Mr Chair—a confined set of questions to the Minister on clause 62A(1) and (2). There will be a number of issues to discuss in the Watercare charter, but I want to just offer the Minister an opportunity to comment on proposed amendments to this section here. As he has said, this is an arrangement that has been reached by his Government and the Auckland Council. But the issue here is that the powers belong to the secretary to prepare the Watercare charter, and not to Aucklanders. I know that he is committed, as Minister, to delivering localism under this plan; in fact, he used his call in answer to my question to remind me of that.\nIf he’s going to remind this committee of his commitment to localism, is it then a mistake in clause 62A(1) that it’s the secretary preparing the Watercare charter, and, at clause 62A(2), that it’s consultation with Auckland Council rather than development by Auckland Council? Should clause 62A not read, “Auckland Council to prepare the Watercare charter”, and clause 62A(2)(a) read that Auckland Council, Watercare, and Taumata Arowai would develop, under the commission’s regulation, the draft charter? Those words would do what he has said he would do, which is restore localism in this way and protect local ownership of those assets and local provision of local services. There are flow-on effects of the secretary preparing the charter here, for a number of things, which then are given effect to by that clause 62A.\nGiven that that’s the new provision which he’s introduced, I want him to be able to comment to this committee on that particular section now. I guess the question to him is: would it be appropriate for Auckland Council to devel
