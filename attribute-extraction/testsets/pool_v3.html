utiny. I say that because when I look at the departmental disclosure statement, I can see the people who were actually told that this bill was going to go ahead. It was said that not many people were able to be consulted because it was Budget sensitive. It’s hard to know really why exactly it’s Budget sensitive. I know that there’s a lot of secrecy surrounding the Budget, but in terms of the people that are affected, these are mainly people who are on low incomes, who have a SuperGold card—so are elderly New Zealanders—and it’s hard to imagine that there would be any specific change of behaviour that would have resulted from wider consultation. Obviously, that could have been done confidentially as well.\nBut we do see that a number of councils have been consulted in the departmental disclosure statement: Auckland Council, Christchurch Council, Tauranga, Manawatū, and Clutha District Council. However, hearing from those people who would really benefit from this particular rates rebate bill or those on the cusp of that as well—that’s often what we hear in select committee. We often hear of people who maybe fall just outside of the entitlement, who believe that they have a good argument about why they should be included, and we weren’t able to do that. But we did see that some of those councils were actually included in that as well.\nSo, as has been said, we support this bill. But the reason that we support it is because we recognise what a difficult time it is for New Zealand, and especially elderly New Zealanders. We are facing some of the hardest economic conditions that I can recall in my lifetime. And certainly in the time that I’ve been in charge of my own family and household, I have noticed in the community very, very, very struggling people within our community—unable to afford groceries, unable to afford rates, unable to afford their mortgage payments. We have seen this get worse under this Government. So it is pleasing to see the Government recognise that there is a cost of living situation in New Zealand that deserves to be addressed.\nWe haven’t seen a lot of action. In fact, a lot of the actions that we’ve seen have made the situation worse. We’ve seen affordability and the cost of living really ramp up under this Government. We’ve seen loss of jobs. We had a hearing this morning with the Minister for the Public Service, but across the country we can see tens of thousands of jobs that have been lost. Some of the people who have SuperGold cards do also work. So it is relevant to them and it is relevant to their affordability of rates whether there are jobs that they can particularly go to. That hasn’t been a focus from this Government. Jobs have not been a focus of this Government; in fact, we’ve seen them go backwards. That’s why these types of measures, like rates rebate schemes, are needed, because people are struggling so much.\nWill this go far enough towards addressing some of the cost of living pressures that people have? I don’t think so. I think we’ve heard a lot of evidence today from this side of the House, who have been taking substantive calls on this bill, around things that have got a lot worse and have raised the cost generally for households as well. It is good to see the Minister and others reflecting on the fact that we do have people who are superannuitants in New Zealand who are making hard choices around what they can spend their money on. They’re making choices about food, they are making choices about bills, they’re making choices about heating. That is not the type of society that we want to be living in. We agree with that, but we don’t think that the measures that the Government is putting into place go far enough and we don’t agree with their choices that result in tax cuts and subsidies for those who don’t need it and not enough for the people at this end that this bill does touch on, who deserve to have more. So that is very problematic.\nWe also see that this is a slight recognition of the terrible situation we are in in relation to the affordability of rates for local government organisations. The House is well aware of the steps that the last Government made in order to try and address the fact that there were unaffordable rates rises that would be necessary for New Zealanders. That was, unfortunately, scrapped by this Government. We’re seeing them take small efforts to try and corral local councils into getting together in relation to water and to try and get them in a scheme that would not be as helpful as the one that was proposed by the last Government. So we hope, for the benefit of New Zealanders, that we are able to see a more sustainable rates framework that is affordable for councils to be able to continue to do their work and for New Zealanders.\nThis bill is a little bit of a help in that, but it, as I said, does not go far enough. That is because of those dual things: the cost of living crisis and the fact that we do have rates which are so unaffordable for New Zealanders. It is regretful that we didn’t have a select committee process, but also that in preparing the analysis for this bill, there wasn’t really able to be any consultation with a number of people affected by this, because I think some of those wider issues around rates affordability, around the role of local government and the role of councils to be able to provide things that are needed, would definitely have arisen with that too.\nAt the same time as we see this small benefit for some elderly ratepayers in New Zealand to address the skyrocketing cost of living in this country, we also see cuts in other areas—for example, the cuts to the pay equity scheme. Many of those, specifically care and support workers, are near retirement, and many of those people will actually be covered by this scheme. So it will be cold comfort for them to see the fact that their earnings within their lifetime would be gendered earnings that were much lower than they should have been paid if they were in a male-dominated field, but they were unable to continue with their pay equity claims, and then they enter into retirement, and they get this tiny rates rebate.\nSo this is about choices—Budgets are about choices. This is a bill that was brought in through the Budget process. The choice that the Government’s made here is to give a small amount of money back to some elder New Zealanders who are desperately in need of some relief. At the same time, we’ve seen much larger cuts in other areas. We’ve seen their cost of living rise. We’ve seen mortgage prices rise. We’ve seen food prices rise. We’ve seen fuel prices rise. We’ve seen the amount that they spend on heating rise. And we know that and I’ve been getting emails just this week from people talking about the choices that they have to make in relation to fuel. I met someone yesterday who lived, actually, near my colleagues Ingrid Leary and Rachel Brooking in Dunedin, who was talking about the amount of money that they had to spend on fuel.\nSo this is a good start. This is a bill that the Labour Party will support, but it doesn’t mean that the work here is done. There is much more work that needs to be done to address the cost of living. There’s much more work that needs to be done in relation to the challenges that our seniors face, and my colleague Ingrid Leary has been doing very good work advocating for that. There are other challenges that people have. But from our side, we believe that the proper work of Government is really to ensure that people have well-paid jobs, that they have a healthcare system that works when they get sick, and that they have homes that they can live in—whether those are rented or whether those are owned homes—that are warm and safe, and that is the right of every New Zealander. So we believe that that should be the focus of this Government, but we support this bill.\n\nRYAN HAMILTON: I’m so pleased to stand. Sixty-six thousand seniors will be better off. I’m going to repeat that: 66,000 seniors will be better off with this bill—one of many cost of living relief payments we’re doing. I commend this bill.", "window_id": "2025-06-24#43"}, {"statement_id": "40fa71b2945a8ebb", "politician": "Camilla Belich", "party": "Labour", "side": "opposition", "date": "2025-07-15", "statement": "Unfortunately, the good work started under the previous Government in order to regulate and make a reasonable environment where there are a few operators able to be regulated and also provide a significant amount of time and resources to address gambling harm—on the contrary, this bill that we now have before us looks to allow 15 different operators licences within New Zealand.", "window": "JAMIE ARBUCKLE: Thank you, Mr Speaker. I rise on behalf of New Zealand First to support the Online Casino Gambling Bill. This bill is to stop the unregulated situation that we find ourselves in at the moment. This bill will create a robust framework to regulate online casino gambling and protect consumers and minimise harm. We want to make sure that only trustworthy operators are allowed to operate in the online gambling market. These trustworthy operators must be subject and accountable to New Zealand standards, not overseas standards. Currently, this industry is very prone to exploitation and we’re keen to bring this to an end.\nSending this to the select committee is the right thing—to hear submissions, to hear concerns, and to see if this piece of legislation goes in the right direction. One concern we do have is what we have heard from other speakers is up to 15 licences, and that will be dealt with over three stages of a licence process. It will be really interesting to hear from people around, actually, if we do need 15 operators in this space or up to 15 operators. Maybe it is a case that we start off more with three or five. That is process, I think, we can flesh out through the select committee.\nWe’ve also heard it is a growing pastime of a number of people to use this. It is a 24/7 access to this gambling. It’s not necessarily like racehorses or Lotto in that sense, but 24/7. We do understand that the harm—especially for our young people if they can get access to this, but even just harm for the general population. So we’ve got to make sure that we’ve got some safeguards in place.\nNew Zealand First does believe in balancing the economic opportunities, because we have heard that there will be an increased tax take, but also the social responsibility that goes around that. This bill achieves—to an extent at the moment—trying to get the right type of balance. The focus on the harm minimisation and the consumer protection aligns with our commitment to community wellbeing. On that, I will commend the bill to the House, and we look forward to hearing through select committee the different views from people that go through that process. Thank you.\nTĀKUTA FERRIS (Te Pāti Māori—Te Tai Tonga): Tēnā koe e te Pīka. I tēnei tū tuatahi ōku, otirā mō Te Pāti Māori i tō mātou hokinga mai ki te Whare i te wehenga ake nei o tō mātou tuahine, a Takutaimoana. E te tuahine, e moe, okioki.\nHoki rawa mai ki a tāua, e te Pīka, tēnā koe. Tēnā hoki tātou.\nE tū ana ahau ki te whakapuaki i ngā whakaaro o Te Pāti Māori mō tēnei tūāhuatanga, nō reira kia tahuri au ki ngā kōrero.\n[Thank you, Mr Speaker. With this first speech of mine, indeed for the Māori Party upon our return to the House following the departure of our sister, Takutaimoana. To my sister, sleep well, take your rest.\nReturning to you and I, Mr Speaker, greetings. Greetings also to all of us.\nI stand to express the opinions of the Māori Party regarding this phenomenon, therefore let me turn to the statements.]\nAlthough it may be true that a regulated online gambling industry is better than an unregulated one, gambling does nothing for Māori. Never has, never will, and neither will this bill. We do not need overseas companies profiting off our misery, and we cannot support a bill that will legalise the exploitation of our people and all of the people of Aotearoa. The Minister expects that most, if not all, of the licences will be won by offshore companies, who are under absolutely no obligation to reinvest any of the income derived back into communities in Aotearoa. The bill is a simple tax-raising exercise, and if this Government is involved in deciding how to spend that money, we know that the communities that need it the most won’t see a cent.\nThe ministry’s own evidence shows us that the bill will have a disproportionate impact on Māori, Pasifika, rangatahi, and our whānau with lifelong disabilities. Māori are more than three times more likely to be entrapped by problem gambling than other New Zealanders, and problem gambling has had a devastating impact on the cohesion, cultural identity, and financial stability of whānau Māori for generations. Pacific peoples are more than twice as likely to be entrapped by problem gambling than other New Zealanders, also. Gambling harm is already ripping through our communities. We don’t need a band-aid fix that legalises and regulates these harmful practices; we need to stop enabling these corporations altogether.\nUnfortunately, this bill only promotes pure international corporate exploitation, with no positive social contribution at all. For sure, there will be a monetary return, but only to the few. Almost half of all rangatahi Māori between the ages of 16 and 24 have gambled in the last year, and they make up 15 percent of all moderate- to high-risk gamblers. This is something that we can’t afford to promote, increase, or exacerbate at all. People with lifelong disabilities have a higher risk of developing harmful gambling behaviour. Social isolation, unemployment, and limited income are all risk factors that contribute to gambling harm. This Government has already taken away the minimum wage pay top-up for our disabled whānau, and now they are legalising a gambling regime that could potentially do even more harm. It’s not acceptable.\nOnline casino companies are offering Māori influencers hundreds of thousands of dollars to promote online gambling and target our whānau. Hāpai Te Hauora Chief Operating Officer Jason Alexander is quoted as saying this: “These gambling companies are [now] using Māori influencers to reach Māori audiences. It’s not just harmful—it’s calculated, it’s manipulative, and it shows they have no regard for the wellbeing of whānau [Māori or the people of Aotearoa].” This bill does nothing to prevent licensed operators from engaging in these predatory practices. In fact, the Government are legalising these practices through this bill. It shouldn’t be allowed. He’s also on the record as saying, “What’s really worrying is that these same companies—the ones illegally targeting our people now—could be operating legally here [in Aotearoa] as early as next year. Their current behaviour shows exactly how little they care about whānau, and if this is how they act before regulation, [then] what will they do once they’re in the system?”\nWe support the cause of Hāpai Te Hauora to ban gambling advertising in Aotearoa completely. We also cannot support a bill whose department didn’t even bother to do a proper Te Tiriti o Waitangi analysis. Instead, they relied on a July 2024 Cabinet paper which included a population implications assessment.\n\nCAMILLA BELICH: Thank you, Mr Speaker. I stand today a bit disappointed, really, with the bill that we have in front of us. The reason for that is that this was really an opportunity to regulate an unregulated market and actually address the main issue with online gambling, which is online harm.\nUnfortunately, the good work started under the previous Government in order to regulate and make a reasonable environment where there are a few operators able to be regulated and also provide a significant amount of time and resources to address gambling harm—on the contrary, this bill that we now have before us looks to allow 15 different operators licences within New Zealand. The result of that will be a change in a situation where we are facing ads constantly when we open our phone, when we open our laptop, when our kids log on to YouTube, for online gambling. Unlike the situation now, where that’s technically illegal to advertise for online gambling, this will now be permitted after this bill has passed.\nMy personal view, as this is a conscience vote, is that there should be a regulated system in New Zealand for online gambling, but, regretfully, what we have in front of us is only going to make that situation worse. Fifteen is far too many. When the last Government looked at this bill, they were considering around—I understand—three. So there’s a significant difference there in what people were looking at.\nI think perhaps one of the reasons that the Minister has ended a little bit off the mark on this bill has been because when this was first introduced—and we see that from the two regulatory impact statements; the first one clearly states that there hasn’t been sufficient time to consult with the people who this would affect. So there hasn’t been feedback from public consultation on this proposal. And by the time the second regulatory impact statement was made to Cabinet, the decisions had already been made about the regime that was going to be put in place. Unfortunately, this regime will allow far too many online gambling operators to operate in New Zealand.\nWe know online gambling does harm. We know that gambling does harm. We know that this is not something that we want to encourage people into. So I think a reasonable stand to take would be to have a regulated market that really looks at the harm it causes. But the environment that this bill will create, as I’ve said, is one where we are constantly faced with advertising for online gambling.\nThere is a bit of irony when I look at what this bill will do and the recent statements that the Government has made in relation to preventing online harm for children and young people. The Government has said that they will have a Government bill making sure that social media is only available to those over 16. This bill—although technically you’re only able to participate in online gambling once you’re over 18, and I hope that the verification methods are robust—will actually probably mean that even with those verification methods, children and young people are subjected to what is an addictive form of spending your time, spending your money, and they will see that normalised. There’s information within these regulatory impact statements and there’s information from advocates against problem gambling that show that when it is advertised, it becomes normalised. We know that because of this regime, there will be legitimate advertising taking place in New Zealand.\nI think this is a missed opportunity. The Government should have taken a step to reduce gambling harm. They should have taken steps that looked at the health and wellbeing of New Zealanders. They should have taken steps that meant that people were less likely to be subjected to advertising for online gambling than they are now. Unfortunately, this bill does the exact opposite. It brings in far too many licences all at once and it means that advertising is a lot more likely. So it is regretful that we do not have a regulatory regime—which we sorely need in this country—which will truly address gambling harm.\nSo, with that, I say my personal view on this conscience matter is that I will not be supporting this bill. However, I am on the Governance and Administration Committee and I look forward to hearing submissions if this bill does pass through the House and looking to see if there are improvements that can be made to this bill to better reflect the harm that online gambling does to our communities. So, with that, I cannot commend this bill to the House but I ask those on the other side to treat this seriously, look to their conscience, and if this bill does indeed go through, try and make significant changes to this bill which would actually look to reduce the harm of gambling that we know is so great within New Zealand’s community.", "window_id": "2025-07-15#6"}, {"statement_id": "601ae68fdb340918", "politician": "Kahurangi Carter", "party": "Green", "side": "opposition", "date": "2025-09-16", "statement": "Every step in this direction is a win for our communities, for our councils, and for Papatūānuku. This bill also makes GST rules fairer for repaired and replaced goods.", "window": "KAHURANGI CARTER: I rise on behalf of the Green Party to speak at the third reading of the Customs (Levies and Other Matters) Amendment Bill. Now, I did read the title because in the second reading there was a bit of confusion as to whether I was talking about the right bill—so just clarifying that, absolutely, product stewardship and waste minimisation is a really important part of this bill. For the Greens, the most important part of this bill is the product stewardship and the progress it makes on waste minimisation. This is a kaupapa that is part of our whakapapa.\nThe Waste Minimisation Act 2008 began its life as a Green Party member’s bill and was championed by former Green MP Nándor Tánczos, who is running currently for Mayor of Whakatāne. The Hon Eugenie Sage, when she was the Associate Minister for the Environment, did amazing things with products stewardship, bringing in six priority products including things like tyres and e-waste. I was actually on the e-waste products stewardship working group when I worked at Para Kore and then went on to work at the Ministry for the Environment, so I know how massive our waste problem is and how big the waste department at the Ministry for the Environment is.\nThere are some really amazing solutions happening out in the communities and product stewardship is one of those really exciting things. This bill carries that kaupapa forward. The Waste Minimisation Act 2008 was the first time Aotearoa recognised that responsibility for waste must be shared with producers and importers, not just by households, councils, and, ultimately, Papatūānuku—our Mother Earth.\nBy enabling the changes to the Customs and Excise Act 2018, the Waste Minimisation Act 2008, and the Goods and Services Tax Act 1985, this bill closes a crucial gap. It makes sure that when tyres, electronics, or packaging come into the country, the cost of dealing with those products at the end of their life are not simply dumped on whānau, communities, and into Papatūānuku that she cannot digest.\nThis is about shifting the responsibility upstream to those that design and profit from products. Now, a great example of this is in the EU, in Belgium, where Apple changed their chargers to USBCs in line with regulation to reduce that e-waste. Now, you might not have known why the iPhones now have that C charger, but it was because laws can put the onus on producers to create products that reduce e-waste and waste in general. Every step in this direction is a win for our communities, for our councils, and for Papatūānuku.\nThis bill also makes GST rules fairer for repaired and replaced goods. I want to shout out to my colleagues here Ricardo Menéndez March and the Hon Marama Davidson for their work on the right-to-repair bill—which I actually helped with before I was an MP. This is something that is core to our beliefs as the Greens. It is that belief that we should honour. When we extract something from the Earth, we should honour it; we shouldn’t just produce it into something, consume it, and then throw it away—a straight line all the way to the rubbish dump. What we need to do is move back into circular systems. That means making sure that producers are responsible for the products that they make at the end of their life. We are so far behind the rest of the world on this. I mean, you only have to look at European nations to see that we really, really need to catch up.\nPeople are making conscious decisions to reduce their carbon footprints, but the throwaway system—that linear system that we live in—does not allow them to do this. The technical changes like this can help us move towards a system of sustainability. The Green Party is proud to support this bill, even though it is a small step and there is so much further we need to go. Thank you, Madam Speaker.\n\nTIM COSTLEY: I never thought I’d say this but I’m looking forward to hearing from the Hon Peeni Henare in a minute, I would assume. The last Labour Party’s “Penny”—“Henny Penny” thought the sky was falling with this bill. It’s ridiculous.\nIt’s a great bill. It’s about a Government getting on with the business of running a country, going for growth so that we can make life more affordable and deliver more opportunities for Kiwi families. I commend it to the House.", "window_id": "2025-09-16#70"}, {"statement_id": "2e8c2b6e4f16487f", "politician": "Rachel Brooking", "party": "Labour", "side": "opposition", "date": "2025-12-16", "statement": "Now, I would say that this is unnecessary and oversimplifies an idea that development does not impact the environment and that you can neatly put the environment to one side.", "window": "Hon CHRIS BISHOP: Well, all of the Soviet Bloc from 1945 through to roughly 1989. In contrast, sir, countries that embraced private property and market-based economies tend to do better. Now, I didn’t intend to start my speech by echoing the great battles of the 1980s, but it seems to be that period of time, just before Christmas, in December, to recast those battles.\nAnyway, this new planning system is going to radically change how we build our houses and infrastructure. I want this speech, and the speeches to come, to be an articulation of Parliament’s intent. The Planning Bill and the Natural Environment Bill have been designed deliberately. The Planning Bill: for planning and regulating how land is used, developed, and enjoyed, and another for protecting and enhancing the natural environment. Not every development has an environmental impact and does not need to be caught up in a natural environment regime.\nThe Planning Bill that’s before us now is critical to accelerating housing and infrastructure delivery. The bill introduces a significant change in what gets regulated, so more things can be done without needing a consent and allowing more people to enjoy their land. We estimate we can cut consent volumes by up to 46 percent. Now, that’s an estimate. It’s been done by officials. I’m sure the Environment Committee will want to test that work over the course of their consideration of this bill. But that itself is a radical reduction in the number of times that people need to ask permission from the local council to do things.\nSo the shift is delivered in three ways. We’re narrowing, or proposing to narrow, the range of effects that councils can regulate So we need to focus the planning system on real impacts. Things like noise and vibration and shading—those are legitimate things that the planning system should consider. But the bill contains a list of effects that are deliberately out of scope: interior changes, apartment layouts, private views, things that do not affect others are out of scope. The need to get little council planners investigating every element of everyone’s house—they need to lay off.\nThe bill lists the threshold for consents. Everyday projects, like building a deck or a garage, won’t need a consent if they have no, or less than minor, effects. That is a change to the status quo.\nThe bill introduces the framework for standardised zones and rules. We have 1,100 different zones currently in use in New Zealand—around 1,175, I’m advised. So we can introduce greater consistency nationwide.\nThere are 100 plans prepared under the RMA. The bill will reduce that number to 17. Reducing the number of plans to regional combined plans, standardising content via national direction and standards will create a faster, more consistent planning process.\nI do want to take a moment to explain the core structure of this bill and the Natural Environment Bill, because the architecture is what drives the system. It sets the hierarchy, locks in certainty, and ensures every part of the process aligns to faster, clearer decisions. We’ve been calling this “the funnel”. It’s a clear, deliberate hierarchy—or a funnel—that clarifies decision making from national goals, down to local actions. The structure is designed to close the door on unnecessary re-litigation and provide certainty.\nThe new system starts with bills having a tightly defined purpose. This is quite a contrast from the RMA, which has a long and confusing purpose clause and requires everything to be looked at through a sustainable management lens. The purpose clauses in the Planning Bill and the Natural Environment Bill aim to avoid that.\nFrom there, the Planning Bill and the Natural Environment Bill have clear goals that set the objectives for the system. These focus the system. If it’s not in the goals, it is not part of the new planning system. The goals do not have an inherent hierarchy within them. No goal is more important than another. The order does not indicate a hierarchy. So for the next High Court judge that considers this issue, once the bill is passed into law, there is no hierarchy. Members can see for themselves the goals of the Planning Bill. The goals we have devised are enabling and positively framed. This is done specifically and deliberately. We want people in the system to behave in that way. We’ve taken great care to ensure that each and every one is required to be in the primary legislation. I have no doubt that the select committee will kick that around, and I look forward to that.\nUnder the goals sits national policy direction. This particularises the goals. It’s the way for the Government to set clear expectations of councils and system users and define what must be achieved. Every goal will have accompanying national direction to particularise and explain them. With these measures in place, everyone will know exactly what is expected.\nBeneath national policy direction are national standards. They set out how national policy direction should be implemented through the combined plans, how councils develop the plans, and what people can do when doing certain activities. National standards must implement national policy direction.\nBelow that are regional spatial plans, which are within regional combined plans. They play a key role in the system. They’re the place where strategic trade-offs are made about how land and natural resources are used. Regional spatial plans have to implement national standards.\nThere’ll be a land-use chapter under this bill, and a natural environment chapter, which is in the Natural Environment Bill. These govern local actions and rules. Here is the critical point: land-use and natural environment chapters must implement regional spatial plans and national standards.\nEach instrument is built on the one above it. This is not guidance; it’s a legal requirement. And then there are consents under the Planning Bill, and permits under the Natural Environment Bill.\nThe impact of the funnel means that the consenting authority cannot refer back up to or relitigate any direction made in the instruments that sit higher up in the system. When decision makers act under the bill, they begin by looking at the instrument directly relevant to the issue at hand, only looking upward in the hierarchy if there’s something missing, unclear, or in conflict. This ensures that every decision follows the hierarchy with each layer reinforcing the next with clarity and consistency from top to bottom. This is a decisive shift from the past, ensuring that every decision is anchored in clear enforceable direction from the top down.\nIt does mean greater responsibility on the Government for robust and effective national instruments. That has not been in place under the RMA, or certainly not over the last 20 years in particular. We will be doing that through the new system.\nI’m going to let my colleague Simon Court, and others to follow, talk about other areas of the bill. These are substantive changes. I’m looking forward to the consideration by the committee.\n\nHon RACHEL BROOKING: Thank you, Mr Speaker. Unlike the Minister, I only have five minutes, so I will not undertake a treatise of where property rights have or have not worked with market economies but will note that property rights do not deal with the issue of common resources such as air, water, and biodiversity. I’ll leave that there.\nNow, of course, it was very disappointing to hear last Tuesday the Prime Minister say that this was the first Government to address resource management. Of course, the last Government, the Labour Government, repealed the RMA, and this Government brought it back two years ago when this Government repealed the Spatial Planning Act and the Natural and Built Environment Act. They were two Acts. The rationale for that was that the spatial plans might be able to at some point link in with infrastructure funding, so they could be in a separate Act to the rest of the Act, which was a replacement for the Resource Management Act.\nWhat this Government has done has split the Resource Management Act in two, one looking at the functions, really, of a regional council—and we'll get to that bill shortly—and one looking more at the functions of a district council, being the Planning Bill. Now, I would say that this is unnecessary and oversimplifies an idea that development does not impact the environment and that you can neatly put the environment to one side. However, we will have that discussion in select committee.\nI do want to note that this emphasis on private property rights and regulatory takings is very troubling to the Labour Party. We are troubled that it will have a chilling effect, because councils will be required to compensate for protections in the Planning Act on heritage and landscape, and that will result in there being no protections.\nWe also note, and it is very frustrating, that there are many similarities with the legislation. This Government could have spent perhaps a month or so reviewing what we did to make some changes. But instead, they repealed it, have amended the RMA time and time again to enable more pollution and stop councils from doing their jobs, and have then come up with a new Planning Bill that will not be passed until sometime late next year.\nI'm also very disappointed in the differences between this legislation and Labour's legislation about the role of mana whenua. It is a great diminishment between our legislation and their legislation, but I also suspect—and this is something that we'll be asking at select committee—that it is a diminishment even from the Resource Management Act into this legislation, which is taking us in totally the wrong direction.\nBut I will now turn to many similarities in terms of the importance of spatial plans; the importance of moving a lot of the GDP in the system away from consent, by consent decisions up into the plans and into the national direction; the efficiencies that can be gained from not considering urban amenity. These are things that we also did. Having one plan— you can argue about the chapters and things in the plans—per region and keeping it at that regional scale with the councils working together. These are all the similarities. Having stronger compliance, monetary enforcement, these are good things as well. So there is a lot that this Government has replicated in these plans but, obviously, with some very important differences; differences that we will discuss at the select committee.\nTalking of the select committee, it's going to the Environment Committee, that is good, and I very much hope that the Government members will enable a longer time for submissions, given that this is going over the Christmas break. Our legislation, also similar timing, and there was 11 weeks given, I believe, for submissions. I encourage them to do that. Also, to look at the bills together to enable people to not necessarily have to identify which bill they are submitting on.\nI think it would be very good, also, to have the Ministry for the Environment’s briefing in the public session as well, because there is—resource management law is difficult. We, the Labour Party, are the grown-ups in the room over this and so we will be supporting sending this to select committee.", "window_id": "2025-12-16#6"}, {"statement_id": "b51b2444d71027a3", "politician": "Julie Anne Genter", "party": "Green", "side": "opposition", "date": "2026-03-11", "statement": "It makes sense for New Zealand to invest in distributed renewable electricity generation like home solar. Pair that with energy-efficient machines like electric vehicles, which can also be used as batteries, like hot water heat pumps—all of those things reduce costs for households and reduce our carbon emissions, so why wouldn’t we do them?", "window": "Hon JULIE ANNE GENTER: Thank you, Madam Speaker.\nWe have to take action on climate change, and, of course the Government is doing the exact opposite. All climate action is basically action on cost of living, particularly when we look at the rising cost of oil internationally, so it simply makes sense for New Zealand to become less reliant on imported fossil fuels for transport. It makes sense for New Zealand to invest in distributed renewable electricity generation like home solar. Pair that with energy-efficient machines like electric vehicles, which can also be used as batteries, like hot water heat pumps—all of those things reduce costs for households and reduce our carbon emissions, so why wouldn’t we do them? It just makes sense.\nThe other interesting observation is, of course, that New Zealand does need to change tack when it looks at its overall investment. We have an ageing population. The National Infrastructure Plan that was released last week demonstrated that the country has not been sufficiently investing in hospitals and healthcare facilities and services. In order to cope with that, we need two things. We need to change our tax system so that we have options to broaden the revenue base in a progressive way. That means the wealthiest pay more than their fair share. When we have that, we have more revenue to invest in the services that everybody benefits from and the infrastructure that everyone benefits from.\nWhat’s interesting is that if you look at page 66 of this report, it shows that New Zealand, far from being a high-tax country, is a country where we’re collecting lower than the OECD average in terms of Government revenue as a percentage of GDP. That would probably be partially responsible for the fact that people can’t access the same high-quality services and infrastructure that we see in many other OECD countries. So while there is a myth that has been bandied about for the last 20 or 30 years in New Zealand that somehow New Zealanders are paying too much tax, the reality is our tax system disproportionately taxes lower income people, doesn’t collect enough revenue at the high end of income earners and wealth holders, and as a percentage of GDP, we’re on the lower end.\nTreasury itself mentions that while income and consumption taxes—this is page 68—are two of the most important sources of Government revenue, they’re all alternatives. Other papers from the Treasury have considered alternative labour tax schemes that are more and less progressive. They also consider adjusting capital income taxes. Those papers illustrate that taxable income in the upper income tax brackets and capital income tax bases could be a contribution. But we also need to have a better investment plan when it comes to infrastructure, and, of course, this Government needs to grapple with the reality that the Roads of National Significance it campaigned on are unfundable and not the best use of money.\nRYAN HAMILTON (National—Hamilton East) (16:13) : Look, it’s great to stand and speak in regard to these bills—not bills, sorry; it’s a habit. The Investment Statement 2025 and the Long-term Fiscal Statement 2025: together, these documents give us a comprehensive view of the Crown balance sheet today and, obviously, the long-term fiscal pressures that will shape New Zealand over the next 40 years. What they show is that this is quite simple. We have a limited window of time to act, and acting early will cost us far less than delaying. It gives me privilege to be part of a Government that’s looking the tiger in the eye and is prepared to make policy changes that will address these long-term structural changes for the benefit of our country.\nThe state of the Crown balance sheet today: the investment statement sets out what the Government owns, what it owes, how those assets are performing, and how resilient we will be when shocks strike, and they certainly do strike, as we know. As at 30 June 2024, the Crown held $571 billion in assets, or roughly $107,000 per person, and $380 billion in liabilities. This leaves a net worth of $191 billion, but even that number needs context.\nThe balance sheet is larger than ever, more complex than ever, and under increasing pressure. There’s a clear amount of structural change required by this Government in the way we spend, monitor, evaluate, and restrain public spending. There has been a clear anomaly around the COVID area which cannot and must not go unnoticed.\nI know the Opposition wants us to move on and say that there’s nothing to see here, but there was a significant amount of spending and it’s been related to these documents that show that it was wasteful, excessive, poorly controlled, and now has placed real strain on where we are today in terms of the debt situation. Treasury refers to it as the debt ratchet—crisis spending that never closes. Often around national crises, it says that we’ll spend about 10 percent of GDP, like the earthquake situation in Christchurch and other natural disasters.\nBut around COVID, the Labour Government spent $60 billion. Nearly half of that was not even related to the COVID pandemic—$60 billion was spent and not even half of that was related to the pandemic itself. These are eye-watering figures, and that’s why this National-led Government has worked so hard to control spending so as to create buffers and resilience that the Treasury says are so important to the ongoing sustainability of our balance sheet and to our cash flow.\nTreasury gives us a simple test for responsible fiscal policy. It says temporary, timely, and targeted. Those three things work well to ensure that our spending is appropriate and is proportionate and is time-bound. Unfortunately, we’ve seen some uncomfortable clarity flow through these documents, which shows that some supports, particularly around COVID, were slow to deliver, were too broad, and proved difficult to unwind, even when circumstances changed significantly, such as some of the mandates which lasted much longer than were justified, shutting down Auckland for longer than was necessary and without an adequate review of their effectiveness.\nWeak monitoring and evaluation allowed waste to persist. Treasury’s documents show that we cannot evaluate what we do not measure and often the Labour Government failed to measure the impacts of its own decisions. That’s why we’ve been very clear as a Government to set up targets that are both public facing and hold us to account so that we can measure our outputs, and dare we be aspirational with some of those targets. We may not even be able to achieve them, but at least we’re being accountable to the public.\n\nRYAN HAMILTON: GDP is showing that we’re actually growing, Mr O’Connor, so I bet you wish you were on the other side of the fence.\nThe Labour Government failed to measure the impacts of its own decisions. Treasury’s analysis shows similar supply problems on the fiscal side. During the COVID response, some spending programmes lacked the value for money that should be standard. Fiscal reports were sometimes extended without strong evaluations. Scrutiny was weakened and transparency was diminished.\n\nRYAN HAMILTON: Do you know anything about transparency, Mr O’Connor? Treasury also criticises the use of large infrastructure and investment programmes as crisis tools, noting that they were slow, poorly timed, and not reversible—the very opposite of what prudent, temporary—", "window_id": "2026-03-11#8"}, {"statement_id": "bdaf4288010de7ea", "politician": "Reuben Davidson", "party": "Labour", "side": "opposition", "date": "2026-04-28", "statement": "The FMA have a particular set of expertise in here, which never needed to defined in an anti - money-laundering bill because their remit was clear: for the health and oversight of a strong and enduring financial system that was not unnecessarily exposed to risk either from money-laundering or other financial risks that occur because of inadequate supervision.", "window": "REUBEN DAVIDSON: What the other members don’t realise is that if they continue to heckle like that I’ll have to start my sentence again. So clause 5(2)  states, “In section 5(1), replace the definition of AML/CFT supervisor with: AML/CFTsupervisormeans the public service agency that, with the authority of the Prime Minister, is for the time being responsible for supervising reporting entities under this Act.”\nThere are a couple of things that I have questions about for the Minister. The first is: why is the agency not named there? I think we all understand who the agency is, but it isn’t explicitly named there, which seems like quite vague language. Then, adding further vague language into that, you also have “for the time being”. It’s quite an open-ended addition, and I’m keen to get some clarity from the Minister on exactly what that means.\nHon NICOLE McKEE (Associate Minister of Justice) (21:34) : Thank you, Mr Chair. Thank you to the member for his introductory remarks and his questions. The member made mention of not wanting to have unintended consequences from the single supervisor, and I do appreciate that remark, but I think what we’ve found is that for the last 13 years we’ve had unintended consequences from the three supervisors—that being that they’ve not been able to get adequate resources out to industry to tell them what risk they can take. None of us saw that—we weren’t even around then, but it wasn’t seen and it’s become an unintended consequence. Hence why we are moving to a single supervisor.\nAs to why we don’t name the Department of Internal Affairs (DIA), if we have a look we’ve had the Reserve Bank, the Financial Markets Authority, the Department of Internal Affairs, and we’re now going to make DIA the single supervisor, but we just don’t know what’s in the future. We don’t know whether Government agencies may change their name or anything like that, so we’re just merely futureproofing so that if there is a name change or if we find there are unintended consequences with it being the DIA and we need to move somewhere else, that we can readily and easily do so. All it is is merely futureproofing for who could be a supervisor in the future.\nARENA WILLIAMS (Labour—Manurewa) (21:36) : Thank you, Mr Chair. I appreciate the Associate Minister of Justice’s remarks about the feedback that was received from industry over the last 13 years about the under-resourcing of the anti - money-laundering (AML) regulators when they were the Reserve Bank, the Financial Markets Authority (FMA), and the Department of Internal Affairs (DIA). It became a series of commentary from industry—say, lawyers, accountants, firms that are affected by AML and have to know their customers and are required under our international obligations to observe, to the Government—that the regulators were under-resourced. This was the thing that gave rise to the ideas about a single regulator. One submitter said, “As a general observation based on our experience on advising clients on the application of this Act since its inception, the existing supervisors appear to be under-resourced. The benefit of a single super AML regulator could be better, more focused resourcing.”\nMy first question to the Minister around that definition at clause 5(2) is whether at section 5(1) replacing “AML/CFT supervisor” with an open-ended definition that is at the behest of the Prime Minister is in fact giving effect to what industry have been saying for those years. Will this not only improve longevity and an understanding of the industry that there is one supervisor and that it is DIA but also that this supervisor will be appropriately resourced to be able to do the work that is it is required to do across the industries that it is required to regulate?\nI will come back to this because I think the guts of this bill really is the levy, but we don’t come to that until later in the bill. So we will approach that methodically, as my colleague has said. The question I want to ask the Minister underneath this definitional point is about the fact that DIA is mostly the preferred regulator of those submitters who submitted from a professional services bent—accountants and lawyers, say. That is the regulator they have dealt with. But for other participants in the system, say, fintechs and banks, their regulator has been the FMA. The FMA have a particular set of expertise in here, which never needed to defined in an anti - money-laundering bill because their remit was clear: for the health and oversight of a strong and enduring financial system that was not unnecessarily exposed to risk either from money-laundering or other financial risks that occur because of inadequate supervision. So when the FMA is granting its functions over DIA, which is a part of this bill, are we clear and do we have confidence, Minister, that that expertise is also being transferred over?\nThe example that I point to here is the FMA bringing a set of practice notes with a particular fintech that was warned and then fined $900,000 for not reporting suspicious transactions. That was done by the FMA’s director of supervision. That director of supervision has expertise in supervising all manner of trusts, not just publicly reporting entities that are covered by AML but also trust entities that have these kinds of reporting obligation under other Acts; say, those trusts that take retail investments and need to report to the people who invest in them. That supervision expertise is a set of expertise which is not just public expertise but also exists in the commercial sector. Supervision expertise is something you can buy and pay for and is well understood within the market. That is something that the FMA have a role in all of the time—in supervising the supervisors and then being the supervisor for funds and for trusts, but that is something that DIA is not in the usual business of doing.\nI want to ask the Minister about how DIA can play that role for the types of organisations that it is not best set up to cater for, that the FMA was catering for. I agree with her comments that a series of overlapping decisions made it very clear that one regulator would benefit, but, as I’ve said, submitters made the connection there because of the resourcing constraints, not because three regulators who have slightly different remits for slightly different industries was inherently a bad thing. Is DIA well equipped to deal with real estate? I ask this question because from 2020 to 2022 the focus internationally and in New Zealand was on the risk of money-laundering through real estate transactions. That should still be our focus as it is large amounts of money that are laundered in this way. Is DIA well equipped to not only deal with real estate agents but their professional obligations when dealing with real assets and land assets? Is it the supervisor that is best placed to continue their focus that New Zealand owes the rest of the world?\nHon NICOLE McKEE (Associate Minister of Justice) (21:41) : Yes, but I will explain a little bit more. As I mentioned earlier when we talked in the previous bill, the supervisors that were the Financial Markets Authority (FMA) and Reserve Bank, made up of some very skilled people—some of those people are actually moving over into the Department of Internal Affairs’ (DIA’s) anti - money-laundering (AML) team, so we’re not losing that expertise.\nI mean, part of the problem with the three supervisors is that two of them were legal entities and one wasn’t. This is where part of the conflict came when it was time to actually give out advice because one may be able to give out advice, but it may contradict another’s legal references. In order to have DIA be the single supervisor in things that we capture with FMA and Reserve Bank skilled people sitting on there, and capture the things that they need to still capture, like the example that you gave, but they’re not going to conflict with each other’s Acts when it comes to giving out that information. They can basically nail it, go out there and penalise people who abuse it or who don’t comply with it, but they can also give out that advice that is needed across all of those markets, including the fintechs as well. They will be working together, and I’m really pleased that the team that has come together will have skills and expertise across all three of those previous supervisory roles.\nDr LAWRENCE XU-NAN (Green) (21:43) : Thank you, Mr Chair. Thank you, Minister, for that response. That segues nicely into my question, which is on clause 7, “Section 39A amended”, around suspicious activity. Now, I understand that for this particular part, the insertions just in section 39A(b), inserted by clause 7, with the inclusion of additional articles, for example, describing section 67A, which is the prohibition of certain cash transactions, but I want to check with the Associate Minister of Justice that while we’re going from three supervisors to one—and I actually want to thank Dr David Wilson for his guidance around this and he may be able to speak more to this particular point—one of the missing links in all of this is the role of banks.\nArena Williams : Yep.\nDr LAWRENCE XU-NAN : Yeah, a lot of that because, again, if when we are looking at three to one, what is the Department of Internal Affairs’ (DIA’s) role in reinforcing or holding banks accountable for ensuring that their processes are up to speed and that they don’t have sort of, like, bank accounts on their books that have been used to facilitate some of the transactions? I noticed that a lot of the things to do with scams etc., do go through a bank account. So when we’re reporting suspicious activities, I just want to know from the Minister whether there’s any consideration of the role of banks in all of this and how they are being held accountable, or how their processes are being held accountable, for any of these activities.\nThe next question I have is also with suspicious activity, and I referenced this in the second reading of my speech, which is that recently, in France, we saw the landmark case with the Lafarge cement company, which has been charged with financing terrorism in Syria and adjacent areas. Lafarge cement is now a subsidiary of the Swiss cement company Holcim, which also operates here in Aotearoa New Zealand. I guess the question there is, when we’re looking at suspicious activities, how broad are we able to go when we’re looking at the broader potential parent company or subsidiary of the parent company that operates in another jurisdiction, where, potentially, we just simply don’t know how they can be linked to a reporting entity or for a person conducting a transaction here in New Zealand? Are there any thoughts that you might have, any sort of advice you’ve taken from DIA, or any other things that you’re working together on in this new area on how we can address that?\nHon NICOLE McKEE (Associate Minister of Justice) (21:45) : Thank you, Mr Chair. I thank the member for his question. There’s a lot of operational detail in there that we would never cover in legislation, but I think if I can answer in this way—and hopefully it answers your question—part of the funding for the levy is to also fund the FIU, which is the Financial Investigation Unit of the New Zealand Police. When the member talks about if we see crime occurring or a bank sees crime occurring, and he’s asking about parent companies, etc.; that’s where I expect the FIU would be able to step in and take any potential criminal cases that occur from the money-laundering.\nNow, when we went out for the discussions with the banks on the levy—well, not just the banks; we went out to everybody to talk to them about the levy and who would pay what and whether or not it was fair, and those discussions have been had and feedback given—we were looking at proportioning part of the levy based on who has the highest rate of, perhaps, potential laundered money going through their system. For example, banks will have more money going through and being laundered through their system then, say, your average real estate agent, so we’re looking at ensuring that the correct amount is being paid in the correct places. But then the question that remained was, “Well, we’re now paying this amount, so what are we getting for it?” This is why we’ve gone out for consultation, because we’ve basically said to the industry, “What do you need in order to operate well? What do you need to be able to mitigate the financial risks that are being undertaken, but also go after the organised crime?” The people that were consulted with came back and said, “Well, we really need the FIU to also be well funded because it’s one thing to stop these transactions, but if we don’t stop it from where it’s originating or even, you know, put some effort into that, it’s just going to keep reoccurring.”\nThe levy will help pay for the investigation of the criminal activity that comes from those suspicious activity reports that are given to the Police. I hope that answers the question of what happens with the flow-on effect once those suspicious activity reports—or SARS, as we call them—get reported. We do have the other avenues. It’s one thing for the supervisor to give advice, but we also have the FIU in there, which is going to take on the criminal activity that comes from that as well.\nREUBEN DAVIDSON (Labour—Christchurch East) (21:48) : Thank you, Mr Chair. Now, please don’t take this as suspicious activity, but I do want to take a step slightly backwards from where we were in the suspicious activity. I wanted to come to Part 1, clause 6, “Section 16 amended”, which is around the standard customer due diligence and verification of identity requirements. In clause 6(1A), “Subsection (1)(b) and (c) does not require a reporting entity to take steps to verify any information obtained under section 15(d).”\nNow, we’ve talked a lot, in various speeches, around the futurepr", "window_id": "2026-04-28#16"}, {"statement_id": "4f03427aae1a61e3", "politician": "Tangi Utikere", "party": "Labour", "side": "opposition", "date": "2026-05-20", "statement": "This bill will not simply mean that port companies have to provide all the information under the sun. The limitations around access to information would still exist—that’s contained within the principal Act here.", "window": "TANGI UTIKERE: I am absolutely shameless when it comes to my constituency of Palmerston North, I’ll give the member that.\nThe decisions that port companies do take are significant decisions, and what this bill seeks to do is to bring into the fold of the Local Government Official Information and Meetings Act (LGOIMA) the operations of port companies in New Zealand. This is not about additional work; it’s not about sort of uncovering these mass issues that are arising in port companies; but it is actually about providing a level of transparency and accountability. I think that, given that there are significant public monies that are pumped through port companies by the mere fact that many of them are owned by local authorities, that’s not actually a difficult thing to ask of or expect from port companies.\nWe are familiar in our communities around the nature of council-controlled organisations (CCOs)—often they are museums or library or theatre organisations and groups—but there are always opportunities within the LGOIMA legislation, which does provide for some information to be withheld from the public. I think everyone in this House has experienced or is aware of the thresholds that exist around the withholding of information being supplied as a result of a public request. This bill will not simply mean that port companies have to provide all the information under the sun. The limitations around access to information would still exist—that’s contained within the principal Act here. If there are commercial situations where commercial sensitivity is an issue that is a justification for withholding that information, ports would still be able to rely on that. Now, that’s not to say that there is an expectation that ports, or other CCOs for that matter, would just use that as they wish, because the threshold still needs to be met.\nThis is a good bill that applies three existing provisions within LGOIMA, and they relate to the principal objectives of the council-controlled organisation. The member has touched on that—around being good employers, about the objectives in terms of return opportunities to shareholders, but also how they can show environmental and social responsibilities to the communities within which these entities do operate. The others relate to the access to information and how information might be withheld if appropriate.\nIn conclusion, I congratulate the member on having the bill drawn. I do hope that it does make its way to the Transport and Infrastructure Committee. I think there are absolute synergies there alongside the work that’s currently under way, and it’s an important piece of legislation.\nHon Dr SHANE RETI (National—Whangārei) (17:19) : Thank you, Madam Speaker. I too want to congratulate the member for having this bill drawn. I think across a political career, roughly 30 to 50 percent of MPs have their bills drawn from the ballot box, so congratulations for working it up, getting it through caucus, and then getting it drawn. That’s quite a process.\nThis bill speaks to accountability, transparency, and community interests, which are all values we support. I guess the question is whether the bill is the right way to achieve this, or whether it’s maybe too blunt for what’s quite a complex system.\nAs we’ve heard, ports are not like most council-controlled organisations; they operate in a highly competitive commercial environment, making decisions in real time. If the goal is to enhance transparency, some of the risks surely also could be, as we’ve heard addressed, exposing commercially sensitive information, delaying decision making, and creating uncertainty for partners and investors. You’ll also note, as we’ve heard from Andy Foster, that the port inquiry through the Transport and Infrastructure Committee may well conclude at around the same time as this bill is making its way, and I’m sure that will throw further light on.\nLook, I think, in summary, there’s three arguments that concern us. One, there’s already distinct commercial legislation: the Port Companies Act 1988; two, the acts that that Act describes required governance structures, and what’s being proposed here would duplicate these; and thirdly, the different focus of ports to be highly competitive compared to the focus that the OIA for local government is. I would also just point out the political lineage of the exclusions in the 2002 Act was actually brought to the House in December 2001 by Labour MP Sandra Lee under a Labour Government. It was then passed over to Chris Carter, who took it through its third reading in December 2002. So it’s actually come from within the team; they thought that the exclusion was important, and I think it is too. So thank you. Thank you for that opportunity to speak to the bill, and we’ll monitor its progress through the House.\nRACHEL BOYACK (Labour—Nelson) (17:21) : Thank you, Madam Speaker. It’s a real pleasure to take a call on the Local Government (Port Companies Accountability) Amendment Bill. Can I begin by congratulating my colleague Lemauga Lydia Sosene on having her bill drawn and on making it this far. I hope that it will pass tonight, and it sounds like maybe it will with the support of New Zealand First. So congratulations again to my colleague.\nThis nearly could have become a “Who has the best port?” competition-type speech tonight. I have the best port in my electorate. I’m sure you agree with me, Madam Speaker—I’ll just indulge the House and bring you into the debate a little bit naughtily. I’m really proud to represent an electorate that has a strong port, an excellent port company led by the wonderful Matt McDonald, which is obviously owned by the Nelson and Tasman councils—and that’s another story, around our two councils.\nI think this is an excellent bill, and I don’t want to take too much of the House’s time tonight. I just want to respond to some of the criticisms brought up by the other side. The first is that any concerns around how this bill will operate, that can be teased out at select committee. That is the purpose of a select committee, and I want to acknowledge New Zealand First for pointing out some of the things they believe need to be addressed at a select committee. That is the role of a select committee; so that’s where this bill needs to go.\nThe second point that I want to make is that there are reasons, under the Local Government Official Information and Meetings Act—just like there are under the Official Information Act—to withhold information. You can write that into legislation very easily to actually address those times when it would be inappropriate to release the information. It could be matters of commercial sensitivity, or other matters that where the public interest does not outweigh the importance of keeping that information from the public at that time. That is one of the concepts that sits behind our official information legislation, so I don’t see why we can’t have the principles of this, which is: these ports are publicly owned companies through our councils and they therefore should have that transparency, should have that accountability mechanism, because it is about the use of ratepayer money. It is about, at times, the use of central government money when money flows into the ports for projects, like we’ve had in Nelson. So there is actually that right for that transparency for the people who are paying for services that are provided by our ports.\nHowever, I absolutely respect there will be times when it would be wholly inappropriate for matters related to commercial sensitivity or matters where something could be put at risk if that information was released to the public at that time. That is why we have these Acts; they do exactly that. I encourage National and ACT to rethink their position. Send this bill to the select committee so that those conversations can be teased out through official advice at select committee. It’s the place to have that conversation so that we can say, “Yes, we support transparency. Here are the areas where we would need to have carve-outs, to ensure that we didn’t put the port companies, operations, and their profitability at risk.”\nWe can get that balance right through a select committee process. That’s what we’re here to do. It’s a fantastic bill; congratulations again to my colleague, and I commend it to the House.\nHon MELISSA LEE (National) (17:25) : Thank you, Madam Speaker. I’d like to start off by congratulating my colleague across the House Lemauga Lydia Sosene, who I serve with on the Governance and Administration Committee. This Local Government (Port Companies Accountability) Amendment Bill, which she is the sponsor for, this side of the House—the National Party—will not be supporting it. We do actually oppose it. Let me start and explain why that is.\nI have to agree with my colleague from the ACT Party Cameron Luxton. I was sitting here listening to him, and he makes perfect sense: where is the problem definition? It actually reminded me of a saying. As a Korean who learnt English as a second language, often some of the English vernacular didn’t make a lot of sense to me when I was growing up. There was a saying, “A solution looking for a problem”. I’m going, what the heck does that actually mean? This sort of describes that, I think. It’s like, this is supposed to be a solution looking for problem, because I have not heard that side of the House telling us why we actually need to change the Act, why we need this member’s bill in order to fix a problem. There is no problem.\nThe reason why that is, is that there is an exclusion for our ports, and I think it is rightly sore because—I know lots of people have actually said “LGOIMA”, there might be some people who don’t actually understand what “LGOIMA” is: Local Government Official Information and Meetings Act. Just like the Official Information Act that we have in Parliament for Ministers, for example, and Government departments who receive this request for information. There are certain things that cannot actually be answered, and often you see redacted documents that actually shows that, you know, it protects our privacy or free and frank conversations that Ministers might actually have with the Government officials. That’s fair enough. But the thing is that they’re trying to say that there is no transparency.\nI think it was member from the Green Party Mike Davidson who was actually saying almost like that there are things that we need to discover, these secret things that are happening. Well, as a company—and often these port companies, some of them are local government entities, as in council-controlled organisations. But some of them are actually, like Port of Tauranga is, you know, it’s a private company. I remember—and a lot of them are listed in the Stock Exchange. And when these commercial entities have to report back, often they do as a commercial entity to their owners, to their shareholders, to the councils. They actually are very transparent as to what they do and how much they’ve earned, all that kind of stuff. It’s not as if nobody finds out about their activity.\nBut I just want to give a different, slightly different perspective. When my family actually first moved to New Zealand, my parents set up an import and export company. One of the things that I had to do, as the person who apparently spoke better English than my parents, I had to be responsible for the documentation for all of the importing and exporting. I remember having to clear Customs, and then having to actually take receipt of 40-tonne truck containers that got delivered from Korea. We were responsible for import of the Korean instant noodles that you now enjoy at supermarkets, you know, and my favourite is the one—Shin Ramyun is my favourite. But the thing is that when food companies, for example, have to do LGOIMA or Official Information Act kind of thing, when they incur costs, guess who actually pays for it! It’s actually the customers who have to pay, because they’ve incurred costs. They’re actually not going to not pass on the costs that they incur.\nYou know, they already have transparency. These are companies that actually are doing their very best to help New Zealand grow. I have seen Auckland port—I know somebody said it’s a bit of a competition—Port of Auckland going, from 1988 when it wasn’t as spick-and-span as it is currently now, and doing more containers per week, per day and actually helping our exporters and importers trade through that port. I’m so very proud of the work that they do.\nI think that this is an overreach and it is a solution looking for a problem. But I actually wish my colleague best of luck at select committee.\nLEMAUGA LYDIA SOSENE (Labour—Māngere) (17:29) : Thank you, Madam Speaker. It’s a pleasure to be able to reply to a number of the contributions that have been made. It is disappointing that the speakers on the other side will not be supporting it through the first reading to the select committee process. I think that’s the very thing that I wanted to point out. A couple of speakers have talked about the problem definition, and what I’m asking for, through this bill, is transparency and the ability to look at a possible national port strategy that would have a more complementary strategy for ports within New Zealand. I appreciate that a number of members have made some specific comments around the port strategy and around the fuel crisis, which is a couple of parts that I did speak about. In my personal view, it does not overlap. Each port that I have looked at and that I have studied has obviously got strengths and weaknesses. Importantly, it was a real delight to be able to understand the infrastructure.\nI come back to the points that were made by other members in terms of transparency, and I do want to acknowledge the support of the Greens and also New Zealand First, in terms of the speakers around transparency. It is important that under the Local G", "window_id": "2026-05-20#10"}, {"statement_id": "5723902cd290b22b", "politician": "Simeon Brown", "party": "National", "side": "government", "date": "2023-12-12", "statement": "I acknowledge all of the coalition partners in their support and I thank them for their support so far in the passage through this House and their continued support as we progress this legislation through the House, and I commend it to the House.", "window": "Hon DAMIEN O’CONNOR: Mr Speaker, thank you very much. I’m very pleased to take a call on this piece of legislation. It is another classic backtrack—not back-on-track; backtrack—legislation. [Interruption] Yeah, backtrack—that’s it exactly. At a time when—as my colleague has just said—we’ve just concluded internationally at COP a commitment to move forward on lower-emitting technologies and efforts across the globe to try and reduce the effects of climate change. It is a little ironic that we pass a piece of legislation that’s going to reverse the direction of travel—pardon the pun.\nI was certainly in the firing line when this was introduced, and I’m very aware of the limited number of options around commercial vehicles across the country. Although, in a discussion and further investigation, at the time it was introduced, one little story the member might be interested in: the Ford Ranger, which was a very popular selling—still is popular selling—vehicle, basically runs a Euro5 motor. If Ford had chosen to be selling the Euro6 motor in New Zealand, the $8,000 or thereabouts tax that was being charged and had been charged would have been significantly lower because of the emissions profile of that vehicle. The point being that there is technology around the world to reduce the emissions and reduce the impulse that the previous legislation brought upon many people who were purchasing or needed to purchase utes and commercial vehicles like that. This was an incentive to move us in the right direction, and, indeed, the uptake of electric vehicles and hybrids in this country is a measure of the success of this piece of legislation—that’s now been backtracked.\nCan I ask one question? If it was that bad, I ask every single National Party and ACT member of Parliament that took up the subsidy, as they call it, and claimed it for the electric vehicles they purchased to pay it back. Pay the money back. Pay the money back—\nTom Rutherford : Pay the taxpayer back for all the money you wasted over the last six years.\nGrant McCallum : Pay the money back to the farmers.\nPay the money back if you think that it was a bad scheme. Mr Speaker, there are a few calls over there—\n\nHon DAMIEN O’CONNOR: I’ll just talk about agriculture, for example, and farmers. Yes, it was an impost on those who had to buy.\nGrant McCallum : Yes, here we go!\nI’m acknowledging that. But there’s a lot of them also. In fact, we help a farmer buy an electric vehicle as well, a car. So they paid somewhere; they picked it up somewhere else.\nCan I just say the hundreds of millions of dollars that the taxpayers have paid across to the agricultural sector—a good investment, but it is a subsidy by some people’s measure. We call it good investment—we did when we were in Government. Good investment. A billion dollars in one Budget alone for the rural sectors. Eight hundred million dollars from taxpayers to help eliminate Mycoplasma bovis, which, if it had been let run, would have imposed huge additional costs on farmers. We saw the value in that investment, just as the legislation for the Clean Car Discount we saw as a good investment in the future decarbonisation of our economy.\nMy colleague Megan Woods pointed out that if we don’t move to reduce our carbon emissions, we do have a legal obligation in 2030 that will require the writing out of cheques. We thought that early investment in this area, encouraging more electric vehicles into the market, is a smart way forward. Indeed, people like myself who were somewhat cynical about the effectiveness of an electric vehicle but was forced to have one by the Prime Minister—can I say that they are really, really smart vehicles. If you live in a city, everyone should have an electric vehicle. Everyone.\nTom Rutherford : What about the rural areas?\nYeah, of course there’s a difference in rural areas. We are now starting to see—be it Rivian, be it Ford—a Ranger that is a hybrid vehicle coming on to the market next year. We’re starting to see movement in that direction. We had the vision. This Government is a backtrack Government with a backtrack piece of legislation.\n\nCAMERON BREWER: I rise in support of this bill and perhaps the biggest revelation this morning that we’ve heard has come from one of the most seasoned operators in the Labour Party, Megan Woods. She said in her call that this scheme was supposed to be self-funding in 10 years. Well, yesterday, the Minister of Transport revealed that the Clean Car Discount has become fiscally irresponsible, with taxpayers now footing a $302.5 million deficit.\nThe Ministry of Transport has also admitted that the ute tax in the electric vehicle subsidy scheme is fiscally unsustainable. And even in our explanatory note here, it notes: “The scheme has challenges that are likely to intensify the longer the scheme is in place. … it is difficult to make financially sustainable and self-financing; it possesses ongoing equity and fairness concerns; it will become less effective over time as electric vehicle prices fall … it requires constant changes to its rebates and charges”. Subsequently, I rise in support of this on behalf of hard-working Upper Harbour taxpayers that the Government has decided to discontinue this mad scheme. Thank you.\nA party vote was called for on the question, That the Land Transport (Clean Vehicle Discount Scheme Repeal) Amendment Bill be now read a first time.\nNew Zealand National 48; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 14; Te Pāti Māori 6.\n\nHon SIMEON BROWN: I move, That the Land Transport (Clean Vehicle Discount Scheme Repeal) Amendment Bill be now read a second time.\nI move that this bill be read a second time and I commend it to the House. I’ve just been listening to the debate from the members opposite who have been trying to tell this House how amazing the scheme was, but they don’t have an answer to one of the key questions here:
