opening the new North Canterbury afterhours medical facility in Rangiora. Won’t that be great for my local constituents?\nAs you can see, it’s going to be a great vibe in 2026, and of course, nationally, as we go to an election year, we will be talking to voters, saying, “Don’t put this at risk”, because it doesn’t take you long to think of going back to a time under that last failed socialist experiment that was the last Labour Government. Think of projects like KiwiBuild, Auckland Light Rail, restructuring the health system in the middle of a pandemic. I mean, who in their right mind would do that? And, of course, that taniwha that was three waters. How did that go down? Like a cup of cold sick. Quite rightly, that’s why they were voted out, and that’s what we’ve got to raise awareness of: don’t put this country at risk.\nThere’s one area I want to talk about. I mean, we’re still looking for it, aren’t we? That $1.9 billion for mental health that the last Government announced. The Mental Health and Wellbeing Commission said there was no evidence of it—“made no material improvement”. That’s so emblematic of that last Government: talked a big game, put the trophy out. The easiest thing is to make a big announcement—money here, money there—but it failed on the follow-through and implementation. That’s why, for mental health, this Government is very different. Our mental health plan is working: faster access to support, more front-line workers, and a better crisis response.\nYou only need to look at the latest data coming out of the mental health targets. It’s the first time we’ve had mental health targets in New Zealand. There’s nothing more accountable for me, as mental health Minister, and this Government is setting very clear targets and holding us to account. For primary mental health, the target is 80 percent of people to be seen within one week, and the latest data shows that 83.4 percent of Kiwis get seen within one week for primary mental health. For specialist mental health: to be seen within three weeks, the target is 80 percent; nationally, we’re at 82.2 percent of Kiwis in their time of need being seen within three weeks. Emergency departments: to ensure people are admitted, discharged, transferred within six hours; 66.8 percent under a National Government, a marked improvement from the last Labour Government.\nWhat’s really interesting is that, by actually measuring something, you can improve the performance. You capture the data. The data shows that Māori are accessing mental health services faster than any other community. Not only that, the data shows that our rural communities are accessing mental health services faster than our urban communities. That is happening under a National Government. Māori are getting faster access to support. Rural communities are getting faster access to support. It shows that, if you have a clear plan and you follow through with implementation, you get the results.\nFor more front-line workforce, I’m happy to announce the latest data, out at the start of this year, an increase of over 11 percent more front-line workers now at the front line from when we came into Government.\nIt’s quite staggering when you look at some of the statistics. The vacancy rates for mental ", "window_id": "2026-01-27#13"}, {"statement_id": "e1f4d0706967324a", "politician": "James Meager", "party": "National", "side": "government", "date": "2026-02-17", "statement": "I gave a couple of examples of where a priority might shift over time and you might have to shift the composition of the group, but underlining all this, of course, are those longstanding requirements of the public sector, including of the chief executive of the DPMC to abide by all of the rules around appointments under the Public Service Act.", "window": "TOM RUTHERFORD: Ginny Andersen—well, she can screech from the top of her lungs, but she’s on the far side over there, and so we don’t need to worry about her.\nThis is making some really positive changes in the employment relations space, and therefore I’m going to commend it to the House.\nA party vote was called for on the question, That the Employment Relations Amendment Bill be now read a third time .\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 14; Te Pāti Māori 4; Ferris; Kapa-Kingi.\nBill read a third time.\nThe result corrected after originally being announced as Ayes 68, Noes 55.\n\nHon PRIYANCA RADHAKRISHNAN: Yeah, sure. It would be in section—\nTim Costley : She doesn’t know—she’s looking it up.\nOh, this little rabbiting from across the Chamber. I’m just trying to read the bill—do you mind? It was the replacement of section 11 in clause 10, basically, that I’m speaking to, and I’m speaking to the changes that are proposed in this amendment bill to that, which remove the “current Government and successive governments” part—so it’s clause 10, “Section 11 replaced (Purpose)”—and I would like to know why.\nThe second point that I’d like to make and the question I’d like to ask is related to the removal or the reduction in the number of long-term insights briefings (LTIBs), which is a specific change that this amendment bill is proposing to make. That is literally one of the very few tools that step outside of the election cycle to look at what the big things that are facing New Zealand are—what’s coming our way, what we should be mindful of in that regard, and then what the choices are that we have to fix them. That is a tool that allows this Parliament to be future-focused. It provides politically neutral analysis that we can then act on and that Ministers can choose to act on or not in order to think ahead, and it really shifts the focus from just being reactive to being a Parliament that is able to plan ahead. That is being removed in a significant way, because it’s being reduced to just one, single long-term insights briefing that the Department of the Prime Minister and Cabinet will hold the pen on.\nIf we were to look at some examples, Treasury did a whole piece of work—a whole briefing—around the future of work, looking at how we plan for workforce transition. The Ministry for the Environment did something similar around climate change, as well.\nThe Minister made a point in the committee stage previously that this bill does not attempt to change the point that the Public Service should be politically neutral. I would propose to the Minister that the accumulation of these different changes in different parts of the amendment do exactly that because it removes the tools that allow for politically neutral planning and analysis through the changes to the LTIBs. The fact that the purpose statement no longer contains mention of “current Government and successive governments” also points to the fact that political neutrality is being tampered with through this amendment bill, and I would like the Minister to share any evidence that he might have considered along this point when you look at the cumulative changes that are bared or proposed by this amendment bill.\nHon JAMES MEAGER (Minister for Hunting and Fishing) (16:50) : Thank you, Madam Chair. I again reject the assertion that political neutrality is being tampered with in this bill. If you look at a range of strengthening aspects in this bill, including the stewardship requirements, the requirement in section 12 for the Public Service to maintain their ability to serve successive Government’s by being politically neutral, and the expectation that agencies build long-term thinking into their advice, there are a number of ways where political neutrality is strengthened throughout this bill.\nIn terms of the exact drafting of clause 10, which replaces section 11, implicit in the drafting of new section 11A is the present tense and the active: “The public service supports the Government to develop and implement its policies, deliver high quality and efficient public services, and meet the needs of New Zealanders”. Then you’ve got the spirit of service, supporting constitutional and democratic government. Now, inherent in that is the requirement to support both the Government of the day and successive Governments, because, of course, a successive Government only comes into existence once it becomes Government and, at that point, it becomes the Government of the day. So having “current and successive Governments” is, essentially—what’s the very fancy phrase you use when something’s redundant? Oh, it’s redundant. I’ll just put it that way. I’ll say it’s redundant. It’s not necessary, because the clause itself explains that the requirement is for the Public Service to support the Government of the day, regardless, of course, of whether that Government is a National - New Zealand First - ACT coalition Government or whether the Government is some sort of unknown and unwanted composition.\nJust in terms of the member’s second point around long-term insights briefings, the essential point to this is that there is the stewardship component required in the bill. There is now the requirement for the Department of the Prime Minister and Cabinet (DPMC) to produce one single long-term insights briefing, which covers a range of areas. Beforehand, we were requiring every agency to provide one of these every three years. There was a lot of crossover, there was a lot of acting independently, and there was a lot of acting in silos, and, I think, a lot of probably good effort went into a significant amount of work, which wasn’t being utilised in any sort of effective way. Providing this function through DPMC will mean that the DPMC will engage with key agencies on topics and areas and themes that are of interest to the State sector and the Government of the day. Of course, should that composition change, then those themes and areas could be adapted and modified to suit the Government of the day.\nTOM RUTHERFORD (National—Bay of Plenty) (16:53) : I move, That debate on this question now close .\n\nHon JAMES MEAGER: Because we’ve got plenty of RMA lawyers in the Parliament who are more than capable of providing solicited or unsolicited advice to the Department of the Prime Minister and Cabinet on various bits of legislation.\nBut the point, I think, is that it’s not that you need to be an expert in the RMA to have the relevant skill set, as the member points out, but there may be some things about a group of priorities, which, as they shift over time, mean you need to change the make-up of the policy advisory groups to better suit or better reflect that reality. I gave a couple of examples of where a priority might shift over time and you might have to shift the composition of the group, but underlining all this, of course, are those longstanding requirements of the public sector, including of the chief executive of the DPMC to abide by all of the rules around appointments under the Public Service Act.", "window_id": "2026-02-17#7"}, {"statement_id": "208b4449ee94610f", "politician": "Nicola Willis", "party": "National", "side": "government", "date": "2026-03-03", "statement": "As I said before, Governments aim for positive, low, stable inflation, and it is tragic when they fail to achieve that because big price increases do get baked in, as they did under the previous Government.", "window": "Hon NICOLA WILLIS: The loudest false promise I have heard in recent times has been from those who out of one side of their mouth say that they care deeply about the cost of living and out the other side of their mouth say that they would change the inflation-targeting regime, would introduce new taxes on tenants, and at the same time would remove the Investment Boost tax policy, which is the very thing that Treasury says will drive future wage growth. I care deeply about the cost of living, but it is not enough to care; that member needs to come up with serious policies on the cost of living if she wants to be taken seriously.\n\nHon David Seymour: Is the Minister impatient to know how Barbara Edmonds thinks she’d ever pay for anything—\n\nHon NICOLA WILLIS: Annual CPI inflation is almost never negative, which is to say that, overall, prices don’t reduce across the economy, on average, and Governments don’t target a drop in the overall price level, because that would lead to people reducing spending and investing, and jobs would be lost and the economy would suffer. Inflation did turn mildly negative in 1999, when the Asian financial crisis reduced the price of imports. Before that, you have to go back to 1946 to find another example of negative inflation. As I said before, Governments aim for positive, low, stable inflation, and it is tragic when they fail to achieve that because big price increases do get baked in, as they did under the previous Government.\nQuestion time interrupted.\nPersonal Explanations\nGrocery Prices—Social Media Comments\nRt Hon CHRIS HIPKINS (Leader of the Opposition) (15:09) : Point of order, Mr Speaker. I seek leave to correct a statement that I made in the House regarding a social media post issued by Nicola Willis.\n\nRt Hon CHRIS HIPKINS: Speaking in the House recently, I alluded to a Facebook post of Nicola Willis where she was unpacking some groceries, and I said that in Facebook post, she had committed to lowering grocery prices. I was mistaken. I should have referred to her press statements of 14 June 2023, 13 July 2023, 12 October 2023, her press conference on 27 August 2025, and her Facebook video in September 2025, all of which committed her to lowering grocery prices.\nHon NICOLA WILLIS (Minister of Finance) (15:09) : Point of order, Mr Speaker. I think that is a misuse of the correction, because—[ Interruption ] Could I have my point of order heard in silence, because—\n\nHon NICOLA WILLIS: The statement which I asked to be corrected was that I had posted a video, and, clearly, the video that he has referred to did not make the statement that he claimed. The context for the things that he is quoting is quite different. It is about the goal of grocery reforms, and the goal of those reforms is quite clearly to make groceries cheaper. That is very different from issuing a campaign video promising that under National, food prices will drop. That was not a promise I made, and I resent being misrepresented in this House and then having him be cute about the fact that he did that.\nRt Hon CHRIS HIPKINS (Leader of the Opposition) (15:10) : Speaking to the point of order, I’m happy to quote directly from the press statement that I’ve just mentioned—\n\nHon LOUISE UPSTON: MSD also found that nearly 99 percent of clients are fulfilling their obligations and the number of sanctions has dropped by 10.6 percent between the September 2024 and September 2025 quarters. The changes we have made have increased client activity and engagement with MSD. This includes a focus on ensuring jobseeker support clients are meeting their obligations. Our Government will continue to support unemployed New Zealanders into work, and having a more proactive welfare system is a really important part of this.\nDana Kirkpatrick : How has the traffic light system helped people understand their obligations?\nThe traffic light system was designed to reset the expectations for those on welfare so that they’re clear about both their rights and their responsibilities. It is helping job seekers to understand and navigate their obligations, helping them to be prepared and proactive and to seize work opportunities when they come along. The colour-coded communication tool is useful because it helps clients re-comply quickly. This has been especially helpful for clients with literacy challenges or language barriers. We know that economic times continue to be challenging, but we want people to be ready as the jobs come. The traffic light system reinforces that expectation.\nDana Kirkpatrick : What other initiatives is the Government implementing to help people into work?\nThe traffic light system is just one part of our wider Welfare that Works programme. Our Government continues to support job seekers into work, with investment into MSD’s front line. We’ve also introduced phone-based case management, supporting 10,000 more people in case management at any time. We’ve also improved the way MSD works with businesses to provide opportunities for job seekers to gain employment. The changes that we have made ensure our welfare system proactively supports those who can work to get off welfare, and we know that work is one of the best ways to lift people out of hardship.\nPrime Minister\nQuestion No. 6\nCHLÖE SWARBRICK (Co-Leader—Green) (15:14) to the Prime Minister : E tautoko ana ia i ngā kōrero me ngā mahi katoa a tōna Kāwanatanga?\n[ Does he stand by all of his Government’s statements and actions? ]\nRt Hon CHRISTOPHER LUXON (Prime Minister) (15:14) : Yes.\nChlöe Swarbrick : Is the Prime Minister aware of how many people, including children, have been kept or made homeless as a result of his Government’s decisions to tighten access to emergency housing, implement benefit sanctions, and more?\n\nRt Hon CHRISTOPHER LUXON: Well, as I’ve said to the member before, I’m very proud that we’ve made house purchasing more affordable. Rents have come down, I think 6,000 or 7,000 people have come off the social housing wait-list, and, when I last looked, 2,100 children had been moved out of emergency housing into proper, dry homes, and there’s big investment going in and support happening in homeless situations, as well.\nChlöe Swarbrick : Point of order, Mr Speaker. The Prime Minister did not address the question, which was whether he is tracking any data on how many people have been made homeless or kept in homelessness as a result of the Government’s decisions to tighten access to emergency housing.\n\nRt Hon CHRISTOPHER LUXON: Well, as I’ve said to the member before, our record on housing is much better than that member’s, when homelessness went up 37 percent and $1 billion was spent. What we see is housing affordability for people who can afford to buy a house, we see rents coming down, we’ve seen 6,000 people come off the social housing wait-list and 2,124 kids come out of squalid motels and into proper homes, we’ve seen rents that are actually stable to falling, and, importantly, at last count, Auckland Council, as I understand, is doing daily counts of rough sleepers. There are about 30 in the Auckland CBD, and the good news is that of the 300 Housing First places that we’ve made available, 203 have been tenanted and 13 have signed leases. So our action plan to make sure that we can support and deal with homelessness in the Auckland CBD, in particular, is making good progress.\nChlöe Swarbrick : Where does he expect those experiencing homelessness who have been denied support because of his Government’s decisions to tighten the criteria on emergency housing—as in their having contributed to their own homelessness—to go if they end up being issued with his intended move-on orders, other than to the next shop front, the next park, or the next cemetery?\nWell, in answer to the first part of the question, this is a Government that spends $515 million a year with different agencies and organisations supporting homeless folk; it’s a Government that spends $5 billion a year on total housing support. But, again, with respect to the move-on orders—and as the member would have found in the difficulty of leading homelessness and having a 37 percent increase when they were in Government—I’d just say that every situation is different and they’re complex situations. Our police now have tools around the move-on orders. They also are well aware of the social service agencies and are well-connected and will plug people into them as need be. But we trust our police, they’ve developed outstanding operational guidelines on gang patches, and we expect similar here.\nChlöe Swarbrick : Point of order, Mr Speaker. I seek leave of the House to table internal guidance circulated amongst MSD staff on the criteria to decline emergency housing applications from members of the public.\n\nRt Hon CHRISTOPHER LUXON: As I’ve said to the member, I would put this Government’s record up against the Labour-Greens Government’s record, when there was a 37 percent increase in homelessness and $1 billion being spent on emergency housing. I’m proud of the progress that we’ve made, and I’m proud of the fact that our homeless action plan is starting to pay a benefit.\nEnergy\nQuestion No. 7\nHon Dr MEGAN WOODS (Labour—Wigram) (15:18) to the Minister for Energy : Has he received advice on the impact of high levels of rooftop solar and household batteries on wholesale markets and distribution network costs; if so, what were the recommendations in that advice?\nHon SIMON WATTS (Minister for Energy) (15:19) : Yes, I have received advice on the impacts of high levels of rooftop solar and household batteries on wholesale markets and distribution costs. It identified potential benefits to household bills, while also requiring significant investment in the grid. That is why the Government is making a number of regulatory changes to make it easier to install rooftop solar and batteries. This includes removing building consent requirements for installing rooftop solar and batteries, and mandating retailers to pay fair price for electricity sold back into the grid from 1 July, along with a number of other regulatory changes to make it easier and cheaper to install rooftop solar and batteries.\n\nHon Dr Megan Woods: Does he agree with Ministry of Business, Innovation and Employment official advice in the regulatory impact statement on incentivising residential solar generation and sustainable buildings, which said of the changes that he has just outlined that “the incentive effect is not clear and [is] expected to be minor.”?\n\nHon SIMON WATTS: It would be fair to acknowledge that we considered a long list of options, including renewables, demand response, and new thermal plant. The challenge that we have as a country is that in a dry year, we do not have sufficient fuel to make power, and we need a solution to deal with that problem. The solution which we have landed on took into account cost, time to deliver, flexibility, and the spillover effects to the other parts of the economy, and that is why we landed on the decision that we have made and not other options.\n\nHon Dr Megan Woods: Has he sought advice this week on the relative impacts on wholesale electricity prices of importing LNG compared with increasing the uptake on distributed solar generation; if not, why not?\n\nHon SIMON WATTS: Well, the reality is—and I’m happy to provide a little bit more context for the member—that this Government isn’t intending to import LNG to replace natural gas, or for it to be imported regularly enough to see it set the gas price overall. LNG is simply a backup option to be imported during dry years. The alternative is that we have no fuel to make electricity, and that was the policy which we inherited, which drove power prices in 2024 to over $800 per megawatt hour and put New Zealand businesses and New Zealanders out of business.", "window_id": "2026-03-03#3"}, {"statement_id": "2ed87bee88e6a460", "politician": "Rawiri Waititi", "party": "Te Pāti Māori", "side": "opposition", "date": "2023-12-12", "statement": "As a new member of the Finance and Expenditure Committee, I would have welcomed the opportunity to hear from the Reserve Bank and the other monetary policy experts on the implications of this bill.", "window": "RAWIRI WAITITI: Well, I speak on the third reading of the Reserve Bank of New Zealand (Economic Objective) Amendment Bill. As laid out in my contributions in the first and second readings, Te Pāti Māori are strongly opposing this bill. I want to begin by reiterating how outrageous it is that the Government have pushed this law through under urgency. To refuse experts in the public the opportunity to submit is arrogant and extreme. It is reckless lawmaking. Te Pāti Māori are concerned with the excessive use of urgency that we have seen from successive Governments. Urgency should only be used when something is genuinely urgent, such as bills that respond to natural emergencies—and don’t worry, this was the same speech we gave to the last Government as well. There is nothing pressing or urgent about this bill, and even when urgency is used there should always still be a select committee process, even if it is shortened.\nAs a new member of the Finance and Expenditure Committee, I would have welcomed the opportunity to hear from the Reserve Bank and the other monetary policy experts on the implications of this bill. But it is clear that the implications are all bad. The benefit of the maximum sustainable employment objective of the Reserve Bank of New Zealand Act is that it ensures that the bank considers how its monetary policy effects employment outcomes. During periods in which prices are relatively stable, which is most of the time, the bank can stimulate the economy to support high levels of employment. This is an important counterweight to the general price stability emphasis of the Act and the bank’s operational policy. It helps to ensure the bank doesn’t run an unnecessarily restrictive monetary policy that damages economic output and employment outcomes.\nThis bill is a solution looking for a problem. There is no economic evidence that the employment mandate has contributed to inflation over the past two years, nor that it has had any other negative economic impacts. Monetary and economic policy should be designed in such a way that it uplifts the social and cultural outcomes of tangata whenua, tangata moana, and working people. Monetary policy that is blindly focused on economic orthodoxy and protecting the interests of the wealthy must be rejected.\nThe Te Pāti Māori approach to reforming the Reserve Bank would entirely be different. We would be looking to widen the mandate of the bank, not limit it even further. If you look at other countries, many have a much broader view and mandates for their reserve banks to take into account social outcomes and ensuring the wellbeing of communities. The mandate should include holistic wellbeing outcomes including social, cultural, and environmental.\nThe 21st century calls for radical rethink to the way we do economics in this country. The economy is not an end in of itself. It is a tool we can use to improve the social outcomes for our communities. People are struggling. Just getting the basics is becoming more and more expensive. Unemployment is rising. Māori unemployment, as always, is rising even faster. This bill just fills the pockets of this Government’s rich mates. At this time, we should be laser focused on policies to reduce unemployment, yet this Government is doing the exact opposite. We can see clearly the agenda of this Minister of Finance, which is capitalism over workers. It is the beginning.\nCarl Bates : Misinformation!\nOh, nickonomics. This is why we condemn this legislation. Te Pāti Māori will continue to fight for tangata whenua, tangata Tiriti, and for ordinary working people. E te Whare, tēnā tātou.\n\nHon JULIE ANNE GENTER: Tēnā koe, Mr Speaker. Can I congratulate you on your appointment as Assistant Speaker. Tēnā koutou e te Whare.\nI think, for the benefit of people who might be watching at home, we should put our speeches and language into a context that means something to ordinary people. I think, to ordinary people, the work of the Reserve Bank is not always clear. The impact of monetary and fiscal policy on people’s everyday lives, when we use that kind of jargon, isn’t always clear. This bill is not likely to make any substantial difference to inflation in and of itself. There is absolutely no reason to believe it would make a difference to inflation.\nAs I showed members opposite last night in the second reading on this bill, if we look at Consumers Price Index (CPI) inflation right around the globe, New Zealand tracked right along with other countries, like the United States, Denmark, the United Kingdom, and Australia. In fact, New Zealand’s inflation peaked at a lower level and, while CPI inflation has been slower to come down, ultimately it’s the same general shape, and that’s because the shock that affected New Zealand affected the whole world, and reserve banks around the world responded in similar ways—the constraints on people going to work, because of the COVID pandemic, did result in supply chain shortages, and there were other factors, like the invasion of Ukraine by Russia, which affected gas prices and oil prices, which flowed on to energy prices here in New Zealand.\nSo the main takeaway for people at home is that New Zealand has been through a similar experience to many other countries—that the new Government is trying to blame these arbitrary things on that result, rather than looking at the factors that genuinely contributed to prices going up here in New Zealand. Once we got into a situation of inflation and the Reserve Bank started tightening, which means raising interest rates, that has almost a cyclical effect—like, it tends to reinforce the price rises that were happening. So now food producers’ interest rates are going up—they’re passing that on in the price of food. Interest rates going up for mortgage holders, interest rates going up for landlords—so they’re putting up rents, even when they probably already own the building outright and don’t have a mortgage on it. So we get into the situation where the fact of increasing interest rates, while it can only bring down the price of so many things, definitely has an effect on asset prices like housing, but not necessarily consumer goods.\nUltimately, what the new Government wants people at home to believe is that they have the answers, that they are the masters of the economy, and that they’re going to improve everything for everyone in the country. The truth is that they have been put in these positions by wealthy donors and vested interests to look after the interests of those people, especially from the ACT Party but also from Nicola Willis, the Minister of Finance, in the National Party. There is a dangerous ideology, which is the belief that letting rich people get richer is good for everyone—well, obviously that’s not true—that implementing the failed neoliberal policies of the 1980s and 1990s will somehow make New Zealand more productive and lead to everyone being richer. But the truth is that what works for individuals to get wealthy in this current system does not work for everyone.\nSo when you say, for example, that we’re going to reward people for being landlords—which means that they do no work and they earn a return on their asset, and they don’t pay tax on that—everyone in the country cannot get wealthy through being landlords. I mean, think about it: can every single person in New Zealand be a landlord and get rich that way? No. Property owning is a type of rent-seeking which is not part of the productive economy, but the people opposite cannot tell the difference between what is good for them and their donors and what is good for New Zealand as a whole. They can’t tell the difference, and the reality is that, if New Zealanders want to see genuine, sustained improvement in our quality of life, we need to protect our environment, we need to make sure our water is clear, we need to accurately price pollution and externalities, and we need to support people by investing in public services, by raising benefits, by limiting the growth of rents, through things like rent controls, and that will genuinely create an environment in which people have an opportunity to succeed.\nWe all do better when we share the wealth, not hoard it, and that’s what the Green Party will continue to campaign for.\nDebate interrupted.\n\nHon KIERAN McANULTY: Point of order. Thank you, Mr Speaker. Yesterday at question time, in response to a question from the Hon Willow-Jean Prime, the Minister for Children provided an answer where she stated that it was in the negative. Now, subsequently, she’s come to correct that, which is great. But in a series of points of order after that answer was given, the Hon David Seymour stated that the answer that was provided was in the positive. So it’s the view of the Labour Party that if the Minister has subsequently come down to correct her answer, perhaps Mr Seymour should also be asked to correct his statement, given he was speaking on behalf of the Minister’s response.\n\nHon DAVID SEYMOUR: My statement was based on the facts as I believed them at the time. It’s clear from the Hansard record that those facts have changed, and people might imagine that I’ve changed my view too, and it doesn’t in any way invalidate the record of what I said at that time.\n\nHon DAVID SEYMOUR: It would be extraordinary if I didn’t. I’m obliged to take all members at their word, and I certainly take the honourable Minister at her word in issuing the correction.\n\nRt Hon CHRISTOPHER LUXON: Yes, I stand by my statement. The Government is going to meet its obligations and commitments that it’s made on climate change, and I also stand by the statement from the Minister of Resources as well, because he was clearly talking about the previous Government’s 100 percent renewable electricity target, which is, actually, a fairy tale and is counter-productive.\n\nHon Marama Davidson: Does his Government have any targets or policies to reduce fossil fuel use across the energy and transport industry to replace the 2030 renewable electricity target, and, if not, why not?\n\nRt Hon CHRISTOPHER LUXON: Yeah, we’re going to actually electrify New Zealand by doubling the amount of renewable electricity that’s in New Zealand so we can make the transition well and make our sectors move to clean, green energy.\n\nHon Marama Davidson: Is he concerned about the growing contradiction, under this Government, between New Zealand’s international and climate commitments and domestic plans which undermine efforts to reduce emissions, such as reopening oil and gas drilling and cancelling the Clean Car Discount?\n\nRt Hon CHRISTOPHER LUXON: Absolutely not. We are deeply committed to delivering on our climate goals and commitments. The way we go about doing that may be different from the previous Government, but don’t misunderstand our commitment to the targets and goals.\n\nHon Marama Davidson: Does he stand by his statement, “There is no reason for climate deniers and climate minimalists in the 21st century”, and, if so, is he embarrassed by the statements of the Minister of Resources that “One of the great lies about climate change is that, yes, apparently, it’s a crisis.”?\n\nHon Marama Davidson: Does he agree with the Climate Change Commission that “Weakening action on climate policy during times of adverse economic conditions—which climate change is only likely to exacerbate—is not sustainable and will greatly compromise [Aotearoa New Zealand’s] ability to meet [emissions budgets and the 2050 target].”?\n\nRt Hon CHRISTOPHER LUXON: We’re not weakening our actions on climate change; we’re just going about it a different way.\nChlöe Swarbrick : That’s a demonstrable lie.\n\nHon Marama Davidson: Will he or will he not instruct all Ministers to implement the commission’s advice—", "window_id": "2023-12-12#50"}, {"statement_id": "ed19c5770f917e73", "politician": "Grant Robertson", "party": "Labour", "side": "opposition", "date": "2024-01-31", "statement": "If that is the case—and it does appear to be so—then that is why this is a very, very sad bill. So that’s my quite simple question for the Minister.", "window": "Hon GRANT ROBERTSON: I wasn’t going to take a call on this part of this silly and sad piece of legislation, but I’ve been inspired by the contribution from the member Dab Bidois, who’s just resumed his seat. So my question on Part 2 is with respect to clause 9. It’s a relatively simple question for the Minister for Regulation, and that’s “Why?”, because this is an organisation that was created at the behest of the ACT Party and that the Minister, in his first and his second reading speeches last night, told us had done good and excellent work, and yet he brings a bill to the House to disestablish it.\nI still haven’t had an answer from the Minister that satisfactorily answers why clause 9 exists, and I guess that there’s a subpart. If “Why?” is not a simple enough question for the Minister, there is a subpart to this, which is to ask the Minister what other options he might have considered. For example, if his concern was, as he has publicly stated in the media, that the Productivity Commission had gone off-piste from where ACT would like it to be—obviously, I disagree with the premise behind that. But if that is the Minister’s concern, why did he not reappoint people that he considered would bring the commission back to where he felt it should be?\nAs everybody has said in the House over the last night and tonight, productivity and the challenge to New Zealand on productivity is decades long, very complex, and something that we all agree we need to do more about, and having an organisation whose job it is to take the big-picture view and to produce the reports that we can learn from is, presumably, a good thing. The Hon James Shaw last night offered the Minister a couple of other ways and pathways that he might be able to do this, including changing the legislation around how the Government needs to respond to a report of the Productivity Commission, thinking again about the kinds of inquiries it can do, who it can work with and indeed, as I say, who is appointed as commissioners.\nSo it is a fairly simple question for me. This is an absurd piece of legislation, and the best we’ve been able to get—\nCarl Bates : That’s why we’re repealing it.\nNo, no, no, this—this—is an absurd piece of legislation, and it does strike me that the only credible thing that we’ve heard is that the Minister wants his vanity project with the ministry of regulation and the only way he could get that through was to sacrifice the Productivity Commission. If that is the case—and it does appear to be so—then that is why this is a very, very sad bill.\nSo that’s my quite simple question for the Minister. Why is clause 9 here, and what else did he consider that he could have done to achieve the goals he has whilst keeping in place a commission that works on the issue that virtually everyone in this House agrees we need to work on?\n\nHELEN WHITE: Thank you, Madam Chair. I want to just graft on to what was said there by the previous speaker, Grant Robertson, because I, years ago, worked for the Law Commission, which is an independent organisation, and those kinds of independent organisations are really rich in having a focus and a capacity for people to engage with them. We heard speakers yesterday talk about how people did engage in a different way with the Productivity Commission and they said that they could do a much longer-term piece of work and they could do a much more specialist piece of work. Now, I can see the Minister for Regulation raising his eyebrows at one of the organisations which I have great respect for—from what I can see—so I would like to know how he intends to continue that tradition of independence if, in fact, when people say things he doesn’t like to hear and that don’t go along with his ideology, he is prepared to dismantle them.\n\nHon DAVID SEYMOUR: I would like to respond to some of the contributions. I would answer Dan Bidois’ question. However, he gave such a lengthy answer himself, it hardly seems necessary.\nIn response to Grant Robertson, clause 9 is there to give effect to the policies that were agreed on in Part 2, and, as he says, it’s a very simple clause. It says, “The Commission is disestablished.”, so he should be able to work that out. As for a number of other comments that he made, I could engage with him on that, but it doesn’t really seem worth it. I could make similar comments about some of the characterisation and attacks from Helen White, but I don’t think that’s really necessary.\n\nHon Dr DUNCAN WEBB: I wonder if I might talk a little bit about this, because we know—and the Minister for Regulation has been quite clear—that the Productivity Commission will be replaced by a ministry which he will be in charge of in respect of regulation, which he thinks will have some impact on productivity. I wonder if he might comment on the suggestion that he would much prefer to have a ministry which he can direct, rather than an independent commission over which he can’t control the opinions of.\nIt’s on the record that Mr Seymour has said that the Productivity Commission, he thinks, has been hijacked, and he said that on 5 September 2023. So it strikes me, Minister, that the real reason you’re abolishing the commission is because you don’t like its independent views, and, what’s more, the chair of the commission—you were unkind enough to say that you would not have appointed him. You said that on the same date.\nNow, the Hon Grant Robertson has already pointed out that it’s open to you to make your own appointments to the commission. But I would ask you to respond to the fact that what you want is a little department all of your own where you can make sure you can control the opinions that come out of it, rather than have a thoughtful and independent organisation which can give genuinely independent insight into productivity in New Zealand.\nA party vote was called for on the question, That Part 2 be agreed to.\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 15; Te Pāti Māori 6.\nPart 2 agreed to.\nA party vote was called for on the question, That Schedule 1 be agreed to.\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 15; Te Pāti Māori 6.\nSchedule 1 agreed to.\nA party vote was called for on the question, That Schedule 2 be agreed to.\nNew Zealand National 49; ACT New Zealand 11; New Zealand First 8.\nNew Zealand Labour 34; Green Party of Aotearoa New Zealand 15; Te Pāti Māori 6.\nSchedule 2 agreed to.\nClauses 1 and 2\n\nHon Dr DUNCAN WEBB: Well, we’ve obviously got the title there: Clause 1 Title, “This Act is New Zealand Productivity Commission Act Repeal Act 2024” but it doesn’t really give much away, does it? We know there’s a lot more going on under the surface. Perhaps the appropriate title for the Act—and we could always put an amendment on the Table—would be the “David Seymour Vanity Regulation Ministry Establishment Act”, because that’s what’s really going on here. Or maybe it’s the “We Don’t Want to Know Independent Opinion Act”, because that’s the other thing that’s going on.\nIt’s really disappointing that what we’ve got here is a piece of legislation where the National Party has allowed the ACT Party to shuffle off to one side an independent voice for the very thing that the National Party claims it’s in favour of, which is productivity. We heard a whole lot of kind of wandering speeches last night, with the general theme that the National Party is keen on better productivity and better industries, and, from the member for Tukituki, more apples, but overall and in general it seems to be that the National Party like the idea of an independent voice which enhanced productivity in New Zealand. But here what we have is the quashing of one of the independent, thoughtful voices we have in respect of productivity in New Zealand. So maybe this bill really should be the “ACT Party Wins Bill”, or, better still, the “ACT Party Wins Again Bill”, because that’s really what we’ve got going on here.\nIn terms of this bill being a simple repeal bill, it’s actually a lot more than that because it’s really—a better title might be the “Lack of Productivity Bill”, because that’s what’s going on here. The Productivity Commission—and we heard this time and time again yesterday—has done some fantastic work. Now, the real criticism was that Government wasn’t obliged to respond and pick up that work, but the fact of the matter is that it’s there and it’s a resource to be used, and it has to be said that Government—and Parliament as well—looked carefully at those reports and was challenged by them.\nBut we know that that party—the ACT Party—doesn’t like to be challenged, and the National Party likes to go along with the ACT Party. So maybe it should be the “Please Don’t Challenge Us Because It All Gets a Bit Awkward Bill”. But the real point I want to make here is that in this bill, the New Zealand Productivity Commission Act Repeal Bill, there’s a lot more going on. What we have going on is the replacement of one ACT idea with another ACT idea, because the leadership has changed, and every ACT leader likes to leave a legacy. This ACT leader thinks that his legacy is going to be the “Kafka ministry”—I mean the ministry of regulation, which, no doubt, another ACT leader will come along and squash with another commission or ministry of some sort or other to leave their legacy as well. So, in terms of the title of this legislation, I put to the Minister, why doesn’t he call it what it really is: the “David Seymour Vanity Act”?\n\nHon GRANT ROBERTSON: I just want to focus and ask the Minister a couple of questions about clause 2, the commencement clause. Noting that the Act comes into force on 29 February 2024—and it is a serious matter I want to raise with the Minister because he—\n\nHon GRANT ROBERTSON: Well, no, because the Minister hasn’t responded to any of my other questions. So, you know, I was trying to give him a guide to the fact I might want one after this—which is that he himself spoke about staff of the Productivity Commission in either the first or second reading speech last night. There is a group of highly specialised expert researchers who produce incredibly interesting and important work at the commission who go on 29 February under clause 2 and as a result of clause 11 that was within Part 2. So just to be clear for members, clause 11(2)—which we’ve already passed—says: “All employment and appointment positions with the Commission are terminated.”\nI want some assurance from the Minister today about the process that is being used to work through with those staff. What then happens in clause 11(3) is that all responsibilities in relation to employment or appointment matters become the liability or the responsibility of the ministry—which is, we’ve learnt, the Treasury.\nSo my questions for the Minister are: what arrangements are in place to support those people to stay within the Public Service? And what support has been given to the Treasury who will now take responsibility for all of the outstanding matters? I would not be at all surprised if, in the course of just on a month, they may not be able to resolve all of the issues that exist around staffing or employment. These people have had their jobs ended unceremoniously through this Act of Parliament, and I think the Minister should stand up and tell us what is being done to support them and what is being done to work and support the Treasury in order for them to fulfil the roles that are given them in clause 11.", "window_id": "2024-01-31#21"}, {"statement_id": "1a354118c5eefe4d", "politician": "Debbie Ngarewa-Packer", "party": "Te Pāti Māori", "side": "opposition", "date": "2024-02-13", "statement": "So, with respect to our Chair, we were hoping to ask questions. We weren’t repetitive; we weren’t heard at all. Kia ora.", "window": "Hon GINNY ANDERSEN: Point of order. Thank you very much, Madam Chair. I appreciate that you identified that there was potentially the same question being asked again and again, and there’s a debate obviously whether or not that had been answered or not; we believe that it wasn’t answered. But I’d just like to point out that as associate spokesperson for social development for Labour, I did not have the opportunity to speak on this bill. You took a number of calls in terms of the committee stage of this bill, the committee stage which we’re in now, not the first or the second reading—[Interruption] As the committee stage—\n\nHon GINNY ANDERSEN: At the committee stage, I, as the associate spokesperson, did not have the opportunity to speak to this bill. So the Government—you are passing this through urgency, you are bypassing any democratic process through having members of the public being able to submit at select committee, and you’re denying the associate spokesperson for the Opposition the opportunity to speak at the committee stage. I believe that is wrong, and I believe that’s something the Speaker should be alerted to.\n\nTANGI UTIKERE: Point of order, Madam Chair. I’ve heard points that have been raised by members. We had a number of speakers and only one was permitted to take any calls. I noticed that Mr Menéndez March has suggested a recall of the Speaker. On behalf of the Opposition, that is what we would like to do. We would like to recall the Speaker. We are moving the recall of the Speaker to raise this concern.\n\nDEBBIE NGAREWA-PACKER: Point of order. We would also like to have reflected that we haven’t had a chance to speak at all. And we would also like to recall the Speaker. As the smallest party, we do make sure that we have something to say at every part of the stage. This is an important, critical bill that has been rushed through and our communities need to know that we’re doing all that we can to make sure their voices are heard.\n\nTANGI UTIKERE: Thank you, Mr Speaker. I first acknowledge this is an extremely rare situation that often members refer to. The position of the Labour Party is that this is the only step that was made available to us in light of a number of calls that were being sought by members that were not taken up. There was an instruction or a view of the Chair that she was looking for new information. We took one call following that instruction, where the member, the Hon Carmel Sepuloni, made some rather salient points and suggested that the Minister in the chair may wish to take advice around that, after which there was no further opportunity for any other member of the Opposition to take any calls on a bill that is currently progressing through the House under urgency, without any select committee scrutiny. So on that basis we felt that there was no other option but to seek to recall the Speaker to ensure that members of this House have an equitable opportunity to raise the questions as part of scrutiny that many New Zealanders would expect us to be doing on this side of the House.\nRICARDO MENÉNDEZ MARCH (Musterer—Green): Acknowledging the comments by Tangi Utikere that this is not done lightly, I would invite you to review the Hansard record, because part of the challenge that I had, particularly with the point around new questions, is, for example, I asked a question around wage gaps and the impact of wage scarring, and that was subsequently used to labour the point that there were no new points being asked. I find that concerning because, like I said, those questions were in good faith—it was not filibustering. So I just would invite you to look at the Hansard record to review the nature of the questions being asked to evaluate whether we were being repetitive or not.\n\nHon MARAMA DAVIDSON: Thank you, Mr Speaker. My inquiry is a genuine one into the well-established tradition of ensuring that points are covered and that when there is dispute as to whether things were getting repetitive—but even so, what is the convention about ensuring equitable speaking across members? Because then it becomes about not just traversing new material but also equitable speakers across a really crucial committee stage of the House. We are impacting on people’s lives here, and I would have thought this House can give it the fullest committee stage that we possibly can.\n\nDEBBIE NGAREWA-PACKER: Kia ora. From our perspective as the only tangata w’enua party here and the way that Māori are going to be impacted, we did expect to be able to have some speaking time. We weren’t able to be heard at all. To be fair, we also are rushing as a small party to try and collect ourselves on everything that’s coming down in a state of urgency. So, with respect to our Chair, we were hoping to ask questions. We weren’t repetitive; we weren’t heard at all. Kia ora.\n\nHon CARMEL SEPULONI: Given that my contribution was the last one before the Chair attempted to close down or closed down the debate, I think it’s important for me to stand up and speak to that. I did repeat questions because—and you can revisit the Hansard and check whether you feel this is the case—I very genuinely do not think that the questions I asked, which were very important, were answered. We received new information in this committee that contradicted the modelling that follows the actual bill. So I asked very specific questions about the implications of that on certain things and I didn’t receive that information. But I didn’t even receive a response to say that the modelling had not been updated. It wasn’t addressed at all, and so I was trying to get those questions answered. I actually had other questions. Again, not an attempt to filibuster, but trying to wrap up that particular area of questioning was difficult. And to have that closed down by the Chair, actually, is not fitting with what committee of the whole House stages should allow us to do when scrutinising a bill in the way we’re expected to during committee stages.\n\nHon GINNY ANDERSEN: I’d just like to reflect on the fact that while there’s two arguments being put forward—one, that we felt that questions were being not answered. But the second point I think it’s important for you to be aware of is that we genuinely felt that debate was prematurely concluded. As an example of that, as the associate spokesperson for Labour, I did not have an opportunity to speak on this bill, and I think at the very least it’s important that you give key spokespeople an opportunity to ask questions of the Minister on this bill, particularly given we don’t have that opportunity at select committee.\n\nRACHEL BOYACK: Thank you, Mr Speaker. The point I want to raise is that I did seek the call on more than one occasion from the Chair, and I had new material. So the key point seems to be here around that new material. There were members on this side of the House seeking the call, and I sought the call twice and intended to continue to seek the call, because I did have questions to put to the Minister that had not been asked by any other member on this side of the House. As other members have pointed out, we did not have a select committee process. And so I actually came to the House specifically with some questions, for the Minister, to ask, and I would still like to have the opportunity to ask them. So, Mr Speaker, I do urge that you take into consideration the fact that multiple members from the Labour Party and from other parties of Opposition sought to take the call and did not receive an opportunity to even take a call. So it’s difficult to ascertain how you could make a judgment that we were being repetitive when members with different items that they wished to interrogate weren’t even given the opportunity to take the call.\n\nHon KIERAN McANULTY: Point of order. Thank you very much, Mr Speaker. We accept that ruling. There are two things I’d like to raise and we’d appreciate if you would reflect on that. Conscious that last night during urgency and today there have been a number of occasions where spokespeople haven’t had the opportunity to make a call, and there were questions that were simply not answered by Ministers—other questions were, but there were certain questions that weren’t; I suspect deliberately to play for time. I’m conscious that presiding officers are required to take into consideration a number of factors, one of which is if Ministers answer questions. I think it would be useful for the House if you were to perhaps look over that and report back.\nBut the other thing that I would like to pose to you is the situation where we have a formal Opposition but two other parties, all three of which are contributing to a committee of the whole House stage debate. I haven’t seen it done before, but I would like your view—perhaps after some reflection—about the possibility of presiding officers indicating that a particular party have had their fair share, while the other two parties in the Opposition can continue. The reason I raise this as my concern is that the Labour Party, as the formal Opposition, could potentially be deprived of an opportunity to contribute constructively at a committee of the whole House stage if other parties, theoretically, aren’t contributing and meeting the requirements of a presiding officer. Given the particular make-up of this Parliament, I think it would be useful for the House if that was something you reflected on.\n\nDEBBIE NGAREWA-PACKER: Kia ora. Thank you, e te Pika. I just want to remind in the Business Committee section of Standing Orders, 78(3) that “Before determining … the Speaker must be satisfied that, having regard to the party [and parties] … does not discriminate against or oppress a minority party or minority parties.” In this case, we didn’t get a word said, and I think that’s really unfair.\nIn respect to what’s before us, it’s so important—it’s so critical for our communities that I do ask that the Speaker consider that ruling.\n\nHon CARMEL SEPULONI: Obviously there’s more that I’d like to traverse over Part 1, but I will move to Part 2. I want to specifically ask questions around the minimum family tax credit.\nAs the supplementary analysis report for this bill states—which we keep referring to because there’s no proper impact statement—approximately 3,200 low-income families are receiving minimum family tax credit, which is an incentive to ensure low-income working families remain better off financially in full-time work than they would be on a main benefit. The minimum family tax credit thresholds are linked to main benefits. If the lower thresholds of the tax credit are not increased in line with main benefit rates, low-income working families are likely to be better off on a benefit than in full-time work. Inland Revenue is apparently addressing this and changes were progressed through the mini-Budget, alongside this proposal.\nCould the Minister explain the implications of this bill on the minimum family tax credit and the general summary of that particular area or concern that’s been raised in paragraph 40 of the supplementary analysis paper. I’m quite keen to know if there are any impacts on those receiving the minimum family tax credit; what are they? The intent was always that it would provide an incentive for people to be in work. Does it still do that with the changes that are proposed, including, of course the ones that are proposed in Part 2? I’ve got a number of other questions but let’s just cut to the chase and answer that one.", "window_id": "2024-02-13#47"}, {"statement_id": "ae1a52c73836a3ab", "politician": "Barbara Edmonds", "party": "Labour", "side": "opposition", "date": "2024-03-26", "statement": "So my question to the Minister is just to make really clear, for a casino operator that has a physical presence in New Zealand—and we have a couple of them—if they have an offshore gaming website, how do these new rules apply to them?", "window": "Hon SIMON WATTS: Thank you very much, Madam Chair. The elements which we’re discussing here in terms of Part 4 relate to the offshore gambling duty which we are going to be implementing. The broader points that are raised by the member are part of the broader gambling system, and I think what I can say is that the introduction of this gambling duty component to those offshore gambling operators will potentially look to increase the amount of gambling activity from offshore back through to those domestic providers, whether they’re gambling operators in pubs or clubs, Lotto, the TAB in New Zealand, or other aspects such as that. So I think that with the increase in the amount of regulation and licensing in the offshore domain, the proxy in terms of whether that will flow through to domestic aspects is probable, but in terms of the exact elements around that, it’s a highly complex area in terms of that.\nBut I think that the point that the member is noting in regards to what would be the implication is one which we have considered and would be reasonably aligned in terms of the way in which we expect some of those flows to occur. Obviously, the proof will be in the pudding in terms of the flow-through around that once that licensing regime is in play, but I don’t see it as being a negative implication on domestic providers.\n\nHon KIERAN McANULTY: Thank you very much, and I appreciate the opportunity to have a back and forth. It’s not that common, but I think it does help the House in understanding the bill at the committee stage here. I am after a clarification from the Minister of Revenue there. He indicated that, at some point, there’s a potential for turnover to go from offshore to onshore operators. Could the Minister please clarify what he meant by that? Does he mean the proposed duty, or does he mean a possible regulatory framework that has been alluded to but not been put in place? Is it the duty or the possible framework that would lead, potentially, to onshore operators increasing turnover?\n\nHon SIMON WATTS: Yeah, the point of clarification to the member is that the introduction of the increased taxes on the offshore gambling operators will, in effect, potentially, make the New Zealand operators more competitive in regards to levelling of that playing field. As a result of that, we may expect to see some movement of gambling activity from those individuals that deal with offshore entities to domestic entities, because of that levelling up and the fact that the implication of the gaming duty on offshore operators, in effect, will, in part, allow domestic operators to be more competitive.\n\nHon KIERAN McANULTY: Thank you very much, and thank you to the Minister of Revenue for that response. Could he please indicate to the committee how that response then correlates with the advice through the regulatory impact statement, which actually suggests that the duty being placed on some operators may actually lead to turnover being transferred from those registered operators that would be hit by the duty on to operators that are unlikely to comply?\n\nHon Dr DEBORAH RUSSELL: Thank you, Madam Chair. Just as a brief break from gambling—I know that my colleagues have a lot more to ask about this new tax, but I want to direct the Minister of Revenue’s attention to something that is sitting in the original bill. But if we’re looking at the bill as reported back by the Finance and Expenditure Committee, I want to direct the Minister’s attention to clause 86—oh, it’s clause 86 on page 86, which is a happy coincidence. What it relates to is the KiwiSaver Act, and the particular new clause is about information sharing. Now, it’s pretty important, these information-sharing permissions that are given to the Commissioner of Inland Revenue and to KiwiSaver providers. The Commissioner of Inland Revenue knows a whole lot of information about each of us, and KiwiSaver providers know a whole lot of information about each of us, and, ideally, they need to be able to communicate with each other in order to ensure that KiwiSaver deductions are properly directed to where they ought to go, that the savings are attached to the person’s name, and all those sorts of things. So there’s some pretty important administrative stuff there which creates good reason for providers and the Commissioner of Inland Revenue to be able to talk to each other.\nSo what this clause does is, in the midst of all the—there’s a set of information which the commissioner is enabled to share with KiwiSaver providers, and vice versa. It’s in section 220B of the KiwiSaver Act, and it says that “The Commissioner and a provider may … communicate to each other by electronic means” standard information: person’s name, date of birth, tax file number, contact information, transfers from one scheme to another. But this clause in the tax bill inserts a new situation in which the commissioner and providers may share information, which is, it says, “information relating to the administration of the estate of a person who is a deceased member of a scheme.” So that’s a pretty important thing to be able to do.\nThe curious thing is, and which is something for the Minister to address, that when I looked at the commentary on the bill—so this is the bill as introduced, and, of course, the commentary is a pretty important guide for select committee members, for members of the public who are trying to understand what a bill does, and for the people in the tax and KiwiSaver communities that we rely on to help us get our tax law right. But if I look at the commentary on the bill, it says, in terms of the summary of the proposed amendment, that it would allow the Commissioner of Inland Revenue to communicate information about deceased KiwiSaver members’ estates to KiwiSaver providers. That’s what we’re told the amendment is supposed to do, but, in actual fact, the amendment does something a little bit wider than that. So the commentary directs us in that particular way, and that’s pretty useful for the commissioner to be able to do that, but, of course, the amendment as put in place right through this doesn’t allow just the commissioner to communicate to KiwiSaver providers; the effect of the amendment is to allow KiwiSaver providers to communicate back to the commissioner as well. So, in actual fact, the effect of the amendment is wider than what was put in the commentary to the bill. So that just means that people may not have been aware of what the actual amendment did, and perhaps, you know, would’ve looked at the commentary and thought, “Well, this is a pretty benign amendment.”—and, indeed, it is a benign amendment, but it’s not the amendment that is described in the commentary to the bill.\nSo I think it is benign, but I would just like to hear from officials as to if I’ve got that right, and from the Minister if I’ve got that right, and, I guess, just a confirmation from the Minister that this is indeed a pretty benign amendment and, indeed, a good one.\n\nHon BARBARA EDMONDS: Thank you, Madam Chair, for the call. I want to take the Minister of Revenue back to the offshore gambling proposal, because there’s a couple of new questions that I want to ask the Minister in relation to (1) harm minimisation; but then, actually, (2) around the definition of an offshore gambling operator. When I had a look at the regulatory impact statement that IRD drafted for this particular proposal, IRD officials suggested there were four particular options in how you can capture the tax from offshore casino websites. Of the different options, option 1 was in relation to status quo, which is, basically, allowing them to tax just with GST; option 2 was to tax consistently with New Zealand casinos, and that’s because for casinos based in New Zealand their tax is GST, they have a 4 percent casino duty on gross betting revenue, and 28 percent on income tax profits; then option 3 was taxing consistently with gaming machines, which the Hon Kieran McAnulty has touched upon; and then option 4 was to align with tax rates imposed in other countries.\nNow, if I remember correctly, the Hon Nicola Willis, during the campaign, said that she would be looking at income tax on the profits of these offshore gaming providers. So it’s quite clear, because the Minister has gone with option 4, that it means that this particular option which the Minister has brought to the House is not consistent with previous statements made by members of Parliament.\nBut if I go to option 4—and this is where my question to the Minister lies in relation to the offshore gambling operator definition—at paragraph 48, officials go through what the disadvantages are of that option 4 to align with the tax rates imposed in other countries. It talks about how the disadvantage of option 4 is that it may be perceived as “less fair” by some gambling stakeholders, compared to options 2 and 3: “This is because 12 percent would be less than the 20 percent gaming machine duty which applies to gaming machines in pubs or clubs.” Again, I’m not going to touch on that, because the Hon Kieran McAnulty briefly spoke about that, but it’s actually a couple of lines down where it says, “Also, as the proposed 12 percent gaming duty would be more than the 4 percent casino duty, New Zealand casinos may seek policy changes to apply a lower 4 percent duty on gaming conducted through their offshore websites on the basis that they see this as being part of their casino, rather than a separate type of gambling activity.” So that’s a really key point. So if they’re based in New Zealand but they operate an offshore gambling website, a casino has a 4 percent duty on their gaming conducted through their offshore website. This new tax brings in a 12 percent tax.\nSo then I look to the definition of what is an “offshore gambling operator” for the purposes of these new provisions. If we look to the definition, it says an “offshore gambling operator means—(a) a registered person located outside New Zealand who conducts any offshore gambling; and (b) for any return period” under which the liabilities, basically, fall. So my question to the Minister is just to make really clear, for a casino operator that has a physical presence in New Zealand—and we have a couple of them—if they have an offshore gaming website, how do these new rules apply to them? Are they taxed at the 4 percent or are they considered an offshore gambling operator, so therefore they’re taxed at the 12 percent?\nI think that’s just an important point to clarify with the Minister. I just want to know because it’s quite clear that they’re disadvantaged because they’d have to pay more tax. But, actually, is that not the purpose of, basically, charging the offshore providers? Are you treating them the same as these offshore providers who have got no presence in New Zealand or are you treating them as if they’re present in New Zealand, so therefore they are outside the scope of these new rules and therefore not an offshore gambling operator?\nMadam Speaker, if I can, I’ll provide the next lot of questions to the Minister as part of this. So the other part of the question that I had for the Minister is around officials in their regulatory impact statement, which I’ve asked previously, and who they consulted with, and the Minister confirmed it was with the Department of Internal Affairs. So I actually want to ask the Minister: has he spoken to, or consulted with, anyone, by himself or with his staff, that are separate to officials, in relation to these particular changes? And really quickly, the reason being is that the only provider that is actually named—", "window_id": "2024-03-26#34"}, {"statement_id": "4bbdec7175d577da", "politician": "Willie Jackson", "party": "Labour", "side": "opposition", "date": "2024-05-08", "statement": "I know some of the Opposition may think it’s a little bit treacherous, but they should know all about that, given the Prime Minister, when he was the Leader of the Opposition, slammed the Government when he was over in England.", "window": "CAMERON BREWER: Aucklanders are rejoicing: a 26 percent increase in water rates has been averted. Congratulations to local government Minister Simeon Brown, Prime Minister Christopher Luxon, and Mayor of Auckland Wayne Brown, and of course the 20 Auckland councillors who unanimously supported our Local Water Done Well plan. Balance sheet separation has been achieved, council ownership and council control have been retained, and now much, much more water infrastructure can be delivered. Auckland households will not be hit with huge water rate increases any more, and that’s thanks to this Government. And the good news is: for the other 77 councils in New Zealand, Local Water Done Well is coming to a town near you.\nAucklanders are rejoicing. Roads of national significance are back and Auckland has got a lot to celebrate. We are building the long overdue north-west alternative highway, aka the Kumeu bypass, the East-West Link, Mill Road—Mill Road! And what’s more, this Government will construct the north-west rapid transit corridor, aka the dedicated busway, up the north-west motorway, State Highway 16. Great for Upper Harbour. Great projects that are being progressed by our Government, not by the last Government. They did nothing. In fact, they vindictively cancelled the likes of Mill Road. Aucklanders are rejoicing that as of 1 July there will be no Auckland regional fuel tax, a saving of 11.5c per litre for Auckland motorists. What’s more, only half of what’s collected since 2018 has been spent, with most spent on speed bumps, red-light cameras, and cycleways.\nAucklanders are rejoicing: failed light rail is dead and buried. Despite them wasting $228 million on consultants after years of trying, the only thing Labour delivered on was a string of media releases. Not one inch of track despite the promises. And yet Aucklanders were promised—get this!—a 13-kilometre tunnel from Wynyard Quarter to Mount Roskill and then stretching above ground to the airport. Never doable, never achieved, never got off the ground. It made building 100,000 KiwiBuild houses look even doable. So the cost all up of $29 billion was averted with that light rail fail and they spent, of course, $30 million on the Kiwi Bacon building that was now not needed.\nAucklanders are rejoicing that Labour’s $785 million cycle bridge across Auckland Harbour bridge is not getting off the ground. It was chucked in, but, of course, not before $51 million was spent on consultants, designs, and engineer fees. And, of course, Aucklanders do not forget the $45 billion promise that Chris Hipkins made on the waterfront in Auckland in August last year for their additional harbour crossing and the spaghetti jungle that would be dropped on the North Shore, and that included trams up Glenfield Road. This is pie-in-the-sky stuff and, thankfully, we’ve got a new Government that’s now focused on what Aucklanders really want.\nFinally, Aucklanders are rejoicing because tax relief is coming. Tax relief is coming and it’s targeted. It’s targeted to a big voter base in Auckland, our low to middle income earners. They deserve some respite after this cost of living crisis that Labour have driven up after six long years of recklessness come the economy.\nThank you for your support, Aucklanders. Thank you. Over 40 percent of Aucklanders voted for the National Party in October—over 40 percent. Auckland was a stronghold for the National Party. In fact, 57 percent of Aucklanders voted for one of the three coalition parties. We won’t let you down, Auckland. We’re backing Auckland. Auckland’s going to be back as the commercial capital of this country. We’re going to drive Auckland into prosperity. It’s Auckland all the way.\n\nHon CASEY COSTELLO: I’d like to acknowledge the speaker from across the House earlier—we are listening. Since taking on my role as Associate Health Minister, I have been listening. I have been listening to the consumers, to the industry groups, and to practitioners, and they have demonstrated that there is absolutely no level of comfort or satisfaction with the Therapeutic Products Act (TPA). So, today, we have announced that the Therapeutic Products Act will be repealed. This repeal will clear a pathway for a modern, risk-proportionate regulatory regime for medicines and medical devices. Separately, we will develop a modernised regime for natural health products.\nThis was legislation where, of the 16,500 submissions, 95 percent opposed what was being introduced. It was clear and broadly accepted that the 1981 Medicines Act had long since passed its suitability, and, for 30 years, this issue has been kicked around and discussed without a solution. Unfortunately, the solution that was implemented missed the mark completely. After extensive consultation, we are now talking to the industry and we are, at this point, going to fix it. The legislation strayed from the foundational requirement, which was to provide New Zealanders safe, timely access to medicine critical to improving health outcomes. We need cost-effective access to the right products. At the same time, we must have the ability to utilise and benefit from the advancements in technology and scientific progress that will improve the health of Kiwis.\nThe reality is that the TPA was not the answer. We were yet again heading down a path of over-regulation, overcomplexity, and over-costings. This is the clear message from the sector who have the knowledge and expertise on what is needed. In addition, the sector were eager to work to improve access to medicine but felt they were being ignored. By repealing this legislation, we can now clear the path for a system, legislation, and supporting resource to improve access to medicine.\nIn addition to medicines and medical devices, we are also committed to a proportional and relevant system for natural health products to provide New Zealanders the alternative solutions that suit their needs. The legislation captured the sector in an over-regulated turmoil—they are lost. This legislation would have created barriers to the essential products that people prefer. We are repealing the TPA, and will look at two options and interventions that will not only create clarity for the future but look at options for urgent relief to the sector.\nNatural Health Products New Zealand estimates current outdated regulation is costing our country half a billion dollars in foregone export revenue. We will fix this. The repeal now is important to provide surety, but it does not leave New Zealand unregulated. This legislation was not to come into effect until 2026, which gives Government and industry time to implement sound regulation. I would note also that the work recognises that the last Government had not funded for all the change and regulation needed to put the TPA into effect—for example, creating the new regulatory regime.\nImportantly, we are not starting again. I have met, over recent weeks, with the key stakeholders. We are talking, we have learnt, and we are moving forward. We will build on submissions that have been made and provide a new opportunity for further reconnection with the sector. At our heart, we are committed to improving health outcomes through legislation that provides safe and timely access to medicines, medical devices, and natural health products. The first step forward required is the repeal of the Therapeutic Products Act, and I look forward to continuing to work with the sector for the benefit of Kiwi health.\n\nHon WILLIE JACKSON: Mr Speaker, firstly can I thank you very much for your support of my trip to the Oxford Union. It would have been very hard without your support, so I thank you very much.\n\nHon WILLIE JACKSON: Yeah, well, that’s right, that’s right. And it would’ve been very hard at the back of the plane. So thanks very much, Mr Speaker. Not sure about your humour though, Mr Speaker. When you saw the invite and you talked about from Lange to Jackson, it doesn’t sort of quite work out for you. So you thought there was a bit of a gap there and I will—\n\nHon WILLIE JACKSON: I will agree th
