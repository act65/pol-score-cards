at it’ll certainly be hard to fill that gap. But as you know, Mr Speaker, the British museums are not very British, and I’ll of course be running a very strong line in terms of the indigenous argument, given British museums hold and have indigenous artefacts, and particularly Māori artefacts, that have been taken over the years.\nBut I have been thinking, over the last couple of days, given this Government’s performance, that it will probably be appropriate for me to go off the moot a little bit because I think it will be such an ideal opportunity, I think, to be able to slam the Government on the international stage. I know that probably doesn’t go down too well. I mean, I’m meant to be going to the Oxford Union and speaking on the moot, but, I mean, what an opportunity. How often do you get an international audience and you’re able to actually expose our Government? I’m really looking forward to it. I know some of the Opposition may think it’s a little bit treacherous, but they should know all about that, given the Prime Minister, when he was the Leader of the Opposition, slammed the Government when he was over in England. Treacherous behaviour, I thought. So the Prime Minister should support me, given his behaviour. It was unprecedented, really.\nSo I look forward to telling the Oxford Union about some of the worst things that are happening here. First of all, I’d like to tell the Oxford Union that we’ve got the most unpopular Prime Minister in the history of Prime Ministers. No one has polled as low as this Prime Minister in recent weeks after an election. I’d like to tell the Oxford Union also that they’ve got some of the worst—and anti-Māori, anti-worker, anti-disabled, and anti-renter—policies in the history of New Zealand politics. I don’t have time to roll them all out, but three of them stand out for me.\nThe peeling back of the smoke-free legislation, that is world-leading legislation. It’s been lauded in London, it’s been lauded in France, it’s been lauded everywhere, and this Government took the opportunity to get rid of that smoke-free legislation guaranteeing that thousands—thousands—more people will die.\nAs well as that, the next disgraceful action that I can pick out in terms of my top three is this fast-track legislation. What a disgraceful piece of legislation. A legislation that excludes our people, Māori. We saw them out there today, didn’t we, tuahine—Marama? We saw them out there today—the riri, the anger, from Ngāti Toa. What a disgraceful piece of legislation that keeps out communities, that keeps out iwi, that reduces this just to three Ministers. A disgraceful, disgraceful piece of legislation. And now we have to trust these three Ministers. It’s shocking.\nAnd the other area: the disability area. We went to a disability centre last week and we saw, firsthand—firsthand—the anger from workers there who now will be given no respite, no rest, nothing, because of this nasty, selfish Government.\nSo I understand the emotion. I understand my tuahine over there when she talks about, “This is a Government exterminating Māori.” I don’t agree with those exact words, but our people feel it—our people feel it—because there’s an attack on the reo, there’s an attack on the Treaty, there’s an attack on tikanga. So, of course, my tuahine, maybe I wouldn’t describe it that way, but, you know, it feels like extermination for Māori. And I feel like I should probably be telling them about this at the Oxford Union. I’m thinking I should do that, but then I think I may go back to the moot just for the tikanga, and that would probably be the right thing to do. Kia ora anō tātou.", "window_id": "2024-05-08#8"}, {"statement_id": "a21d4fe9b5782de9", "politician": "Glen Bennett", "party": "Labour", "side": "opposition", "date": "2024-07-23", "statement": "That is my hope and challenge to the Minister, but also to lay out the plan, tell us how we’re going to spend money to double exports in 10 years.", "window": "GLEN BENNETT: What she said, Madam Speaker, and a bit more, actually—I’m just agreeing with the Minister for Economic Development, mostly, on this piece of legislation. In many ways, it’s the rats and mice in terms of dealing with bits and pieces here and there. So it is interesting to listen to what the Minister had to say. Wholeheartedly, on this side of the House, we’re happy to take this to select committee and move it forward.\nI guess the one challenge is speaking about being a pro-growth Government—and that’s aspirational; I agree with that. The doubling exports in 10 years—let’s be aspirational, but let’s actually have a plan and let’s actually have investment to make sure that happens. That’s the one thing I want to challenge the Minister on. I’ve been travelling the country over our recess, meeting with businesses and economic development agencies and sort of hearing about the challenges and things. One of the things, and with this legislation, is about how clunky much of what Government does is, how clunky the Ministry of Business, Innovation and Employment system is. So this tidies up a whole lot of stuff.\nAgain, it’s been a convention of this House for whoever’s in Opposition to support the majority of what is done. So we do support this. But, again, the challenge is around how we get our systems working correctly so that business, community, and innovation can thrive. That is my hope and challenge to the Minister, but also to lay out the plan, tell us how we’re going to spend money to double exports in 10 years.\nJust out of curiosity, for the nobody who are in the gallery this morning, I would like to just share a little bit about some of the things in this legislation, because I know that the nobody who are here—oh, sorry, there’s the security guard. I know I shouldn’t mention the galleries—apologies, Madam Speaker. So the things we’re going to be mending are things like the Auctioneers Act 2013, the Building Societies Act 1965, the Charities Trusts Act 1957, or we can go all the way back to 1908 to the Industrial and Provident Societies Act. The amazing thing about this legislation is it is so interesting because that piece of legislation in the Regulatory Systems (Economic Development) Amendment Bill does something really important: it replaces “by the Customs” with “Customs”. So it takes out “the”. So it’s amazing stuff.\nThis is really powerful legislation, but it is important. I agree with the Minister, it actually is stuff that we need to do just to clarify and keep moving forward, so I commend these bills to the House.\nRICARDO MENÉNDEZ MARCH (Green): Look, these bills tend to be relatively uncontroversial, and we haven’t identified anything that we have issues with. I guess it is worth noting the political tensions raised by the Minister for Economic Development around this belief that sensible regulation can be really good for the wellbeing of the country, while at the same time there is a political drive to slash regulations that actually often protect, for example, the safety of workers in the workplace or allow them to stay well. So I think it’s just interesting that in the context of non-controversial legislation, there are still political statements that I think are at odds with what has been said—between what has been said in the first speech and then what the Government is actually doing.\nLook, these bills do make amendments to a series of Acts—and apologies, because I want to make sure that I get them right. But they make amendments to things like the Electricity Act 1992, to the Employment Relations Act 2000, the Gas Act 1992, the Health and Safety at Work Act 2015, the Immigration Advisers Licensing Act 2007, as well as the Mines Rescue Act 2013 and the Parental Leave and Employment Protection Act 1987. I wanted to pick up particularly on the changes to the Immigration Advisers Licensing Act 2007, just around the clarifications around immigration applications being put forward on behalf of an applicant, unless the agents are licensed immigration advisers; and personal criteria for cancelling, suspending an immigration licence. I think, to me, that’s an important conversation we need to have in select committee as well, around how that will impact people’s lives on a more substantive level.\nAs an immigration spokesperson, having worked with people who have been failed by immigration advisers, I think it’s important that we have robust systems in place to make sure that that workforce, which does really important work in supporting our migrant workers, actually has clear guidelines around, for example, what, how, and when their licence will be struck or suspended if they don’t act accordingly. Also, when we’ve worked with so many people who have had other people from the community put forward their immigration applications, it is really important that we do have robustness in place to ensure that those immigration applications actually are—if somebody’s going to support the applicant, that it is somebody who has received the adequate training. Because quite often we’re talking about people’s lives being on the balance when those immigration applications are made.\nBut, I think, more than anything, the key message for us is that it’s going to be really important that people and the public actually make submissions on this. I mean, we’re all in agreement that these changes do feel politically non-controversial, but we need the public backing to ensure that any nuance that we may have missed actually gets identified. So far, the Greens feel comfortable with what’s been presented here, and we do look forward to a constructive conversation about getting regulations right. When it comes to the nature of this bill, I hope that’s translated as well, and, more broadly, there’s a political agreement that actually regulations are particularly a good thing when the market in and of itself won’t regulate itself, or when there are, for example, professional areas that have not been shown to adequately support members of the communities. So the Green Party commends this legislation to the House.\n\nHon BROOKE VAN VELDEN: Thank you, Madam Speaker. I’m pleased to take a call on these bills today. Firstly, I just wanted to congratulate the Minister for Economic Development, the Hon Melissa Lee, for bringing these bills to the House today. It’s very good work. This Regulatory Systems (Immigration and Workforce) Amendment Bill is going to lift the quality of regulation in the immigration, workplace relations and safety, and energy portfolios. The bill will be improving four pieces of workplace relations and safety legislation that I’m responsible for: the Employment Relations Act 2000, the Health and Safety at Work Act 2015, the Mines Rescue Act 2013, and the Parental Leave and Employment Protection Act 1987.\nWhile these may not be the most exciting changes that this Government will make, cleaning up existing regulation is a necessary activity to ensure efficient regulatory systems. Collectively, the small changes in these bills will make it easier for Kiwis to understand the law and comply with Government requirements. The bills also fix problems with legislation, clarify unclear provisions, and ensure provisions are fit for purpose. There are quite a few amendments in the range of Acts in these bills today, so I’d like to touch on just a few and how they affect my portfolios and what effect they will have.\nI’m very pleased that this legislation will improve parental leave provisions to allow people who are not biological parents leave provisions so that there is more flexibility when they stop work to care for a child and ensure that they remain eligible for parental leave payments. This change will help people who have taken on the care of a child unexpectedly, once long-term care is confirmed. Currently, under the law, it requires someone to stop work when they become a primary carer in order to access parental leave payments, but due to the legal obligations to their employer to work out their notice, if they continue working, they will not be eligible for parental leave payments. Section 7 of the Parental Leave and Employment Protection Act sets out the definition of a primary carer for someone who is not the biological parent as “a person, other than the biological mother or her spouse or partner, who takes permanent primary responsibility for the care, development, and upbringing of a child who is under the age of 6 years”.\nI’m aware of a number of cases where this change would have been beneficial. For example, a man and his partner were informally looking after a child when final parenting orders were made. He resigned from his job to look after this child and be the primary caregiver and he gave his employer six weeks’ notice. This man was then declined parental leave payments because he did not take parental leave or stop work from the date that he became the child’s primary carer. In the second case, a woman was given the care of her niece following a whānau hui, and she continued working. Later, when it became clear that she needed to stop working in order to care for this child, she applied for parental leave payments and her application was declined because she continued to work after the child had come into her care. In both cases, if these proposed amendments existed, the primary carers could be eligible for parental leave payments because they stopped work within a reasonable period of becoming the primary carer of the child, and I think that is a very good move that this legislation sets out.\nThe immigration and workforce bill will also make some other changes, too. It’s really important that employers and workers meet their legal workplace obligations, and that’s hard to do when the law is unclear. One area that does need clarifying is the Health and Safety at Work Act. New Zealanders expect and deserve their family members to return home safe and well. At the start and end of every work day, people should know that the law is there to keep them safe. As the Minister, I want to make sure that the law is clearer, which is why we will be doing a wide-ranging public consultation on health and safety law. But in the meantime, this bill will clear up some of the existing regulations in health and safety.\nIt will clarify that, in situations where safety-critical equipment or processes fail, they must be a notifiable incident, even if no one was directly imminently exposed to danger. The bill will minimise the risk of unjustified delays before parties receive notice and become able to file private prosecutions. It does this now by only requiring that the regulator make reasonable efforts to establish whether a relevant regulator or regulatory agency is taking action, or intends to act, regarding a situation, rather than having to contact over 100 entities, which it currently does, and it will assist in reducing the number of invoices for ACC CoverPlus Extra customers. I commend this legislation to the House.", "window_id": "2024-07-23#40"}, {"statement_id": "ba5300fd9d8f14df", "politician": "Ginny Andersen", "party": "Labour", "side": "opposition", "date": "2024-08-28", "statement": "Thank you very much, Madam Chair. I’d just like to continue the discussion on new section 18AA, which is to be inserted in the Search and Surveillance Act by clause 14, which is the warrantless searches associated with firearms prohibition orders (FPOs).", "window": "SCOTT WILLIS: Thank you. I believe I have a pathway that I can offer the Minister that will help and give people reassurance that we’re not going to simply screen for the most vulnerable communities but we are going to apply this fairly. That is the tabled amendment—and it’s numbered (i)—that says, “In clause 14 after new section 18AA(3), page 6, after line 25, insert ‘Any person who is subject to warrantless search under subsection (1) shall be entitled to reasonable compensation if it is subsequently found that they are not subject to a firearms prohibition order.’ ”\nNow, this, to me, seems like a very reasonable amendment to make, because it gives a safeguard and it will ensure that a reasonable approach is taken and that there has to be evidence, some sort of belief, rather than just a suspicion. This is what I’ve heard from the Minister, that the bill has been strengthened. There has to be a demonstration of belief. So we do need to understand that if that is there, not just a suspicion, and if it is simply a suspicion, we need some recompense for people who have been targeted. I think this amendment does that very simply and clearly and should make a difference and should ensure that it is indeed acting on a belief rather than a suspicion that will enable police to use their powers.\nI encourage the Minister to consider this amendment, and, well, in fact, I think it will help improve the bill and sharpen it from our perspective. I appreciate your thoughts on the matter, Minister, in the time that remains to us.\n\nHon GINNY ANDERSEN: Thank you very much, Madam Chair. I’d just like to continue the discussion on new section 18AA, which is to be inserted in the Search and Surveillance Act by clause 14, which is the warrantless searches associated with firearms prohibition orders (FPOs). I would like to just ask the Minister: in terms of what was originally provided under the first firearms prohibition orders regime, from my recollection, that, basically, invoked section 18 of the Search and Surveillance Act, which enabled there to be—if someone had an FPO on them, it, basically, kicked in that search power. If the police suspected that someone had a firearm and that person had an FPO, that enabled the police to search, if I remember rightly.\nWhat I’d really like to understand is this. Where this bill started off was with its search powers, and then after the select committee, where it ended up, it was looking quite close to where we were under the initial regime. It’s looking quite close, so I’d really like the Minister to spell out what the difference is between an FPO regime that invokes section 18 of the Search and Surveillance Act, and the somewhat watered-down provision now under new section 18AA, which now has the changed wording, which is “believe”. They can’t suspect that someone has an FPO; they must believe that the person has an FPO on them in order to legitimately search that person and their house, and we’re not sure about the car because the Attorney-General thinks that that might be out if there are people in the car.\nI’m quite interested to know specifically what the difference is that this bill does, and I’m also really, really keen to understand how this is going to play out for operational information for police. How are we going to ensure that through operational instructions to front-line officers, we are able to make it clear to police officers where that line lies and where they’re able to act? As we’re aware, in the heat of the moment and when you’re in difficult situations on the front line, there’s a split-second decision that often gets made. While we are thankful and grateful for the great work police officers do and for that split-second decision that they need to make, I guess what I’d like to know is: what is the check when that doesn’t go well, and what is the check when there has been a search that’s not justified and there, in fact, wasn’t an FPO?\nI know we’ve spoken about the New Zealand Bill of Rights Act and where that kicks in, but I think it’s important that we understand that if a police officer did execute a search under new section 18AA and, in fact, the person didn’t have an FPO and we later on find that the police officer didn’t even have grounds to believe that the person had an FPO, what happens at that point in time? I think that that’s really important information to have.\nJust to recap, my two main questions are: how is this new regime in terms of the warrantless search associated with FPOs—what is the material difference between that and the previous one, which invoked section 18 of the Search and Surveillance Act; and, secondly, if a police officer did execute a search without a warrant on someone and later on we find out that they did not have grounds to believe that the person had an FPO, what is the follow-up process in relation to that, I guess, wrong call, or that unwarranted search? Are there any repercussions or is there any information that would be able to be taken action on by the person who was unrightly subjected to that and wrongfully searched; and, secondly, what kind of reassurance can the Minister give us that police operational instructions will be giving a sufficient level of specificity to officers in training and on the front line to ensure that they are equipped with the right advice so that they’re not endangering themselves by executing a warrantless search without knowing where the line lies?\n\nHon NICOLE McKEE: Thank you, Madam Chair. I’ll address the two questions that have been asked by the member from the Greens and the member from the Labour Party.\nTo the first one, from the member from the Greens Scott Willis, when you initiated the five minutes that you had to talk about licensed firearms owners who also commit crimes and spoke of the heinous one that we all are aware of, that man did not have a firearms prohibition order (FPO) upon him, and this bill is about those that do have firearms prohibition orders. But what’s really, I think, quite important to note is that any licensed firearms owner that commits a crime—especially any of those 42 crimes that are within the old three-strikes regime and the new crimes that have been elected under the Misuse of Drugs Act, the Arms Act, the Psychoactive Substances Act, and, of course, the three under the Crimes Act as well—any licensed firearms owner that does commit a crime in that space is more than likely going to have a firearms prohibition order placed upon them, and then they will come under this regime.\nI understand your concern and I’d just like to, I guess, advise the member that those that have current licences, licensed firearms owners, actually are kept abreast by police of the way that they behave. They come to the attention of police if they do things like get multiple speeding tickets, have a drink-driving conviction. I would argue that licensed firearms owners are actually more looked upon by New Zealand Police than any other member of society for their compliance with the law and every law in New Zealand, full stop, but once they break that law, and if they commit any serious crime punishable by one year or more, and any of those crimes that we’ve mentioned, then they are eligible for a firearms prohibition order. And, of course, that means that they cannot frequent ranges, they cannot go into retail stores that sell firearms, they can’t be around firearms or people with firearms. It would be unfortunate for them to get to that point, but that’s part of the conditions if they break those rules.\nWhen it comes to the person that you mentioned, there’s an ongoing coronial inquiry at the moment as to how that person even obtained a licence in the first place. I think that is a completely different argument—or not even an argument, but discussion—to be had in the House in upcoming months as we look to rewrite the Arms Act. But, for the firearms prohibition orders, it’s of no relevance for this particular bill that’s going through. I just want to assure the member that should a licensed firearms owner actually break the law and commit any of those crimes, it is more than likely they will have an FPO placed upon them. And, more importantly, because they do know people with firearms and probably do have a whole lot of friend groups and associates, it is really important that we are able to allow police to monitor the compliance with that FPO on those particular people.\nYou ask, what is an appropriate consequence for an unreasonable search of somebody, what safeguards are in place? I’d just like to reassure the member that we currently do have some safeguards. As it mentions in the bill, the search must be for the purpose of monitoring compliance with the FPO. It’s not about looking for drugs or looking for other weapons; it’s about the compliance of the FPO. If the search is for another purpose, the search could be found to be unreasonable under the New Zealand Bill of Rights Act 1990, which we have discussed. If this happened, the evidence could be deemed to be inadmissible in court and the Crown could be liable to pay damages to the person. Not only would the evidence be inadmissible for prosecution if deemed so, in circumstances where the Crown may have to pay damages—and there is already significant case law about this. The member’s tabled amendment, I believe, already reflects current law and opportunities to look for redress where it is deemed that the search has been unreasonable, or even breached the New Zealand Bill of Rights Act; we have case law already to allow for people to seek compensation.\nMoving to the member from the Labour Party who was asking about section 18 and new section 18AA and the differences, people need to understand that when criminals have firearms, they tend to try and hide them; they’re not open with the fact that they have them. People with firearms prohibition orders have been identified, quite rightly, as posing a very high risk to public safety. This new search power allows for the proactive monitoring of their compliance with the conditions of the firearms prohibition orders, and those conditions can vary because the judge decides what those conditions are going to be on the individual. Under the current settings, the searches can only be conducted where police have reasonable grounds to suspect an offence has been, or is about to be, committed, and this late point of intervention limits the public safety benefits from the regime. We do not, as I mentioned earlier, want police to be getting into a situation where a firearm is being presented at them because they weren’t able to take it away when they were searching under compliance. It’s really important that we give police those tools.\nWhen you asked about how the police are going to operate under this regime, they’re developing the guidance on how they’re going to use this new power. Police have a lot of experience in searching people, doing it in a reasonable manner, complying with the law when they do it, because if they don’t do it right in the first place, a lot of the evidence that they find will become inadmissible and we end up having criminals who were in possession of firearms potentially either using them against our front line, which is unacceptable, or getting away with it. We can’t be having that. We’ve got to support our front line here. The police will develop the operational guidance on how they will utilise this new power, new section 18AA. In all respects, I believe that we’re doing the right thing by allowing them to try and take the guns off the gangs before they’re used against our front line.", "window_id": "2024-08-28#16"}, {"statement_id": "f52625d618e97c06", "politician": "Jan Tinetti", "party": "Labour", "side": "opposition", "date": "2024-09-12", "statement": "That is shocking. That is shocking, that this is the tone that educators take on how they are going to approach education in Aotearoa and how they are going to educate our future generations.", "window": "Hon JAN TINETTI: Mr Simpson, perhaps you would like to get up and show the information that would show that this would make a difference. You will not be able to, because, Mr Simpson, the research and evidence is sitting there that shows that this will have the exact opposite response—absolutely.\nMoney withdrawn from the public education system in the form of profits—as this is doing—means that that money cannot go to any other part of the education system, and we heard throughout this that the education system has many issues that are sitting within it. There are young people sitting there—neurodiverse students—who are not getting the support that they need, because the resourcing is not going in at the level that it is needed. Now, if we put charter schools in place, that would only serve to help some of those students, and a very tiny percentage of them. That means that we’re going to have greater inequities within the system than we have ever seen before. That is what the research shows overseas and the research that we have seen from New Zealand the last time this failed experiment was put in place—and it was a failed experiment.\nOne of the greatest issues that we saw during the select committee process was that once again—once again—we are not having the public scrutiny that is needed on these particular schools. The Ombudsman discussed his concern around the fact that the charter schools were not going to be subject to the Official Information Act. That happened last time, as well. Those issues were prevalent last time, and we saw that in the failed experiment. But, once again, this Government sees that it is only right to bring back what failed last time and put it into the bill this time, and I can only think that young people will suffer because of it.\nOne of the areas that our teachers said, time and time again, that they were really concerned about was the lack of emphasis on quality teaching in this particular bill. Really, really upset with what some members were saying around this—and upset with the emphasis from the Minister, during this time, thinking that anyone can teach our young people. I can tell him that not just anyone can teach our young people. It is absolutely upsetting to think that we can staff a school with people with limited authority to teach, which means that they don’t have to have any qualifications whatsoever, they don’t have to know about the pedagogy, and they don’t have to know about what goes on inside a young person’s head. He believes that they can staff a school completely on that.\nWe know that there have been a number of young people whom the system has not served well. This is not the answer to that. As I have said, this will create greater inequities within the system.\nFlexibility already exists. We heard from the Hon Marian Hobbs that she was able to set up a school within the State system—Four Avenues High School—that was already able to answer a lot of what this bill is trying to fix.\nThis is a terrible piece of legislation, and we will hear more about this throughout the process as it comes before the House. Thank you.\nDr LAWRENCE XU-NAN (Green): Tēnā koe e te Māngai o te Whare. What a time to be a parliamentarian, to witness firsthand the parallel universe that the Minister is living in, in terms of some of the stats that were referred to. I am disappointed. I am disappointed at the way that this particular bill was approached, and the way this particular bill was approached during the select committee stage.\nLet’s start with some of the common themes of the submissions, and let’s start with charter schools. We have heard from multiple submitters that our existing education system in Aotearoa is already flexible enough and does not require yet another tier, yet another educational system. We have State schools, State integrated schools, specialist schools, special character schools, kura kaupapa, and private schools. We do not need another one. In fact, some have argued that our system is almost too flexible as it stands. That’s the first thing.\nSecond thing: a lack of evidence. We have consistently seen a lack of evidence both in Aotearoa and internationally that charter schools as a system work. We have heard submitters from overseas, particularly from the UK, of the danger when you introduce charter schools in their form of academies and also in terms of the orphan schools and the orphan students that are created as a part of that system.\nOther things that we have seen: the number of overseas interests in setting up charter schools in Aotearoa. We have heard from submitters who blatantly tell us that the only reason they’re interested in setting up a charter school is because they can get public money for it. That is shocking. That is shocking, that this is the tone that educators take on how they are going to approach education in Aotearoa and how they are going to educate our future generations.\nLet’s talk about the next thing, in terms of the process of this bill. Now, the Hon Jan Tinetti has already talked about the truncated select committee process that we have seen, which meant that we rushed things through—and I thank the Education and Workforce Committee; I thank the chair, Katie Nimon; and I also thank the staff who helped us through that. However, that shouldn’t have been the normal process, and, particularly, when we had this bill going through select committee, the application for charter schools should not have been opened. People should not have already had to apply for it, not knowing whether there’s going to be any amendment. That is a presumption that we’ve had that this bill is going to go through as it stands.\nThe other thing is, as we saw, the original deadline for the select committee, which we decided, was 25 July. Then, on 23 July, the Associate Minister of Education released a new Amendment Paper, Amendment Paper 49, with some major, major adjustments, which I’m sure other speakers will speak on later. That meant that we then had to go back to those submitters, saying, “Sorry—you already submitted, but we just released an amendment. Would you like to make an amendment to your submission?” We have to adjust our time line and deadline to accommodate the release of that Amendment Paper. That is not OK. That is not the process that people of Aotearoa expect from their Parliament and from their Government.\nWhat we see with the charter school as well, in terms of the flexibility, over and over again, is the fact that this is, essentially, a carve-out. This is a carve-out for the Associate Minister. This is the only way that the Government was able to form a Government, by pandering to what their coalition partner demands, and I have mentioned in this House before of the discrepancy and inconsistency between what the Minister of Education and what the Associate Minister of Education has stated, and their vision and direction of education in Aotearoa.\nLastly, when it comes to charter schools, let’s talk about the New Zealand Bill of Rights Act implications. Now, I don’t know how often this happens, but the Chief Ombudsman himself made a submission and made an oral submission expressing his concern under freedom of expression, under freedom of access to information, on the basis that charter schools, as a publicly funded institute, will not be subjected to the Official Information Act. No other publicly funded institute does that, to my knowledge. When we asked the Chief Ombudsman, he couldn’t give a clear answer on whether anyone else has such privilege. That is a serious concern to the fundamental right that we have here in Aotearoa.\nWhen we heard the submission from the Children and Young People’s Commission, they mentioned our obligation under international conventions around the right to education and rights for children. We then asked, “Why was there no child impact statement produced as a part of this?”, and there was no answer for that. This whole process has been incredibly disheartening but also just incredibly negative in terms of how this Government has chosen to progress their bills.\nNow, let’s move on to the second part of this, which is around early childhood education (ECE). We’ve heard from the Children and Young People’s Commission around the ECE, we have heard from people, we have mentioned that there was no child impact statement. First of all, the network management approval process was introduced in 2023. For any other party, in a number of other bills we have seen in this House, they said, “Oh, you know what, there is not enough time for us to see how well it’s going to work.” Apparently, one year is sufficient for this particular bill and for this particular process, for it to be repealed after one year.\nOn top of that, they said that this is going to be a barrier for the creating of new ECE centres. Well, let me tell this House: the number of ECE centres that have been approved under the network management has increased in 2023—not decreased; increased. So what is the barrier that is being referred to here, other than the fact that this is giving a carte blanche to for-profit ECE companies to privatise further at the cost of our future? Our young children should be able to live their lives, should be able to be educated, and that should be the priority of our focus here in Aotearoa. If someone’s like, “My priority is going to be making money.”, it is not going to be about the children. It is not going to be about our ākonga. That is a serious concern.\nOverall, in terms of what we have seen with the submissions and during the select committee process, 90.3 percent of the submitters, 90.3—not most, not some; 90.3. For those of you, that is an A+ when you are in the schooling system. It is an A+ if you are looking at the GPA system at university. That is the percentage of people who said no to this bill: 90.3 percent of people said no to the repeal of the ECE network management. That is not some; that is almost all of them, and that has not been acknowledged by the Minister and that has not been acknowledged by the way that we have progressed this.\nI do thank the submitters who have submitted on this bill. I thank all of you who have experience, both lived experience as well as decades of work experience, who took the time out of your busy lives to make a submission. I am also angry. I am angry for all of you who made those submissions, to think that your voice will be heard by this Government, and it has not been heard by this Government. That is shameful. What a joke of a process.\nSo, with everything that we have seen from the submitters, no, the Green Party will not support this bill.\nGRANT McCALLUM (National—Northland): Thank you, Madam Speaker. I rise to take a call on the Education and Training Amendment Bill, a bill that we wholeheartedly support. I’d like to begin by thanking the people in our select committee, chaired by the wonderful Katie Nimon, deputy chair, Carl Bates, my colleague Mike Butterick, Parmjeet Parmar, the Hon Jan Tinetti, Camilla Belich, Lawrence Xu-Nan, and the Hon Phil Twyford.\nThe bill came in three parts, right? There was the first part to deal with the charter schools, the second part was around the network approval for early childhood education, and the final part, which has hardly been spoken of, was to do with the Secretary for Education being able to make rules for State schools about collecting, recording, and providing attendance data.\nWell, I’ve been in this House now, listening to the Opposition, and listening to them, I’m thinking “Well, they really have missed the point, haven’t they?” This is about choice, about giving parents and students choice in their education. That’s what it’s all about, right? This is where they forget that when parents go to look at where they’d like their children to go to school, they look around and at the moment, clearly with some parents, they’re struggling. Some parents are struggling to find the right school. Right?\nI’d like to point out actually, yes, we received a number of submissions. Well, I notice they’ve ignored the ones that were in support of. I’ll give you a quote from a submission from the Maxim Institute—", "window_id": "2024-09-12#10"}, {"statement_id": "072c31f7ff156b27", "politician": "Chris Hipkins", "party": "Labour", "side": "opposition", "date": "2024-11-12", "statement": "Many people entering into State and faith-based institutions were undocumented, records were incomplete, they’ve gone missing, and in some cases, yes, they were deliberately destroyed.", "window": "Rt Hon CHRIS HIPKINS: Kia hiwa rā, kia hiwa rā. Kia hiwa rā ki tēnei tuku, kia hiwa rā ki tērā tuku. Kia tū, kia oho, kia mataara. Tihei mauri ora.\nKi te hunga kua riro ki te pō, moe mai, moe mai, moe mai rā koutou.\nKi ngā mōrehu kua tae mai, tēnā koutou. Koutou ngā mōrehu e mātakitaki mai nā, e whakarongo mai nā huri noa i te motu, tēnā koutou.\nHe tū whakaiti tēnei ki te whakapāha atu ki a koutou, ngā mōrehu, mō ngā tini tūkinotanga, ngā taimahatanga, me te mamae. Aue, taukuri e.\n[Be vigilant, be alert. Be alert at this terrace, be alert on that terrace. Arise, awaken, remain sharp. It is the breath of life.\nTo those who have gone into the darkness, rest in peace.\nTo the survivors who have arrived, greetings. To you, the survivors that are watching and listening all around the country, greetings to you.\nI stand to humbly apologise to you, the survivors, for the many abuses, difficulties, and the anguish. Oh my, such anguish.]\nCan I start by acknowledging and fully supporting the words of the Prime Minister in delivering the formal apology on behalf of successive Governments who have failed you, survivors, your families, whānau, kāinga, hapū, iwi, your communities, your support networks, and New Zealand as a nation. I want to acknowledge all of you—those who are physically here at Parliament today, those who are watching all across the country, those who find it too painful to engage in this process at all, and those who have died before today finally arrived.\nAmong the community of survivors are many intersecting communities who have jointly suffered from neglect, from abuse, from trauma, from torture, and they have carried their scars over lifetimes and over generations: Māori survivors, Pacific survivors, Pākehā survivors, Deaf survivors, disabled survivors, survivors who experienced mental distress, takatāpui, mahu, vakasalewa, palopa, fa‘afafine, ‘akavai‘ne, fakaleiti, fakafifine, and all rainbow survivors. Today is a hugely important day for all of you to finally hear what the Crown has failed to give you for all these years: an apology.\nIt’s a hugely important day for us, the representatives of the Crown and of successive Governments, that we finally—finally—acknowledge the thousands of confronting experiences of neglect, abuse, trauma, torture, and that we finally own up fully to our failings and offer our sincerest apologies. We are sorry. Today, all of Aotearoa New Zealand will bear witness to the truth: to what survivors experienced, to our decades of wilful ignorance, denial, minimisation, and to our conviction to end such horror and vile acts from continuing.\nAs the royal commission found, around 250,000 people were abused, and an even higher, untold number neglected. We will never know that true number. Many people entering into State and faith-based institutions were undocumented, records were incomplete, they’ve gone missing, and in some cases, yes, they were deliberately destroyed. Every corner of New Zealand has been affected by this abuse—a family member, a neighbour, a colleague, a friend.\nIn 2018, we started the long-overdue process of acknowledging that the abuse happened, and so we could hear from those who have had to live with the repercussions of that. To those who shared your stories with the inquiry, thank you. To those who’ve chosen not to recount those memories, we wholeheartedly understand. To those who died before they were given the opportunity to be heard, rest knowing that you are heard today. I give my thanks to all of those who were involved—to the commissioners, assisting counsel, the Survivor Advisory Group of Experts—I can name but a handful, but my gratitude goes out to everyone who was instrumental in this inquiry. It was an enormous task.\nWhile necessary and welcomed, for many the inquiry and associated events stir up and exacerbate the pain and the suffering, and I know that, for many, today will be painful. The things that we speak about today rise from the worst of human nature. They show us how immoral and reprehensible it is that we, as the Crown, not only allowed it to happen and ignored it, but further punished those who spoke out. I want you to hear that we have heard—that, while we can never fully understand what these experiences were like for you, we have heard your testimonies.\nThe royal commission shows us that many survivors who entered State or faith-based care and institutions were forced into them due to discriminatory attitudes and harsh conditions that were beyond their control: racism, ableism, sexism, homophobia, transphobia, and cruel attitudes towards people who simply needed support. What these people—what you, the survivors, and your loved ones—experienced spans an unimaginable spectrum of horror; horror perpetuated within a system that allowed it, by people who you should have been able to trust: caregivers, staff, peers, other residents, police, medical practitioners, teachers, social workers, nurses, nuns, priests, and religious ministers.\nYou lived without care, affection, love, emotional support, and connection. Many of you experienced psychological and emotional neglect and abuse: being institutionalised and denied your personhood. Physical and sexual abuse and violence was a common experience. Many were deprived of an education or punished for having special needs. Deaf survivors were punished for using sign language. Blind survivors were punished for using echolocation. Survivors also experienced physical neglect. They were denied food, shelter, water, basic hygiene. Female survivors were often denied menstrual products. Many were placed in solitary confinement, often for long periods of time, and neglected whilst there.\nSurvivors were not allowed to express who they were, and they were often punished when they did so. Too many were neglected medically, yet also subjected to unnecessary and invasive procedures without consent, and some of you were tortured. All of this at the hands of State and faith-based institutions that were entrusted with providing care and protection to you, taonga, who should have been loved and nurtured. Not only has this immeasurable harm and trauma hurt you—the children, young people, and vulnerable adults who experienced it directly—but also your families, your whānau, your kāinga, your hapū, iwi, and communities. The intergenerational and collective harm caused cannot be overstated. Survivors were often targeted based on race, sexual orientation, disability, and gender, and isolated from their cultures, their language, their sense of self, and from their families.\nMāori survivors found themselves in a system that inherently worked against them, and care settings that were blatantly racist. Many Māori survivors were made to feel whakamā—shame—at having been stripped of their identity as Māori. Whakapapa and mana motuhake were transgressed, and people were severed from their whānau. Marae, hapū, iwi lost people who would otherwise be sitting on the taumata or the paepae, passing on cultural knowledge.\nPacific survivors were punished for who they were, with their cultural needs and existence not only neglected but actively destroyed. There are stories of Pacific survivors who were told they didn’t belong in this world and that they had no identity. For Pacific survivors, it was not only being actively dislocated from their kāinga, communities, and church but also the harm experienced in various institutions that breached the va‘a, resulting in shame, isolation, and an inability to fully embrace life.\nPākehā survivors were similarly removed from their families, actively isolated from them, and often for nothing more than being poor. Pākehā survivors have suffered lifelong dislocation and disconnection from family and community. Their identity and mana also diminished. We should never overlook the horrors they endured.\nDeaf survivors were seen as lesser, forced to communicate only orally. They suffered under audism and ableist attitudes, and they were punished if they were caught using sign language. Education centres for Deaf New Zealanders like van Asch Deaf Education Centre and Kelston Deaf Education Centre should have been safe spaces. Instead, they became a hellscape for students where physical and sexual abuse were rife. Students were constantly belittled, others made to feel inferior.\nDisabled survivors were shut away, stigmatised, and devalued for being disabled. They faced all types of abuse and extreme neglect. In their interviews with the inquiry, disabled survivors said that “abuse and neglect caused them to lose their sense of self, their personhood – the ‘essence of being human’ – and connections to their families, communities, cultures and language”.\nMentally distressed survivors were shut away in institutions and experienced the full spectrum of abuse, neglect, and trauma that were par for the course in these places. Nothing they experienced was therapeutic or addressed their needs.\nRainbow survivors were forced into institutions and psychiatric wards engulfed in homophobia, where they were mislabelled with different mental health illnesses. Conversion practices were rife as a means to “cure” or to “fix” survivors, including the use of electric shocks. One such institution that used electric shocks and hurt, broke, and tortured those who passed through their doors was the Lake Alice Hospital—a name now synonymous with the experience of trauma, and a shameful part of New Zealand’s history. The horrors committed there and in similar places remain some of the darkest in our history.\nChurches and other faith-based entities were also spaces where many suffered. They abused their power to harm people who they were entrusted to care for. Priests, ministers, and other religious leaders—those who should have been trusted—devolved into monsters behind closed doors, and they must also equally be held to account.\nSuccessive Labour Governments, Ministers, ministries, and State institutions had a role to play in this neglect, this abuse, this trauma, this torture. They allowed systems they governed to continue to place children, young people, and vulnerable adults in care unnecessarily, and to hurt them while they were there. When survivors tried to raise the alarm, representatives of Labour also played a role in ignoring, punishing, and shaming survivors, drowning them out so they could never be heard. That was wrong.\nToday, I want to tell you on behalf of successive Labour Governments: we also formally and unreservedly say sorry for the neglect, abuse, trauma, and torture that took place in State and faith-based care institutions. We apologise for ignoring you, for punishing you for speaking out, and for leaving you unsafe and unheard. Today, I want to confirm that we hear you. We hear all of you, and we are sorry that that took so long. To each and every one of you who endured all that suffering, to your families, your children, mokopuna, your kāinga, your hapū, your iwi, your communities: we see your scars and we hear you. And we are sorry. You should have been safe, protected, and believed—and you were not. That is the ultimate injustice that we, as representatives of the Crown, must also bear the burden of.\nI am sorry that the last Labour Government did not act more quickly to put in place an independent redress system. We, the Government, and representatives of the Crown, owe a huge debt to you. Redress has taken far, far too long, to the point where many have already died or fear they might do so before getting any compensation. Redress should be kept out of the court system, and it should be seen as an investment in our people. It’s a national disgrace that it has taken us too long. I want to confirm that for the serious matter of redress and compensating survivors, we’re taking the politics off the table. We’re committing to finally paying back this debt. We welcome the Government’s action to streamline that process, and we stand ready to work together to get this done as quickly and as efficiently as possible. There will be a big bill, but it’s nothing compared to the debt that we owe those survivors. It must not be the reason for any further delay.\nI’m under no illusions that neglect, abuse, and trauma in State care still happens today. For this apology to have any credibility, we must take concrete action to stop it. You’ve heard words before and now you want action—I hear you. One of the many things that sticks with me from reading the report, and from the accounts that we heard this morning, is that survivors emphasise time and again that they don’t want what happened to them to happen to one more person. For many of you, this is just as an important part of seeking justice, and we have enormous work to do.\nThe inquiry and this apology must be a turning point, a point from which to embark on a pathway for us to not only right these historic wrongs but also fundamentally change our care system, change it so that State care is rarely necessary. When I met with Keith Wiffin to discuss my speech, he said to me, “The best prevention for abuse in State care is to keep people out of it in the first place.”, and I wholeheartedly agree. When people are in care it should be a safe and warm space for all, as it should always have been.\nWe welcome and support the Government’s commitment and beginning the work to improve the safeguards for those in State care. There is much, much work to do, and we must not waste one more day. We also support the Government to work with local authorities to honour the unmarked graves and to remove the names of proven perpetrators from public places. For the guilty who remain nameless, we encourage the Government to ensure that all is done to hold those perpetrators to account.\nI want to acknowledge, in closing, that for some and perhaps many of you there will never be healing and closure. My hope is that this apology today offers at least some relief—that your fight to be heard has resulted in t", "window_id": "2024-11-12#2"}, {"statement_id": "d7a323a2f006a7bd", "politician": "Damien O'Connor", "party": "Labour", "side": "opposition", "date": "2024-12-10", "statement": "I think that has allowed us to expand farming operations, but there are consequences in some areas. As I’ve said before, this is a unique geological area where the nitrates, if not managed properly, will remain in that aquifer, affecting the local community’s ability to get good, fresh water.", "window": "Hon DAMIEN O’CONNOR: Sorry, I was little slow there, Mr Chairman. I’m just working my way through Schedule 2—the first time I’ve had a chance to look at it. I’ll start right at the beginning. It relates to the Āmuri irrigation project, which the Minister responsible for RMA Reform, I understand, has already put up an amendment to—the Balmoral Water Storage Facility project.\nI just happened to be in and around Culverden this week, so I’m familiar with some questions that should be asked, and it’s really, to the Minister, on advice that the panel received. This is quite a unique area of North Canterbury. The area runs, basically, between the Waiau River and the Hurunui River. This is the area that currently has irrigation from the Waiau River. There’s quite a complex irrigation system that’s been running for some time. The area is quite dry. It has been converted in the past into dairy operations. In fact, it continues to be developed and transitioned from forestry—a huge area of forestry—into farmland. This Amuri Irrigation Company Limited is going to put in this water storage facility, and the amount of water coming from the Hurunui River will, as the Minister has amended, change from “1.5 million cubic metres”, which is not right, to “1.5 cubic metres of water per second”, which is the proposed extraction rate.\nMy questions to the Minister relate to the nitrate levels in the Culverden basin. It’s quite a unique geological area. There are already increasing nitrate levels in that aquifer. My question to the Minister is: what advice did the panel receive regarding the already increasing nitrate levels—whether this project would rapidly increase the nitrate levels in that aquifer, and what would be the long-term consequences of that? As we’ve seen in Waimate—in fact, there were some other projects here that are likely to impact on that—the school at Waimate can’t drink the water because of the nitrate levels in the water supply.\nI don’t think any New Zealander, whether they be in rural or urban areas, wants to see that degradation continue. Here is a project which, again, continues the irrigation—and I’m not opposed to that at all. I think that has allowed us to expand farming operations, but there are consequences in some areas. As I’ve said before, this is a unique geological area where the nitrates, if not managed properly, will remain in that aquifer, affecting the local community’s ability to get good, fresh water. So, firstly, the question to the Minister: did the panel receive any advice on the nitrate levels and what might happen with this greater level of irrigation?\nThen the other issue of Ngāi Tahu: Ngāi Tahu are big landowners in the Culverden basin there. They will be potential beneficiaries of this. This will enable more conversion of their forest land into farmland, possibly going from dry stock operations into dairy. The nitrate footprint of both those operations is quite different. What advice did the panel receive, and were there any guidelines as to the utilisation of this water over what kind of farming operations will develop from access to more water facilities? These are really important issues.\nThe other cultural question that I have—and the Minister may know this. This will, effectively, be the mixing of water from both the Waiau and from the Hurunui rivers—two different catchments coming into one area for the development of farming operations. As I say, that in itself is a good objective, but we are learning as we go forward about the impacts of inappropriate land use in inappropriate places: the wrong tree in the wrong place or the wrong farm in the wrong place. The questions go to the Minister: what advice did the panel receive when it looked at this application? Are the issues of the cultural mixing of water important; and, in fact, should that be a deal breaker? And how does Ngāi Tahu manage the issues of the cultural values of water and then the commercial objectives of their land development?\nIt’s quite a significant project—one that’s No. 1 in the schedule. As I work through, I’m sure I’ll have other questions to the Minister, but I welcome his reply on this.\n\nHon CHRIS BISHOP: I’ll just deal with some of the last few questions. In relation to the Hon Barbara Edmonds’ question around a variety of different housing projects, some of which have schools as part of them, some of them don’t: nothing particularly turns on that, to be honest. Some of the applications proposed included the potential for a school as part of the development, others did not, but that wasn’t determinative as to whether or not they were listed.\nIn relation to her question around the Ministry of Education, I’m advised that the advisory group and Ministers did not receive advice from the Ministry of Education. The wording reflects an option expressed by the applicant to work with the Ministry of Education to include a school in a development down the line—that there may be the potential for a school; there may not be. There’s a whole lot of work that has to go under way around that, and the Government’s got work under way around better school property processes—that’s a separate issue. I think it’s helpful for some of these developments that, when they do take place, developers are thinking ahead about infrastructure, about schools that may or may not be included, but those are kind of subsidiary questions to what we’re actually dealing with.\nIn relation to the Hon Deborah Russell’s point around some of these KiwiRail projects, I think, respectfully, she may be a touch confused. There are two KiwiRail projects; in fact, there are four KiwiRail projects listed. The two she’s talking about are the four-tracking of Westfield to Pukekohe. I happen to know a little bit about this project because I used to be the transport spokesperson. Suffice to say that the Government is—this is the third main line. The last Government funded it; they should have done the fourth main at the same time. The benefit-cost ratio of the fourth main is actually higher if you do them both at the same time. They didn’t do that. It’s quite an odd decision. So that is that.\nThis allows me to make a general point, which is that consent is different from funding. Just because something might get consent or it might go through to expert panel does not mean it’s funded. There’s billions of dollars’ worth of projects here, and consent is not the same as funding.\nThe point she was making about Avondale-Southdown is a wholly separate project across another part of Auckland. She was attempting to make a political point about a National Party MP. They’re completely separate projects, by the way, but she seemed to think they were the same.\nIn relation to Damien O’Connor’s project point, I don’t know what advice the panel received; that was a process run separately to Ministers. Many of the issues that he talks about would be considered by an expert panel as it goes through the process, but I don’t have visibility about what advice the advisory group who gave Ministers recommendations received.\n\nHon KIERAN McANULTY: Point of order, Madam Chairperson. Thank you, Madam Chair, and thank you for that guidance. I think the committee would benefit from some clarity here, because it wasn’t that long ago that we sought clarification from the presiding officer in the Chair around the ability of the committee, given the Speaker’s ruling last night and the subsequent conversation that I had with you last evening and then with the presiding officer around what that meant in practice, and where we landed was that if members of the Opposition, or, indeed, the Government—so members of this committee—wished to speak specifically to each of the 149 projects listed in Schedule 2, that would be permissible. Now, subsequent to that, the presiding officer has made it clear that if we stray outside Schedule 2 at this moment, then that could bring on a closure motion, so that’s something for all of us to consider. But, essentially, in summary, as long as we talk about projects in this, we’re OK.\n\nHon KIERAN McANULTY: My question is around it being repetitive. If we were to take that guidance given and the permission, essentially, to speak to each project, naturally we might ask similar questions but about different projects. So my question is: would you deem that to be repetitive?\n\nHon KIERAN McANULTY: Excellent—thank you. The other question I have is around the ability to speak to amendments that relate to these projects. There are a number of amendments that are being progressively tabled that propose to remove a specific project. Now, that hasn’t been tested or discussed yet, and I don’t actually intend to ask that question specifically, but I just want to be really clear that if some member has spoken about a project and then another member wishes to speak to an amendment that relates to that project, would that be deemed repetitious?\n\nHon KIERAN McANULTY: So a member could potentially not have the opportunity to speak to an amendment that they’ve put forward?\n\nHon KIERAN McANULTY: —that we will see contributions from members specific to projects that won’t be touching on contributions to projects that have been spoken of before and won’t be repetitious. I’m sure we can expect to see that. I’d like to make my call now.\n\nHon Dr MEGAN WOODS: Thank you, and thank you for your guidance, Madam Chair. Just further to the clarifications you’ve been able to give my colleague Kieran McAnulty, my question is: if there’s a member who has taken a call, asked the Minister some questions, and is seeking information before they decide they need to put in an amendment, because, actually, their decision about whether or not there does need to be an amendment is dependent on the Minister’s answer—whether, in that instance, they will then be able to speak to their Amendment Paper, because they won’t know until the Minister has answered the questions that we’re seeking in this committee of the whole House stage?", "window_id": "2024-12-10#36"}, {"statement_id": "e4f1ff9f842c87b1", "politician": "Marama Davidson", "party": "Green", "side": "opposition", "date": "2025-03-05", "statement": "The contractor was providing local employment and using local food.”; if so, can he tell the House how many people have lost their jobs as a result of his Government’s changes to Ka Ora, Ka Ako?", "window": "TEANAU TUIONO: E te Atua kaha rawa, ka tuku whakamoemiti atu mātou, mō ngā karakia kua waihotia mai ki runga i a mātou. Ka waiho i ō mātou pānga whaiaro katoa ki te taha. Ka mihi mātou ki te Kīngi, me te inoi atu mō te ārahitanga i roto i ō mātou whakaaroarohanga, kia mōhio ai, kia whakaiti ai tā mātou whakahaere i ngā take o te Whare nei, mō te oranga, te maungārongo, me te aroha o Aotearoa. Āmene.\n[Almighty God, we give thanks for the blessings which have been bestowed on us. Laying aside all personal interests, we acknowledge the King and pray for guidance in our deliberations, that we may conduct the affairs of this House with wisdom and humility, for the welfare, peace, and compassion of New Zealand. Amen.]\nVisitors\nAustralia—Queensland Parliament\n\nHon SIMEON BROWN: Point of order. I seek leave to make a personal explanation to correct a statement I made in an urgent debate on Tuesday, 4 March.\n\nHon SIMEON BROWN: In the urgent debate yesterday, I misspoke when speaking about former Minister Michael Wood. I said that the Minister was told 17 times by the Cabinet Office to sell his Auckland Transport shares; I should have said “16 times” for his Auckland Airport shares.\n\nHon NICOLA WILLIS: The Government’s four priorities for Budget 2025 are: lifting economic growth through measures to address long-term productivity challenges, implementing a social investment approach, keeping tight control of Government spending while funding a limited number of policy commitments and cost pressures, and developing a sustainable pipeline of long-term infrastructure investments.\nMike Butterick : What are examples of policy commitments that will be funded in the Budget?\nThe Government has already announced a significant policy commitment for Budget 2025. That is the commitment of $1.37 billion a year from 2025 onwards to meet demographic, volume, and price pressures for front-line health services. In total, that comes to an additional $5.48 billion for Health New Zealand over the forecast period. Agreeing this very significant increase in funding ahead of time gave Health New Zealand certainty in its planning and demonstrates the Government’s commitment to delivering the healthcare New Zealanders need.\nMike Butterick : Has the Government announced any other funding for health ahead of Budget 2025?\nYes. Budget 2025 provides just over a billion dollars of extra funding over the forecast period for additional medicines, including cancer treatments. On Monday, the Government announced measures to boost primary care, including increasing the number of doctors and nurses in primary care and a new 24/7 digital healthcare service for online appointments. These new measures will also be funded from Budget 2025. There is a myth propagated by the New Zealand Public Service Association and others that health funding is being reduced. Nothing could be further from the truth. Billions of dollars of additional funding are going into health to help ensure Kiwis have more access to the care they need where they need it.\nMike Butterick : How will this additional health funding fit within the Government’s operating allowance?\nThe Government has set an operating allowance for Budget 2025 of $2.4 billion. That is a tight allowance aimed at restricting growth in expenditure and reducing New Zealand’s structural Budget deficit left to us by the last Government. It is important to remember, though, that allowances are a net concept. They encompass savings and revenue initiatives as well as new spending. More savings, therefore, in the Budget equals more opportunity to invest in front-line services. That is called reprioritisation, for the benefit of members who did not experience this concept when they were last in office.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. Yesterday, you asked members on this side of the House to show a little more restraint. We have done so today. That would also involve you requiring Government members—[Interruption]\n\nRt Hon Chris Hipkins: I think, yesterday, you asked us to show more restraint on this side of the House, and you’ll note today we have done exactly that. I think a reciprocal expectation is that Ministers will actually stick to the rules around Government questions and not use them to attack the Opposition. Almost every one of the answers delivered by Nicola Willis did exactly that. You didn’t get a reaction from us, because you asked us not to do that, but there should be some reaction to that.\n\nHon Chris Bishop: Point of order. Sir, politics is about comparing and contrasting. It is very difficult to answer questions as a Government without drawing some comparison to what has gone before or indeed what is coming into the future—\n\nRt Hon Winston Peters: Point of order. The rightful complaint from Mr Parker is that he’s put the very issue back at the centre of this parliamentary behaviour, and he’s quite right. What you’re saying is no criticism at all can happen. What happened to “Sticks and stones can break my bones, but names will never hurt me.”? Over there, they’re so sensitive to every little issue.\n\nRt Hon CHRISTOPHER LUXON: Yes, and especially our action to make it easier for Kiwis to get access to the healthcare that they need. This morning, our excellent Minister of Health, Simeon Brown, announced more support for nurses so they can play a greater role in primary care. That comes off the back of action yesterday to train more doctors here at home, including in primary care. On Monday, we announced action to support more nurses into primary care, making it easier for international doctors to practise here, and introduce a whole system of digital 24/7 care. Kiwis deserve to be able to see a doctor as quickly as they can. We’re working hard to make that a reality. I would have thought the Opposition would want to support that.\n\nHon Marama Davidson: Does he agree that, regardless of socio-economic status, a meal at lunchtime is a basic level of collective care that should be afforded to all tamariki?\n\nRt Hon CHRISTOPHER LUXON: What I believe is that we need to help kids who are coming to school with no lunches, and that’s why we saved the school lunch programme that was unfunded. We’ve got some challenges, but we’re working our way through them.\n\nHon Marama Davidson: Does he agree that providing school lunches is an important collective response and one that is far more helpful than vilifying parents and families doing it tough?\n\nRt Hon CHRISTOPHER LUXON: What I’d say is in the last 24 hours the vilification from Labour and the Greens, who are telling working parents across New Zealand who happen to give their kids a Marmite sandwich and apple each and every day that they are bad parents, is not acceptable.\n\nHon Marama Davidson: Does he agree with Mana College principal Jeff Chapman that the previous school lunch programme “was a nice little circular local economy, and it was working great. The contractor was providing local employment and using local food.”; if so, can he tell the House how many people have lost their jobs as a result of his Government’s changes to Ka Ora, Ka Ako?\n\nRt Hon CHRISTOPHER LUXON: Well, what I can say is that we are actually funding the school lunch programme. We are feeding more kids than the previous Government did. We are doing so, more efficiently, having saved $130 million, which has been put back into health and education for our kids. So I think it’s a win-win. We’ve got some challenges to work through. The Minister, David Seymour, will deal with that.\n\nHon David Seymour: Sure. Is the Prime Minister also aware that the previous Government had left no money in the Budget for that nice little circular economy from 2025 onwards, and how has this Government responded to that fiscal cliff?\n\nRt Hon CHRISTOPHER LUXON: Well, I thank the member for his excellent question because that is exactly the case. The parties that claim to advocate for those that most need food didn’t fund the programme. We funded the programme, and we extended it to more kids.\n\nRt Hon Chris Hipkins: How many free school lunches programmes could be funded for the cost of the tax cuts the Government gave to landlords?\n\nRt Hon CHRISTOPHER LUXON: Well, I think the member is conflating two very different issues. What I’m proud about is that, actually, rents under this Government are stable, not up $180 per week. What I’m comfortable about is that house prices didn’t increase 40 to 50 percent, and what I’m comfortable about is that, actually, social housing wait-lists are going down and kids in emergency housing are out of motels—nothing that the Labour Government could sort out, despite the much-vaunted equity of housing, which they don’t own anymore.\n\nHon Marama Davidson: Will he stop pointing fingers at his Ministers and take responsibility, as Prime Minister, to feed our tamariki?\n\nRt Hon CHRISTOPHER LUXON: Well, we are. We have a school lunch programme. Look, we have said that—and the Minister has said himself that—the food is in some cases not up to scratch. He’s making sure he holds those contractors to account, he’s working through the issues, and I’ve got every confidence that he will do so.\nChlöe Swarbrick : What happened to personal responsibility?\nI do take responsibility, and I have clear accountabilities on my Ministers, and that’s what I’d expect to happen.\n\nHon David Seymour: Is it the view of his Government that good words and good wishes must be backed up by a fiscally sustainable plan to actually pay for the Government’s programmes, and does he believe it’s credible to have all those good words and good wishes but no plan to afford them?\n\nRt Hon CHRISTOPHER LUXON: It is something that we have inherited: a Government previously that didn’t fund Pharmac, a Government that didn’t fund school lunches, and a Government that had billions of dollars of blowout on ferries and on Dunedin Hospital. Make the list; we’re fixing it.\n\nRt Hon CHRISTOPHER LUXON: I commit, and the Minister is very committed, to making sure we make the school lunch programme work and we get what we contracted for. But, as I have said before, we will continue to provide children who need lunches with a school lunch programme. It’s important, because we know the evidence is that, if they don’t have food, they don’t learn and they end up on welfare—that’s not great.\n\nRt Hon CHRISTOPHER LUXON: Yes, and especially our action to support Kiwis with the cost of living. Two years ago, inflation was running at 7.2 percent; today, it’s 2.2 percent. Two years ago today, the official cash rate was 4.75 percent, and today it is 3.75 percent. Two years ago, food inflation was 10.3 percent, and today it’s just 2.3 percent. You know, it’s an encouraging sign that we’re making progress. We know there’s a lot more for us to do, and the best thing that we can do is grow the economy so that we can create those jobs, lift incomes, and actually create opportunities for more Kiwis so they’ve got more money in their pocket. That’s important.\n\nRt Hon Chris Hipkins: On what day and at what time did he first discuss allegations that Andrew Bayly had a physical altercation with a staff member, with Andrew Bayly?\n\nRt Hon CHRISTOPHER LUXON: As I have previously said, I was made aware of the issue on Thursday, and Andrew Bayly resigned very late on Friday.\n\nRt Hon Chris Hipkins: Point of order, Mr Speaker. I didn’t ask him when he was informed or when Andrew Bayly resigned; I asked him when he first discussed those allegations with Andrew Bayly.\n\nRt Hon Chris Hipkins: On what date and at what time did he first discuss allegations Andrew Bayly had a physical altercation with a staff member, with Andrew Bayly?\n\nRt Hon CHRISTOPHER LUXON: My office had conversations with Andrew Bayly on the Wednesday and the Thursday, and I discussed it with Andrew Bayly on the Friday.\n\nRt Hon Chris Hipkins: When did he formally receive Andrew Bayly’s resignation as a Minister, and in what form was his resignation delivered?", "window_id": "2025-03-05#0"}, {"statement_id": "612949eeee905666", "politician": "Camilla Belich", "party": "Labour", "side": "opposition", "date": "2025-06-24", "statement": "I don’t think so. I think we’ve heard a lot of evidence today from this side of the House, who have been taking substantive calls on this bill, around things that have got a lot worse and have raised the cost generally for households as well.", "window": "CAMILLA BELICH: Thank you, Madam Speaker. It’s been interesting being in the House for this debate, where there’s been a lot of comments made as a running commentary from the other side, but very, very few substantive contributions to this debate. Actually, it shows that the other side of the House has not actually been listening to this debate, where a number of speakers, not only in this debate but in the committee of the whole House stage and in the second reading and the first reading said that, indeed, Labour supports this bill. So I’m happy to clarify that for the member, who obviously hasn’t been taking any account of what’s been going on in the House or listening to any of the arguments that this side of the House has been putting forward.\nCarl Bates : You’re the party of no. Why would we not think that you were going to say no?\nWell, Mr Bates, the reason that I would suggest that you would know the correct position of our party is because it has been said numerous times in the House, and that is the role of people in the House; to be part of the debate and listen to those who are taking part in it.\nSo we are pleased to support this bill. We will be outlining why that is and actually looking into this bill in some detail. I think it is important to note, as other speakers have noted, that this bill was announced as part of the Budget changes and has gone through under urgency. So as the chair of the Governance and Administration Committee, who would have welcomed the opportunity to have received submissions on this bill, to hear from people affected by this bill, to hear debates around this bill, to hear if there are any issues in this bill, we have not been able to have that opportunity. We did have a session with the Minister in the committee of the whole House stage. There were a number of questions that were asked; a number of questions were left unanswered. So I think it’s important to note, as this is the last opportunity for this House to comment on this particular bill, that this process—although we support this bill and this bill is a good start—around bringing this bill to the House under urgency, without a select committee, has not been what we would expect in respect of good lawmaking.\nThis particular bill is one that would have really benefited, I think, from a select committee process and being able to have that scr
