[pytest]
# Every suite in the repo, runnable as a single `pytest` from the root.
# Each subproject keeps its own conftest.py to put its modules on the path,
# because the pipelines are run as scripts from their own directories.
testpaths =
    data/tests
    attribute-extraction/tests
    site/tests
    game
python_files = test_*.py
addopts = -q
